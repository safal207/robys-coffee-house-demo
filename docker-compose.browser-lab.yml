name: robys-browser-lab

services:
  site:
    image: "${ROBY_QA_SITE_IMAGE:-nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}"
    ports:
      - "${ROBY_QA_BIND_ADDRESS:-127.0.0.1}:${ROBY_QA_SITE_PORT:-8080}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./qa/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - qa-browser-lab

  chromium:
    image: "${ROBY_QA_CHROMIUM_IMAGE:-ghcr.io/linuxserver/chromium:version-11e602ae@sha256:6d35963fd7903bcfb944f3b70999a27ed44b729db94813da6be983a69a5bad06}"
    platform: "${ROBY_QA_BROWSER_PLATFORM:-linux/amd64}"
    pull_policy: always
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Istanbul}"
      CUSTOM_USER: "${ROBY_QA_USER:-qa}"
      PASSWORD: "${ROBY_QA_PASSWORD:-replace_me_before_lan_use}"
      TITLE: "Roby's QA — Chromium"
      CHROME_CLI: "http://site/?qa-browser=chromium"
    ports:
      - "${ROBY_QA_BIND_ADDRESS:-127.0.0.1}:${ROBY_QA_CHROMIUM_HTTP_PORT:-3010}:3000"
      - "${ROBY_QA_BIND_ADDRESS:-127.0.0.1}:${ROBY_QA_CHROMIUM_HTTPS_PORT:-3011}:3001"
    volumes:
      - chromium-config:/config
    shm_size: "1gb"
    depends_on:
      site:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qa-browser-lab

  firefox:
    image: "${ROBY_QA_FIREFOX_IMAGE:-ghcr.io/linuxserver/firefox:version-136.0build3-0ubuntu0.24.04.1mt1@sha256:aa9f6468a0bdb3362a99a97d445b2afdb92dfcbceb2093b8f7b61530bc9703ef}"
    platform: "${ROBY_QA_BROWSER_PLATFORM:-linux/amd64}"
    pull_policy: always
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Istanbul}"
      CUSTOM_USER: "${ROBY_QA_USER:-qa}"
      PASSWORD: "${ROBY_QA_PASSWORD:-replace_me_before_lan_use}"
      TITLE: "Roby's QA — Firefox"
      FIREFOX_CLI: "http://site/?qa-browser=firefox"
    ports:
      - "${ROBY_QA_BIND_ADDRESS:-127.0.0.1}:${ROBY_QA_FIREFOX_HTTP_PORT:-3020}:3000"
      - "${ROBY_QA_BIND_ADDRESS:-127.0.0.1}:${ROBY_QA_FIREFOX_HTTPS_PORT:-3021}:3001"
    volumes:
      - firefox-config:/config
    shm_size: "1gb"
    depends_on:
      site:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qa-browser-lab

networks:
  qa-browser-lab:
    driver: bridge

volumes:
  chromium-config:
  firefox-config:
