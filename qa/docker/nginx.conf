server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ /\.(?!well-known) {
    deny all;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ =404;
  }
}
