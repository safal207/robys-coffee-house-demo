name: Temporary manual QA rebase verification

on:
  push:
    branches:
      - tmp/manual-qa-rebase-verify-20260916

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch build/verifiers for split service-worker core
        run: python3 tmp-build-sw-core-patch.py
      - name: Build current-main plus manual QA sources
        run: npm run build
      - name: Generate initial integrity state
        run: npm run integrity:generate
      - name: Full repository check on production tree
        shell: bash
        run: |
          cp .github/workflows/tmp-manual-qa-rebase-verify-20260916.yml /tmp/tmp-manual-qa-workflow.yml
          cp .github/workflows/tmp-sw-core-scan-20260916.yml /tmp/tmp-sw-core-scan.yml
          rm .github/workflows/tmp-manual-qa-rebase-verify-20260916.yml
          rm .github/workflows/tmp-sw-core-scan-20260916.yml
          npm run check
          cp /tmp/tmp-manual-qa-workflow.yml .github/workflows/tmp-manual-qa-rebase-verify-20260916.yml
          cp /tmp/tmp-sw-core-scan.yml .github/workflows/tmp-sw-core-scan-20260916.yml
      - name: Finalize generated integrity state
        run: |
          npm run integrity:generate
          npm run verify:integrity
          npm run verify:security
      - name: Protect fresh San Sebastian preview flow
        shell: bash
        run: |
          test -f pairing-preview.css
          test -f src/products/sets-v1/iced-san-sebastian-pairing-preview.mp4
          test -f sw-core-v64.js
          grep -q 'sw-core-v64.js' sw.js
          grep -q 'const CACHE_VERSION = "robys-offline-' sw-core-v64.js
      - run: npx playwright install chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/menu.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/http.log
          exit 1
      - name: Targeted manual QA browser proof
        run: node tmp-manual-qa-rebase-test.mjs
      - name: Check source and generated drift allowlist
        shell: bash
        run: |
          mkdir -p qa-manual-rebase
          git status --porcelain | tee qa-manual-rebase/git-status.txt
          changed=$(git status --porcelain | sed -E 's/^.. //')
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(scripts/(build|service-worker-source|verify-menu-share|test-photo-logo|verify-smart-choice-release|verify-android-download|verify-security-contracts|test-discover-deck|verify-taste-journey-posters|verify-brand-identity-assets|verify-menu-image-assets|verify-pr140-release-blockers|verify-menu-truth-live|verify-menu-order|test-brand-wordmark|verify-regression-contracts|verify-entry-handoff)\.mjs|qa/traceability/api-platform\.json|index\.html|menu\.html|experience/index\.html|smart-choice/index\.html|sw\.js|sw-core-v64\.js|integrity-manifest\.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected drift:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit split-SW compatibility and generated outputs on temporary branch
        shell: bash
        run: |
          git config user.name 'robys-qa-bot'
          git config user.email 'robys-qa-bot@users.noreply.github.com'
          git add \
            scripts/build.mjs \
            scripts/service-worker-source.mjs \
            scripts/verify-menu-share.mjs \
            scripts/test-photo-logo.mjs \
            scripts/verify-smart-choice-release.mjs \
            scripts/verify-android-download.mjs \
            scripts/verify-security-contracts.mjs \
            scripts/test-discover-deck.mjs \
            scripts/verify-taste-journey-posters.mjs \
            scripts/verify-brand-identity-assets.mjs \
            scripts/verify-menu-image-assets.mjs \
            scripts/verify-pr140-release-blockers.mjs \
            scripts/verify-menu-truth-live.mjs \
            scripts/verify-menu-order.mjs \
            scripts/test-brand-wordmark.mjs \
            scripts/verify-regression-contracts.mjs \
            scripts/verify-entry-handoff.mjs \
            qa/traceability/api-platform.json \
            index.html menu.html experience/index.html smart-choice/index.html sw.js sw-core-v64.js integrity-manifest.json
          if git diff --cached --quiet; then
            echo 'No source/generated changes to commit.'
          else
            git diff --cached --check
            git commit -m 'Support split service-worker core and generate manual QA polish'
            git push origin HEAD:tmp/manual-qa-rebase-verify-20260916
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manual-qa-rebase-proof-${{ github.run_id }}
          path: qa-manual-rebase/
          if-no-files-found: warn
          retention-days: 7
