name: Prepare isolated menu performance candidate
on:
  push:
    branches: [perf/menu-switch-scroll-20261021]
    paths: [.github/workflows/prepare-menu-performance.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/perf/menu-switch-scroll-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: perf/menu-switch-scroll-20261021
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Apply reviewed authored changes
        run: node scripts/prepare-menu-performance.mjs
      - name: Canonical rebuild, integrity and complete static regression
        run: |
          npm run build
          npm run integrity:generate
          npm run check
          npm run verify:security
          git diff --check
      - name: Commit only to the isolated feature branch, removing temporary setup
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm scripts/prepare-menu-performance.mjs .github/workflows/perf-workspace-export.yml .github/workflows/prepare-menu-performance.yml
          git add src scripts/measure-menu-responsiveness.mjs scripts/test-menu-feed-navigation.mjs scripts/test-menu-view-mode.mjs menu-app.js menu-feed.js menu-view-mode.js menu.html menu-feed.html sw-core-v64.js integrity-manifest.json
          git add -u .github/workflows scripts/prepare-menu-performance.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: warm menu view assets and bound feed scroll work'
          git push origin HEAD:refs/heads/perf/menu-switch-scroll-20261021
          mkdir -p .artifacts/menu-performance-candidate
          git rev-parse HEAD > .artifacts/menu-performance-candidate/head.txt
          git diff --stat f9d728f32c85a8462cea1e8cfa179b445a78e387 > .artifacts/menu-performance-candidate/changes.txt
      - run: npx playwright install --with-deps chromium
      - name: Compare baseline and candidate on the same runner and browser
        run: |
          git worktree add --detach /tmp/robys-menu-baseline f9d728f32c85a8462cea1e8cfa179b445a78e387
          ROBYS_PERF_ROOT=/tmp/robys-menu-baseline ROBYS_PERF_OUTPUT=.artifacts/menu-performance-candidate/baseline ROBYS_PERF_LABEL=baseline ROBYS_SOURCE_REVISION=f9d728f32c85a8462cea1e8cfa179b445a78e387 node scripts/measure-menu-responsiveness.mjs
          ROBYS_PERF_OUTPUT=.artifacts/menu-performance-candidate/candidate ROBYS_PERF_LABEL=candidate ROBYS_SOURCE_REVISION=$(git rev-parse HEAD) node scripts/measure-menu-responsiveness.mjs
      - name: Full Chromium feed and view-switch regression
        env:
          CHECKOUT_BROWSERS: chromium
        run: node scripts/test-menu-feed-browser.mjs
      - name: Export exact candidate evidence without credentials
        if: always()
        run: |
          mkdir -p .artifacts/menu-performance-candidate
          git rev-parse HEAD > .artifacts/menu-performance-candidate/final-head.txt
          git diff --check
          git archive --format=tar.gz HEAD > .artifacts/menu-performance-candidate/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-performance-candidate
          path: |
            .artifacts/menu-performance-candidate/
            .artifacts/menu-feed/
          retention-days: 7
