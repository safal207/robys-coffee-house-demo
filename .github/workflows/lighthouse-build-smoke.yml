name: Lighthouse build and smoke

on:
  workflow_call:

env:
  LHCI_VERSION: "0.15.1"

jobs:
  build-smoke:
    # The signed ffprobe prerequisite supports this Ubuntu deb822 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check app.js
      - name: Ensure ffprobe is available
        run: node scripts/ensure-lighthouse-ffprobe.mjs
      - run: npm run verify:media
      - name: Refresh redirect smoke
        run: npx --yes @lhci/cli@${LHCI_VERSION} collect --config=lighthouse/lighthouserc.refresh-smoke.cjs
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-refresh-smoke-${{ github.sha }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
