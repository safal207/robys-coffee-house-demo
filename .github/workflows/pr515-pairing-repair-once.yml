name: PR515 pairing runtime repair once
on:
  push:
    branches: [feat/taste-memory-social-20261120]
    paths: [.github/workflows/pr515-pairing-repair-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run integrity:generate
      - run: npm run verify:integrity
      - run: node scripts/verify-pairing-cta.mjs
      - run: node --test scripts/test-performance-delivery-regression.mjs
      - name: Commit reproducible outputs and remove temporary workflow
        run: |
          git rm .github/workflows/pr515-pairing-repair-once.yml
          git add pairing-posters.js menu.html menu-grid.html sw-core-v64.js integrity-manifest.json
          if [ -n "$(git diff --name-only)" ]; then
            echo "Unexpected generated drift, refusing push:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync corrected pairing runtime and integrity'
          git push origin HEAD:feat/taste-memory-social-20261120
