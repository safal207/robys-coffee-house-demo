name: Temporary current-main menu truth repair

on:
  push:
    branches:
      - fix/menu-truth-current-main-20260910

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fail-closed current-main repair
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');

          const expectedBase = '910326ec514e337b77134d01067a3e975c438f10';
          const actualBase = cp.execSync('git rev-parse HEAD^', { encoding: 'utf8' }).trim();
          if (actualBase !== expectedBase) {
            throw new Error(`Repair base moved: expected ${expectedBase}, got ${actualBase}`);
          }

          function replaceOnce(path, from, to, label) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(from);
            if (first < 0 || source.indexOf(from, first + from.length) >= 0) {
              throw new Error(`${label}: expected exactly one source match in ${path}`);
            }
            fs.writeFileSync(path, source.slice(0, first) + to + source.slice(first + from.length));
          }

          replaceOnce(
            'src/menu-app.js',
            `searchInput.addEventListener("input", () => {\n  searchTerm = searchInput.value;\n  renderMenu();\n});`,
            `searchInput.addEventListener("input", () => {\n  searchTerm = searchInput.value;\n  if (searchTerm.trim() && activeCategory !== "all") {\n    activeCategory = "all";\n    syncCategoryHash("all");\n    renderCategoryNav();\n  }\n  renderMenu();\n});`,
            'global menu search'
          );

          replaceOnce(
            'pairing-posters.js',
            `    oldPrice: "340 ₺",\n`,
            ``,
            'unsupported historical price'
          );
          replaceOnce(
            'pairing-posters.js',
            `function posterKicker(lang) {\n  return {\n    tr: "PAIR OF THE DAY",\n    en: "PAIR OF THE DAY",\n    ru: "PAIR OF THE DAY"\n  }[lang] ?? "PAIR OF THE DAY";\n}`,
            `function posterKicker() {\n  return "TASTE JOURNEY";\n}`,
            'time-sensitive poster claim'
          );
          replaceOnce(
            'pairing-posters.js',
            `    kicker.textContent = posterKicker(lang);`,
            `    kicker.textContent = posterKicker();`,
            'neutral poster kicker call'
          );
          replaceOnce(
            'pairing-posters.js',
            `    if (meta.oldPrice) {\n      const oldPrice = document.createElement("span");\n      oldPrice.className = "pairing-poster-old-price";\n      oldPrice.textContent = meta.oldPrice;\n      priceBadge.append(oldPrice);\n    }\n`,
            ``,
            'crossed-out price renderer'
          );

          const posterSource = fs.readFileSync('pairing-posters.js', 'utf8');
          const posterRevision = crypto.createHash('sha256').update(posterSource).digest('hex').slice(0, 12);

          let menuHtml = fs.readFileSync('menu.html', 'utf8');
          const posterScriptPattern = /pairing-posters\.js\?v=[^"']+/;
          if (!posterScriptPattern.test(menuHtml)) throw new Error('menu.html has no pairing poster script revision');
          menuHtml = menuHtml.replace(posterScriptPattern, `pairing-posters.js?v=${posterRevision}`);
          fs.writeFileSync('menu.html', menuHtml);

          let sw = fs.readFileSync('sw.js', 'utf8');
          const cachePattern = /const CACHE_VERSION = "robys-offline-[^"]+";/;
          if (!cachePattern.test(sw)) throw new Error('Service-worker cache version marker missing');
          sw = sw.replace(
            cachePattern,
            `const CACHE_VERSION = "robys-offline-v64-20260910-menu-truth-${posterRevision}-d16fc23e122d-58d387ca0c01-96b566c9731e";`
          );
          const coreAnchor = `  "./menu-product-reveal-runtime.js?v=90e757f93063",\n`;
          if (!sw.includes(coreAnchor) || sw.includes('./pairing-posters.js?v=')) {
            throw new Error('Unexpected pairing poster CORE_ASSETS state');
          }
          sw = sw.replace(coreAnchor, `${coreAnchor}  "./pairing-posters.js?v=${posterRevision}",\n`);
          const exactAnchor = `    url.pathname.endsWith("/menu-product-reveal-runtime.js") ||\n`;
          if (!sw.includes(exactAnchor) || sw.includes('url.pathname.endsWith("/pairing-posters.js")')) {
            throw new Error('Unexpected pairing poster exact-revision state');
          }
          sw = sw.replace(exactAnchor, `${exactAnchor}    url.pathname.endsWith("/pairing-posters.js") ||\n`);
          fs.writeFileSync('sw.js', sw);

          const verifier = `import assert from "node:assert/strict";\nimport { createHash } from "node:crypto";\nimport { readFileSync } from "node:fs";\nimport { readVerifiedMenuSource } from "./menu-runtime-source.mjs";\n\nconst poster = readFileSync("pairing-posters.js", "utf8");\nconst menuHtml = readFileSync("menu.html", "utf8");\nconst serviceWorker = readFileSync("sw.js", "utf8");\nconst menuSource = readVerifiedMenuSource();\nconst posterRevision = createHash("sha256").update(poster).digest("hex").slice(0, 12);\n\nassert.doesNotMatch(poster, /\\boldPrice\\b/, "Poster runtime must not carry an unsupported historical price");\nassert.doesNotMatch(poster, /PAIR OF THE DAY/i, "Poster runtime must not make an unowned time-sensitive claim");\nassert.match(poster, /TASTE JOURNEY/, "Poster kicker must use the existing neutral Taste Journey identity");\nassert.match(menuSource, /searchTerm\\.trim\\(\\) && activeCategory !== "all"[\\s\\S]*activeCategory = "all"[\\s\\S]*syncCategoryHash\\("all"\\)[\\s\\S]*renderCategoryNav\\(\\)/, "A non-empty search must expand from a selected category to the full menu");\nassert.match(menuHtml, new RegExp(\`pairing-posters\\\\.js\\\\?v=\${posterRevision}\`), "menu.html must bind the poster runtime to its exact content revision");\nassert.match(serviceWorker, new RegExp(\`\\"\\\\./pairing-posters\\\\.js\\\\?v=\${posterRevision}\\"\`), "Service worker must precache the exact poster revision");\nassert.match(serviceWorker, /url\\.pathname\\.endsWith\\("\\/pairing-posters\\.js"\\)/, "Poster runtime must use exact-revision cache matching");\nassert.match(serviceWorker, new RegExp(\`robys-offline-v64-20260910-menu-truth-\${posterRevision}-\`), "Cache version must invalidate clients when this repair lands");\n\nconsole.log(\`✅ MENU-TRUTH-LIVE-001: global search, neutral pairing claims, and exact poster cache binding verified at \${posterRevision}.\`);\n`;
          fs.writeFileSync('scripts/verify-menu-truth-live.mjs', verifier);

          replaceOnce(
            'scripts/verify-pairing-cta.mjs',
            `import "./verify-pairing-catalog-parity.mjs";\n`,
            `import "./verify-pairing-catalog-parity.mjs";\nimport "./verify-menu-truth-live.mjs";\n`,
            'live menu truth verifier registration'
          );

          console.log(`Prepared current-main repair; pairing poster revision ${posterRevision}`);
          NODE

      - name: Rebuild generated runtime
        run: npm run build

      - name: Regenerate integrity manifest
        run: npm run integrity:generate

      - name: Verify focused contracts
        run: |
          npm run verify:pairing-cta
          npm run verify:menu-content
          npm run verify:integrity
          node --check pairing-posters.js
          node --check menu-app.js
          node --check sw.js
          git diff --check

      - name: Verify security boundary
        run: npm run verify:security

      - name: Remove temporary workflow and commit clean result
        shell: bash
        run: |
          rm .github/workflows/tmp-menu-truth-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(menu): restore global search and evidence-backed pairing copy"
          git push origin HEAD:fix/menu-truth-current-main-20260910
