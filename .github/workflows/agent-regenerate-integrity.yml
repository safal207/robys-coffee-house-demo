name: Agent regenerate integrity manifest

on:
  push:
    branches:
      - agent/robys-equal-word-height
    paths:
      - src/brand/robys-header-master-v1.svg
      - src/brand/robys-primary-master-v1.svg
      - sw.js
      - .github/workflows/agent-regenerate-integrity.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/robys-equal-word-height
          fetch-depth: 0

      - name: Generate current manifest
        run: node scripts/generate-integrity-manifest.mjs

      - name: Commit regenerated manifest
        shell: bash
        run: |
          if git diff --quiet -- integrity-manifest.json; then
            echo "Manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity-manifest.json
          git commit -m "Regenerate integrity manifest for logo alignment"
          git push origin HEAD:agent/robys-equal-word-height
