name: Cinematic generated-state sync

on:
  push:
    branches: [feature/cinematic-experience]

permissions:
  contents: write

concurrency:
  group: cinematic-generated-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Synchronize generated revisions
        run: npm run build

      - name: Refresh integrity manifest
        run: npm run integrity:generate

      - name: Run complete repository check on synchronized tree
        run: npm run check

      - name: Refresh and verify final integrity state
        shell: bash
        run: |
          set -euo pipefail
          npm run integrity:generate
          npm run verify:integrity
          npm run verify:security

      - name: Reject unexpected generated drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              'sw.js',
              'experience/index.html',
              'experience/cinematic-environments.css',
              'integrity-manifest.json',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = []
          for line in lines:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
          unexpected = sorted(set(changed) - allowed)
          print('Generated changes:', changed)
          if unexpected:
              raise SystemExit(f'Unexpected generated drift: {unexpected}')
          PY

      - name: Persist synchronized generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js experience/index.html experience/cinematic-environments.css integrity-manifest.json
          if git diff --cached --quiet; then
            echo 'Generated state already synchronized.'
            exit 0
          fi
          git commit -m 'Sync cinematic generated revisions'
          git push
