name: PR515 one-shot performance rebuild 2
# Recheck the generated QA source and delivered runtime after ASSET-001 verifier repair
on:
  push:
    branches: [feat/taste-memory-social-20261120]
    paths: [.github/workflows/pr515-performance-build-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run integrity:generate
      - run: node --test scripts/test-performance-delivery-regression.mjs
      - run: node scripts/verify-p1-interface-contracts.mjs
      - name: Commit generated assets and remove one-shot workflow
        run: |
          git rm .github/workflows/pr515-performance-build-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync first-feed hint and minified QA runtime'
          git push origin HEAD:feat/taste-memory-social-20261120
