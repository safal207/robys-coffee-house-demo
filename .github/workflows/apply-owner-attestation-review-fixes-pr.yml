name: Apply owner-attestation review fixes from PR

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    name: Apply bounded review fixes
    if: github.event.pull_request.head.ref == 'feat/owner-business-truth-attestation-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/owner-business-truth-attestation-v1
          fetch-depth: 0

      - name: Decide whether this is the one-shot trigger commit
        id: gate
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "ci: trigger owner-attestation review fixes" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Apply exact bounded changes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/causal-refactoring-lib.mjs",
              """  if (!isObject(reference) || !SHA256_DIGEST.test(reference.canonical_json_sha256)) {
            return ['owner_attestation must contain a valid canonical_json_sha256 before evidence validation'];
          }
          if (typeof evidenceText !== 'string') {
          """,
              """  if (!isObject(reference) || !SHA256_DIGEST.test(reference.canonical_json_sha256)) {
            return ['owner_attestation must contain a valid canonical_json_sha256 before evidence validation'];
          }
          if (!isDateOnly(reference.confirmed_at)) {
            return [
              'owner_attestation.confirmed_at must be a valid YYYY-MM-DD date before evidence validation'
            ];
          }
          if (typeof evidenceText !== 'string') {
          """,
          )

          replace_once(
              "scripts/causal-refactoring-lib.mjs",
              """  if (record.confirmed_at !== status.reviewed_at) {
            errors.push('owner attestation confirmed_at must equal business-truth reviewed_at');
          }
          """,
              """  if (record.confirmed_at !== reference.confirmed_at) {
            errors.push(
              'owner attestation confirmed_at must equal owner_attestation.confirmed_at'
            );
          }
          """,
          )

          replace_once(
              "scripts/causal-refactoring-lib.mjs",
              """      if (!isSafeRepositoryPath(ownerAttestation.path)) {
                errors.push('owner_attestation.path must be a safe repository-relative path');
              }
              if (!SHA256_DIGEST.test(ownerAttestation.canonical_json_sha256)) {
          """,
              """      if (!isSafeRepositoryPath(ownerAttestation.path)) {
                errors.push('owner_attestation.path must be a safe repository-relative path');
              }
              if (!isDateOnly(ownerAttestation.confirmed_at)) {
                errors.push('owner_attestation.confirmed_at must be a valid YYYY-MM-DD date');
              } else if (
                isDateOnly(status.reviewed_at)
                && ownerAttestation.confirmed_at > status.reviewed_at
              ) {
                errors.push('owner_attestation.confirmed_at cannot be later than reviewed_at');
              }
              if (!SHA256_DIGEST.test(ownerAttestation.canonical_json_sha256)) {
          """,
          )

          replace_once(
              "qa/causal-refactoring/business-truth-status.json",
              """  \"owner_attestation\": {
                \"path\": \"qa/causal-refactoring/owner-business-truth-attestation-2026-08-30.json\",
                \"canonical_json_sha256\": \"sha256:796292cb408fbe333adf542e252a6e0de23a0b7abf1947dfaed7e0b7a6e13916\"
              },
          """,
              """  \"owner_attestation\": {
                \"path\": \"qa/causal-refactoring/owner-business-truth-attestation-2026-08-30.json\",
                \"confirmed_at\": \"2026-08-30\",
                \"canonical_json_sha256\": \"sha256:796292cb408fbe333adf542e252a6e0de23a0b7abf1947dfaed7e0b7a6e13916\"
              },
          """,
          )

          replace_once(
              "scripts/test-causal-refactoring.mjs",
              """const ownerAttestationRecord = JSON.parse(ownerAttestationText);
          assert.equal(
            truthStatus.owner_attestation.canonical_json_sha256,
            digestBusinessValue(ownerAttestationRecord)
          );
          """,
              """const ownerAttestationRecord = JSON.parse(ownerAttestationText);
          assert.equal(
            truthStatus.owner_attestation.canonical_json_sha256,
            digestBusinessValue(ownerAttestationRecord)
          );
          assert.equal(
            truthStatus.owner_attestation.confirmed_at,
            ownerAttestationRecord.confirmed_at
          );
          """,
          )

          replace_once(
              "scripts/test-causal-refactoring.mjs",
              """assert(
            validateOwnerAttestationEvidence(
              ownerEvidenceDriftedLedger,
              ownerAttestationText,
              ownerEvidenceDriftedProfile
            ).includes(
              'owner attestation field opens does not match production ledger and business profile'
            )
          );

          const missingOwnerAttestation = structuredClone(truthStatus);
          """,
              """assert(
            validateOwnerAttestationEvidence(
              ownerEvidenceDriftedLedger,
              ownerAttestationText,
              ownerEvidenceDriftedProfile
            ).includes(
              'owner attestation field opens does not match production ledger and business profile'
            )
          );

          const technicalMetadataProfile = { ...profile, version: profile.version + 1 };
          const technicalMetadataLedger = structuredClone(truthStatus);
          technicalMetadataLedger.reviewed_at = '2026-08-31';
          const technicalVersionField = technicalMetadataLedger.fields.find(
            (field) => field.key === 'version'
          );
          technicalVersionField.value_sha256 = digestBusinessValue(
            technicalMetadataProfile.version
          );
          assert.deepEqual(
            validateBusinessTruthStatus(technicalMetadataLedger, technicalMetadataProfile),
            []
          );
          assert.deepEqual(
            validateOwnerAttestationEvidence(
              technicalMetadataLedger,
              ownerAttestationText,
              technicalMetadataProfile
            ),
            []
          );

          const mismatchedOwnerConfirmationDate = structuredClone(truthStatus);
          mismatchedOwnerConfirmationDate.owner_attestation.confirmed_at = '2026-08-29';
          assert(
            validateOwnerAttestationEvidence(
              mismatchedOwnerConfirmationDate,
              ownerAttestationText,
              profile
            ).includes(
              'owner attestation confirmed_at must equal owner_attestation.confirmed_at'
            )
          );

          const missingOwnerConfirmationDate = structuredClone(truthStatus);
          delete missingOwnerConfirmationDate.owner_attestation.confirmed_at;
          assert(
            validateBusinessTruthStatus(missingOwnerConfirmationDate, profile)
              .includes('owner_attestation.confirmed_at must be a valid YYYY-MM-DD date')
          );

          const futureOwnerConfirmationDate = structuredClone(truthStatus);
          futureOwnerConfirmationDate.owner_attestation.confirmed_at = '2026-08-31';
          assert(
            validateBusinessTruthStatus(futureOwnerConfirmationDate, profile)
              .includes('owner_attestation.confirmed_at cannot be later than reviewed_at')
          );

          const missingOwnerAttestation = structuredClone(truthStatus);
          """,
          )

          replace_once(
              "docs/causal-refactoring/owner-business-truth-attestation-2026-08-30.md",
              """Binding rule: the ledger stores the canonical JSON SHA-256 digest of the owner manifest. The verifier compares every manifest field, value and value digest with both the production ledger and canonical business profile. Any manifest or confirmed-value change requires a renewed owner review and a replacement digest.
          """,
              """Binding rule: the ledger stores the canonical JSON SHA-256 digest and owner-specific `confirmed_at` date of the owner manifest. The verifier compares every manifest field, value and value digest with both the production ledger and canonical business profile. Any manifest or confirmed-value change requires a renewed owner review and a replacement digest.

          The ledger's top-level `reviewed_at` is the date of the latest ledger review and may advance when repository-controlled fields change. It does not renew owner confirmation. `owner_attestation.confirmed_at` remains pinned to the immutable manifest's `confirmed_at` until the owner performs a new confirmation event.
          """,
          )

          replace_once(
              "docs/causal-refactoring/owner-business-truth-attestation-2026-08-30.md",
              """The existing JSON manifest and this human-readable record remain registered in the repository as historical evidence, but they no longer authorize the current status ledger. A renewed confirmation requires a replacement manifest and digest before `owner_attestation` is added back and production publication is restored.
          """,
              """The existing JSON manifest and this human-readable record remain registered in the repository as historical evidence, but they no longer authorize the current status ledger.

          Renewal is a new evidence event. Before restoring production publication:

          1. create a new immutable JSON manifest at a new repository path with the renewed exact values, value digests and owner confirmation date;
          2. register that new path in `qa/causal-refactoring/registry.json` with `kind: owner-attestation`;
          3. set `owner_attestation.path`, `owner_attestation.confirmed_at` and `owner_attestation.canonical_json_sha256` in the status ledger to the new manifest;
          4. update the affected field attestations and digests, then restore `publication_mode=production` only after the verifier and exact-head checks pass.
          """,
          )

          replace_once(
              "docs/causal-refactoring/README.md",
              """The eleven current owner-critical fields were confirmed on 2026-08-30 and are bound to their exact canonical values by SHA-256 digests. The production ledger also binds the canonical JSON digest of `qa/causal-refactoring/owner-business-truth-attestation-2026-08-30.json`, whose complete field set is compared with both the ledger and business profile. The human-readable [`owner-business-truth-attestation-2026-08-30.md`](owner-business-truth-attestation-2026-08-30.md) preserves provenance and the claim boundary. Any later value or attestation-manifest change invalidates the gate until the owner confirms the replacement.
          """,
              """The eleven current owner-critical fields were confirmed on 2026-08-30 and are bound to their exact canonical values by SHA-256 digests. The production ledger also binds the canonical JSON digest and owner-specific confirmation date of `qa/causal-refactoring/owner-business-truth-attestation-2026-08-30.json`, whose complete field set is compared with both the ledger and business profile. The human-readable [`owner-business-truth-attestation-2026-08-30.md`](owner-business-truth-attestation-2026-08-30.md) preserves provenance and the claim boundary. Any later value or attestation-manifest change invalidates the gate until the owner confirms the replacement. The ledger's `reviewed_at` may advance for repository-controlled metadata without changing `owner_attestation.confirmed_at` or implying renewed owner approval.
          """,
          )

          replace_once(
              "docs/causal-refactoring/README.md",
              """For each owner-critical field:

          1. confirm the exact value with the café owner;
          2. retain accountable evidence outside secrets or personal data;
          3. compute the canonical value digest with `digestBusinessValue` and store it in `value_sha256`;
          4. change its attestation to `owner-confirmed`;
          5. run the verifier and full repository checks;
          6. bind release evidence to the exact current commit.

          The production gate fails while any owner-critical field remains unconfirmed.
          """,
              """For each owner confirmation event:

          1. confirm the exact owner-critical values with the café owner;
          2. create a new immutable machine-readable manifest at a new repository path with its own `confirmed_at` date, exact values and canonical value digests;
          3. register that new manifest path in `qa/causal-refactoring/registry.json` with `kind: owner-attestation`;
          4. set the ledger's `owner_attestation.path`, `owner_attestation.confirmed_at` and `owner_attestation.canonical_json_sha256` to that registered manifest;
          5. store each canonical value digest in `value_sha256` and change the corresponding field attestation to `owner-confirmed`;
          6. run the verifier and full repository checks;
          7. bind release evidence to the exact current commit.

          The production gate fails while any owner-critical field remains unconfirmed. A replacement or renewed manifest must use a new immutable path, be registered as owner-attestation evidence, and replace all three ledger reference fields before production mode is restored.
          """,
          )
          PY

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Run focused causal-refactoring checks
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check scripts/causal-refactoring-lib.mjs
          node --check scripts/test-causal-refactoring.mjs
          npm run test:causal-refactoring
          npm run verify:causal-refactoring

      - name: Remove one-shot workflow files and commit bounded fixes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git rm -f \
            .github/workflows/apply-owner-attestation-review-fixes.yml \
            .github/workflows/apply-owner-attestation-review-fixes-pr.yml \
            .github/owner-attestation-review-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/causal-refactoring-lib.mjs \
            scripts/test-causal-refactoring.mjs \
            qa/causal-refactoring/business-truth-status.json \
            docs/causal-refactoring/README.md \
            docs/causal-refactoring/owner-business-truth-attestation-2026-08-30.md
          git diff --cached --check
          git commit -m "fix: separate owner confirmation lifecycle"
          git push origin HEAD:feat/owner-business-truth-attestation-v1
