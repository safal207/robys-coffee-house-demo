name: Apply owner-attestation review fixes from PR

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    name: Apply bounded review fixes
    if: github.event.pull_request.head.ref == 'feat/owner-business-truth-attestation-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/owner-business-truth-attestation-v1
          fetch-depth: 0

      - name: Decide whether this is the one-shot trigger commit
        id: gate
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "ci: trigger owner-attestation review fixes" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Apply exact bounded changes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              write(path, text.replace(old, new, 1))

          lib_path = "scripts/causal-refactoring-lib.mjs"
          evidence_marker = "  if (typeof evidenceText !== 'string') {\n"
          evidence_guard = (
              "  if (!isDateOnly(reference.confirmed_at)) {\n"
              "    return [\n"
              "      'owner_attestation.confirmed_at must be a valid YYYY-MM-DD date before evidence validation'\n"
              "    ];\n"
              "  }\n"
          )
          replace_once(lib_path, evidence_marker, evidence_guard + evidence_marker)

          replace_once(
              lib_path,
              "  if (record.confirmed_at !== status.reviewed_at) {\n"
              "    errors.push('owner attestation confirmed_at must equal business-truth reviewed_at');\n"
              "  }\n",
              "  if (record.confirmed_at !== reference.confirmed_at) {\n"
              "    errors.push(\n"
              "      'owner attestation confirmed_at must equal owner_attestation.confirmed_at'\n"
              "    );\n"
              "  }\n"
          )

          digest_marker = (
              "      if (!SHA256_DIGEST.test(ownerAttestation.canonical_json_sha256)) {\n"
          )
          date_validation = (
              "      if (!isDateOnly(ownerAttestation.confirmed_at)) {\n"
              "        errors.push('owner_attestation.confirmed_at must be a valid YYYY-MM-DD date');\n"
              "      } else if (\n"
              "        isDateOnly(status.reviewed_at)\n"
              "        && ownerAttestation.confirmed_at > status.reviewed_at\n"
              "      ) {\n"
              "        errors.push('owner_attestation.confirmed_at cannot be later than reviewed_at');\n"
              "      }\n"
          )
          replace_once(lib_path, digest_marker, date_validation + digest_marker)

          status_path = Path("qa/causal-refactoring/business-truth-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          current_reference = status["owner_attestation"]
          status["owner_attestation"] = {
              "path": current_reference["path"],
              "confirmed_at": "2026-08-30",
              "canonical_json_sha256": current_reference["canonical_json_sha256"]
          }
          status_path.write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          test_path = "scripts/test-causal-refactoring.mjs"
          date_assertion_marker = (
              "const staleOwnerAttestationRecord = structuredClone(ownerAttestationRecord);\n"
          )
          date_assertion = (
              "assert.equal(\n"
              "  truthStatus.owner_attestation.confirmed_at,\n"
              "  ownerAttestationRecord.confirmed_at\n"
              ");\n\n"
          )
          replace_once(test_path, date_assertion_marker, date_assertion + date_assertion_marker)

          lifecycle_marker = "const missingOwnerAttestation = structuredClone(truthStatus);\n"
          lifecycle_tests = (
              "const technicalMetadataProfile = { ...profile, version: profile.version + 1 };\n"
              "const technicalMetadataLedger = structuredClone(truthStatus);\n"
              "technicalMetadataLedger.reviewed_at = '2026-08-31';\n"
              "const technicalVersionField = technicalMetadataLedger.fields.find(\n"
              "  (field) => field.key === 'version'\n"
              ");\n"
              "technicalVersionField.value_sha256 = digestBusinessValue(\n"
              "  technicalMetadataProfile.version\n"
              ");\n"
              "assert.deepEqual(\n"
              "  validateBusinessTruthStatus(technicalMetadataLedger, technicalMetadataProfile),\n"
              "  []\n"
              ");\n"
              "assert.deepEqual(\n"
              "  validateOwnerAttestationEvidence(\n"
              "    technicalMetadataLedger,\n"
              "    ownerAttestationText,\n"
              "    technicalMetadataProfile\n"
              "  ),\n"
              "  []\n"
              ");\n\n"
              "const mismatchedOwnerConfirmationDate = structuredClone(truthStatus);\n"
              "mismatchedOwnerConfirmationDate.owner_attestation.confirmed_at = '2026-08-29';\n"
              "assert(\n"
              "  validateOwnerAttestationEvidence(\n"
              "    mismatchedOwnerConfirmationDate,\n"
              "    ownerAttestationText,\n"
              "    profile\n"
              "  ).includes(\n"
              "    'owner attestation confirmed_at must equal owner_attestation.confirmed_at'\n"
              "  )\n"
              ");\n\n"
              "const missingOwnerConfirmationDate = structuredClone(truthStatus);\n"
              "delete missingOwnerConfirmationDate.owner_attestation.confirmed_at;\n"
              "assert(\n"
              "  validateBusinessTruthStatus(missingOwnerConfirmationDate, profile)\n"
              "    .includes('owner_attestation.confirmed_at must be a valid YYYY-MM-DD date')\n"
              ");\n\n"
              "const futureOwnerConfirmationDate = structuredClone(truthStatus);\n"
              "futureOwnerConfirmationDate.owner_attestation.confirmed_at = '2026-08-31';\n"
              "assert(\n"
              "  validateBusinessTruthStatus(futureOwnerConfirmationDate, profile)\n"
              "    .includes('owner_attestation.confirmed_at cannot be later than reviewed_at')\n"
              ");\n\n"
          )
          replace_once(test_path, lifecycle_marker, lifecycle_tests + lifecycle_marker)

          owner_doc_path = "docs/causal-refactoring/owner-business-truth-attestation-2026-08-30.md"
          owner_doc = read(owner_doc_path)
          owner_heading = "## Owner confirmation lifecycle"
          if owner_heading in owner_doc:
              raise SystemExit(f"{owner_doc_path}: lifecycle section already exists")
          owner_doc += (
              "\n## Owner confirmation lifecycle\n\n"
              "The top-level `reviewed_at` records the latest technical review of the ledger. "
              "It may advance when repository-controlled fields change and does not renew owner approval. "
              "The current owner event remains pinned by `owner_attestation.confirmed_at`, which must equal "
              "the immutable manifest's `confirmed_at` and must not be later than `reviewed_at`.\n\n"
              "A renewal or replacement is a new evidence event. Before production mode is restored, create "
              "a new immutable JSON manifest at a new repository path, register that path in "
              "`qa/causal-refactoring/registry.json` with `kind: owner-attestation`, and replace all three "
              "ledger reference fields: `owner_attestation.path`, `owner_attestation.confirmed_at`, and "
              "`owner_attestation.canonical_json_sha256`. Then update the affected field attestations and "
              "digests and rerun exact-head verification. The historical manifest is never rewritten.\n"
          )
          write(owner_doc_path, owner_doc)

          readme_path = "docs/causal-refactoring/README.md"
          readme = read(readme_path)
          readme_heading = "## Owner confirmation lifecycle"
          if readme_heading in readme:
              raise SystemExit(f"{readme_path}: lifecycle section already exists")
          readme += (
              "\n## Owner confirmation lifecycle\n\n"
              "`reviewed_at` is technical ledger-review time; `owner_attestation.confirmed_at` is owner-event "
              "time. Updating repository-controlled metadata may advance the former without changing the "
              "latter or implying renewed owner confirmation.\n\n"
              "Every renewed or replacement attestation must use a new immutable manifest path, be registered "
              "in `qa/causal-refactoring/registry.json` with `kind: owner-attestation`, and replace the ledger's "
              "attestation path, confirmation date, and canonical manifest digest before "
              "`publication_mode=production` is restored.\n"
          )
          write(readme_path, readme)
          PY

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Run focused causal-refactoring checks
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check scripts/causal-refactoring-lib.mjs
          node --check scripts/test-causal-refactoring.mjs
          npm run test:causal-refactoring
          npm run verify:causal-refactoring

      - name: Remove one-shot workflow files and commit bounded fixes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git rm -f \
            .github/workflows/apply-owner-attestation-review-fixes.yml \
            .github/workflows/apply-owner-attestation-review-fixes-pr.yml \
            .github/owner-attestation-review-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/causal-refactoring-lib.mjs \
            scripts/test-causal-refactoring.mjs \
            qa/causal-refactoring/business-truth-status.json \
            docs/causal-refactoring/README.md \
            docs/causal-refactoring/owner-business-truth-attestation-2026-08-30.md
          git diff --cached --check
          git commit -m "fix: separate owner confirmation lifecycle"
          git push origin HEAD:feat/owner-business-truth-attestation-v1
