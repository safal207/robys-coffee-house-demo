name: Menu Product Reveal

on:
  pull_request:
    paths:
      - "menu.html"
      - "menu-product-reveal.js"
      - "menu-product-reveal-runtime.js"
      - "menu-product-reveal.css"
      - "menu-runtime.css"
      - "styles-v2.css"
      - "menu-premium.css"
      - "menu-family.css"
      - "pairing-posters.css"
      - "menu-stability.css"
      - "menu-stability-v2.css"
      - "menu-security-v2.css"
      - "brand-photo-logo.css"
      - "order-checkout.css"
      - "scripts/menu-styles-bundle.mjs"
      - "scripts/test-menu-styles-bundle.mjs"
      - "scripts/build.mjs"
      - "scripts/test-menu-product-reveal.mjs"
      - "scripts/test-menu-product-reveal-browser.mjs"
      - "scripts/ensure-playwright-browsers.mjs"
      - "scripts/signed-ubuntu-packages.mjs"
      - "scripts/test-playwright-prerequisites.mjs"
      - "package.json"
      - "package-lock.json"
      - "src/products/san-sebastian.webp"
      - ".github/workflows/menu-product-reveal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check menu-product-reveal.js
          node --check menu-product-reveal-runtime.js
          node --check scripts/test-menu-product-reveal.mjs
          node --check scripts/test-menu-product-reveal-browser.mjs
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Verify reveal contract
        run: node scripts/test-menu-product-reveal.mjs
      - name: Install test browser
        run: node scripts/ensure-playwright-browsers.mjs chromium
      - name: Run Chromium reveal smoke
        run: node scripts/test-menu-product-reveal-browser.mjs
