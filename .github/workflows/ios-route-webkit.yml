name: iOS WebKit route gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-route-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright for the iOS WebKit gate
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps webkit

      - name: Build site
        run: npm run build

      - name: Start local HTTPS site
        run: |
          # WebKit honors upgrade-insecure-requests on loopback too. Serve TLS
          # instead of changing the production CSP or testing an unstyled page.
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/robys-ios.key -out /tmp/robys-ios.crt \
            -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
          python3 - <<'PY' > /tmp/robys-ios-server.log 2>&1 &
          import http.server, ssl
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 4173), http.server.SimpleHTTPRequestHandler)
          tls = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          tls.load_cert_chain('/tmp/robys-ios.crt', '/tmp/robys-ios.key')
          server.socket = tls.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          echo $! > /tmp/robys-ios-server.pid
          for attempt in {1..30}; do
            if curl --cacert /tmp/robys-ios.crt --fail --silent https://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/robys-ios-server.log
          exit 1

      - name: Verify Google Maps route handoff in iPhone WebKit
        env:
          BASE_URL: https://127.0.0.1:4173
        run: node scripts/verify-ios-route-webkit.mjs

      - name: Upload iOS route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-route-webkit-${{ github.run_id }}
          path: |
            qa-artifacts/ios-route-webkit.json
            qa-artifacts/ios-route-map.png
            qa-artifacts/ios-route-trace.zip
            /tmp/robys-ios-server.log
          if-no-files-found: warn
          retention-days: 14
