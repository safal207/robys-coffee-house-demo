name: Manual QA generated sync

on:
  push:
    branches:
      - fix/manual-qa-polish-20260915

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build generated runtime
        run: npm run build
      - name: Refresh integrity manifest
        run: npm run integrity:generate
      - name: Full repository check
        run: npm run check
      - name: Security check
        run: npm run verify:security
      - name: Collect generated diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          mkdir -p generated-sync
          git diff --name-only -z | while IFS= read -r -d '' file; do
            mkdir -p "generated-sync/$(dirname "$file")"
            cp "$file" "generated-sync/$file"
          done
          git diff --name-only > generated-sync/changed-files.txt
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual-qa-generated-sync-${{ github.run_id }}
          path: generated-sync/
          if-no-files-found: error
          retention-days: 7
