name: Manual QA generated sync

on:
  push:
    branches:
      - qa/generated-sync-403

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Align shared Smart Choice PWA precache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sw-core-v64.js')
          text = path.read_text()
          old = '"./smart-choice/pwa.js?v=premium-cache-new-20260904-1"'
          new = '"./smart-choice/pwa.js?v=pairing-video-fix-20260916-2"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old Smart Choice PWA cache key, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Rebuild deterministic generated outputs
        run: |
          npm run build
          npm run integrity:generate
      - name: Verify exact generated allowlist
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            experience/index.html
            featured-gallery.js
            index.html
            integrity-manifest.json
            sw-core-v64.js
          )
          if [[ ${#changed[@]} -ne ${#expected[@]} ]]; then
            echo "unexpected generated file count" >&2
            exit 1
          fi
          for i in "${!expected[@]}"; do
            [[ "${changed[$i]}" == "${expected[$i]}" ]] || {
              echo "unexpected generated path: ${changed[$i]} != ${expected[$i]}" >&2
              exit 1
            }
          done
      - name: Commit generated outputs to scratch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience/index.html featured-gallery.js index.html integrity-manifest.json sw-core-v64.js
          git commit -m "Materialize generated outputs [skip ci]"
          git push origin HEAD:qa/generated-sync-403
