name: PR515 temporary LCP build synchronization
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pr515-lcp-build-sync.yml'
      - 'src/menu-app.js'
      - 'scripts/test-performance-delivery-regression.mjs'
permissions:
  contents: write
jobs:
  generated:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Fail on concurrently changed branch
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run integrity:generate
      - name: Verify newly generated runtime and performance contracts
        run: |
          node --test scripts/test-performance-delivery-regression.mjs
          npm run verify:integrity
      - name: Commit generated artifacts and self-delete temporary workflow
        shell: bash
        run: |
          git rm -f .github/workflows/pr515-lcp-build-sync.yml
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(menu): sync conditional localization and integrity runtime'
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
