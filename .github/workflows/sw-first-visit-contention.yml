name: Service Worker first-visit contention audit
on:
  pull_request:
    paths:
      - "scripts/audit-sw-first-visit-contention.mjs"
      - ".github/workflows/sw-first-visit-contention.yml"
permissions:
  contents: read
concurrency:
  group: sw-first-visit-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cold-visit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ensure-playwright-browsers.mjs chromium
      - name: Validate audit JavaScript syntax
        run: node --check scripts/audit-sw-first-visit-contention.mjs
      - name: Compare cold first visits with and without Service Worker
        run: node scripts/audit-sw-first-visit-contention.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sw-first-visit-contention-evidence
          path: .artifacts/sw-first-visit-contention/
          if-no-files-found: error
          retention-days: 14
