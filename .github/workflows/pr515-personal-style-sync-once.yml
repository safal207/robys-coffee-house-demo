name: PR515 personal feed CSS sync once
on:
  push:
    branches: [feat/taste-memory-social-20261120]
    paths: [.github/workflows/pr515-personal-style-sync-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run integrity:generate
      - run: npm run verify:integrity
      - run: node --test scripts/test-performance-delivery-regression.mjs scripts/test-menu-feed.mjs scripts/test-menu-view-mode.mjs scripts/test-causal-regression-pipeline.mjs
      - run: node scripts/verify-entry-handoff.mjs
      - name: Commit generated assets and remove one-shot workflow
        run: |
          git rm .github/workflows/pr515-personal-style-sync-once.yml
          git add -u
          for path in $(git diff --cached --name-only); do
            case "$path" in
              .github/workflows/pr515-personal-style-sync-once.yml|menu-feed.html|sw-core-v64.js|integrity-manifest.json|menu.html|menu-grid.html|index.html|qa.js|src/bootstrap-v2.js|bootstrap-v2.js|discover.html) ;;
              *) echo "Unexpected generated change: $path"; exit 1 ;;
            esac
          done
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync nonblocking personal feed styles and module revision'
          git push origin HEAD:feat/taste-memory-social-20261120
