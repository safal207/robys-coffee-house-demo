name: Visual toolchain lock preparation

on:
  pull_request:
    paths:
      - '.github/workflows/visual-toolchain-prepare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record source and original dependency inputs
        run: |
          mkdir -p toolchain-evidence/original toolchain-evidence/candidate
          git rev-parse HEAD > toolchain-evidence/source-sha.txt
          cp package.json package-lock.json toolchain-evidence/original/
          node -e "require('node:assert/strict').equal(require('./package.json').devDependencies.playwright, '1.55.1')"
      - name: Generate candidate lock with npm, without executing package scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact pixelmatch@6.0.0 pngjs@7.0.0
          node -e "const a=require('node:assert/strict'),p=require('./package.json'),l=require('./package-lock.json'); a.equal(p.devDependencies.playwright,'1.55.1'); for(const [n,v] of Object.entries({playwright:'1.55.1',pixelmatch:'6.0.0',pngjs:'7.0.0'})){a.equal(p.devDependencies[n],v);a.equal(l.packages['node_modules/'+n].version,v)}"
          cp package.json package-lock.json toolchain-evidence/candidate/
          git diff -- package.json package-lock.json > toolchain-evidence/dependencies.patch
      - name: Install exact candidate tree
        run: npm ci --no-audit --no-fund
      - name: Record effective dependency tree
        run: |
          node --version > toolchain-evidence/node-version.txt
          npm --version > toolchain-evidence/npm-version.txt
          npm ls --all --json > toolchain-evidence/npm-ls.json
      - name: Audit candidate dependency tree without applying fixes
        run: |
          set +e
          npm audit --json --audit-level=high > toolchain-evidence/npm-audit.json 2> toolchain-evidence/npm-audit.stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > toolchain-evidence/npm-audit.exit-code.txt
          exit "$status"
      - name: Upload preparation evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-toolchain-prepare-${{ github.event.pull_request.head.sha || github.sha }}
          path: toolchain-evidence/
          if-no-files-found: error
          retention-days: 14
