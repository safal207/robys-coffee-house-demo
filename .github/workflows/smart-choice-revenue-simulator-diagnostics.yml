name: Smart Choice revenue simulator diagnostics

on:
  pull_request:
    paths:
      - 'src/smart-choice/revenue-simulator*'
      - 'smart-choice/simulator*'
      - 'scripts/*revenue-simulator*'
      - 'package.json'
      - '.github/workflows/smart-choice-revenue-simulator-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Revenue arithmetic suite
        run: npm run test:smart-choice-revenue-simulator
      - name: TypeScript
        run: npm run typecheck
      - name: Build existing site
        run: node scripts/build.mjs
      - name: Build simulator
        run: node scripts/build-smart-choice-revenue-simulator.mjs
      - name: Verify simulator
        run: npm run verify:smart-choice-revenue-simulator
