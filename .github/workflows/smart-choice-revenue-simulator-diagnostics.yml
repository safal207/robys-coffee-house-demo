name: Smart Choice revenue simulator diagnostics

on:
  pull_request:
    paths:
      - 'src/smart-choice/revenue-simulator*'
      - 'smart-choice/simulator*'
      - 'scripts/*revenue-simulator*'
      - 'package.json'
      - '.github/workflows/smart-choice-revenue-simulator-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Revenue arithmetic suite
        run: npm run test:smart-choice-revenue-simulator
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/revenue-simulator-tsc.log 2>&1
          echo $? > /tmp/revenue-simulator-tsc.code
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: revenue-simulator-tsc-log
          path: |
            /tmp/revenue-simulator-tsc.log
            /tmp/revenue-simulator-tsc.code
      - name: Enforce TypeScript result
        shell: bash
        run: exit "$(cat /tmp/revenue-simulator-tsc.code)"
      - name: Build existing site
        run: node scripts/build.mjs
      - name: Build simulator
        run: node scripts/build-smart-choice-revenue-simulator.mjs
      - name: Verify simulator
        run: npm run verify:smart-choice-revenue-simulator
