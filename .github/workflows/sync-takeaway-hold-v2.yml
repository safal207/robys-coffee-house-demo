name: Sync Takeaway Hold V2

on:
  push:
    branches:
      - fix/takeaway-hold-after-settle-v2
    paths:
      - "takeaway-entry.js"
      - "scripts/premium-depth-smoke.mjs"
      - "scripts/test-takeaway-entry.mjs"
      - ".github/workflows/sync-takeaway-hold-v2.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/takeaway-hold-after-settle-v2
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove entry unit regression before generation
        run: node --test scripts/test-takeaway-entry.mjs
      - name: Canonical build
        run: npm run build
      - name: Generate and verify integrity
        run: |
          node scripts/generate-integrity-manifest.mjs
          node scripts/verify-integrity-manifest.mjs
      - name: Enforce bounded generated diff
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              bootstrap-v2.js|discover.html|index.html|menu.html|sw.js|integrity-manifest.json) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          test -n "$changed"
      - name: Commit canonical generated output only
        shell: bash
        run: |
          git add -- bootstrap-v2.js discover.html index.html menu.html sw.js integrity-manifest.json
          git diff --cached --quiet && { echo "No canonical diff to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(entry): sync canonical hold revisions"
          git push origin HEAD:fix/takeaway-hold-after-settle-v2
