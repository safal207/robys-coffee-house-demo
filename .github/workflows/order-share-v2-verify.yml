name: Verify order share v2 candidate
'on':
  push:
    branches:
    - qa/order-share-v2-verify-20260908
permissions:
  contents: read
concurrency:
  group: order-share-v2-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BASE_SHA: f0068868851a1cbfaf026923b41264551ab80756
      CANDIDATE_BRANCH: fix/order-share-v2-lifecycle-20260908
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: f0068868851a1cbfaf026923b41264551ab80756
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - run: npm ci --no-audit --no-fund
    - name: Install regression and preserve baseline failure evidence
      shell: bash
      run: |
        mkdir -p .artifacts/order-share-v2
        cat > scripts/test-order-share-lifecycle.mjs <<'LIFECYCLE_EOF'
        /** Actual order-shell.ts + order-share.ts logic integration.
         * The DOM, canonical store, dock and clipboard below are test doubles.
         * This is NOT browser layout/focus evidence, a production-catalog test or site CI.
         */
        import {test} from 'node:test';
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        import vm from 'node:vm';
        import {createHash} from 'node:crypto';
        import ts from 'typescript';
        const shell=readFileSync(process.env.ORDER_SHELL_SOURCE ?? new URL('../src/order-shell.ts',import.meta.url),'utf8');
        const share=readFileSync(process.env.ORDER_SHARE_SOURCE ?? new URL('../src/order-share.ts',import.meta.url),'utf8');
        console.log('# source_sha256',JSON.stringify({shell:createHash('sha256').update(shell).digest('hex'),share:createHash('sha256').update(share).digest('hex')}));
        const flush=()=>new Promise(r=>setImmediate(r));
        function setup(){
         const focusAttempts=[];
         let document;
         class Element extends EventTarget {
          constructor(tag){super();this.tagName=tag.toUpperCase();this.children=[];this.parentElement=null;this.attributes=new Map();this.className='';this.id='';this.dataset={};this.hidden=false;this.open=false;this.disabled=false;this.value='';this.textContent='';this.inert=false;
           this.classList={add:(...v)=>{this.className=[...new Set([...this.className.split(' ').filter(Boolean),...v])].join(' ')},remove:(...v)=>{this.className=this.className.split(' ').filter(x=>!v.includes(x)).join(' ')},toggle:(x,on)=>{const has=this.className.split(' ').includes(x),next=on===undefined?!has:on;if(next)this.classList.add(x);else this.classList.remove(x);return next;}};
          }
          append(...nodes){for(const n of nodes){n.parentElement=this;this.children.push(n);}}
          replaceChildren(...nodes){for(const n of this.children)n.parentElement=null;this.children=[];this.append(...nodes);}
          setAttribute(k,v){this.attributes.set(k,String(v));if(k==='open')this.open=true;}
          getAttribute(k){return this.attributes.get(k)??null;}
          removeAttribute(k){this.attributes.delete(k);if(k==='open')this.open=false;}
          set href(v){this.setAttribute('href',v);}get href(){return this.getAttribute('href')??'';}
          get isConnected(){return this===document.body||Boolean(this.parentElement?.isConnected);}
          matches(s){if(s.startsWith('#'))return this.id===s.slice(1);if(s.startsWith('.'))return this.className.split(' ').includes(s.slice(1));if(s==='[data-order-focus]')return this.dataset.orderFocus!==undefined;if(s==='button:not([disabled])')return this.tagName==='BUTTON'&&!this.disabled;if(s==='textarea:not([disabled])')return this.tagName==='TEXTAREA'&&!this.disabled;if(s==='a[href]')return this.tagName==='A'&&this.attributes.has('href');return this.tagName.toLowerCase()===s;}
          querySelectorAll(selector){return this.children.flatMap(n=>[n,...n.querySelectorAll('*')]).filter(n=>selector==='*'||selector.split(',').some(s=>n.matches(s.trim())));}
          querySelector(selector){return this.querySelectorAll(selector)[0]??null;}
          getClientRects(){for(let n=this;n;n=n.parentElement)if(n.hidden||(n.tagName==='DIALOG'&&!n.open))return[];return[{}];}
          focus(){focusAttempts.push(this);document.activeElement=this;}
          select(){this.selectionStart=0;this.selectionEnd=this.value.length;}
          click(){if(!this.disabled)this.dispatchEvent(new Event('click',{cancelable:true}));}
          showModal(){this.open=true;}
          close(){this.open=false;}
         }
         document={readyState:'complete',activeElement:null,createElement:t=>new Element(t),documentElement:new Element('html'),body:new Element('body'),querySelector:s=>document.body.querySelector(s)};
         document.documentElement.lang='ru';
         const state={revision:1,lines:[{id:'cold-coffee:iced-latte',quantity:3}]};
         let pendingLegacy=null;const listeners=[];
         const resolveProduct=id=>id==='cold-coffee:iced-latte'?{image:'fixture.png',item:{price:180,name:{tr:'Latte',en:'Latte',ru:'Латте'}}}:undefined;
         const order={get:()=>structuredClone(state),summary:()=>({quantity:state.lines.reduce((n,l)=>n+l.quantity,0),totalMinor:state.lines.reduce((n,l)=>n+18000*l.quantity,0)}),status:()=>({persistent:true,canUndo:false,notice:null,pendingLegacy}),subscribe:fn=>{listeners.push(fn);},setQuantity(id,quantity){state.lines=state.lines.filter(l=>l.id!==id);if(quantity)state.lines.push({id,quantity});state.revision++;for(const f of listeners)f();},undoRemoval(){},resolveMigration(){pendingLegacy=null;for(const f of listeners)f();}};
         const clipboardCalls=[],deferred={};
         const storage=new Map();
         const context=vm.createContext({document,window:new EventTarget(),HTMLElement:Element,MutationObserver:class{observe(){}},navigator:{clipboard:{writeText(text){clipboardCalls.push(text);return new Promise((resolve,reject)=>Object.assign(deferred,{resolve,reject}));}}},sessionStorage:{getItem:k=>storage.get(k)??null,setItem:(k,v)=>storage.set(k,v)},URL,Intl,CustomEvent,Event,setTimeout,Promise,console});
         function load(source,path,dependencies){
          const output=ts.transpileModule(source.replaceAll('import.meta.url','"https://example.test/order-shell.js"'),{compilerOptions:{target:ts.ScriptTarget.ES2020,module:ts.ModuleKind.CommonJS},reportDiagnostics:true});
          assert.equal((output.diagnostics??[]).filter(d=>d.category===ts.DiagnosticCategory.Error).length,0);
          const module={exports:{}};
          const fn=new vm.Script(`(function(exports,module,require){${output.outputText}\n})`,{filename:path}).runInContext(context);
          fn(module.exports,module,name=>{assert(Object.hasOwn(dependencies,name),`Unexpected dependency: ${name}`);return dependencies[name];});return module.exports;
         }
         const realShare=load(share,'order-share.ts',{});
         load(shell,'order-shell.ts',{'./order-share.js':realShare,'./order-dock.js':{installOrderDock(){}},'@robys/order':{order,resolveOrderProduct:resolveProduct,suggestOrderAddition:()=>undefined}});
         const find=selector=>{const node=document.querySelector(selector);assert(node,`Missing ${selector}`);return node;};
         const dialog=find('#robys-order-dialog'),panel=find('#robys-order-sharing'),preview=find('.order-share-preview'),copy=find('.order-share-actions').children[1],status=panel.querySelector('.order-status');
         return {document,order,state,dialog,panel,preview,copy,status,deferred,clipboardCalls,focusAttempts,
          open(){find('#robys-order-trigger').click();},close(){find('.order-close').click();},reveal(){panel.open=true;panel.dispatchEvent(new Event('toggle'));},handoff(){find('#robys-order-handoff').click();},edit(){find('#robys-order-edit').click();},pending(value){pendingLegacy=value;for(const f of listeners)f();}};
        }

        test('closed drawer cannot expose an active share projection on initial render',()=>{const f=setup();assert(!f.dialog.open);assert(f.panel.hidden);assert.equal(f.preview.value,'');});
        test('opening the real shell reveals the collapsed sharing control and canonical total',()=>{const f=setup();f.open();assert(f.dialog.open);assert(!f.panel.hidden);assert(!f.panel.open);f.reveal();assert(f.preview.value.includes('3 × Латте'));assert(f.preview.value.includes('540'));assert.deepEqual(f.clipboardCalls,[]);});
        test('closing drawer clears disclosure and cannot leave a stale success view on reopening',async()=>{const f=setup();f.open();f.reveal();f.copy.click();f.deferred.resolve();await flush();assert(f.status.textContent.includes('скопирован'));f.close();assert(!f.dialog.open);assert(f.panel.hidden);assert(!f.panel.open);assert.equal(f.preview.value,'');assert.equal(f.status.textContent,'');f.open();assert(!f.panel.hidden);assert(!f.panel.open);assert.equal(f.status.textContent,'');});
        test('late clipboard rejection after closing does not attempt hidden focus or restore status',async()=>{const f=setup();f.open();f.reveal();f.copy.click();f.close();const attempts=f.focusAttempts.length;f.deferred.reject(new Error('denied'));await flush();assert.equal(f.focusAttempts.length,attempts);assert(f.panel.hidden);assert.equal(f.status.textContent,'');assert.equal(f.preview.value,'');});
        test('late clipboard success after closing does not restore hidden content or success',async()=>{const f=setup();f.open();f.reveal();f.copy.click();f.close();f.deferred.resolve();await flush();assert(f.panel.hidden);assert.equal(f.status.textContent,'');assert.equal(f.preview.value,'');});
        test('canonical-order changes while drawer is closed do not resurrect the share panel',()=>{const f=setup();f.open();f.reveal();f.close();f.order.setQuantity('cold-coffee:iced-latte',4);assert(f.panel.hidden);assert.equal(f.preview.value,'');f.open();f.reveal();assert(f.preview.value.includes('4 × Латте'));assert(f.preview.value.includes('720'));});
        test('barista handoff hides sharing and editing restores a collapsed control',()=>{const f=setup();f.open();f.reveal();f.handoff();assert(f.panel.hidden);assert(!f.panel.open);assert.equal(f.preview.value,'');f.edit();assert(!f.panel.hidden);assert(!f.panel.open);});
        test('empty order and pending migration still prevent sharing in the open shell',()=>{const f=setup();f.open();f.pending([{id:'cold-coffee:iced-latte',quantity:1}]);assert(f.panel.hidden);f.pending(null);assert(!f.panel.hidden);f.order.setQuantity('cold-coffee:iced-latte',0);assert(f.panel.hidden);assert.equal(f.preview.value,'');});
        test('clipboard failure from a previous drawer opening cannot steal focus after reopening',async()=>{const f=setup();f.open();f.reveal();f.copy.click();f.close();f.open();const attempts=f.focusAttempts.length;f.deferred.reject(new Error('old request denied'));await flush();assert.equal(f.focusAttempts.length,attempts);assert.equal(f.status.textContent,'');assert(!f.panel.open);});
        test('clipboard success from a previous opening cannot label the new drawer as copied',async()=>{const f=setup();f.open();f.reveal();f.copy.click();f.close();f.open();f.deferred.resolve();await flush();assert.equal(f.status.textContent,'');assert(!f.panel.open);assert(!f.copy.disabled);});
        LIFECYCLE_EOF
        set +e
        node --test scripts/test-order-share-lifecycle.mjs > .artifacts/order-share-v2/baseline-lifecycle.tap 2>&1
        result=$?
        set -e
        test "$result" = 1
        grep -q '^# tests 10$' .artifacts/order-share-v2/baseline-lifecycle.tap
        grep -q '^# pass 3$' .artifacts/order-share-v2/baseline-lifecycle.tap
        grep -q '^# fail 7$' .artifacts/order-share-v2/baseline-lifecycle.tap
    - name: Apply hash-checked source repair and preserve assertions
      shell: bash
      run: |
        python3 - <<'PATCH_PY'
        from pathlib import Path
        import hashlib, json

        def checked(path, sha):
            data = Path(path).read_bytes()
            actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
            assert actual == sha, f'{path}: stale input {actual}'
            return data.decode()

        def replace_once(text, old, new):
            assert text.count(old) == 1, f'ambiguous patch anchor: {old[:70]!r}'
            return text.replace(old, new)

        share = checked('src/order-share.ts', '7fe6c6b58d33833fabbe2c47601377ed49f41465')
        share = replace_once(share, "  let identity = '', busy = false, visible = false;", "  let identity = '', busy = false, visible = false;\n  let lifecycle = 0;")
        share = replace_once(share, '    panel.hidden = !visible || !options.canShare();', '    const nextHidden = !visible || !options.canShare();\n    if (panel.hidden !== nextHidden) lifecycle += 1;\n    panel.hidden = nextHidden;')
        share = replace_once(share, '    const capturedIdentity = identity;', '    const capturedIdentity = identity;\n    const capturedLifecycle = lifecycle;')
        share = replace_once(share, '      if (panel.hidden || !preview) return;', '      if (panel.hidden || !preview || lifecycle !== capturedLifecycle) return;')
        share = replace_once(share, '          if (!panel.hidden && preview) status.textContent', '          if (!panel.hidden && preview && lifecycle === capturedLifecycle) status.textContent')
        Path('src/order-share.ts').write_text(share)

        shell = checked('src/order-shell.ts', '20bb527a7b1d6cdb049b4d7565c19cf4e4595055')
        shell = replace_once(shell, '    canShare:()=>order.summary().quantity>0 && !order.status().pendingLegacy', '    canShare:()=>dialog.open && order.summary().quantity>0 && !order.status().pendingLegacy')
        shell = replace_once(shell, "    document.body.classList.add('order-is-open');close.focus();", "    sharing.update(true);\n    document.body.classList.add('order-is-open');close.focus();")
        shell = replace_once(shell, '  function hide():void {', '  function hide():void {\n    sharing.update(false);')
        Path('src/order-shell.ts').write_text(shell)

        # Scope the existing assertion, rather than selecting the first arbitrary status
        # or changing business/geometry expectations. Copy feedback has its own region.
        premium = checked('scripts/premium-ui-regression.mjs', 'ccc8836b18cdbadde32c2e9c9ffcd575a2d7583f')
        premium = replace_once(premium, "'#robys-order-dialog .order-status'", "'#robys-order-dialog > .order-status'")
        premium = replace_once(premium, "cart.locator('.order-status')", "cart.locator(':scope > .order-status')")
        premium = replace_once(premium, "  // Observe the active common-order live region after a quantity change.", "  // The copy panel has a separate live region; require one primary order status.\n  assert.equal(await cart.locator(':scope > .order-status').count(), 1, `${label}: exactly one primary order announcement`);\n  // Observe the active common-order live region after a quantity change.")
        Path('scripts/premium-ui-regression.mjs').write_text(premium)

        package = json.loads(checked('package.json', '6f870dad913985b29a1593ef19e3cedfe74f58cc'))
        package['scripts']['test:order-share'] += ' scripts/test-order-share-lifecycle.mjs'
        Path('package.json').write_text(json.dumps(package, indent=2) + '\n')

        browser = checked('scripts/test-order-share-browser.mjs', '45fc83aeacf7dc88add4e159f6f8b89159eedf50')
        addition = r'''  await scenario('lifecycle: closed drawer does not prepare an active share projection',async()=>{
            await fresh();await addProduct('cold-coffee:iced-caffe-latte');
            await page.locator('#robys-order-dialog').waitFor({state:'attached'});
            assert.equal(await page.locator('#robys-order-dialog').isVisible(),false);
            assert.equal(await share().evaluate(n=>n.hidden),true);
            assert.equal(await preview().inputValue(),'');assert.equal(await telegram().getAttribute('href'),null);
            await order();assert(await toggle().isVisible());assert.equal(await share().evaluate(n=>n.open),false);
          });
          await scenario('lifecycle: close clears an expanded selection and reopening starts collapsed',async()=>{
            await fresh();await addProduct('cold-coffee:iced-caffe-latte');await order();await openShare();const before=await canonical();
            await page.keyboard.press('Escape');
            assert.equal(await share().evaluate(n=>n.hidden&&!n.open),true);
            assert.equal(await preview().inputValue(),'');assert.equal(await status().textContent(),'');
            assert.equal(await telegram().getAttribute('href'),null);
            await order();assert(await toggle().isVisible());assert.equal(await share().evaluate(n=>n.open),false);
            assert.equal(await canonical(),before);
          });
          for(const outcome of ['resolve','reject'])for(const reopen of [false,true]){
            await scenario(`lifecycle: delayed clipboard ${outcome} after close${reopen?' and reopen':''} cannot revive status or steal focus`,async()=>{
              await fresh();await addProduct('cold-coffee:iced-caffe-latte');await order();await openShare();const before=await canonical();
              await page.evaluate(()=>{window.copyCalls=[];Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:text=>{
                window.copyCalls.push(text);return new Promise((resolve,reject)=>{window.resolveOldCopy=resolve;window.rejectOldCopy=reject;});
              }}});});
              await copy().click();assert(await copy().isDisabled());await page.keyboard.press('Escape');
              if(reopen)await order();
              const focused=await page.evaluate(()=>({id:document.activeElement.id,cls:document.activeElement.className}));
              await page.evaluate(outcome=>{if(outcome==='resolve')window.resolveOldCopy();else window.rejectOldCopy(new Error('delayed denial test'));},outcome);
              await page.waitForFunction(()=>document.querySelector('.order-share-actions button').disabled===false);
              assert.deepEqual(await page.evaluate(()=>({id:document.activeElement.id,cls:document.activeElement.className})),focused);
              assert.equal(await status().textContent(),'');assert.equal(await share().evaluate(n=>n.open),false);
              assert.equal(await share().evaluate(n=>n.hidden),!reopen);assert.equal(await canonical(),before);
              assert.equal(await page.evaluate(()=>window.copyCalls.length),1);
              if(!reopen){assert.equal(await preview().inputValue(),'');assert.equal(await telegram().getAttribute('href'),null);}
              if(reopen){
                await openShare();await page.evaluate(()=>Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:()=>Promise.resolve()}}));
                await copy().click();await settledStatus('скопирован');
              }
            });
          }
        '''
        anchor = "  await scenario('keyboard: collapsed/open disclosure, focus wrap and Escape return'"
        browser = replace_once(browser, anchor, addition + anchor)
        Path('scripts/test-order-share-browser.mjs').write_text(browser)

        # Confirm the v2 source bytes, not just the patch intent.
        for path, sha in [('src/order-share.ts','4b04615a0f2218c6803d36b5ee9a10cc7597d3c8'), ('src/order-shell.ts','b6a859e04d3eefb08a146336f6521229f783180e')]:
            checked(path, sha)
        print('Pinned source v2, primary-status scope, and six real-menu lifecycle cases prepared.')
        PATCH_PY
    - name: Build and regenerate existing integrity bindings
      run: npm run build && npm run integrity:generate
    - name: Full check and security
      shell: bash
      run: |-
        npm run check 2>&1 | tee .artifacts/order-share-v2/check.log
        npm run verify:security 2>&1 | tee .artifacts/order-share-v2/security.log
        node --test scripts/test-order-share-lifecycle.mjs 2>&1 | tee .artifacts/order-share-v2/fixed-lifecycle.tap
    - run: npx playwright install --with-deps chromium
    - name: Production menu sharing and lifecycle browser checks
      run: npm run test:order-share:browser
    - name: Unmodified premium geometry and business assertions with scoped status locator
      run: node scripts/premium-ui-regression.mjs
    - name: Stage only the bounded candidate and record exact tree
      shell: bash
      run: |
        python3 - <<'SCOPE_PY'
        import subprocess
        allowed={'src/order-share.ts','src/order-shell.ts','package.json','scripts/premium-ui-regression.mjs','scripts/test-order-share-browser.mjs','scripts/test-order-share-lifecycle.mjs','order-shell.js','order-launcher.js','menu-app.js','index.html','menu.html','discover.html','smart-choice/index.html','sw.js','integrity-manifest.json'}
        changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
        assert not changed-allowed, f'Unexpected changed files: {changed-allowed}'
        assert set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()) <= {'scripts/test-order-share-lifecycle.mjs'}, 'Unexpected untracked files'
        subprocess.run(['git','add','--',*sorted(changed),'scripts/test-order-share-lifecycle.mjs'],check=True)
        SCOPE_PY
        git diff --cached --check
        git diff --cached --binary > .artifacts/order-share-v2/candidate.patch
        git diff --cached --stat > .artifacts/order-share-v2/candidate-stat.txt
        git write-tree > .artifacts/order-share-v2/candidate-tree.txt
        git rev-parse HEAD > .artifacts/order-share-v2/base-head.txt
        sha256sum .artifacts/order-share-v2/candidate.patch > .artifacts/order-share-v2/candidate-patch.sha256
    - name: Publish verified candidate to a separate branch only
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$(git rev-parse HEAD)" = "$BASE_SHA"
        test "$(git ls-remote origin refs/heads/feat/menu-telegram-share-20260907 | cut -f1)" = "$BASE_SHA"
        if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH"; then
          echo 'Candidate branch already exists; refusing to overwrite.' >&2
          exit 1
        else
          test "$?" = 2
        fi
        export GIT_AUTHOR_NAME='github-actions[bot]'
        export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
        export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
        export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
        tree=$(cat .artifacts/order-share-v2/candidate-tree.txt)
        commit=$(printf '%s\n' 'fix(order): integrate v2 drawer lifecycle and scope primary status regression' | git commit-tree "$tree" -p "$BASE_SHA")
        printf '%s\n' "$commit" > .artifacts/order-share-v2/candidate-commit.txt
        git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' push origin "$commit:refs/heads/$CANDIDATE_BRANCH"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: order-share-v2-verification-${{ github.sha }}
        path: |-
          .artifacts/order-share-v2/
          .artifacts/order-share/
          .artifacts/premium-ui/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
