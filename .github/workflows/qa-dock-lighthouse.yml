name: PR341 dock performance measurement
on:
  push:
    branches: [qa/pr341-dock-performance]
    paths: [.github/workflows/qa-dock-lighthouse.yml]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8387e10d9c60742239edf076a620ca1fd51371a7
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9
        with:
          script: |
            const fs=require('fs'),zlib=require('zlib'),crypto=require('crypto'),cp=require('child_process');
            const input='8387e10d9c60742239edf076a620ca1fd51371a7';
            const file=await github.rest.repos.getContent({...context.repo,path:'.github/qa/pr341-dock-input.json',ref:'3ffe407b7f4f868fa222f5170e648deed4ddcbbe'});
            const manifest=JSON.parse(Buffer.from(file.data.content,'base64').toString());
            if(manifest.inputHead!==input)throw Error('Wrong input');
            fs.mkdirSync('.artifacts/perf-input',{recursive:true});
            fs.writeFileSync('.artifacts/perf-input/manifest.json',JSON.stringify(manifest,null,2));
            for(const [i,entry] of manifest.patches.entries()){
              const blob=await github.rest.git.getBlob({...context.repo,file_sha:entry.sha});
              let patch=Buffer.from(blob.data.content,'base64');if(entry.gzip)patch=zlib.gunzipSync(patch);
              if(entry.sha256&&crypto.createHash('sha256').update(patch).digest('hex')!==entry.sha256)throw Error('Patch hash mismatch');
              const path='.artifacts/perf-input/'+i+'.patch';fs.writeFileSync(path,patch);cp.execFileSync('git',['apply',path]);
            }
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run integrity:generate
      - name: Measure with unchanged enforced budgets
        env:
          LIGHTHOUSE_ENFORCE: 'true'
        run: node scripts/run-lighthouse-profile.mjs mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr341-dock-lighthouse-${{ github.run_id }}
          path: |
            .artifacts/perf-input/
            lighthouse/reports/
            .lighthouseci/
          retention-days: 7
          if-no-files-found: error
