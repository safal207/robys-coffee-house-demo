name: Assemble pairing video

on:
  push:
    branches:
      - feat/kiosk-pairing-video-cart-20260916

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact compact MP4
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .asset-upload/pairing-video-compact-20260916 -name 'part*.b64' -type f | wc -l)" -eq 7
          cat .asset-upload/pairing-video-compact-20260916/part*.b64 | tr -d '\n\r' | base64 --decode > src/products/sets-v1/iced-san-sebastian-pairing-card.mp4
          test "$(wc -c < src/products/sets-v1/iced-san-sebastian-pairing-card.mp4)" -eq 46561
          actual="$(sha256sum src/products/sets-v1/iced-san-sebastian-pairing-card.mp4 | cut -d ' ' -f 1)"
          test "$actual" = "834fb5ec5eab863d1707c667c7404a9447da6f9ae38be02b9d3cf3df5ac7059a"
      - name: Commit binary and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-upload/pairing-video-20260916 .asset-upload/pairing-video-compact-20260916
          rm -f .github/workflows/tmp-pairing-video-cart-20260916.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add compact pairing card video"
          git push
