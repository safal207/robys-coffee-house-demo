name: Dessert story contract
on:
  pull_request:
    paths:
      - "menu-feed.html"
      - "menu-grid.html"
      - "menu.html"
      - "src/dessert-story.js"
      - "dessert-story.css"
      - "src/products/stories/chocolate-cake/**"
      - "scripts/test-dessert-story.mjs"
      - "scripts/test-dessert-story-browser.mjs"
      - ".github/workflows/dessert-story-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse story controller
        run: node --check src/dessert-story.js
      - name: Verify assets and three menu entrypoints
        run: node --test scripts/test-dessert-story.mjs
      # Diagnostic only: capture exact generated bytes without granting CI write access.
      - name: Print deterministic generated release delta
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run integrity:generate
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const files=execFileSync('git',['diff','--name-only','-z'],{encoding:'utf8'}).split(String.fromCharCode(0)).filter(Boolean);
          console.log('ROBYS_GENERATED_PATHS='+JSON.stringify(files));
          for(const path of files){
            const base64=readFileSync(path).toString('base64');
            for(let i=0;i<base64.length;i+=2000)console.log('ROBYS_GENERATED_CHUNK|'+path+'|'+(i/2000)+'|'+base64.slice(i,i+2000));
          }
          console.log('ROBYS_GENERATED_END');
          NODE
      - name: Install Chromium for gesture regression
        run: npx playwright install --with-deps chromium
      - name: Verify swipe, locales and accessible modal under CSP
        run: node scripts/test-dessert-story-browser.mjs
      - name: Attach mobile story screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dessert-story-visual-${{ github.sha }}
          path: .artifacts/dessert-story/qa-390.png
          if-no-files-found: warn
