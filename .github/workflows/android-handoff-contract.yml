name: Android WebView handoff contract

on:
  pull_request:
    paths:
      - "bootstrap-v2.js"
      - "android-handoff.js"
      - "sw.js"
      - "android-native/**"
      - "integrity-manifest.json"
      - "scripts/android-handoff-smoke.mjs"
      - ".github/workflows/android-handoff-contract.yml"
  push:
    branches:
      - agent/android-webview-atomic-handoff-v1
    paths:
      - "bootstrap-v2.js"
      - "android-handoff.js"
      - "sw.js"
      - "android-native/**"
      - "integrity-manifest.json"
      - "scripts/android-handoff-smoke.mjs"
      - ".github/workflows/android-handoff-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-handoff-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: ANDROID-HANDOFF-001 browser bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install deterministic browser tools
        run: npm install --no-save --package-lock=false playwright@1.52.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify atomic WebView bridge contract
        env:
          ANDROID_HANDOFF_RESULTS_DIR: ${{ github.workspace }}/visual-results/android-handoff
        run: node scripts/android-handoff-smoke.mjs

      - name: Upload handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-handoff-browser-${{ github.sha }}
          path: visual-results/android-handoff/**
          if-no-files-found: warn
          retention-days: 14
