name: Sync menu truth generated artifacts

on:
  push:
    branches:
      - agent/fix-menu-truth-and-journeys
    paths:
      - ".github/workflows/sync-menu-truth-generated.yml"

permissions:
  contents: write

concurrency:
  group: sync-menu-truth-generated
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'safal207/robys-coffee-house-demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-menu-truth-and-journeys
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate official runtime and manifest
        run: |
          npm run build
          npm run integrity:generate

      - name: Commit exact generated artifacts
        run: |
          git add sw.js integrity-manifest.json
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync menu truth generated artifacts"
          git push origin HEAD:agent/fix-menu-truth-and-journeys
