name: Smart Choice release diagnostics

on:
  pull_request:
    paths:
      - 'src/smart-choice/**'
      - 'smart-choice/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/smart-choice-release-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Release unit suite
        run: npm run test:smart-choice-release
      - name: Existing Smart Choice domain suites
        run: |
          npm run verify:smart-choice-catalog
          npm run test:smart-choice-engine
          npm run test:smart-choice-cart
          npm run test:smart-choice-analytics
          npm run test:smart-choice-decision-trace
          npm run test:smart-choice-experiments
      - name: Build exact static assets
        run: node scripts/build.mjs
      - name: Page contract
        run: npm run test:smart-choice-page
      - name: Release verifier
        run: npm run verify:smart-choice-release
