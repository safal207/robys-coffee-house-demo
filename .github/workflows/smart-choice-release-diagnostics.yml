name: Smart Choice release diagnostics

on:
  pull_request:
    paths:
      - 'src/smart-choice/**'
      - 'smart-choice/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/smart-choice-release-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Build exact static assets
        run: node scripts/build.mjs > /dev/null
      - name: Capture release verifier
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify:smart-choice-release > release-verifier.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: smart-choice-release-verifier-log
          path: release-verifier.log
          if-no-files-found: error
      - name: Enforce verifier result
        shell: bash
        run: exit "${{ steps.verify.outputs.exit_code }}"
