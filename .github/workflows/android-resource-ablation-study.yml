name: Diagnose Android full-page resource classes
'on':
  push:
    branches: [qa/android-render-contention-c34f0e0-20260909]
    paths: [.github/workflows/android-resource-ablation-study.yml]
permissions:
  contents: read
concurrency:
  group: android-resource-ablation-c34f0e0-20260909
  cancel-in-progress: false
jobs:
  capture:
    name: API36 ${{ matrix.mode }} replicate ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - mode: no-media
            rep: 1
          - mode: no-media
            rep: 2
          - mode: no-images-media
            rep: 1
          - mode: no-images-media
            rep: 2
          - mode: no-css
            rep: 1
          - mode: no-css
            rep: 2
          - mode: no-js
            rep: 1
          - mode: no-js
            rep: 2
    steps:
      - name: Checkout exact native candidate
        uses: actions/checkout@v4
        with:
          ref: c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          persist-credentials: false
      - name: Fetch diagnostic capture script only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .qa-resources
          sparse-checkout: .github/scripts/capture-android-page-diagnostic.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply hash-bound resource-ablation + direct-visual treatment
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          test "$(git rev-parse HEAD)" = c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          test "$(git hash-object android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java)" = f9714db73ffe3589d874babd10a37f49a65d1a29
          mkdir -p .artifacts
          cp .qa-resources/.github/scripts/capture-android-page-diagnostic.sh .artifacts/capture-android-page-diagnostic.sh
          chmod +x .artifacts/capture-android-page-diagnostic.sh
          python3 - "$MODE" <<'PY'
          from pathlib import Path
          import hashlib,sys
          mode=sys.argv[1]
          assert mode in {'no-media','no-images-media','no-css','no-js'}
          p=Path('android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java')
          data=p.read_bytes(); got=hashlib.sha256(data).hexdigest()
          assert got=='d6fd2d8b8ae8c1788e9d64c20e4f1a175df72dbe1403f000b94dcccfcb39ed61', got
          s=data.decode()
          # Imports are diagnostic-only and stay out of the release candidate.
          anchor='import android.webkit.WebResourceRequest;\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'import android.webkit.WebResourceResponse;\n\nimport java.io.ByteArrayInputStream;\n')
          anchor='''            @Override\n            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {'''
          assert s.count(anchor)==1
          predicate={
            'no-media': 'path.endsWith(".mp4") || path.endsWith(".webm") || path.endsWith(".m4v")',
            'no-images-media': 'path.endsWith(".mp4") || path.endsWith(".webm") || path.endsWith(".m4v") || path.endsWith(".webp") || path.endsWith(".avif") || path.endsWith(".png") || path.endsWith(".jpg") || path.endsWith(".jpeg") || path.endsWith(".svg")',
            'no-css': 'path.endsWith(".css")',
            'no-js': 'path.endsWith(".js")'
          }[mode]
          mime={'no-media':'video/mp4','no-images-media':'application/octet-stream','no-css':'text/css','no-js':'application/javascript'}[mode]
          override=f'''            @Override\n            public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {{\n                if (!request.isForMainFrame()) {{\n                    String path = request.getUrl() != null ? request.getUrl().getPath() : null;\n                    if (path != null) {{\n                        path = path.toLowerCase(java.util.Locale.ROOT);\n                        if ({predicate}) {{\n                            Log.d(HANDOFF_TAG, "DIAGNOSTIC_BLOCK_{mode.upper().replace('-','_')} " + path);\n                            return new WebResourceResponse("{mime}", "utf-8", new ByteArrayInputStream(new byte[0]));\n                        }}\n                    }}\n                }}\n                return null;\n            }}\n\n'''
          s=s.replace(anchor,override+anchor)
          # Hold full page bytes constant but isolate visual-state rendering from web-ready polling.
          old='''        }\n        pollBridgeReady(view, generation);\n    }'''
          new='''        }\n        debugState("BRIDGE_BYPASS_DIAGNOSTIC");\n        requestRevealWhenVisualStateReady(view, false, generation);\n    }'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          test "$(git diff --name-only)" = android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          git diff -- android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java > .artifacts/resource-treatment.patch
          sha256sum .artifacts/capture-android-page-diagnostic.sh > .artifacts/diagnostic-script.sha256
          printf 'base_product_head=%s\ninvocation_head=%s\ntreatment=%s\nreplicate=%s\nweb_source=public-github-pages\nweb_bytes_pinned_to_pr=false\nbridge_poll_bypassed=true\ngpu_backend=software\nscreenrecord=false\nrelease_certified=false\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" '${{ matrix.mode }}' '${{ matrix.rep }}' > .artifacts/provenance.txt
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build diagnostic APK
        run: gradle -p android-native :app:assembleDebug --stacktrace
      - name: Release build resources before cold emulator
        run: |
          gradle -p android-native --stop
          free -h
          nproc
      - name: Capture treatment on fresh emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: CAPTURE_PAGE_VARIANT=full CAPTURE_REPLICATE=${{ matrix.rep }} bash .artifacts/capture-android-page-diagnostic.sh
      - name: Verify diagnostic provenance
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          test "$(git diff --name-only)" = android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
      - name: Upload every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-resource-${{ matrix.mode }}-${{ matrix.rep }}-${{ github.sha }}
          path: |
            android-native/build/page-diagnostic/full-${{ matrix.rep }}/
            .artifacts/provenance.txt
            .artifacts/diagnostic-script.sha256
            .artifacts/resource-treatment.patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
