name: Diagnose Android visual callback request timing
'on':
  push:
    branches: [qa/android-render-contention-c34f0e0-20260909]
    paths: [.github/workflows/android-resource-ablation-study.yml]
permissions:
  contents: read
concurrency:
  group: android-visual-request-timing-c34f0e0-20260910
  cancel-in-progress: true
jobs:
  capture:
    name: API36 ${{ matrix.timing }} replicate ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        timing: [immediate, post0, post100, post250, post500]
        rep: [1, 2]
    env:
      NATIVE_SHA: c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
      WEB_SHA: 910326ec514e337b77134d01067a3e975c438f10
      DEBUG_ORIGIN_SHA: fad4e6d42d45c581c7bbd041d4cee67e3f161b38
      DEBUG_ORIGIN_PARENT: 9e4e09d09affa28712b27bb6ca48961adc8cbca8
    steps:
      - name: Checkout exact #369 native candidate
        uses: actions/checkout@v4
        with:
          ref: c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout diagnostic capture helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .qa-resources
          sparse-checkout: .github/scripts/capture-android-page-diagnostic.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Freeze exact web bytes and force early-commit no-CSS treatment
        shell: bash
        env:
          TIMING: ${{ matrix.timing }}
          REP: ${{ matrix.rep }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NATIVE_SHA"
          mkdir -p .artifacts /tmp/robys-web
          git fetch --no-tags --depth=1 origin "$WEB_SHA" "$DEBUG_ORIGIN_SHA" "$DEBUG_ORIGIN_PARENT"
          git archive --format=tar "$WEB_SHA" > .artifacts/web.tar
          tar -xf .artifacts/web.tar -C /tmp/robys-web
          sha256sum .artifacts/web.tar > .artifacts/web-archive.sha256
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/robys-web/index.html')
          s=p.read_text()
          s,n=re.subn(r'<link\s+rel="stylesheet"[^>]*>\s*', '', s, flags=re.I)
          assert n >= 10, n
          p.write_text(s)
          PY
          sha256sum /tmp/robys-web/index.html > .artifacts/treated-index.sha256
          printf 'native=%s\nweb=%s\ntreatment=no-css\nvisual_request_timing=%s\nreplicate=%s\nweb_source=pinned-local-git-archive\nbridge_poll_bypassed=true\ngpu_backend=software\nscreenrecord=false\nrelease_certified=false\n' "$NATIVE_SHA" "$WEB_SHA" "$TIMING" "$REP" > .artifacts/provenance.txt

      - name: Add debug-only pinned origin and declared request timing
        shell: bash
        env:
          TIMING: ${{ matrix.timing }}
        run: |
          set -euo pipefail
          git diff "$DEBUG_ORIGIN_PARENT" "$DEBUG_ORIGIN_SHA" -- \
            android-native/app/src/debug/AndroidManifest.xml \
            android-native/app/src/debug/res/xml/network_security_config.xml \
            android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java > /tmp/debug-origin.patch
          git apply --3way /tmp/debug-origin.patch
          python3 - "$TIMING" <<'PY'
          from pathlib import Path
          import sys,textwrap
          timing=sys.argv[1]
          p=Path('android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java')
          s=p.read_text()
          old='''        }\n        pollBridgeReady(view, generation);\n    }'''
          if timing == 'immediate':
              request='''        debugState("VISUAL_REQUEST_IMMEDIATE");\n        requestRevealWhenVisualStateReady(view, false, generation);'''
          elif timing == 'post0':
              request='''        mainHandler.post(() -> {\n            debugState("VISUAL_REQUEST_POST_ZERO");\n            requestRevealWhenVisualStateReady(view, false, generation);\n        });'''
          else:
              delay={'post100':100,'post250':250,'post500':500}[timing]
              label={'post100':'VISUAL_REQUEST_POST_HUNDRED','post250':'VISUAL_REQUEST_POST_QUARTER','post500':'VISUAL_REQUEST_POST_HALF'}[timing]
              request=f'''        mainHandler.postDelayed(() -> {{\n            debugState("{label}");\n            requestRevealWhenVisualStateReady(view, false, generation);\n        }}, {delay}L);'''
          new='''        }\n        debugState("BRIDGE_BYPASS_DIAGNOSTIC");\n'''+request+'''\n    }'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))

          cp=Path('.qa-resources/.github/scripts/capture-android-page-diagnostic.sh')
          c=cp.read_text()
          old_start='adb shell am start -W -n "$PACKAGE/$ACTIVITY" > "$OUT/activity-start.txt"'
          new_start='adb shell am start -W -n "$PACKAGE/$ACTIVITY" --es robys.test.APP_URL "http://10.0.2.2:4199/?entry=android-handoff" > "$OUT/activity-start.txt"'
          assert c.count(old_start)==1
          c=c.replace(old_start,new_start)
          c=c.replace('"$([[ "$VARIANT" == full ]] && echo public-github-pages || echo inline-loadDataWithBaseURL)" "$([[ "$VARIANT" == full ]] && echo false || echo inline-in-apk)"', '"pinned-local-git-archive" "true"')
          c=c.replace('Full uses mutable public GitHub Pages; minimal uses inline loadDataWithBaseURL on the same trusted base URL.', 'Full uses a pinned local git archive through the debug-only 10.0.2.2 origin; this run forces the same no-CSS early-commit treatment and changes only visual callback request scheduling.')
          out=Path('.artifacts/capture-pinned.sh'); out.write_text(c); out.chmod(0o755)

          wrapper=Path('.artifacts/run-pinned-capture.sh')
          wrapper.write_text(textwrap.dedent('''\
          #!/usr/bin/env bash
          set -euo pipefail
          python3 -m http.server 4199 --bind 0.0.0.0 --directory /tmp/robys-web > .artifacts/web-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4199/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4199/ >/dev/null
          : "${CAPTURE_REPLICATE:?CAPTURE_REPLICATE is required}"
          CAPTURE_PAGE_VARIANT=full CAPTURE_REPLICATE="$CAPTURE_REPLICATE" bash .artifacts/capture-pinned.sh
          '''))
          wrapper.chmod(0o755)
          PY
          git diff --check
          git diff -- android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java > .artifacts/native-diagnostic.patch
          bash -n .artifacts/capture-pinned.sh
          bash -n .artifacts/run-pinned-capture.sh
          sha256sum .artifacts/capture-pinned.sh > .artifacts/capture-pinned.sha256
          sha256sum .artifacts/run-pinned-capture.sh > .artifacts/run-pinned-capture.sha256

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build shared diagnostic APK
        run: |
          gradle -p android-native :app:assembleDebug --stacktrace
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk > .artifacts/apk.sha256
          gradle -p android-native --stop

      - name: Capture timing treatment on fresh API36 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: CAPTURE_REPLICATE=${{ matrix.rep }} bash .artifacts/run-pinned-capture.sh

      - name: Upload every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-visual-timing-${{ matrix.timing }}-${{ matrix.rep }}-${{ github.sha }}
          path: |
            android-native/build/page-diagnostic/full-${{ matrix.rep }}/
            .artifacts/provenance.txt
            .artifacts/web-archive.sha256
            .artifacts/treated-index.sha256
            .artifacts/native-diagnostic.patch
            .artifacts/capture-pinned.sha256
            .artifacts/run-pinned-capture.sha256
            .artifacts/apk.sha256
            .artifacts/web-server.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
