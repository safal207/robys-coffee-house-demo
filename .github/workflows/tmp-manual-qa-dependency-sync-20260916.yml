name: Temporary manual QA dependency sync

on:
  push:
    branches:
      - tmp/manual-qa-dependency-sync-20260916

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Hide temporary workflow from product-tree checks
        run: mv .github/workflows/tmp-manual-qa-dependency-sync-20260916.yml /tmp/tmp-manual-qa-dependency-sync-20260916.yml
      - run: npm ci --no-audit --no-fund
      - name: Build and refresh integrity
        run: |
          npm run build
          npm run integrity:generate
      - name: Reject unreachable runtime
        run: node scripts/audit-dependencies.mjs --check
      - name: Full repository checks
        run: npm run check
      - name: Security checks
        run: npm run verify:security
      - name: Final generated-state checks
        run: |
          npm run integrity:generate
          npm run verify:integrity
          node scripts/audit-dependencies.mjs --check
          git diff --check
      - name: Restore temporary workflow outside production diff
        run: mv /tmp/tmp-manual-qa-dependency-sync-20260916.yml .github/workflows/tmp-manual-qa-dependency-sync-20260916.yml
      - name: Commit synchronized production tree
        run: |
          git config user.name 'Aleksey Safonov'
          git config user.email '55020240+safal207@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-manual-qa-dependency-sync-20260916.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize manual QA dependency cleanup'
          git push origin HEAD:tmp/manual-qa-dependency-sync-20260916
