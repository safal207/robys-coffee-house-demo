name: Temporary lockfile refresh

on:
  push:
    branches:
      - agent/motion-release-certification-v1
    paths:
      - "package.json"
      - ".github/workflows/lockfile-refresh-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact Playwright lock
        run: |
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/playwright']?.version!=='1.52.0'||p.packages['node_modules/playwright-core']?.version!=='1.52.0') process.exit(1)"
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(test): regenerate Playwright lockfile"
          git push origin HEAD:agent/motion-release-certification-v1
