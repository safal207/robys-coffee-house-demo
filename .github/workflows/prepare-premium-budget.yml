name: Prepare premium runtime budget
on:
  push:
    branches: [feat/premium-runtime-budget]
    paths: [.github/workflows/prepare-premium-budget.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move source without changing runtime semantics
        shell: python
        run: |
          from pathlib import Path
          import json
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one anchor in {path}: {old}')
              p.write_text(text.replace(old, new, 1))
          source = Path('src/conversion.js')
          if source.exists():
              raise RuntimeError('Conversion source already exists; refuse overwrite')
          source.write_bytes(Path('conversion.js').read_bytes())
          replace('scripts/build.mjs', 'let conversionSource = readFileSync("conversion.js", "utf8");', 'let conversionSource = readFileSync("src/conversion.js", "utf8");')
          replace('scripts/build.mjs', 'writeFileSync("conversion.js", conversionSource);', 'writeFileSync("conversion.js", transformSync(conversionSource, {\n  minify: true, format: "esm", target: "es2020", legalComments: "none"\n}).code);')
          replace('qa/traceability/ui-ux.json', '"conversion.js#setupHeaderAndProgress"', '"src/conversion.js#setupHeaderAndProgress"')
          replace('qa/traceability/ui-ux.json', '"conversion.js#setupMobileCta"', '"src/conversion.js#setupMobileCta"')
          replace('AGENTS.md', '- `src/app.ts` generates `app.js`.', '- `src/app.ts` generates `app.js`.\n- `src/conversion.js` generates `conversion.js`; its Android stylesheet revision is injected during build.')
          Path('.github/workflows/prepare-premium-budget.yml').unlink()
      - run: npm ci --no-audit --no-fund
      - name: Build and validate without relaxing any contract
        run: |
          set -euo pipefail
          mkdir -p .artifacts/premium-budget
          npm run build > .artifacts/premium-budget/build.log 2>&1
          npm run integrity:generate
          npm run check > .artifacts/premium-budget/check.log 2>&1
          npm run verify:security > .artifacts/premium-budget/security.log 2>&1
          npm run verify:performance > .artifacts/premium-budget/performance.log 2>&1
          git diff --check
      - name: Commit validated source to isolated branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add src/conversion.js
          git commit -m 'perf(build): compile conversion from preserved source and reduce startup transfer'
          git push origin HEAD:refs/heads/feat/premium-runtime-budget
          git rev-parse HEAD > .artifacts/premium-budget/HEAD.txt
          git rev-parse HEAD^{tree} > .artifacts/premium-budget/TREE.txt
      - run: npx playwright install --with-deps chromium
      - name: Check actual interaction behavior after compression
        run: node scripts/premium-feedback-regression.mjs
      - name: Check geometry, order and Smart Choice
        if: always()
        run: node scripts/premium-ui-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-budget-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
