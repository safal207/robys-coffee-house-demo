name: Manual visual QA sweep

on:
  push:
    branches:
      - feature/cinematic-experience

permissions:
  contents: read

concurrency:
  group: manual-visual-qa-sweep
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.head_commit.message == 'Run manual visual QA sweep'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/cinematic-experience
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/robys-manual-qa-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/robys-manual-qa-http.log
          exit 1

      - name: Capture manual QA matrix
        shell: bash
        run: |
          mkdir -p manual-visual-qa
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const out = 'manual-visual-qa';
          const base = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({ headless: true });
          const report = { generatedAt: new Date().toISOString(), captures: [], errors: [] };

          async function contextPage(viewport, locale='tr-TR') {
            const context = await browser.newContext({ viewport, locale, reducedMotion: 'no-preference' });
            const page = await context.newPage();
            page.on('pageerror', error => report.errors.push({ type: 'pageerror', message: String(error) }));
            page.on('console', msg => { if (msg.type() === 'error') report.errors.push({ type: 'console', message: msg.text() }); });
            return { context, page };
          }

          async function save(page, name, fullPage=false) {
            const path = `${out}/${name}.png`;
            await page.screenshot({ path, fullPage, animations: 'disabled' });
            const size = await page.evaluate(() => ({ width: innerWidth, height: innerHeight, scrollY }));
            report.captures.push({ name, path, ...size, fullPage });
          }

          async function open(path, viewport, locale='tr-TR') {
            const { context, page } = await contextPage(viewport, locale);
            await page.goto(`${base}${path}`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(600);
            return { context, page };
          }

          // HOME: mobile header and open navigation.
          {
            const { context, page } = await open('/', { width: 390, height: 844 });
            await save(page, 'home-mobile-top-390x844');
            await page.locator('.menu-toggle').click();
            await page.waitForTimeout(250);
            await save(page, 'home-mobile-menu-open-390x844');
            await context.close();
          }

          // MENU: top, first product modal, empty cart.
          {
            const { context, page } = await open('/menu.html', { width: 390, height: 844 });
            await save(page, 'menu-mobile-top-390x844');
            await page.waitForSelector('#menu-root');
            const productButton = page.locator('#menu-root button').first();
            if (await productButton.count()) {
              await productButton.click();
              await page.waitForTimeout(250);
              if (await page.locator('#menu-product-dialog[open]').count()) {
                await save(page, 'menu-mobile-product-dialog-390x844');
                await page.locator('[data-menu-dialog-close="product"]').click();
              }
            }
            await page.locator('#menu-cart-trigger').click();
            await page.waitForTimeout(200);
            await save(page, 'menu-mobile-empty-cart-390x844');
            await context.close();
          }

          // SMART CHOICE: initial loaded state on desktop/mobile/short landscape.
          for (const [name, viewport] of [
            ['smart-choice-desktop-1440x900', { width: 1440, height: 900 }],
            ['smart-choice-mobile-390x844', { width: 390, height: 844 }],
            ['smart-choice-mobile-320x568', { width: 320, height: 568 }],
            ['smart-choice-landscape-915x412', { width: 915, height: 412 }],
          ]) {
            const { context, page } = await open('/smart-choice/', viewport);
            await page.waitForFunction(() => {
              const app = document.querySelector('#smart-choice-app');
              return app && !app.querySelector('.loading-card');
            }, { timeout: 10000 });
            await save(page, name);
            await context.close();
          }

          async function captureExperience(name, viewport, scene, lang='tr', locale='tr-TR') {
            const { context, page } = await contextPage(viewport, locale);
            await context.addInitScript(({lang}) => localStorage.setItem('robys-language', lang), { lang });
            await page.goto(`${base}/experience/`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(500);
            await page.evaluate((scene) => {
              const root = document.querySelector('[data-cinematic-experience]');
              if (!(root instanceof HTMLElement)) throw new Error('experience root missing');
              const start = root.getBoundingClientRect().top + window.scrollY;
              const range = Math.max(1, root.offsetHeight - window.innerHeight);
              window.scrollTo(0, start + range * (scene / 6));
            }, scene);
            await page.waitForFunction((scene) => document.querySelector('[data-cinematic-experience]')?.getAttribute('data-active-scene') === String(scene), scene, { timeout: 8000 });
            await page.waitForTimeout(350);
            await save(page, name);
            await context.close();
          }

          // EXPERIENCE: representative sequence on desktop and mobile.
          for (const scene of [0, 1, 2, 3, 4, 5, 6]) {
            await captureExperience(`experience-desktop-scene-${scene}-1440x900`, { width: 1440, height: 900 }, scene, scene === 6 ? 'ru' : 'tr', scene === 6 ? 'ru-RU' : 'tr-TR');
          }
          for (const scene of [0, 3, 5, 6]) {
            await captureExperience(`experience-mobile-scene-${scene}-390x844`, { width: 390, height: 844 }, scene, scene === 6 ? 'ru' : 'tr', scene === 6 ? 'ru-RU' : 'tr-TR');
          }
          await captureExperience('experience-narrow-finale-320x480', { width: 320, height: 480 }, 6, 'ru', 'ru-RU');
          await captureExperience('experience-landscape-finale-915x412', { width: 915, height: 412 }, 6, 'ru', 'ru-RU');
          await captureExperience('experience-wide-short-finale-1280x400', { width: 1280, height: 400 }, 6, 'ru', 'ru-RU');

          fs.writeFileSync(`${out}/report.json`, JSON.stringify(report, null, 2));
          await browser.close();
          console.log(`Captured ${report.captures.length} manual QA screenshots; browser errors=${report.errors.length}`);
          NODE

      - name: Upload manual visual QA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual-visual-qa-${{ github.sha }}-${{ github.run_id }}
          path: manual-visual-qa/
          if-no-files-found: error
          retention-days: 7
