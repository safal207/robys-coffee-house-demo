name: Remove revenue simulator unrelated index drift

on:
  pull_request:
    paths:
      - '.github/workflows/remove-revenue-unrelated-index-drift.yml'

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Restore base homepage revision only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = 'social-offer.js?v=b27f47bc7aec'
          new = 'social-offer.js?v=2d091095f70c'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one unrelated cache drift marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm run integrity:generate
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          rm .github/workflows/remove-revenue-unrelated-index-drift.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html integrity-manifest.json .github/workflows/remove-revenue-unrelated-index-drift.yml
          git commit -m "build: remove unrelated homepage cache drift"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
