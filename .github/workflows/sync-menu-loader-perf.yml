name: Sync Menu Loader Performance Revision

on:
  push:
    branches:
      - feat/discover-deck-consolidated
    paths:
      - "menu-product-reveal.js"
      - ".github/workflows/sync-menu-loader-perf.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discover-deck-consolidated
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove loader contracts before generation
        run: |
          node scripts/test-discover-deck.mjs
          node scripts/test-menu-product-reveal.mjs
      - name: Canonical build and integrity
        run: |
          npm run build
          node scripts/generate-integrity-manifest.mjs
          node scripts/verify-integrity-manifest.mjs
          node scripts/test-discover-deck.mjs
          node scripts/test-menu-product-reveal.mjs
          npm run verify:security
      - name: Enforce loader-only generated closure
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              menu.html|sw.js|integrity-manifest.json) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          test -n "$changed"
      - name: Commit canonical output
        shell: bash
        run: |
          git add -- menu.html sw.js integrity-manifest.json
          git diff --cached --quiet && { echo "No canonical output to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(menu): sync compact loader revision"
          git push origin HEAD:feat/discover-deck-consolidated
