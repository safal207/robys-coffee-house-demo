name: Refresh Deck Integrity Once

on:
  push:
    branches:
      - feat/discover-stacked-journey-deck
    paths:
      - ".github/workflows/refresh-deck-integrity-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/discover-stacked-journey-deck
      - name: Generate canonical manifest
        run: node scripts/generate-integrity-manifest.mjs
      - name: Commit canonical manifest and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-deck-integrity-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity-manifest.json .github/workflows/refresh-deck-integrity-once.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore(integrity): refresh deck manifest"
          git push origin HEAD:feat/discover-stacked-journey-deck
