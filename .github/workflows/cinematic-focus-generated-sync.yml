name: Cinematic focus generated-state sync

on:
  push:
    branches:
      - feature/cinematic-experience

permissions:
  contents: write

concurrency:
  group: cinematic-focus-generated-state-sync
  cancel-in-progress: true

jobs:
  sync-validate-commit:
    if: github.event.head_commit.message == 'Sync cinematic focus generated state'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/cinematic-experience

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build revisioned outputs
        run: npm run build

      - name: Refresh integrity manifest
        run: npm run integrity:generate

      - name: Run full repository check against production tree
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/cinematic-focus-generated-sync.yml
          cp "$workflow" /tmp/cinematic-focus-generated-sync.yml
          rm "$workflow"
          trap 'cp /tmp/cinematic-focus-generated-sync.yml "$workflow"' EXIT
          npm run check
          npm run verify:security
          cp /tmp/cinematic-focus-generated-sync.yml "$workflow"
          trap - EXIT

      - name: Enforce generated-output allowlist
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'experience/index.html',
              'sw.js',
              'integrity-manifest.json',
          }
          status = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          changed = {line[3:] for line in status}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected generated drift: {unexpected}')
          required = {'experience/index.html', 'sw.js', 'integrity-manifest.json'}
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'expected generated outputs missing: {missing}')
          print('Generated outputs:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit generated state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience/index.html sw.js integrity-manifest.json
          git diff --cached --check
          git commit -m 'Refresh cinematic focus generated state'
          git push origin HEAD:feature/cinematic-experience
