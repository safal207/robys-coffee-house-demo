name: Diagnose Android full-page render path
'on':
  push:
    branches: [qa/android-render-contention-c34f0e0-20260909]
    paths: [.github/workflows/android-page-render-study.yml]
permissions:
  contents: read
concurrency:
  group: android-page-render-study-c34f0e0-20260909
  cancel-in-progress: false
jobs:
  capture:
    name: API36 ${{ matrix.variant }} replicate ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - variant: full
            rep: 1
          - variant: minimal
            rep: 1
          - variant: minimal
            rep: 2
          - variant: full
            rep: 2
    steps:
      - name: Checkout exact native candidate
        uses: actions/checkout@v4
        with:
          ref: c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          persist-credentials: false
      - name: Fetch diagnostic capture script only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .qa-page
          sparse-checkout: .github/scripts/capture-android-page-diagnostic.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Bind product and diagnostic bytes
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          test "$(git hash-object android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java)" = f9714db73ffe3589d874babd10a37f49a65d1a29
          mkdir -p .artifacts
          cp .qa-page/.github/scripts/capture-android-page-diagnostic.sh .artifacts/capture-android-page-diagnostic.sh
          chmod +x .artifacts/capture-android-page-diagnostic.sh
          sha256sum .artifacts/capture-android-page-diagnostic.sh > .artifacts/diagnostic-script.sha256
          printf 'base_product_head=%s\ninvocation_head=%s\nvariant=%s\nreplicate=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" '${{ matrix.variant }}' '${{ matrix.rep }}' > .artifacts/provenance.txt
      - name: Apply minimal-page diagnostic treatment only when selected
        if: matrix.variant == 'minimal'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java')
          data=p.read_bytes()
          got=hashlib.sha256(data).hexdigest()
          assert got=='d6fd2d8b8ae8c1788e9d64c20e4f1a175df72dbe1403f000b94dcccfcb39ed61', got
          s=data.decode()
          old='''        webView.stopLoading();\n        webView.loadUrl(appUrlForGeneration(generation));'''
          new='''        webView.stopLoading();\n        // DIAGNOSTIC-ONLY treatment: keep the trusted URL/generation and native\n        // state machine, but replace the public page with a minimal inline DOM.\n        String diagnosticUrl = appUrlForGeneration(generation);\n        String diagnosticHtml = "<!doctype html><html><head><meta charset=\\\"utf-8\\\">"\n                + "<meta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">"\n                + "<style>html,body{margin:0;width:100%;height:100%;background:#241c1b}</style>"\n                + "<script>document.documentElement.dataset.robysAndroidHandoff='ready';"\n                + "window.__robysAndroidHandoffRelease=function(){document.documentElement.dataset.robysAndroidHandoff='done';};</script>"\n                + "</head><body></body></html>";\n        webView.loadDataWithBaseURL(\n                diagnosticUrl, diagnosticHtml, "text/html", "utf-8", diagnosticUrl\n        );'''
          assert s.count(old)==1, 'unexpected load anchor count'
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          test "$(git diff --name-only)" = android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          git diff -- android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java > .artifacts/minimal-treatment.patch
      - name: Assert full-page control is byte-identical
        if: matrix.variant == 'full'
        shell: bash
        run: |
          git diff --exit-code
          test "$(git hash-object android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java)" = f9714db73ffe3589d874babd10a37f49a65d1a29
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build treatment APK
        run: gradle -p android-native :app:assembleDebug --stacktrace
      - name: Release build resources before cold emulator
        run: |
          gradle -p android-native --stop
          free -h
          nproc
      - name: Capture no-record page treatment
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: CAPTURE_PAGE_VARIANT=${{ matrix.variant }} CAPTURE_REPLICATE=${{ matrix.rep }} bash .artifacts/capture-android-page-diagnostic.sh
      - name: Verify treatment provenance
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          if [[ '${{ matrix.variant }}' == full ]]; then
            git diff --exit-code
          else
            test "$(git diff --name-only)" = android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          fi
      - name: Upload all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-page-${{ matrix.variant }}-${{ matrix.rep }}-${{ github.sha }}
          path: |
            android-native/build/page-diagnostic/${{ matrix.variant }}-${{ matrix.rep }}/
            .artifacts/provenance.txt
            .artifacts/diagnostic-script.sha256
            .artifacts/minimal-treatment.patch
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
