name: Refresh integrity manifest

on:
  workflow_dispatch:
  push:
    branches: [main, feat/robys-brand-polish-v5]
    paths-ignore:
      - "integrity-manifest.json"

permissions:
  contents: write

concurrency:
  group: refresh-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run integrity:generate

      - name: Commit refreshed manifest
        run: |
          if git diff --quiet -- integrity-manifest.json; then
            echo "Integrity manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity-manifest.json
          git commit -m "chore: refresh integrity manifest"
          git push

      - name: Wait for refreshed GitHub Pages publication
        run: |
          local_build="$(node -e 'const m=require("./integrity-manifest.json"); process.stdout.write(m.build)')"
          local_menu_sha="$(node -e 'const m=require("./integrity-manifest.json"); process.stdout.write(m.files.find((f)=>f.path==="menu.html").sha256)')"
          for attempt in {1..30}; do
            page_url="https://safal207.github.io/robys-coffee-house-demo/?refresh-wait=${attempt}"
            manifest_url="https://safal207.github.io/robys-coffee-house-demo/integrity-manifest.json?refresh-wait=${attempt}"
            remote_build="$(curl --fail --silent "$page_url" | sed -n 's/.*name="robys-build" content="\([^"]*\)".*/\1/p' | head -1 || true)"
            curl --fail --silent "$manifest_url" > /tmp/remote-integrity-manifest.json || true
            remote_manifest_build="$(node -e 'const fs=require("fs"); try { const m=JSON.parse(fs.readFileSync("/tmp/remote-integrity-manifest.json","utf8")); process.stdout.write(m.build || ""); } catch {}')"
            remote_menu_sha="$(node -e 'const fs=require("fs"); try { const m=JSON.parse(fs.readFileSync("/tmp/remote-integrity-manifest.json","utf8")); process.stdout.write(m.files?.find((f)=>f.path==="menu.html")?.sha256 || ""); } catch {}')"
            if test -n "$local_build" \
              && test "$remote_build" = "$local_build" \
              && test "$remote_manifest_build" = "$local_build" \
              && test "$remote_menu_sha" = "$local_menu_sha"; then
              echo "Refreshed page and manifest are published: build=$local_build menu_sha=$local_menu_sha"
              exit 0
            fi
            echo "Waiting for refresh: local_build=$local_build page=$remote_build manifest=$remote_manifest_build local_menu_sha=$local_menu_sha remote_menu_sha=$remote_menu_sha"
            sleep 10
          done
          echo "GitHub Pages did not publish the refreshed manifest in time"
          exit 1

      - name: Verify refreshed public digests
        run: node scripts/verify-live-integrity.mjs

      - name: Upload refreshed integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-live-integrity-${{ github.run_id }}
          path: .artifacts/live-integrity-report.json
          if-no-files-found: warn
          retention-days: 30

  # Temporary branch-only source/build synchronization using this workflow's
  # existing write permission. No main writes, forced updates or gate exemptions.
  repair-pr422:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/robys-brand-polish-v5' && github.repository == 'safal207/robys-coffee-house-demo' && github.actor == 'safal207'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Verify expected branch head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - run: npm ci --ignore-scripts
      - name: Apply reviewed source repair and rebuild
        run: |
          node scripts/pr422-repair-once.mjs
          npm run build
          npm run integrity:generate
      - name: All ordinary checks remain mandatory
        run: |
          npm run check
          npm run verify:security
      - name: Test real page and offline regressions
        run: |
          npx --no-install playwright install --with-deps chromium
          node scripts/test-brand-refinement-v5.mjs
      - name: Commit only the bounded repaired/generated files to this PR branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const allowed = new Set(['scripts/build.mjs','scripts/test-discover-pairing-rotation.mjs','scripts/verify-smart-choice-release.mjs','scripts/test-brand-refinement-v5.mjs','scripts/verify-brand-refinement-v5.mjs','sw-core-v64.js','discover.html','menu-app.js','menu.html','integrity-manifest.json','smart-choice/analytics-v2.js','smart-choice/app-v2.js','smart-choice/cart-v2.js','smart-choice/decision-trace-v2.js','smart-choice/experiments-v2.js','smart-choice/index.html','smart-choice/release-qa.js','smart-choice/simulator-v2.js','smart-choice/simulator.html']);
          const changed = execFileSync('git',['diff','--name-only','-z']).toString().split('\0').filter(Boolean);
          assert.ok(changed.length > 0, 'Expected repaired source and generated changes');
          for (const path of changed) assert.ok(allowed.has(path), `Unexpected changed file: ${path}`);
          execFileSync('git', ['add', '--', ...changed]);
          JS
          test "$(git ls-remote origin refs/heads/feat/robys-brand-polish-v5 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: reduce localized bundle bytes and retain refined logos offline"
          git push origin HEAD:refs/heads/feat/robys-brand-polish-v5
      - name: Upload browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr422-repair-browser-${{ github.sha }}
          path: visual-results/brand-refinement-v5/
          if-no-files-found: warn
          retention-days: 7
