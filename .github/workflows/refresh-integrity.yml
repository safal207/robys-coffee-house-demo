name: Refresh integrity manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "integrity-manifest.json"

permissions:
  contents: write

concurrency:
  group: refresh-integrity-main
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run integrity:generate

      - name: Commit refreshed manifest
        run: |
          if git diff --quiet -- integrity-manifest.json; then
            echo "Integrity manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity-manifest.json
          git commit -m "chore: refresh integrity manifest"
          git push

      - name: Verify refreshed public digests after exact publication
        env:
          ROBY_INTEGRITY_WAIT_MS: 300000
        run: node scripts/verify-live-integrity.mjs

      - name: Upload refreshed integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-live-integrity-${{ github.run_id }}
          path: .artifacts/live-integrity-report.json
          if-no-files-found: warn
          retention-days: 30
