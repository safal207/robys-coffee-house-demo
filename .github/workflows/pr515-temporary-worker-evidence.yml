name: PR515 temporary generated worker evidence
on:
  pull_request:
    paths:
      - .github/workflows/pr515-temporary-worker-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/generate-integrity-manifest.mjs
      - run: sha256sum sw-core-v64.js integrity-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr515-generated-worker
          path: |
            sw-core-v64.js
            integrity-manifest.json
            menu.html
            menu-grid.html
            menu-feed.html
          retention-days: 3
