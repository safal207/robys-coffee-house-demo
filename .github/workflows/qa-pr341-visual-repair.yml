name: PR 341 action harness repair
on:
  push:
    branches: [qa/pr341-visual-repair-20260906]
permissions:
  contents: read
jobs:
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact candidate
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run verify:security
          git diff --exit-code
          npm install --no-save --package-lock=false playwright@1.52.0 pixelmatch@6.0.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify actions with app-only test state
        run: ORDER_VISUAL_RESULTS_DIR=visual-results/order-reachability node scripts/order-visual-reachability.mjs
      - name: Record identity
        if: always()
        run: |
          mkdir -p visual-results
          git rev-parse HEAD > visual-results/HEAD.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr341-action-repair-${{ github.sha }}
          path: visual-results/
          retention-days: 14
          if-no-files-found: error
