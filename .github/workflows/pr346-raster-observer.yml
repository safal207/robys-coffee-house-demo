name: PR346 scoped profiler after native startup

on:
  push:
    branches: [diagnostic/pr346-late-profile-observer-20260908]

permissions:
  contents: read

concurrency:
  group: pr346-late-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Scoped profile after native startup
    env:
      SUBJECT_SHA: 6592c51a1bd5812e3ae85ed6c83c53effafc7050
      WEB_DIGEST: 8823867ecbd1325fde477779e8702a362a2cb8242d91d51cc2b5751d8309e588
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout immutable subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          path: subject

      - name: Verify subject and original capture identity
        env:
          EXPECTED_SOURCE_SHA: ${{ env.SUBJECT_SHA }}
        run: |
          test "$(git -C subject rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git -C subject status --porcelain)"
          cmp .github/scripts/capture-android-launch.sh subject/.github/scripts/capture-android-launch.sh
          cmp scripts/test-android-capture-contract.py subject/scripts/test-android-capture-contract.py

      - name: Prepare pinned fixture and unchanged trace collector
        env:
          EXPECTED_SOURCE_SHA: ${{ env.SUBJECT_SHA }}
          EXPECTED_WEB_DIGEST: ${{ env.WEB_DIGEST }}
        run: |
          python3 scripts/prepare-android-pinned-fixture.py --source subject --output "$RUNNER_TEMP/pinned-fixture"
          python3 scripts/prepare-android-trace-probe.py "$RUNNER_TEMP/pinned-fixture"
          python3 scripts/prepare-android-rendering-trace.py "$RUNNER_TEMP/pinned-fixture" --source subject --expected-source-sha "$EXPECTED_SOURCE_SHA" --expected-web-sha256 "$EXPECTED_WEB_DIGEST" --expected-web-count 241
          python3 scripts/prepare-android-readiness-export.py "$RUNNER_TEMP/pinned-fixture" --source subject --expected-source-sha "$EXPECTED_SOURCE_SHA" --expected-web-sha256 "$EXPECTED_WEB_DIGEST" --expected-web-count 241
          cp scripts/qa/start-android-raster-profile.py scripts/qa/run-android-late-profile-probe.sh "$RUNNER_TEMP/pinned-fixture/"
          cp scripts/qa/run-android-readiness-probe.sh scripts/qa/verify-android-readiness-export.py "$RUNNER_TEMP/pinned-fixture/"
          cp scripts/qa/run-android-rendering-probe.sh scripts/qa/verify-android-rendering-trace.py "$RUNNER_TEMP/pinned-fixture/"
          cp scripts/qa/run-android-preraster-probe.sh "$RUNNER_TEMP/pinned-fixture/run-android-preraster-probe.sh"
          cp scripts/qa/print-android-preraster-evidence.py "$RUNNER_TEMP/pinned-fixture/print-android-preraster-evidence.py"
          cp scripts/qa/android-settling-wait.py "$RUNNER_TEMP/pinned-fixture/android-settling-wait.py"
          git rev-parse HEAD > "$RUNNER_TEMP/pinned-fixture/diagnostic-tooling.sha"
          sha256sum scripts/prepare-android-pinned-fixture.py scripts/prepare-android-trace-probe.py scripts/qa/PinnedWebFixture.java scripts/qa/android-handoff-trace.pbtx scripts/qa/sample-emulator-cpu.py scripts/qa/run-android-preraster-probe.sh scripts/qa/print-android-preraster-evidence.py scripts/qa/android-settling-wait.py scripts/prepare-android-rendering-trace.py scripts/qa/RobysRenderingTrace.java scripts/qa/run-android-rendering-probe.sh scripts/qa/verify-android-rendering-trace.py scripts/prepare-android-readiness-export.py scripts/qa/RobysReadinessExport.java scripts/qa/android-raster-callstack.pbtx scripts/qa/run-android-readiness-probe.sh scripts/qa/verify-android-readiness-export.py scripts/verify-android-pinned-evidence.py scripts/qa/start-android-raster-profile.py scripts/qa/run-android-late-profile-probe.sh .github/scripts/capture-android-launch.sh > "$RUNNER_TEMP/pinned-fixture/diagnostic-tools.sha256"
          cp .github/workflows/pr346-raster-observer.yml "$RUNNER_TEMP/pinned-fixture/diagnostic-workflow.yml"

      - name: Require the declared 241 pinned web files
        env:
          EXPECTED_SOURCE_SHA: ${{ env.SUBJECT_SHA }}
          EXPECTED_WEB_DIGEST: ${{ env.WEB_DIGEST }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pinned-fixture/fixture-manifest.json').read_text())
          files = manifest['files']
          digest = hashlib.sha256(json.dumps(files, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert len(files) == 241, len(files)
          assert digest == os.environ['EXPECTED_WEB_DIGEST'], digest
          assert manifest['source_sha'] == os.environ['EXPECTED_SOURCE_SHA']
          print(json.dumps({'source_sha': manifest['source_sha'], 'web_files': len(files), 'web_inventory_sha256': digest}))
          PY

      - name: Verify fixture and original capture/trace negative controls
        run: |
          python3 scripts/test-android-pinned-fixture.py
          python3 scripts/test-android-trace-probe.py
          python3 scripts/test-android-rendering-collector.py
          python3 scripts/test-android-readiness-export.py --source subject
          python3 scripts/test-android-readiness-collector.py
          python3 scripts/test-android-raster-callstack.py
          python3 scripts/test-android-pinned-entry-module.py
          python3 scripts/test-android-raster-profile-start.py
          python3 scripts/test-android-late-profile-wrapper.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build diagnostic debug APK
        run: |
          gradle -p "$RUNNER_TEMP/pinned-fixture/android-native" :app:assembleDebug --stacktrace
          gradle -p "$RUNNER_TEMP/pinned-fixture/android-native" --stop
          free -h
          nproc

      - name: Apply declared idle interval then trace original cold launch
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cd "$RUNNER_TEMP/pinned-fixture" && python3 android-settling-wait.py --seconds 120 --output startup-wait.json && test -z "$(adb shell pm path com.robys.coffeehouse.debug | tee package-before-install.txt)" && bash run-android-late-profile-probe.sh

      - name: Verify delivered bytes even when handoff fails
        if: always()
        run: python3 scripts/verify-android-pinned-evidence.py "$RUNNER_TEMP/pinned-fixture" --entry-module android-native-product-frame.js

      - name: Upload original verdict and complete trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr346-late-profile-observation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pinned-fixture/late-profile-evidence/**
            ${{ runner.temp }}/pinned-fixture/late-profile-collector.log
            ${{ runner.temp }}/pinned-fixture/late-profile-exits.txt
            ${{ runner.temp }}/pinned-fixture/start-android-raster-profile.py
            ${{ runner.temp }}/pinned-fixture/run-android-late-profile-probe.sh
            ${{ runner.temp }}/pinned-fixture/readiness-evidence/**
            ${{ runner.temp }}/pinned-fixture/readiness-export.diff
            ${{ runner.temp }}/pinned-fixture/native-rendering-source.java
            ${{ runner.temp }}/pinned-fixture/android-native/app/src/main/java/com/robys/coffeehouse/RobysReadinessExport.java
            ${{ runner.temp }}/pinned-fixture/android-native/app/src/main/java/com/robys/coffeehouse/PinnedWebFixture.java
            ${{ runner.temp }}/pinned-fixture/run-android-readiness-probe.sh
            ${{ runner.temp }}/pinned-fixture/verify-android-readiness-export.py
            ${{ runner.temp }}/pinned-fixture/rendering-evidence/**
            ${{ runner.temp }}/pinned-fixture/*manifest.json
            ${{ runner.temp }}/pinned-fixture/*instrumentation.diff
            ${{ runner.temp }}/pinned-fixture/native-original-source.java
            ${{ runner.temp }}/pinned-fixture/native-transport-source.java
            ${{ runner.temp }}/pinned-fixture/rendering-observer.diff
            ${{ runner.temp }}/pinned-fixture/rendering-preparation-summary.json
            ${{ runner.temp }}/pinned-fixture/android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
            ${{ runner.temp }}/pinned-fixture/android-native/app/src/main/java/com/robys/coffeehouse/RobysRenderingTrace.java
            ${{ runner.temp }}/pinned-fixture/run-android-rendering-probe.sh
            ${{ runner.temp }}/pinned-fixture/verify-android-rendering-trace.py
            ${{ runner.temp }}/pinned-fixture/package-before-install.txt
            ${{ runner.temp }}/pinned-fixture/startup-wait.json
            ${{ runner.temp }}/pinned-fixture/android-settling-wait.py
            ${{ runner.temp }}/pinned-fixture/trace-evidence/**
            ${{ runner.temp }}/pinned-fixture/android-native/build/visual-evidence/**
            ${{ runner.temp }}/pinned-fixture/fixture-manifest.json
            ${{ runner.temp }}/pinned-fixture/native-instrumentation.diff
            ${{ runner.temp }}/pinned-fixture/pinned-evidence-summary.json
            ${{ runner.temp }}/pinned-fixture/apk-inventory.json
            ${{ runner.temp }}/pinned-fixture/diagnostic-tooling.sha
            ${{ runner.temp }}/pinned-fixture/diagnostic-tools.sha256
            ${{ runner.temp }}/pinned-fixture/diagnostic-workflow.yml
            ${{ runner.temp }}/pinned-fixture/capture.sh
            ${{ runner.temp }}/pinned-fixture/trace-capture.sh
            ${{ runner.temp }}/pinned-fixture/trace-runner.sh
            ${{ runner.temp }}/pinned-fixture/sample-emulator-cpu.py
            ${{ runner.temp }}/pinned-fixture/run-android-preraster-probe.sh
            ${{ runner.temp }}/pinned-fixture/print-android-preraster-evidence.py
          if-no-files-found: error
          retention-days: 14
