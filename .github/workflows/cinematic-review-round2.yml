name: Cinematic review round 2

on:
  push:
    branches: [feature/cinematic-experience]

permissions:
  contents: write

concurrency:
  group: cinematic-review-round2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply second-round Codex fixes
        run: python scripts/apply-cinematic-review-round2.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build revisioned runtime
        run: npm run build

      - name: Refresh integrity manifest
        run: npm run integrity:generate

      - name: Validate syntax and security
        shell: bash
        run: |
          set -euo pipefail
          node --check experience/experience.js
          npm run verify:security

      - name: Run complete repository check
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Target second-round review findings
        shell: bash
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 4173 > /tmp/robys-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/experience/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });

          // Cascade regression: 320x480 cup must fit inside the right-half product column.
          const shortPage = await browser.newPage({ viewport: { width: 320, height: 480 } });
          await shortPage.goto('http://127.0.0.1:4173/experience/', { waitUntil: 'networkidle' });
          const max = await shortPage.evaluate(() => document.documentElement.scrollHeight - innerHeight);
          await shortPage.evaluate((y) => scrollTo(0, y), max * 0.52);
          await shortPage.waitForTimeout(800);
          const cup = await shortPage.locator('.hero-product--cup').boundingBox();
          const world = await shortPage.locator('.product-world').boundingBox();
          if (!cup || !world) throw new Error('short viewport cup/product world missing');
          if (cup.width > world.width + 1 || cup.x < world.x - 1 || cup.x + cup.width > world.x + world.width + 1) {
            throw new Error(`short viewport cup escapes product column: cup=${JSON.stringify(cup)} world=${JSON.stringify(world)}`);
          }
          await shortPage.close();

          // Accessibility regression: all narrative scenes remain exposed with JS enabled;
          // only invisible CTA links are removed from the tab/accessibility path until active.
          const a11y = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await a11y.goto('http://127.0.0.1:4173/experience/', { waitUntil: 'networkidle' });
          const sceneState = await a11y.locator('[data-scene]').evaluateAll((nodes) => nodes.map((node) => ({
            ariaHidden: node.getAttribute('aria-hidden'),
            visibility: getComputedStyle(node).visibility,
          })));
          if (sceneState.length !== 7) throw new Error(`expected 7 scenes, got ${sceneState.length}`);
          if (sceneState.some((state) => state.ariaHidden !== null || state.visibility !== 'visible')) {
            throw new Error(`narrative scene removed from accessibility tree: ${JSON.stringify(sceneState)}`);
          }
          const finalLinks = a11y.locator('[data-scene="6"] a');
          for (let i = 0; i < await finalLinks.count(); i += 1) {
            if (await finalLinks.nth(i).getAttribute('tabindex') !== '-1') throw new Error('inactive final CTA remains tabbable');
          }

          // Localization regression: chapter labels follow the selected language.
          await a11y.locator('[data-lang="ru"]').click();
          const ru = await a11y.locator('[data-scene] .scene-kicker').allTextContents();
          const expectedRu = ['ROBY\'S · ГАЗИПАША', '01 · ИСТОК', '02 · ЭНЕРГИЯ', '03 · МОМЕНТ', '04 · ДВИЖЕНИЕ', '05 · СОЧЕТАНИЕ', '06 · С СОБОЙ'];
          if (JSON.stringify(ru) !== JSON.stringify(expectedRu)) throw new Error(`Russian chapter labels mismatch: ${JSON.stringify(ru)}`);
          await a11y.locator('[data-lang="tr"]').click();
          const tr = await a11y.locator('[data-scene] .scene-kicker').allTextContents();
          const expectedTr = ["ROBY'S · GAZİPAŞA", '01 · KÖKEN', '02 · ENERJİ', '03 · AN', '04 · HAREKET', '05 · EŞLİK', '06 · YANINA AL'];
          if (JSON.stringify(tr) !== JSON.stringify(expectedTr)) throw new Error(`Turkish chapter labels mismatch: ${JSON.stringify(tr)}`);

          const finalY = await a11y.evaluate(() => document.documentElement.scrollHeight - innerHeight);
          await a11y.evaluate((y) => scrollTo(0, y), finalY * 0.99);
          await a11y.waitForTimeout(800);
          for (let i = 0; i < await finalLinks.count(); i += 1) {
            if (await finalLinks.nth(i).getAttribute('tabindex') === '-1') throw new Error('active final CTA did not re-enter tab order');
          }
          await a11y.close();
          await browser.close();
          NODE

      - name: Commit fixes on green validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience/ integrity-manifest.json
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'Resolve second cinematic review findings'
          git push
