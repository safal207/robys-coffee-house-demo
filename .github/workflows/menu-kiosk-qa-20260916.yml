name: Menu kiosk QA

on:
  push:
    branches:
      - fix/manual-qa-polish-20260915

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Stabilize generated outputs and integrity
        run: |
          npm run build
          npm run integrity:generate
      - name: Repository checks
        run: npm run check
      - name: Security checks
        run: npm run verify:security
      - run: npx playwright install chromium
      - name: Start server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kiosk-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/menu.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/kiosk-http.log; exit 1
      - name: Verify kiosk layouts
        shell: bash
        run: |
          mkdir -p kiosk-qa
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173/menu.html';
          const summary=[];
          for (const c of [
            {label:'desktop-1440',viewport:{width:1440,height:900},kiosk:true},
            {label:'tablet-1024',viewport:{width:1024,height:768},kiosk:true},
            {label:'mobile-390',viewport:{width:390,height:844},kiosk:false}
          ]) {
            const context=await browser.newContext({viewport:c.viewport,locale:'ru-RU'});
            await context.addInitScript(()=>localStorage.setItem('robys-language','ru'));
            const page=await context.newPage();
            await page.goto(base,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('#menu-root')?.dataset.ready==='true');
            const initial=await page.evaluate(()=>{
              const nav=document.querySelector('#menu-category-nav');
              const root=document.querySelector('#menu-root');
              const buttons=[...nav.querySelectorAll('button')];
              const nr=nav.getBoundingClientRect(); const rr=root.getBoundingClientRect();
              return {nav:{x:nr.x,y:nr.y,w:nr.width,h:nr.height,position:getComputedStyle(nav).position},root:{x:rr.x,w:rr.width},buttons:buttons.slice(0,3).map(b=>{const r=b.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,text:b.textContent.trim()}})};
            });
            if (c.kiosk) {
              if (!(initial.nav.position==='fixed' && initial.nav.x < initial.root.x && initial.nav.w >= 200)) throw new Error(`${c.label}: category rail is not a left kiosk rail: ${JSON.stringify(initial)}`);
              if (!(initial.buttons.length>=2 && Math.abs(initial.buttons[0].x-initial.buttons[1].x)<4 && initial.buttons[1].y>initial.buttons[0].y+20)) throw new Error(`${c.label}: category buttons are not vertical`);
            } else {
              if (initial.nav.position==='fixed') throw new Error(`${c.label}: mobile category rail must not be fixed`);
              if (!(initial.buttons.length>=2 && Math.abs(initial.buttons[0].y-initial.buttons[1].y)<6)) throw new Error(`${c.label}: mobile categories must stay horizontal`);
            }
            await page.screenshot({path:`kiosk-qa/${c.label}-all.png`,fullPage:false});
            const dessert=page.locator('#menu-category-nav [data-category="desserts"]');
            await dessert.click();
            await page.waitForTimeout(350);
            const selected=await page.evaluate(()=>({
              panels:document.querySelectorAll('#menu-root > .full-menu-panel').length,
              panelId:document.querySelector('#menu-root > .full-menu-panel')?.id,
              active:document.querySelector('#menu-category-nav .menu-category-chip.active')?.dataset.category
            }));
            if (selected.panels!==1 || selected.panelId!=='desserts' || selected.active!=='desserts') throw new Error(`${c.label}: kiosk category selection failed: ${JSON.stringify(selected)}`);
            await page.screenshot({path:`kiosk-qa/${c.label}-desserts.png`,fullPage:false});
            summary.push({label:c.label,initial,selected});
            await context.close();
          }
          fs.writeFileSync('kiosk-qa/summary.json',JSON.stringify(summary,null,2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: menu-kiosk-qa-${{ github.run_id }}
          path: kiosk-qa/
          if-no-files-found: error
          retention-days: 7
