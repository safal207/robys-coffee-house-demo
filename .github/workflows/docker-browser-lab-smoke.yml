name: Docker browser lab smoke

on:
  push:
    branches:
      - agent/docker-browser-lab
      - agent/secure-browser-lab-bind
      - agent/harden-evidence-chain
    paths:
      - docker-compose.browser-lab.yml
      - qa/docker/**
      - qa/manual/ROBYS_BROWSER_LAB.md
      - .github/workflows/docker-browser-lab-smoke.yml
  pull_request:
    paths:
      - docker-compose.browser-lab.yml
      - qa/docker/**
      - qa/manual/ROBYS_BROWSER_LAB.md
      - .github/workflows/docker-browser-lab-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-browser-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Start pinned nginx, Chromium and Firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ROBY_QA_USER: qa
      ROBY_QA_PASSWORD: test_only_browser_lab
      ROBY_QA_BROWSER_PLATFORM: linux/amd64
      TZ: UTC
    steps:
      - name: Checkout exact repository head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Compose policy
        run: |
          set -euo pipefail
          docker compose version
          docker compose -f docker-compose.browser-lab.yml config -q
          docker compose -f docker-compose.browser-lab.yml config --format json > /tmp/browser-lab-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/browser-lab-compose.json').read_text())
          expected_counts = {'site': 1, 'chromium': 2, 'firefox': 2}
          for service_name, expected_count in expected_counts.items():
              service = config['services'][service_name]
              image = service.get('image', '')
              assert '@sha256:' in image, f'{service_name}: image is not digest-pinned: {image}'
              assert ':latest' not in image, f'{service_name}: mutable latest tag is forbidden: {image}'
              ports = service.get('ports', [])
              assert len(ports) == expected_count, (
                  f'{service_name}: expected {expected_count} published ports, got {len(ports)}'
              )
              for port in ports:
                  host_ip = port.get('host_ip')
                  assert host_ip == '127.0.0.1', (
                      f"{service_name}:{port.get('published')} is bound to {host_ip!r}, "
                      "expected loopback-only 127.0.0.1"
                  )
          assert config['services']['chromium'].get('platform') == 'linux/amd64'
          assert config['services']['firefox'].get('platform') == 'linux/amd64'
          print('All browser-lab images are immutable and all ports are loopback-only by default.')
          PY

      - name: Pull pinned browser lab images
        run: |
          set -euo pipefail
          docker compose -f docker-compose.browser-lab.yml pull

      - name: Start browser lab and capture resolved image inventory
        run: |
          set -euo pipefail
          docker compose -f docker-compose.browser-lab.yml up -d --wait
          docker compose -f docker-compose.browser-lab.yml images --format json > /tmp/browser-lab-images.json
          test -s /tmp/browser-lab-images.json

      - name: Probe site and browser desktops
        shell: bash
        run: |
          set -euo pipefail

          probe_http() {
            local url="$1"
            local label="$2"
            local code="000"

            for _ in $(seq 1 60); do
              code="$(curl --insecure --silent --show-error --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [[ "$code" =~ ^[1-4][0-9][0-9]$ ]]; then
                echo "${label} responded with HTTP ${code}"
                return 0
              fi
              sleep 2
            done

            echo "${label} did not become reachable; last HTTP code: ${code}" >&2
            return 1
          }

          test "$(curl --fail --silent http://localhost:8080/healthz)" = "ok"
          curl --fail --silent http://localhost:8080/ > /tmp/robys-index.html
          grep --ignore-case --quiet "rob[y’']" /tmp/robys-index.html

          probe_http "https://localhost:3011/" "Chromium desktop"
          probe_http "https://localhost:3021/" "Firefox desktop"

          docker compose -f docker-compose.browser-lab.yml ps

      - name: Collect runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p qa/browser-lab-artifacts
          docker compose -f docker-compose.browser-lab.yml config --format json > qa/browser-lab-artifacts/compose-config.json 2>&1 || true
          docker compose -f docker-compose.browser-lab.yml ps --all > qa/browser-lab-artifacts/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.browser-lab.yml logs --no-color > qa/browser-lab-artifacts/compose.log 2>&1 || true
          cp /tmp/browser-lab-images.json qa/browser-lab-artifacts/images.json 2>/dev/null || true
          cp /tmp/robys-index.html qa/browser-lab-artifacts/index.html 2>/dev/null || true

      - name: Upload exact-run runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-browser-lab-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/browser-lab-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Stop browser lab
        if: always()
        run: docker compose -f docker-compose.browser-lab.yml down --volumes --remove-orphans
