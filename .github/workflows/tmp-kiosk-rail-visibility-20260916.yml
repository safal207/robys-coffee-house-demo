name: Temporary kiosk rail visibility validation

on:
  push:
    branches:
      - tmp/kiosk-rail-visibility-20260916

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 tmp-kiosk-rail-patch.py
      - run: npm run build
      - run: npx playwright install chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/menu.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/http.log
          exit 1
      - name: Verify kiosk rail behavior
        run: |
          mkdir -p qa-kiosk
          node tmp-kiosk-rail-test.mjs
      - name: Commit source-only kiosk visibility patch
        shell: bash
        run: |
          git config user.name 'robys-qa-bot'
          git config user.email 'robys-qa-bot@users.noreply.github.com'
          git add src/menu-app.js menu-security-v2.css
          git diff --cached --check
          git commit -m 'Scope kiosk category rail to menu zone'
          git push origin HEAD:tmp/kiosk-rail-visibility-20260916
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kiosk-rail-proof-${{ github.run_id }}
          path: qa-kiosk/
          if-no-files-found: warn
          retention-days: 7
