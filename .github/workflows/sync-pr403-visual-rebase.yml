name: Sync PR403 visual rebase

on:
  push:
    branches:
      - rebase/pr403-visual-20260918
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pr403-visual-rebase
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run integrity:generate
      - run: npm run check
      - run: npm run verify:security
      - run: git diff --check
      - name: Commit synced visual release state and remove one-shot workflow
        run: |
          git rm -f .github/workflows/sync-pr403-visual-rebase.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync rebased visual release state"
          git push origin HEAD:rebase/pr403-visual-20260918
