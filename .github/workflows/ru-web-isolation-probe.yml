name: RU web isolation probe

on:
  push:
    branches: ['probe/ru-web-isolation-main-20260909']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate candidate integrity manifest without committing it
        run: npm run integrity:generate
      - name: Install Chromium from locked Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Run focused RU HTTP contract
        env:
          RU_QA_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/test-ru-coffee-landing.mjs
      - name: Verify full project against regenerated candidate manifest
        run: |
          npm run check
          npm run verify:security
      - name: Preserve generated manifest and RU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru-isolation-probe-${{ github.sha }}
          path: |
            integrity-manifest.json
            visual-results/ru-coffee/
          if-no-files-found: warn
          retention-days: 7
