name: Diagnose API36 visual callback scheduling
on:
  push:
    branches: [qa/android-visual-callback-diag-9e4-20260909]
    paths: [.github/workflows/android-visual-callback-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: android-visual-callback-diag-9e4-20260909
  cancel-in-progress: false
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_SHA: 9e4e09d09affa28712b27bb6ca48961adc8cbca8
      BASE_DIAG_SHA: fad4e6d42d45c581c7bbd041d4cee67e3f161b38
    steps:
      - name: Checkout exact local-origin diagnostic base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fad4e6d42d45c581c7bbd041d4cee67e3f161b38
          persist-credentials: false
      - name: Checkout timing helper outside native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .diag
          sparse-checkout: scripts/android-visual-callback-diagnostic.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Freeze exact web and apply debug-only timing instrumentation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_DIAG_SHA"
          mkdir -p .artifacts/visual-callback-diag /tmp/robys-web
          git fetch --no-tags --depth=1 origin "$WEB_SHA"
          git archive --format=tar "$WEB_SHA" > .artifacts/visual-callback-diag/web.tar
          tar -xf .artifacts/visual-callback-diag/web.tar -C /tmp/robys-web
          sha256sum .artifacts/visual-callback-diag/web.tar > .artifacts/visual-callback-diag/web.sha256
          git ls-tree -r "$WEB_SHA" > .artifacts/visual-callback-diag/web-tree.txt
          python3 .diag/scripts/android-visual-callback-diagnostic.py apply-native
          git diff --check
          git diff -- android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java > .artifacts/visual-callback-diag/instrumentation.patch
          test "$(git hash-object .github/scripts/capture-android-launch.sh)" = 52222dbbee45bad86df5604bbc5acf5b3f5c1914
          grep -q 'VISUAL_CALLBACK_TIMEOUT_MS = 1_500L' android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          grep -q 'BRIDGE_READY_TIMEOUT_MS = 3_500L' android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          grep -q 'LOAD_COMMIT_HARD_TIMEOUT_MS = 24_000L' android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          python3 scripts/test-android-capture-contract.py | tee .artifacts/visual-callback-diag/capture-contract.log
          python3 .diag/scripts/android-visual-callback-diagnostic.py prepare-capture
      - name: Commit identified diagnostic source before execution
        shell: bash
        run: |
          set -euo pipefail
          git add android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(android): timestamp visual callback queue boundaries'
          test "$(git rev-parse HEAD^)" = "$BASE_DIAG_SHA"
          git rev-parse HEAD > .artifacts/visual-callback-diag/instrumented-native.sha
          git rev-parse 'HEAD^{tree}' > .artifacts/visual-callback-diag/instrumented-native.tree
          git archive --format=tar.gz HEAD > .artifacts/visual-callback-diag/instrumented-native-source.tar.gz
      - name: Enable KVM or classify product execution not-run
        id: kvm
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -e /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            printf '{"product_execution":"NOT_RUN","reason":"KVM_UNAVAILABLE","image":"%s"}\n' "$ImageVersion" > .artifacts/visual-callback-diag/environment.json
            exit 1
          fi
          ls -l /dev/kvm | tee .artifacts/visual-callback-diag/kvm.txt
          printf '{"product_execution":"ELIGIBLE","reason":null,"image":"%s"}\n' "$ImageVersion" > .artifacts/visual-callback-diag/environment.json
      - name: Set up Java 17
        if: ${{ steps.kvm.outcome == 'success' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        if: ${{ steps.kvm.outcome == 'success' }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        if: ${{ steps.kvm.outcome == 'success' }}
        run: sdkmanager 'platforms;android-36'
      - name: Set up Gradle 9.5.0
        if: ${{ steps.kvm.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify release boundary and build one instrumented debug APK
        if: ${{ steps.kvm.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-native :app:processReleaseMainManifest --stacktrace 2>&1 | tee .artifacts/visual-callback-diag/release-manifest.log
          gradle -p android-native :app:assembleDebug --stacktrace 2>&1 | tee .artifacts/visual-callback-diag/debug-build.log
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk > .artifacts/visual-callback-diag/apk.sha256
          gradle -p android-native --stop
      - name: Sample 01
        id: s1
        if: ${{ steps.kvm.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: robys-vcb-01
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .artifacts/visual-callback-diag/run-case.sh 01
      - name: Sample 02
        id: s2
        if: ${{ steps.kvm.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: robys-vcb-02
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .artifacts/visual-callback-diag/run-case.sh 02
      - name: Sample 03
        id: s3
        if: ${{ steps.kvm.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: robys-vcb-03
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .artifacts/visual-callback-diag/run-case.sh 03
      - name: Sample 04
        id: s4
        if: ${{ steps.kvm.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: robys-vcb-04
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .artifacts/visual-callback-diag/run-case.sh 04
      - name: Analyze all fixed samples without selecting passes
        if: ${{ always() && steps.kvm.outcome == 'success' }}
        shell: bash
        run: |
          python3 .diag/scripts/android-visual-callback-diagnostic.py analyze | tee .artifacts/visual-callback-diag/analysis.log
          printf 's1=%s\ns2=%s\ns3=%s\ns4=%s\n' '${{ steps.s1.outcome }}' '${{ steps.s2.outcome }}' '${{ steps.s3.outcome }}' '${{ steps.s4.outcome }}' > .artifacts/visual-callback-diag/action-outcomes.txt
      - name: Upload diagnostic evidence including failures/not-run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-callback-diag-9e4-${{ github.sha }}
          path: .artifacts/visual-callback-diag/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
