name: Temporary Day premium timing budget

on:
  push:
    branches:
      - agent/premium-depth-v1
    paths:
      - ".github/workflows/premium-depth-day-budget-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/premium-depth-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tighten Day cold choreography
        run: |
          python3 -c 'from pathlib import Path; p=Path("day-night-entry.js"); s=p.read_text(); old="    coldDuration: 1_140,"; assert old in s; p.write_text(s.replace(old, "    coldDuration: 1_100,", 1))'
          node --check day-night-entry.js
          npm run integrity:generate
          npm run verify:integrity
      - name: Commit timing adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day-night-entry.js integrity-manifest.json
          git commit -m "perf(motion): keep Day premium entry inside release budget"
          git push origin HEAD:agent/premium-depth-v1
