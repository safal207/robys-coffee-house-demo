name: Smart Choice decision trace diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  trace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run build with concise diagnostics
        shell: bash
        run: |
          set +e
          npm run build > trace-build.log 2>&1
          status=$?
          tail -n 140 trace-build.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-choice-decision-trace-build-${{ github.run_id }}
          path: trace-build.log
          if-no-files-found: error
          retention-days: 2
