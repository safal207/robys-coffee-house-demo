name: Lighthouse Live Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read expected build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          BUILD=$(grep -oP 'name="robys-build" content="\K[^"]+' index.html)
          test -n "$BUILD"
          echo "value=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Auditing build: $BUILD"

      - name: Verify available Chrome
        run: |
          set -euo pipefail
          google-chrome --version

      - name: Install exact Lighthouse version
        run: npm install --global lighthouse@12.8.2

      - name: Wait for current Pages build
        env:
          BUILD_ID: ${{ steps.build.outputs.value }}
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if curl --silent --fail "https://safal207.github.io/robys-coffee-house-demo/?deploy=${GITHUB_SHA}" | grep -q "$BUILD_ID"; then
              echo "Build $BUILD_ID is live"
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment ($attempt/24)"
            sleep 10
          done
          echo "Build $BUILD_ID did not appear in time"
          exit 1

      - name: Run mobile Lighthouse
        run: |
          set -euo pipefail
          lighthouse "https://safal207.github.io/robys-coffee-house-demo/?audit=${GITHUB_SHA}" \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lh-mobile.json \
            --quiet

      - name: Run desktop Lighthouse
        run: |
          set -euo pipefail
          lighthouse "https://safal207.github.io/robys-coffee-house-demo/?audit=${GITHUB_SHA}" \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lh-desktop.json \
            --quiet

      - name: Build exact-run compact summary
        env:
          BUILD_ID: ${{ steps.build.outputs.value }}
          AUDITED_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const pick = (report) => {
            const audit = (id) => report.audits[id];
            const categories = Object.fromEntries(
              ['performance','accessibility','best-practices','seo'].map(id => [id, Math.round(report.categories[id].score * 100)])
            );
            const metrics = Object.fromEntries(
              ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive']
                .map(id => [id, { displayValue: audit(id)?.displayValue ?? null, numericValue: audit(id)?.numericValue ?? null }])
            );
            const opportunities = Object.values(report.audits)
              .filter(a => a.details?.type === 'opportunity' && a.numericValue > 0)
              .sort((a,b) => (b.numericValue || 0) - (a.numericValue || 0))
              .slice(0, 8)
              .map(a => ({ id: a.id, title: a.title, displayValue: a.displayValue ?? null, score: a.score }));
            return { categories, metrics, opportunities };
          };
          const mobile = read('lh-mobile.json');
          const desktop = read('lh-desktop.json');
          const summary = {
            schema: 'robys.lighthouse.live.v2',
            generatedAt: new Date().toISOString(),
            lighthouseVersion: mobile.lighthouseVersion,
            testedUrl: mobile.finalDisplayedUrl || mobile.finalUrl,
            testedCommit: process.env.AUDITED_SHA,
            sourceRunId: process.env.SOURCE_RUN_ID,
            build: process.env.BUILD_ID,
            mobile: pick(mobile),
            desktop: pick(desktop)
          };
          fs.writeFileSync('lighthouse-live-summary.json', JSON.stringify(summary, null, 2) + '\n');
          const markdown = [
            '# Lighthouse live audit',
            '',
            `- Tested commit: \`${summary.testedCommit}\``,
            `- Source run: \`${summary.sourceRunId}\``,
            `- Build: \`${summary.build}\``,
            `- Mobile performance: **${summary.mobile.categories.performance}**`,
            `- Desktop performance: **${summary.desktop.categories.performance}**`,
            '',
            'This artifact describes the deployed site observed during this run. It does not mutate `main` and does not by itself prove byte-equivalence between deployment and source.'
          ].join('\n') + '\n';
          fs.writeFileSync('lighthouse-live-summary.md', markdown);
          console.log(JSON.stringify(summary, null, 2));
          NODE
          cat lighthouse-live-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable live Lighthouse evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-live-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lh-mobile.json
            lh-desktop.json
            lighthouse-live-summary.json
            lighthouse-live-summary.md
          if-no-files-found: error
          retention-days: 90
