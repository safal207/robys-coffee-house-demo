name: Release repair source snapshot
on:
  push:
    branches: [fix/release-audit-20260905]
    paths: [.github/workflows/qa-release-source.yml]
permissions:
  contents: read
concurrency:
  group: release-source-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c9b54ea637f6cef5ac63753fee4057a8e7c94017
          persist-credentials: false
      - name: Capture concurrent source without credentials
        run: |
          mkdir -p release-source
          git rev-parse HEAD > release-source/HEAD.txt
          git archive --format=tar.gz HEAD > release-source/source.tar.gz
          shasum -a 256 release-source/source.tar.gz > release-source/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-source-c9b54ea
          path: release-source/
          retention-days: 3
          if-no-files-found: error
