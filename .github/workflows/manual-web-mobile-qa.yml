name: Manual Web and Android QA

on:
  pull_request:
    paths:
      - ".github/workflows/manual-web-mobile-qa.yml"
      - "qa/manual/**"
      - "scripts/run-web-mobile-manual-qa.mjs"
      - "scripts/run-android-apk-contract-qa.mjs"
      - "scripts/run-android-emulator-manual-qa.py"
      - "downloads/android-v1.1/**"
      - "index.html"
      - "menu.html"
      - "smart-choice/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-web-mobile-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.55.0"
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.55.0-noble"

jobs:
  web-and-apk-contract:
    name: Docker · Web desktop, mobile web and APK contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Pull pinned Playwright Docker image
        run: docker pull "$PLAYWRIGHT_IMAGE"

      - name: Run guided web manual journeys and APK contract in Docker
        run: |
          docker run --rm --init --ipc=host \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env CI=true \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc 'set -euo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends unzip >/dev/null
              npm ci
              npm install --no-save --ignore-scripts playwright@'"$PLAYWRIGHT_VERSION"'
              ROBYS_QA_OUTPUT=qa-artifacts/desktop node scripts/run-web-mobile-manual-qa.mjs desktop
              ROBYS_QA_OUTPUT=qa-artifacts/mobile node scripts/run-web-mobile-manual-qa.mjs mobile
              ROBYS_QA_OUTPUT=qa-artifacts/apk node scripts/run-android-apk-contract-qa.mjs'

      - name: Upload Docker browser and APK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-web-mobile-apk-contract
          path: |
            qa-artifacts/desktop
            qa-artifacts/mobile
            qa-artifacts/apk
          if-no-files-found: error
          retention-days: 14

  android-emulator:
    name: Android APK install and Smart Choice journey
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Reconstruct and verify signed APK
        run: |
          mkdir -p qa-artifacts/android
          cat downloads/android-v1.1/part-*.b64 | tr -d '\r\n\t ' | base64 --decode > qa-artifacts/android/robys-coffee-house-v1.1.apk
          test "$(stat -c%s qa-artifacts/android/robys-coffee-house-v1.1.apk)" = "25231"
          echo "f188c2f0ab820d514c9c1bd75734e3d76f8203f89d4a1604fd08da43fd7910a6  qa-artifacts/android/robys-coffee-house-v1.1.apk" | sha256sum --check

      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 35 emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name robys-qa --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"

      - name: Boot clean Android emulator
        run: |
          nohup emulator -avd robys-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > qa-artifacts/android/emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: APK-02–APK-06 emulator manual journey
        run: python3 scripts/run-android-emulator-manual-qa.py --apk qa-artifacts/android/robys-coffee-house-v1.1.apk --out qa-artifacts/android

      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-emulator-manual-qa
          path: qa-artifacts/android
          if-no-files-found: error
          retention-days: 14

      - name: Stop emulator
        if: always()
        run: adb emu kill || true
