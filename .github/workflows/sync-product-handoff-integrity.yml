name: Sync Product Handoff Integrity

on:
  pull_request:
    paths:
      - "discover-deck.js"
      - "menu-product-reveal.js"
      - ".github/workflows/sync-product-handoff-integrity.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Regenerate integrity manifest with repository generator
        run: node scripts/generate-integrity-manifest.mjs
      - name: Verify generated manifest independently
        run: node scripts/verify-integrity-manifest.mjs
      - name: Commit only generated integrity manifest when stale
        shell: bash
        run: |
          if git diff --quiet -- integrity-manifest.json; then
            echo "Integrity manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- integrity-manifest.json
          test "$(git diff --cached --name-only | tr -d '\r')" = "integrity-manifest.json"
          git commit -m "chore(integrity): sync product handoff manifest"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
