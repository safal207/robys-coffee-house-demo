name: Premium depth certification

on:
  pull_request:
    paths:
      - "bootstrap-v2.js"
      - "day-night-entry.js"
      - "sw.js"
      - "integrity-manifest.json"
      - "scripts/premium-depth-smoke.mjs"
      - "scripts/generate-integrity-manifest.mjs"
      - "scripts/verify-integrity-manifest.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/premium-depth-certification.yml"
  push:
    branches:
      - agent/premium-depth-v1
    paths:
      - "bootstrap-v2.js"
      - "day-night-entry.js"
      - "sw.js"
      - "integrity-manifest.json"
      - "scripts/premium-depth-smoke.mjs"
      - "scripts/generate-integrity-manifest.mjs"
      - "scripts/verify-integrity-manifest.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/premium-depth-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-depth-certification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    name: MOTION-DEPTH-001 hybrid premium 3D exact-head gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install deterministic Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify premium runtime syntax
        run: |
          node --check bootstrap-v2.js
          node --check day-night-entry.js
          node --check sw.js
          node --check scripts/premium-depth-smoke.mjs

      - name: Verify full integrity contract
        run: npm run verify:integrity

      # MOTION-CONTEXT-001, including the 60 Hz cadence gate, is certified
      # independently on the same exact PR head by contextual-entry-certification.yml.
      - name: Certify hybrid 3D material stage, focal hold and logo focus
        env:
          PREMIUM_DEPTH_RESULTS_DIR: ${{ github.workspace }}/visual-results/premium-depth
        run: node scripts/premium-depth-smoke.mjs

      - name: Upload premium depth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: premium-depth-hybrid-final-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-results/**
          if-no-files-found: error
          retention-days: 14
