name: Premium depth certification

on:
  pull_request:
    paths:
      - "day-night-entry.js"
      - "integrity-manifest.json"
      - "scripts/premium-depth-smoke.mjs"
      - "scripts/contextual-entry-smoke.mjs"
      - "scripts/generate-integrity-manifest.mjs"
      - "scripts/verify-integrity-manifest.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/premium-depth-certification.yml"
  push:
    branches:
      - agent/premium-depth-v1
    paths:
      - "day-night-entry.js"
      - "integrity-manifest.json"
      - "scripts/premium-depth-smoke.mjs"
      - "scripts/contextual-entry-smoke.mjs"
      - "scripts/generate-integrity-manifest.mjs"
      - "scripts/verify-integrity-manifest.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/premium-depth-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-depth-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: MOTION-DEPTH-001 premium optics v2.3 final gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install deterministic Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify premium runtime syntax
        run: |
          node --check day-night-entry.js
          node --check scripts/premium-depth-smoke.mjs

      - name: Verify full integrity contract
        run: npm run verify:integrity

      - name: Re-run contextual Day/Night baseline
        env:
          CONTEXTUAL_ENTRY_RESULTS_DIR: ${{ github.workspace }}/visual-results/contextual-entry
        run: node scripts/contextual-entry-smoke.mjs

      - name: Certify perspective depth, focal hold and late logo focus
        env:
          PREMIUM_DEPTH_RESULTS_DIR: ${{ github.workspace }}/visual-results/premium-depth
        run: node scripts/premium-depth-smoke.mjs

      - name: Upload premium depth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-depth-v23-final-${{ github.sha }}
          path: visual-results/**
          if-no-files-found: error
          retention-days: 14
