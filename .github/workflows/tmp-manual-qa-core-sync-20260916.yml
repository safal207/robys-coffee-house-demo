name: Temporary manual QA core sync

on:
  push:
    branches:
      - tmp/manual-qa-build-sync-20260916

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Hide temporary workflow from product-tree checks
        run: mv .github/workflows/tmp-manual-qa-core-sync-20260916.yml /tmp/tmp-manual-qa-core-sync-20260916.yml
      - name: Align build, verifiers and traceability with split service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'unexpected {label} anchor in {path}: {s.count(old)} matches')
              p.write_text(s.replace(old, new))

          replace_one(
              'scripts/build.mjs',
              'let serviceWorker = readFileSync("sw.js", "utf8");',
              'let serviceWorker = readFileSync("sw-core-v64.js", "utf8");',
              'build worker read'
          )
          replace_one(
              'scripts/build.mjs',
              'writeFileSync("sw.js", serviceWorker);',
              'writeFileSync("sw-core-v64.js", serviceWorker);',
              'build worker write'
          )

          read_combined = {
              'scripts/verify-smart-choice-release.mjs': (
                  'const serviceWorker = read("sw.js");',
                  'const serviceWorker = `${read("sw.js")}\n${read("sw-core-v64.js")}`;'
              ),
              'scripts/verify-security-contracts.mjs': (
                  'const serviceWorker = read("sw.js");',
                  'const serviceWorker = `${read("sw.js")}\n${read("sw-core-v64.js")}`;'
              ),
              'scripts/verify-brand-identity-assets.mjs': (
                  'const sw = read("sw.js");',
                  'const sw = `${read("sw.js")}\n${read("sw-core-v64.js")}`;'
              ),
              'scripts/test-brand-wordmark.mjs': (
                  'const serviceWorker = read("sw.js");',
                  'const serviceWorker = `${read("sw.js")}\n${read("sw-core-v64.js")}`;'
              ),
          }
          for path, (old, new) in read_combined.items():
              replace_one(path, old, new, 'combined read worker')

          readfile_combined = [
              ('scripts/verify-menu-image-assets.mjs', 'serviceWorker'),
              ('scripts/verify-menu-share.mjs', 'serviceWorker'),
              ('scripts/verify-taste-journey-posters.mjs', 'serviceWorker'),
              ('scripts/verify-pr140-release-blockers.mjs', 'serviceWorker'),
              ('scripts/verify-menu-truth-live.mjs', 'serviceWorker'),
              ('scripts/verify-menu-order.mjs', 'serviceWorker'),
              ('scripts/verify-regression-contracts.mjs', 'serviceWorker'),
              ('scripts/verify-entry-handoff.mjs', 'serviceWorker'),
          ]
          for path, variable in readfile_combined:
              old = f'const {variable} = readFileSync("sw.js", "utf8");'
              new = f'const {variable} = readFileSync("sw.js", "utf8") + "\\n" + readFileSync("sw-core-v64.js", "utf8");'
              replace_one(path, old, new, 'combined readFile worker')

          replace_one(
              'scripts/verify-android-download.mjs',
              'const sw = readFileSync("sw.js", "utf8");',
              'const sw = readFileSync("sw.js", "utf8") + "\\n" + readFileSync("sw-core-v64.js", "utf8");',
              'Android combined worker'
          )
          replace_one(
              'scripts/test-discover-deck.mjs',
              'const swSource = readFileSync(resolve(root, "sw.js"), "utf8");',
              'const swSource = readFileSync(resolve(root, "sw.js"), "utf8") + "\\n" + readFileSync(resolve(root, "sw-core-v64.js"), "utf8");',
              'Discover combined worker'
          )
          replace_one(
              'scripts/test-photo-logo.mjs',
              'const serviceWorker = readFileSync(new URL("../sw.js", import.meta.url), "utf8");',
              'const serviceWorker = readFileSync(new URL("../sw.js", import.meta.url), "utf8") + "\\n" + readFileSync(new URL("../sw-core-v64.js", import.meta.url), "utf8");',
              'photo-logo combined worker'
          )

          replace_one(
              'qa/traceability/api-platform.json',
              '"sw.js#CACHE_VERSION"',
              '"sw-core-v64.js#CACHE_VERSION"',
              'platform cache trace evidence'
          )
          replace_one(
              'qa/traceability/api-platform.json',
              '"sw.js#navigationResponse"',
              '"sw-core-v64.js#navigationResponse"',
              'platform navigation trace evidence'
          )

          # Keep all public entry points on the same service-worker registration revision.
          replace_one(
              'menu-pwa.js',
              'const SERVICE_WORKER_URL = "sw.js?v=premium-cache-new-20260904-1";',
              'const SERVICE_WORKER_URL = "sw.js?v=pairing-video-fix-20260916-2";',
              'menu PWA registration revision'
          )
          replace_one(
              'menu.html',
              'src="menu-pwa.js?v=premium-cache-new-20260904-1"',
              'src="menu-pwa.js?v=pairing-video-fix-20260916-2"',
              'menu PWA script revision'
          )
          replace_one(
              'sw-core-v64.js',
              '"./pwa.js?v=premium-cache-new-20260904-1"',
              '"./pwa-pairing-fix.js?v=20260916-2"',
              'landing PWA precache entry'
          )
          replace_one(
              'sw-core-v64.js',
              '"./menu-pwa.js?v=premium-cache-new-20260904-1"',
              '"./menu-pwa.js?v=pairing-video-fix-20260916-2"',
              'menu PWA precache entry'
          )
          replace_one(
              'scripts/verify-menu-share.mjs',
              'const pwaRuntime = readFileSync("pwa.js", "utf8");',
              'const pwaRuntime = readFileSync("pwa-pairing-fix.js", "utf8");',
              'landing PWA verifier runtime'
          )
          replace_one(
              'scripts/verify-menu-share.mjs',
              'assert(indexHtml.includes(`src="pwa.js?v=${pwaRevision}"`), "index.html does not load the current PWA registration revision");',
              'assert(/src="pwa-pairing-fix\\.js\\?v=[^"]+"/.test(indexHtml), "index.html does not load the current PWA registration runtime");',
              'landing PWA verifier HTML assertion'
          )
          PY
      - run: npm ci --no-audit --no-fund
      - name: Build and refresh integrity
        run: |
          npm run build
          npm run integrity:generate
      - name: Full repository checks
        run: npm run check
      - name: Security checks
        run: npm run verify:security
      - name: Final integrity verification
        run: |
          npm run integrity:generate
          npm run verify:integrity
          git diff --check
      - name: Restore temporary workflow outside production diff
        run: mv /tmp/tmp-manual-qa-core-sync-20260916.yml .github/workflows/tmp-manual-qa-core-sync-20260916.yml
      - name: Commit synchronized production tree
        run: |
          git config user.name 'Aleksey Safonov'
          git config user.email '55020240+safal207@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-manual-qa-core-sync-20260916.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize split worker build and QA contracts'
          git push origin HEAD:tmp/manual-qa-build-sync-20260916
