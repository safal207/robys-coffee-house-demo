name: RU landing regression

on:
  pull_request:
    paths:
      - 'ru/**'
      - 'menu.html'
      - 'styles-v2.css'
      - 'mobile.css'
      - 'brand-photo-logo.css'
      - 'src/brand/**'
      - 'src/robys-hero-poster.jpg'
      - 'qa/visual-regression.json'
      - 'integrity-manifest.json'
      - 'scripts/test-ru-coffee-landing.mjs'
      - 'scripts/test-ru-main-isolation.mjs'
      - '.github/workflows/ru-coffee-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru-coffee:
    name: RU landing responsive, accessibility and cart journey
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run verify:security
      - run: git diff --exit-code
      - run: npx --no-install playwright install --with-deps chromium
      - name: Test unmodified HTTP-delivered RU page
        env:
          RU_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/test-ru-coffee-landing.mjs
      - name: Test RU landing to existing menu and two-coffee cart total
        env:
          RU_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/test-ru-main-isolation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-coffee-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            visual-results/ru-coffee/
            visual-results/ru-main-isolation/
          if-no-files-found: error
          retention-days: 14
