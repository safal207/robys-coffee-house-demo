name: Refresh Deck Height Once

on:
  push:
    branches:
      - feat/discover-stacked-journey-deck
    paths:
      - ".github/workflows/refresh-deck-height-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/discover-stacked-journey-deck
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci
      - name: Build canonical revisions
        run: npm run build
      - name: Verify focused static contracts
        run: |
          node scripts/test-discover-deck.mjs
          node scripts/test-menu-product-reveal.mjs
      - name: Refresh canonical integrity manifest
        run: node scripts/generate-integrity-manifest.mjs
      - name: Enforce bounded generated diff
        run: |
          rm .github/workflows/refresh-deck-height-once.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
            ".github/workflows/refresh-deck-height-once.yml",
            "discover.html",
            "sw.js",
            "integrity-manifest.json",
          }
          changed = set(filter(None, subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()))
          extra = changed - allowed
          if extra:
              raise SystemExit(f"unexpected generated files: {sorted(extra)}")
          required = {"discover.html", "sw.js", "integrity-manifest.json"}
          missing = required - changed
          if missing:
              raise SystemExit(f"expected generated files missing: {sorted(missing)}")
          print("bounded deck-height generated diff:", sorted(changed))
          PY
      - name: Commit generated revisions and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discover.html sw.js integrity-manifest.json .github/workflows/refresh-deck-height-once.yml
          git commit -m "chore(discover): sync short-height deck revision"
          git push origin HEAD:feat/discover-stacked-journey-deck
