name: Menu first photo preload experiment
on:
  pull_request:
    paths:
      - "scripts/experiment-menu-first-photo-preload.mjs"
      - "scripts/experiment-menu-photo-route-risk.mjs"
      - ".github/workflows/menu-first-photo-preload-experiment.yml"
permissions:
  contents: read
concurrency:
  group: menu-first-photo-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired-cold-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ensure-playwright-browsers.mjs chromium
      - name: Validate experiment syntax
        run: |
          node --check scripts/experiment-menu-first-photo-preload.mjs
          node --check scripts/experiment-menu-photo-route-risk.mjs
      - name: Compare paired published-menu navigation
        run: node scripts/experiment-menu-first-photo-preload.mjs
      - name: Probe feed, search, product and category preload risks
        run: node scripts/experiment-menu-photo-route-risk.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-photo-preload-experiment
          path: .artifacts/menu-first-photo-experiment/
          if-no-files-found: warn
          retention-days: 14
