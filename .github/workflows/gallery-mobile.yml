name: Gallery mobile gate

on:
  pull_request:
    paths:
      - "src/featured-gallery.ts"
      - "featured-gallery.js"
      - "featured-gallery.css"
      - "conversion.css"
      - "index.html"
      - "src/products/cards/**"
      - "src/products/gallery-v2/**"
      - "qa/gallery.spec.ts"
      - "qa/footer.spec.ts"
      - "qa/playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-gallery-assets.sh"
      - "scripts/verify-pairing-preview-media.mjs"
      - "scripts/test-pairing-preview-media.mjs"
      - "scripts/pairing-preview-playback.mjs"
      - "scripts/live-smoke.mjs"
      - "scripts/build.mjs"
      - "sw*.js"
      - "qa/fixtures/media/**"
      - "scripts/ensure-playwright-browsers.mjs"
      - "scripts/signed-ubuntu-packages.mjs"
      - "scripts/test-playwright-prerequisites.mjs"
      - "src/products/sets-v1/**"
      - ".github/workflows/gallery-mobile.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Ensure FFmpeg decoding tools are available
        run: node scripts/ensure-lighthouse-ffprobe.mjs

      - name: Audit gallery and decode the complete pairing clip
        run: npm run verify:gallery:assets

      - name: Compile TypeScript runtime
        run: npm run build

      - name: Convert Iced Latte for compatibility inspection
        id: convert-iced-latte
        continue-on-error: true
        run: |
          ffmpeg -hide_banner -loglevel error \
            -i src/products/gallery-v2/iced-latte.avif \
            -frames:v 1 -c:v libwebp -q:v 90 \
            iced-latte-compatible.webp
          ffmpeg -hide_banner -loglevel error \
            -i src/products/gallery-v2/iced-latte.avif \
            -frames:v 1 \
            iced-latte-compatible.png

      - name: Report compatibility conversion result
        if: always()
        run: |
          if [ "${{ steps.convert-iced-latte.outcome }}" = "failure" ]; then
            echo "::warning::Diagnostic AVIF conversion failed; browser compatibility is still verified by the Playwright matrix."
          fi

      - name: Upload converted Iced Latte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iced-latte-compatible
          path: |
            iced-latte-compatible.webp
            iced-latte-compatible.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Install browser engines
        run: node scripts/ensure-playwright-browsers.mjs webkit chromium

      - name: Verify codec-capable Chrome
        run: google-chrome --version

      - name: Run mobile gallery matrix
        run: npx --no-install playwright test --config=qa/playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-mobile-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
