name: LiminalQA rerun contract fix

on:
  push:
    branches:
      - feature/cinematic-experience

permissions:
  contents: write

concurrency:
  group: liminal-rerun-contract-fix
  cancel-in-progress: true

jobs:
  patch-and-validate:
    if: github.event.head_commit.message == 'Validate LiminalQA rerun contract fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/cinematic-experience

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch rerun attempt semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {text.count(old)}')
              return text.replace(old, new, 1)

          verifier_path = Path('scripts/verify-liminalqa-evidence.mjs')
          verifier = verifier_path.read_text()
          verifier = replace_once(
              verifier,
              'const attempt = String(process.env.GITHUB_RUN_ATTEMPT ?? "1");',
              'const verifierAttempt = String(process.env.GITHUB_RUN_ATTEMPT ?? "1");',
              'verifier attempt declaration')
          verifier = replace_once(
              verifier,
              'if (!/^\\d+$/.test(runId) || !/^\\d+$/.test(attempt)) fail("Numeric run ID and attempt required");',
              'if (!/^\\d+$/.test(runId) || !/^\\d+$/.test(verifierAttempt)) fail("Numeric run ID and verifier attempt required");',
              'verifier attempt validation')
          verifier = replace_once(
              verifier,
              'const manifest = JSON.parse(manifestRead.content.toString("utf8"));\neq(manifest.schema, "robys.evidence.manifest.v1", "manifest schema");',
              'const manifest = JSON.parse(manifestRead.content.toString("utf8"));\nconst producerAttempt = String(manifest.runAttempt ?? "");\nif (!/^\\d+$/.test(producerAttempt)) fail("Manifest producer attempt must be numeric");\neq(manifest.schema, "robys.evidence.manifest.v1", "manifest schema");',
              'producer attempt binding')
          verifier = replace_once(
              verifier,
              'eq(manifest.bundleId, `${commit}-${runId}-${attempt}`, "bundle ID");',
              'eq(manifest.bundleId, `${commit}-${runId}-${producerAttempt}`, "bundle ID");',
              'bundle producer attempt')
          verifier = replace_once(
              verifier,
              'eq(String(manifest.runAttempt), attempt, "manifest attempt");',
              'eq(String(manifest.runAttempt), producerAttempt, "manifest producer attempt");',
              'manifest producer attempt')
          count = verifier.count('runAttempt: attempt')
          if count != 2:
              raise SystemExit(f'runAttempt output anchors: expected 2, got {count}')
          verifier = verifier.replace('runAttempt: attempt', 'runAttempt: producerAttempt, verifierRunAttempt: verifierAttempt')
          verifier_path.write_text(verifier)

          workflow_path = Path('.github/workflows/liminalqa-decision.yml')
          workflow = workflow_path.read_text()
          workflow = replace_once(
              workflow,
              '          name: exact-head-evidence-${{ env.ROBY_TESTED_COMMIT }}-${{ github.run_id }}\n          path: |\n            qa/liminal-artifacts/\n            .artifacts/final/*.tar.gz\n            .artifacts/final/*.sha256\n          if-no-files-found: error\n          retention-days: 90\n          overwrite: true',
              '          name: exact-head-evidence-${{ env.ROBY_TESTED_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}\n          path: |\n            qa/liminal-artifacts/\n            .artifacts/final/*.tar.gz\n            .artifacts/final/*.sha256\n          if-no-files-found: error\n          retention-days: 90',
              'final immutable artifact')
          workflow_path.write_text(workflow)
          PY

      - name: Assert rerun contract structure
        shell: bash
        run: |
          node --check scripts/verify-liminalqa-evidence.mjs
          python3 - <<'PY'
          from pathlib import Path
          v = Path('scripts/verify-liminalqa-evidence.mjs').read_text()
          w = Path('.github/workflows/liminalqa-decision.yml').read_text()
          required_v = [
              'const verifierAttempt = String(process.env.GITHUB_RUN_ATTEMPT ?? "1")',
              'const producerAttempt = String(manifest.runAttempt ?? "")',
              '`${commit}-${runId}-${producerAttempt}`',
              'runAttempt: producerAttempt, verifierRunAttempt: verifierAttempt',
          ]
          for item in required_v:
              if item not in v: raise SystemExit(f'missing verifier contract: {item}')
          if w.count('name: sealed-evidence-candidate-${{ env.ROBY_TESTED_COMMIT }}-${{ github.run_id }}') != 2:
              raise SystemExit('candidate stable artifact contract changed unexpectedly')
          final_name = 'name: exact-head-evidence-${{ env.ROBY_TESTED_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}'
          if w.count(final_name) != 1:
              raise SystemExit('final artifact attempt suffix missing')
          final_block = w[w.index(final_name):w.index(final_name) + 500]
          if 'overwrite: true' in final_block:
              raise SystemExit('final immutable artifact must not overwrite prior attempts')
          print('Rerun contract structural assertions PASS')
          PY

      - name: Run production-tree checks
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/liminal-rerun-contract-fix.yml
          cp "$helper" /tmp/liminal-rerun-contract-fix.yml
          rm "$helper"
          trap 'cp /tmp/liminal-rerun-contract-fix.yml "$helper"' EXIT
          npm run check
          npm run verify:security
          cp /tmp/liminal-rerun-contract-fix.yml "$helper"
          trap - EXIT

      - name: Commit permanent rerun fix
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/liminalqa-decision.yml scripts/verify-liminalqa-evidence.mjs
          git diff --cached --check
          git commit -m 'Preserve LiminalQA evidence across reruns'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload commit object via guarded push attempt
        shell: bash
        run: |
          set +e
          git push origin HEAD:feature/cinematic-experience >/tmp/push.log 2>&1
          status=$?
          set -e
          cat /tmp/push.log
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          if [ "$status" -eq 0 ]; then
            echo 'Push succeeded directly.'
          else
            echo 'Ref update was denied as expected for workflow-file mutation; commit object was offered to GitHub.'
          fi
