name: Lighthouse evidence final validation

on:
  push:
    branches:
      - feature/cinematic-experience

permissions:
  contents: write

concurrency:
  group: lighthouse-evidence-final-validation
  cancel-in-progress: true

jobs:
  patch-validate-commit:
    if: github.event.head_commit.message == 'Validate final Lighthouse evidence fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/cinematic-experience

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Lighthouse evidence fixes
        run: python3 scripts/patch-lighthouse-evidence-final.py

      - name: Verify changed script syntax
        run: |
          node --check scripts/verify-liminalqa-evidence.mjs
          node --check scripts/run-lighthouse-repeatability.mjs
          node --check scripts/build-liminalqa-signals.mjs

      - name: Assert verifier and report contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const verifier = fs.readFileSync('scripts/verify-liminalqa-evidence.mjs', 'utf8');
          const runner = fs.readFileSync('scripts/run-lighthouse-repeatability.mjs', 'utf8');
          const requiredVerifier = [
            '? 24 : 1',
            'rawPaths.length, 14',
            'report.experienceProfiles',
            'verifyLighthouseRoute(homeProfile, "home"',
            'verifyLighthouseRoute(experienceProfile, "experience"'
          ];
          for (const needle of requiredVerifier) if (!verifier.includes(needle)) throw new Error(`verifier contract missing: ${needle}`);
          const requiredReport = [
            'const markdownProfiles = [...profiles, ...experienceProfiles]',
            '| Profile | Route | Warm-up | Measured | Verdict |',
            '### ${profile.profile} / ${profile.route}'
          ];
          for (const needle of requiredReport) if (!runner.includes(needle)) throw new Error(`report contract missing: ${needle}`);
          console.log('Verifier + report route-aware contracts present.');
          NODE

      - name: Build revisioned outputs
        run: npm run build

      - name: Refresh integrity manifest
        run: npm run integrity:generate

      - name: Verify security contracts
        run: npm run verify:security

      - name: Run complete repository check against production tree
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/lighthouse-evidence-final-validation.yml
          helper=scripts/patch-lighthouse-evidence-final.py
          cp "$workflow" /tmp/lighthouse-evidence-final-validation.yml
          cp "$helper" /tmp/patch-lighthouse-evidence-final.py
          rm "$workflow" "$helper"
          trap 'cp /tmp/lighthouse-evidence-final-validation.yml "$workflow"; cp /tmp/patch-lighthouse-evidence-final.py "$helper"' EXIT
          npm run check
          cp /tmp/lighthouse-evidence-final-validation.yml "$workflow"
          cp /tmp/patch-lighthouse-evidence-final.py "$helper"
          trap - EXIT

      - name: Enforce changed-file allowlist
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'scripts/verify-liminalqa-evidence.mjs',
              'scripts/run-lighthouse-repeatability.mjs',
              'integrity-manifest.json',
          }
          status = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          changed_paths = {line[3:] for line in status}
          unexpected = sorted(changed_paths - allowed)
          required = {'scripts/verify-liminalqa-evidence.mjs', 'scripts/run-lighthouse-repeatability.mjs'}
          missing = sorted(required - changed_paths)
          if unexpected:
              raise SystemExit(f'unexpected changed files: {unexpected}')
          if missing:
              raise SystemExit(f'expected changed files missing: {missing}')
          print('Allowed changed files:', *sorted(changed_paths), sep='\n- ')
          PY

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-liminalqa-evidence.mjs scripts/run-lighthouse-repeatability.mjs integrity-manifest.json
          git diff --cached --check
          git commit -m 'Verify expanded Lighthouse evidence'
          git push origin HEAD:feature/cinematic-experience
