name: Roby's brand identity contract

on:
  pull_request:
    paths:
      - "qa/brand/candidate/**"
      - "src/brand/**"
      - "brand-photo-logo.css"
      - "brand-refinement-v5.css"
      - "index.html"
      - "menu.html"
      - "discover.html"
      - "scripts/*brand*.mjs"
      - "scripts/verify-robys-approved-identity-v4.mjs"
      - "package.json"
      - ".github/workflows/brand-candidate.yml"
  push:
    branches:
      - main
    paths:
      - "qa/brand/candidate/**"
      - "src/brand/**"
      - "brand-photo-logo.css"
      - "brand-refinement-v5.css"
      - "index.html"
      - "menu.html"
      - "discover.html"
      - "scripts/*brand*.mjs"
      - "scripts/verify-robys-approved-identity-v4.mjs"
      - "package.json"
      - ".github/workflows/brand-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-brand-identity:
    name: BRAND-IDENTITY-001 approved geometry contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # Temporary PR422 diagnostic. Export only tracked source and locked packages;
      # never .git, credentials, runner configuration, environment or browser profiles.
      - name: Package offline reproduction inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 422 && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p "$RUNNER_TEMP/pr422-reproduction"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/pr422-reproduction/source.tar.gz"
          tar -czf "$RUNNER_TEMP/pr422-reproduction/locked-node-modules.tar.gz" node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/pr422-reproduction/checkout-sha.txt"
          sha256sum package-lock.json > "$RUNNER_TEMP/pr422-reproduction/lock-sha256.txt"

      - name: Upload offline reproduction inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 422 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr422-reproduction-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr422-reproduction/
          if-no-files-found: error
          retention-days: 1

      - name: Verify original and refined Roby's identity
        run: |
          npm run verify:brand-candidate
          npm run verify:brand-identity

      - name: Install locked Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify compact controls and refined logo in the browser
        run: node scripts/test-brand-refinement-v5.mjs

      - name: Upload brand and language-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brand-refinement-v5-${{ github.sha }}
          path: visual-results/brand-refinement-v5/
          if-no-files-found: warn
