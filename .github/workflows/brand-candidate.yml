name: Roby's brand identity contract

on:
  pull_request:
    paths:
      - "qa/brand/candidate/**"
      - "src/brand/**"
      - "brand-photo-logo.css"
      - "scripts/verify-robys-approved-identity-v4.mjs"
      - "package.json"
      - ".github/workflows/brand-candidate.yml"
  push:
    branches:
      - main
    paths:
      - "qa/brand/candidate/**"
      - "src/brand/**"
      - "brand-photo-logo.css"
      - "scripts/verify-robys-approved-identity-v4.mjs"
      - "package.json"
      - ".github/workflows/brand-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-brand-identity:
    name: BRAND-IDENTITY-001 approved geometry contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify approved Roby's identity
        run: npm run verify:brand-candidate
