name: PR341 invalid-order candidate
on:
  push:
    branches: [feat/unified-order-flow]
    paths: [.github/workflows/pr341-preserve-order-candidate.yml]
permissions:
  contents: write
concurrency:
  group: pr341-preserve-order-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'safal207/robys-coffee-house-demo' && github.ref == 'refs/heads/feat/unified-order-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Assert exact preparation parent
        run: |
          test "$(git rev-parse HEAD^)" = 83e3ddfbb34f0b955afb1612d95d3f98ed78ee85
          mkdir -p .artifacts/preserve-order
          git rev-parse HEAD > .artifacts/preserve-order/checkout.sha
      - run: npm ci --no-audit --no-fund
      - name: Record unfixed repository-source result
        run: |
          set +e
          ORDER_TEST_REPORT=.artifacts/preserve-order/before.json node scripts/test-order-invalid-storage.mjs > .artifacts/preserve-order/before.log 2>&1
          status=$?
          set -e
          test "$status" = 1
          node -e "const r=require('./.artifacts/preserve-order/before.json');if(r.total!==35||r.passed!==6||r.failed!==29)process.exit(1)"
      - name: Apply reviewed source changes with exact blob guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          source = Path('src/order-store.ts')
          raw = source.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == 'e2390282aa57028265f03361adfb8ac8359489ae', 'Source changed: stop, do not overwrite'
          s = raw.decode()
          changes = [['  let safeToWrite = storage !== null;\n', '  let safeToWrite = storage !== null;\n  let orderRecordPresent = false;\n'], ['    try { const text = storage?.getItem(key); return text ? JSON.parse(text) : null; }', '    try {\n      const text = storage?.getItem(key);\n      if (key === ORDER_KEY) {\n        orderRecordPresent = text !== null && text !== undefined;\n        return orderRecordPresent ? JSON.parse(text!) : null;\n      }\n      return text ? JSON.parse(text) : null;\n    }'], ["if (!safeToWrite || !storage) { persistent = false; notice = 'storage'; return; }", "if (!safeToWrite || !storage) { persistent = false; if (!notice) notice = 'storage'; return; }"], ['  if (existing) {', '  if (orderRecordPresent && safeToWrite) {'], ['if (existing.version !== 2 ||', 'if (!existing || existing.version !== 2 ||'], ["    } catch { notice = 'invalid-order'; snapshot.migrationDone = true; }", "    } catch {\n      // Invalid or newer data is not an empty basket. Preserve its original\n      // bytes; edits in this document remain an explicitly unsaved draft.\n      notice = 'invalid-order'; persistent = false; safeToWrite = false;\n      snapshot.migrationDone = true;\n    }"], ["      if (stored?.version !== 2 && stored !== null) return;\n      if (stored && Number.isSafeInteger(stored.revision) && stored.revision >= snapshot.revision) {\n        try {\n          const next: OrderSnapshot = { version: 2, revision: stored.revision, lines: validLines(stored.lines), migrationDone: stored.migrationDone === true };\n          if (JSON.stringify(next) !== JSON.stringify(snapshot)) undo = null;\n          snapshot = next;\n          if (snapshot.migrationDone) pendingLegacy = null;\n          emit();\n        } catch { notice = 'invalid-order'; emit(); }\n      }", "      if (!orderRecordPresent) return;\n      try {\n        if (!stored || stored.version !== 2 || !Number.isSafeInteger(stored.revision) || stored.revision < 0) throw new Error('Invalid order schema');\n        const next: OrderSnapshot = { version: 2, revision: stored.revision, lines: validLines(stored.lines), migrationDone: stored.migrationDone === true };\n        if (next.revision < snapshot.revision) return;\n        if (JSON.stringify(next) !== JSON.stringify(snapshot)) undo = null;\n        snapshot = next;\n        if (snapshot.migrationDone) pendingLegacy = null;\n        emit();\n      } catch {\n        // A restored page must not overwrite unreadable/newer stored data\n        // on its next edit, either. Keep the current in-memory order intact.\n        notice = 'invalid-order'; persistent = false; safeToWrite = false;\n        emit();\n      }"]]
          for old, new in changes:
              assert s.count(old) == 1, 'Patch precondition failed'
              s = s.replace(old, new)
          assert hashlib.sha256(s.encode()).hexdigest() == '06a3067975a8da95b5daddbd9158e5b83ac6704de4c7f48c127b6f6df74da5f7'
          source.write_text(s)
          p = Path('package.json')
          raw = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '88ebd041b98d27dc773d255a4ef96096437a1afb'
          s = raw.decode()
          a = '"test:order-recovery": "node scripts/test-order-recovery.mjs"'
          b = '"test:order-recovery": "node scripts/test-order-recovery.mjs && node scripts/test-order-invalid-storage.mjs"'
          assert s.count(a) == 1
          p.write_text(s.replace(a, b))
          PY
      - name: Build and run complete repository checks
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .artifacts/preserve-order/build.log
          npm run integrity:generate 2>&1 | tee .artifacts/preserve-order/integrity.log
          npm run check 2>&1 | tee .artifacts/preserve-order/check.log
          npm run verify:security 2>&1 | tee .artifacts/preserve-order/security.log
          ORDER_TEST_REPORT=.artifacts/preserve-order/after.json node scripts/test-order-invalid-storage.mjs
          node scripts/test-unified-order.mjs > .artifacts/preserve-order/domain.json
          node scripts/test-menu-runtime-contract.mjs
      - run: npx playwright install --with-deps chromium
      - name: Existing enlarged-text and touch geometry
        env:
          ORDER_LAYOUT_RESULTS_DIR: .artifacts/preserve-order/layout
        run: node scripts/order-layout-regression.mjs
      - name: Existing cross-route browser journeys
        env:
          ORDER_RESULTS_DIR: .artifacts/preserve-order/journeys
        run: node scripts/unified-order-browser.mjs
      - name: Store tested candidate objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('.')
          out = root / '.artifacts/preserve-order'
          head = os.environ['GITHUB_SHA']
          repo = 'safal207/robys-coffee-house-demo'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/feat/unified-order-flow'
          allowed = set('src/order-store.ts package.json app.js index.html discover.html menu.html menu-app.js order-store.js order-shell.js order-launcher.js smart-choice/app-v2.js smart-choice/cart-v2.js smart-choice/index.html sw.js integrity-manifest.json'.split())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed and set(changed) <= allowed, f'Unexpected build changes: {changed}'
          assert {'src/order-store.ts', 'package.json', 'order-store.js'} <= set(changed)
          subprocess.run(['git', 'diff', '--check'], check=True)
          patch = subprocess.check_output(['git', 'diff', '--binary'])
          (out / 'source.patch').write_bytes(patch)
          subprocess.run(['git', 'add', '--', *changed], check=True)
          local_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          entries = []
          manifest = {}
          for name in changed:
              content = (root / name).read_text()
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'content': content})
              manifest[name] = hashlib.sha256(content.encode()).hexdigest()
              saved = out / 'candidate-files' / name
              saved.parent.mkdir(parents=True, exist_ok=True)
              saved.write_text(content)
          def api(method, endpoint, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + endpoint, data=data, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          pr = api('GET', 'pulls/341')
          assert pr['state'] == 'open' and not pr['merged'] and pr['head']['sha'] == head
          assert pr['head']['repo']['full_name'] == repo and pr['head']['ref'] == 'feat/unified-order-flow'
          parent = api('GET', 'git/commits/' + head)
          tree = api('POST', 'git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          assert tree['sha'] == local_tree, 'Remote tree differs from tested local tree'
          commit = api('POST', 'git/commits', {'message': 'fix(order): preserve invalid persisted data on load and page restore', 'tree': tree['sha'], 'parents': [head]})
          result = {'checkoutSha': head, 'candidateCommit': commit['sha'], 'candidateTree': tree['sha'], 'filesSha256': manifest,
                    'runId': os.environ['GITHUB_RUN_ID'], 'branchUpdated': False, 'merged': False, 'deployed': False,
                    'boundary': 'Unreferenced tested candidate; advancing the feature branch is a separate owner-authorized action.'}
          (out / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr341-preserve-order-${{ github.sha }}
          path: .artifacts/preserve-order/
          retention-days: 14
          if-no-files-found: error
