name: Finalize Smart Choice static files

on:
  pull_request:
    paths:
      - ".github/workflows/smart-choice-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply CSP-safe progress and focus fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("src/smart-choice/page.ts")
          source = page.read_text()

          before_progress = '''  const value = createElement("span", "progress-value");
            value.style.width = `${((state.questionIndex + 1) / questions.length) * 100}%`;
            track.append(value);
          '''
          after_progress = '''  const value = createElement("span", "progress-value");
            const progressStep = Math.min(questions.length, Math.max(1, state.questionIndex + 1));
            value.classList.add(`progress-value--${progressStep}`);
            track.append(value);
          '''
          if before_progress in source:
              source = source.replace(before_progress, after_progress, 1)
          elif after_progress not in source:
              raise SystemExit("Progress patch context not found")

          before_focus = '''  window.requestAnimationFrame(() => {
              content.querySelector<HTMLElement>("h1")?.focus({ preventScroll: true });
            });
          '''
          after_focus = '''  window.requestAnimationFrame(() => {
              const heading = content.querySelector<HTMLElement>("h1");
              if (!heading) return;
              heading.tabIndex = -1;
              heading.focus({ preventScroll: true });
            });
          '''
          if before_focus in source:
              source = source.replace(before_focus, after_focus, 1)
          elif after_focus not in source:
              raise SystemExit("Focus patch context not found")

          page.write_text(source)

          css_path = Path("smart-choice/style.css")
          css = css_path.read_text()
          marker = '''.progress-value {
            display: block;
            width: 0;
            height: 100%;
            background: var(--ruby);
            border-radius: inherit;
            transition: width 220ms ease;
          }
          '''
          addition = marker + '''
          .progress-value--1 { width: 20%; }
          .progress-value--2 { width: 40%; }
          .progress-value--3 { width: 60%; }
          .progress-value--4 { width: 80%; }
          .progress-value--5 { width: 100%; }
          '''
          if ".progress-value--5" not in css:
              if marker not in css:
                  raise SystemExit("Progress CSS marker not found")
              css = css.replace(marker, addition, 1)
          css_path.write_text(css)

          test_path = Path("scripts/test-smart-choice-page.mjs")
          test = test_path.read_text()
          marker = 'assert(!source.includes("Math.random"), "Flow must remain deterministic");\n'
          addition = marker + 'assert(!source.includes(".style."), "Strict CSP forbids runtime inline style writes");\nassert(source.includes("heading.tabIndex = -1"), "Rendered headings must receive programmatic focus");\n'
          if "Strict CSP forbids runtime inline style writes" not in test:
              if marker not in test:
                  raise SystemExit("Page test marker not found")
              test = test.replace(marker, addition, 1)
          test_path.write_text(test)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm run build

      - name: Regenerate integrity manifest
        run: npm run integrity:generate

      - name: Commit exact source and generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/smart-choice-finalize.yml
          git add src/smart-choice/page.ts scripts/test-smart-choice-page.mjs smart-choice/style.css smart-choice/app.js smart-choice/index.html social-offer.js integrity-manifest.json
          git commit -m "fix: make Smart Choice progress CSP-safe"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
