name: Diagnose Android bridge versus visual-state stall
'on':
  push:
    branches: [qa/android-render-contention-c34f0e0-20260909]
    paths: [.github/workflows/android-bridge-bypass-study.yml]
permissions:
  contents: read
concurrency:
  group: android-bridge-bypass-c34f0e0-20260909
  cancel-in-progress: false
jobs:
  capture:
    name: API36 full-page direct-visual replicate ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rep: [1, 2]
    steps:
      - name: Checkout exact native candidate
        uses: actions/checkout@v4
        with:
          ref: c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          persist-credentials: false
      - name: Fetch diagnostic capture script only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .qa-bridge
          sparse-checkout: .github/scripts/capture-android-page-diagnostic.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply hash-bound direct-visual diagnostic treatment
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          test "$(git hash-object android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java)" = f9714db73ffe3589d874babd10a37f49a65d1a29
          mkdir -p .artifacts
          cp .qa-bridge/.github/scripts/capture-android-page-diagnostic.sh .artifacts/capture-android-page-diagnostic.sh
          chmod +x .artifacts/capture-android-page-diagnostic.sh
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java')
          data=p.read_bytes(); got=hashlib.sha256(data).hexdigest()
          assert got=='d6fd2d8b8ae8c1788e9d64c20e4f1a175df72dbe1403f000b94dcccfcb39ed61', got
          s=data.decode()
          old='''        }\n        pollBridgeReady(view, generation);\n    }'''
          new='''        }\n        // DIAGNOSTIC-ONLY: preserve the full public page and commit deadline,\n        // but bypass JS-ready polling so the visual-state path is isolated.\n        debugState("BRIDGE_BYPASS_DIAGNOSTIC");\n        requestRevealWhenVisualStateReady(view, false, generation);\n    }'''
          assert s.count(old)==1, 'unexpected bridge tail anchor'
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          test "$(git diff --name-only)" = android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          git diff -- android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java > .artifacts/direct-visual-treatment.patch
          sha256sum .artifacts/capture-android-page-diagnostic.sh > .artifacts/diagnostic-script.sha256
          printf 'base_product_head=%s\ninvocation_head=%s\ntreatment=full-page-direct-visual\nreplicate=%s\nweb_source=public-github-pages\nweb_bytes_pinned_to_pr=false\nbridge_poll_bypassed=true\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" '${{ matrix.rep }}' > .artifacts/provenance.txt
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build diagnostic APK
        run: gradle -p android-native :app:assembleDebug --stacktrace
      - name: Release build resources before cold emulator
        run: |
          gradle -p android-native --stop
          free -h
          nproc
      - name: Capture full page with direct visual-state request
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: CAPTURE_PAGE_VARIANT=full CAPTURE_REPLICATE=${{ matrix.rep }} bash .artifacts/capture-android-page-diagnostic.sh
      - name: Verify diagnostic provenance
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          test "$(git diff --name-only)" = android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
      - name: Upload every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-direct-visual-${{ matrix.rep }}-${{ github.sha }}
          path: |
            android-native/build/page-diagnostic/full-${{ matrix.rep }}/
            .artifacts/provenance.txt
            .artifacts/diagnostic-script.sha256
            .artifacts/direct-visual-treatment.patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
