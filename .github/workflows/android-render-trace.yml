name: Android pinned render trace

on:
  pull_request:
    paths:
      - "scripts/prepare-android-trace-probe.py"
      - "scripts/test-android-trace-probe.py"
      - "scripts/qa/android-handoff-trace.pbtx"
      - "scripts/qa/sample-emulator-cpu.py"
      - ".github/workflows/android-render-trace.yml"

permissions:
  contents: read

concurrency:
  group: android-render-trace-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.pull_request.number == 342
    name: Render trace ${{ matrix.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head, head-swiftshader]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && '5b01276b99db719cae2fc72f29d38eb00c9953f4' || '409eef86b76749c0af35847447012cd13f47e7a6' }}
          path: subject

      - name: Prepare isolated pinned fixture
        run: |
          python3 scripts/prepare-android-pinned-fixture.py --source subject --output "$RUNNER_TEMP/pinned-fixture"
          python3 scripts/prepare-android-trace-probe.py "$RUNNER_TEMP/pinned-fixture"
          python3 scripts/test-android-trace-probe.py

      - name: Verify fixture inventory and negative controls
        run: python3 scripts/test-android-pinned-fixture.py

      - name: Verify original capture failure semantics
        run: python3 scripts/test-android-capture-contract.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build diagnostic debug APK
        run: |
          gradle -p "$RUNNER_TEMP/pinned-fixture/android-native" :app:assembleDebug --stacktrace
          gradle -p "$RUNNER_TEMP/pinned-fixture/android-native" --stop
          free -h
          nproc

      - name: Trace cold launch with original recorder and deadlines
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu ${{ matrix.revision == 'head-swiftshader' && 'swiftshader' || 'software' }} -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cd "$RUNNER_TEMP/pinned-fixture" && bash trace-runner.sh

      - name: Verify delivered source identity even when handoff fails
        if: always()
        run: python3 scripts/verify-android-pinned-evidence.py "$RUNNER_TEMP/pinned-fixture"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-render-trace-${{ matrix.revision }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pinned-fixture/trace-evidence/**
            ${{ runner.temp }}/pinned-fixture/trace-capture.sh
            ${{ runner.temp }}/pinned-fixture/trace-runner.sh
            ${{ runner.temp }}/pinned-fixture/sample-emulator-cpu.py
            ${{ runner.temp }}/pinned-fixture/android-native/build/visual-evidence/**
            ${{ runner.temp }}/pinned-fixture/fixture-manifest.json
            ${{ runner.temp }}/pinned-fixture/native-instrumentation.diff
            ${{ runner.temp }}/pinned-fixture/pinned-evidence-summary.json
            ${{ runner.temp }}/pinned-fixture/apk-inventory.json
          if-no-files-found: error
          retention-days: 14
