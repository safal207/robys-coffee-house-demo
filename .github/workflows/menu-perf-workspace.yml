name: Menu performance QA workspace
on:
  push:
    branches: [perf/menu-responsiveness-20261021]
    paths: [.github/workflows/menu-perf-workspace.yml]
permissions:
  contents: read
jobs:
  compare:
    if: github.ref == 'refs/heads/perf/menu-responsiveness-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Canonical build, full check and security
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/menu-performance
          node scripts/build.mjs 2>&1 | tee .artifacts/menu-performance/build.log
          npm run integrity:generate
          npm run check 2>&1 | tee .artifacts/menu-performance/check.log
          npm run verify:security 2>&1 | tee .artifacts/menu-performance/security.log
          git diff --check
      - name: Record local candidate tree before measurement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu-app.js menu-feed.js menu-view-mode.js menu.html menu-feed.html sw-core-v64.js integrity-manifest.json
          git commit -m 'build: emit cache-preserving menu performance candidate'
          git rev-parse HEAD > .artifacts/menu-performance/candidate-head.txt
      - name: Install pinned browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Prepare unchanged baseline with the same measurement harness
        run: |
          git worktree add --detach "$RUNNER_TEMP/menu-baseline" d8426661dcd5a0b73c971fdef932fd1bf16c62b1
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/menu-baseline/node_modules"
          cp scripts/test-menu-performance-browser.mjs "$RUNNER_TEMP/menu-baseline/scripts/"
      - name: Baseline then candidate, followed by the reverse order
        shell: bash
        run: |
          set -o pipefail
          (cd "$RUNNER_TEMP/menu-baseline"; ROBYS_PERF_OUTPUT="$GITHUB_WORKSPACE/.artifacts/menu-performance/baseline" node scripts/test-menu-performance-browser.mjs) 2>&1 | tee .artifacts/menu-performance/baseline.log
          ROBYS_PERF_ENFORCE=1 ROBYS_PERF_OUTPUT=.artifacts/menu-performance/candidate node scripts/test-menu-performance-browser.mjs 2>&1 | tee .artifacts/menu-performance/candidate.log
          ROBYS_PERF_ENFORCE=1 ROBYS_PERF_OUTPUT=.artifacts/menu-performance/candidate-repeat node scripts/test-menu-performance-browser.mjs 2>&1 | tee .artifacts/menu-performance/candidate-repeat.log
          (cd "$RUNNER_TEMP/menu-baseline"; ROBYS_PERF_OUTPUT="$GITHUB_WORKSPACE/.artifacts/menu-performance/baseline-repeat" node scripts/test-menu-performance-browser.mjs) 2>&1 | tee .artifacts/menu-performance/baseline-repeat.log
      - name: Existing menu and shared-cart browser regression
        shell: bash
        env:
          CHECKOUT_BROWSERS: chromium
        run: |
          set -o pipefail
          node scripts/test-menu-feed-browser.mjs 2>&1 | tee .artifacts/menu-performance/menu-regression.log
      - name: Publish tested generated files only to the feature branch
        run: |
          test "$(git ls-remote origin refs/heads/perf/menu-responsiveness-20261021 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/perf/menu-responsiveness-20261021
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robys-menu-performance-comparison-v2
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
