name: Diagnose API36 with pinned web bytes
on:
  push:
    branches: [qa/android-pinned-web-9e4e09d-20260909]
    paths: [.github/workflows/android-pinned-web-diagnostic.yml]
permissions:
  contents: write
concurrency:
  group: android-pinned-web-9e4e09d-20260909
  cancel-in-progress: false
jobs:
  pinned-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 9e4e09d09affa28712b27bb6ca48961adc8cbca8
      PRODUCT_TREE: 1bf29a5a25ffd3669490567c2910c16255fa52ea
      DIAG_BRANCH: diag/android-pinned-web-9e4e09d-20260909
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9e4e09d09affa28712b27bb6ca48961adc8cbca8
          persist-credentials: false
      - name: Checkout diagnostic helper outside product tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .diag
          sparse-checkout: scripts/android-pinned-web-diagnostic.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Freeze exact web bytes and validate old capture semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          mkdir -p .artifacts/android-pinned-web /tmp/robys-pinned-web
          git archive --format=tar "$PRODUCT_SHA" > .artifacts/android-pinned-web/web-source.tar
          tar -xf .artifacts/android-pinned-web/web-source.tar -C /tmp/robys-pinned-web
          sha256sum .artifacts/android-pinned-web/web-source.tar > .artifacts/android-pinned-web/web-source.sha256
          git ls-tree -r "$PRODUCT_SHA" > .artifacts/android-pinned-web/web-tree.txt
          sha256sum index.html android-handoff.js bootstrap-v2.js sw.js integrity-manifest.json > .artifacts/android-pinned-web/web-critical.sha256
          printf 'product_sha=%s\nproduct_tree=%s\nweb_source=pinned-git-archive\nweb_url=http://10.0.2.2:4199/?entry=android-handoff\nweb_bytes_pinned=true\nworkflow_invocation=%s\n' "$PRODUCT_SHA" "$PRODUCT_TREE" "$GITHUB_SHA" > .artifacts/android-pinned-web/provenance.txt
          python3 scripts/test-android-capture-contract.py | tee .artifacts/android-pinned-web/capture-contract-before.log
      - name: Apply bounded debug-only native harness
        shell: bash
        run: |
          set -euo pipefail
          python3 .diag/scripts/android-pinned-web-diagnostic.py apply-native
          git diff --check
          git diff -- android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java android-native/app/src/debug/AndroidManifest.xml android-native/app/src/debug/res/xml/network_security_config.xml > .artifacts/android-pinned-web/native-diagnostic.patch
          test "$(git hash-object .github/scripts/capture-android-launch.sh)" = 52222dbbee45bad86df5604bbc5acf5b3f5c1914
          test "$(git hash-object android-native/app/src/main/AndroidManifest.xml)" = 45cbc1cae91bdbdb11ee2019afa64220ed7fe4e8
          test "$(git hash-object android-native/app/src/main/res/xml/network_security_config.xml)" = 683208ffda765ff9d68c5dc665fc017fe9f5bbdc
          test "$(git hash-object android-native/app/build.gradle.kts)" = 950774020b1c96450dfc96ee8e69479a92204d26
      - name: Commit identified diagnostic native source before execution
        shell: bash
        run: |
          set -euo pipefail
          git add android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java android-native/app/src/debug/AndroidManifest.xml android-native/app/src/debug/res/xml/network_security_config.xml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(android): allow pinned host bytes in debug harness only'
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          git rev-parse HEAD > .artifacts/android-pinned-web/native-diagnostic.sha
          git rev-parse 'HEAD^{tree}' > .artifacts/android-pinned-web/native-diagnostic.tree
          git archive --format=tar.gz HEAD > .artifacts/android-pinned-web/native-diagnostic-source.tar.gz
          git diff --exit-code "$PRODUCT_SHA" -- index.html android-handoff.js bootstrap-v2.js sw.js integrity-manifest.json
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify release boundary and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-android-capture-contract.py | tee .artifacts/android-pinned-web/capture-contract-after.log
          gradle -p android-native :app:processReleaseMainManifest --stacktrace 2>&1 | tee .artifacts/android-pinned-web/release-manifest-check.log
          gradle -p android-native :app:assembleDebug --stacktrace 2>&1 | tee .artifacts/android-pinned-web/debug-build.log
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk > .artifacts/android-pinned-web/apk.sha256
          gradle -p android-native --stop
      - name: Prepare transformed capture script outside committed source
        shell: bash
        run: |
          set -euo pipefail
          python3 .diag/scripts/android-pinned-web-diagnostic.py prepare-capture
          diff -u .github/scripts/capture-android-launch.sh .artifacts/android-pinned-web/capture-pinned.sh > .artifacts/android-pinned-web/capture-transform.diff || test "$?" = 1
      - name: Launch API 36 emulator against pinned exact web archive
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .artifacts/android-pinned-web/run-pinned.sh
      - name: Validate pinned provenance and ordered completion
        if: always()
        shell: bash
        run: python3 .diag/scripts/android-pinned-web-diagnostic.py analyze
      - name: Publish diagnostic commit only after the pinned contract passes
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$DIAG_BRANCH"; then echo 'Diagnostic branch already exists; refusing overwrite.' >&2; exit 1; else test "$?" = 2; fi
          git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$DIAG_BRANCH"
      - name: Upload pinned/native evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-pinned-web-9e4e09d-${{ github.sha }}
          path: |
            .artifacts/android-pinned-web/
            android-native/build/visual-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
