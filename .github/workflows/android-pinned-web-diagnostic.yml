name: Diagnose API36 with pinned web bytes
on:
  push:
    branches: [qa/android-pinned-web-9e4e09d-20260909]
    paths: [.github/workflows/android-pinned-web-diagnostic.yml]
permissions:
  contents: write
concurrency:
  group: android-pinned-web-9e4e09d-20260909
  cancel-in-progress: false
jobs:
  pinned-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 9e4e09d09affa28712b27bb6ca48961adc8cbca8
      PRODUCT_TREE: 1bf29a5a25ffd3669490567c2910c16255fa52ea
      PINNED_WEB_URL: http://10.0.2.2:4199/?entry=android-handoff
      DIAG_BRANCH: diag/android-pinned-web-9e4e09d-20260909
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9e4e09d09affa28712b27bb6ca48961adc8cbca8
          persist-credentials: false

      - name: Freeze exact web bytes before native diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          mkdir -p .artifacts/android-pinned-web /tmp/robys-pinned-web
          git archive --format=tar "$PRODUCT_SHA" > .artifacts/android-pinned-web/web-source.tar
          tar -xf .artifacts/android-pinned-web/web-source.tar -C /tmp/robys-pinned-web
          sha256sum .artifacts/android-pinned-web/web-source.tar > .artifacts/android-pinned-web/web-source.sha256
          git ls-tree -r "$PRODUCT_SHA" > .artifacts/android-pinned-web/web-tree.txt
          printf 'product_sha=%s\nproduct_tree=%s\nweb_source=pinned-git-archive\nweb_url=%s\nweb_bytes_pinned=true\nworkflow_invocation=%s\n' \
            "$PRODUCT_SHA" "$PRODUCT_TREE" "$PINNED_WEB_URL" "$GITHUB_SHA" > .artifacts/android-pinned-web/provenance.txt
          sha256sum index.html android-handoff.js bootstrap-v2.js sw.js integrity-manifest.json \
            > .artifacts/android-pinned-web/web-critical.sha256
          python3 scripts/test-android-capture-contract.py | tee .artifacts/android-pinned-web/capture-contract-before.log

      - name: Apply debug-only local-origin harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          def blob(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          p = Path('android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java')
          data = p.read_bytes()
          assert blob(data) == 'ddc68d69bae045c5202a4641a2f552ed79338ab8', blob(data)
          s = data.decode()

          def one(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)

          one(
              '    private static final String APP_URL_BASE = "https://safal207.github.io/robys-coffee-house-demo/?entry=android-handoff";\n',
              '    private static final String APP_URL_BASE = "https://safal207.github.io/robys-coffee-house-demo/?entry=android-handoff";\n'
              '    private static final String TEST_APP_URL_EXTRA = "robys.test.APP_URL";\n'
          )
          one(
              '    private Runnable visualStateTimeout;\n',
              '    private Runnable visualStateTimeout;\n'
              '    private String appUrlBase = APP_URL_BASE;\n'
          )
          one(
              '        super.onCreate(savedInstanceState);\n\n        root = new FrameLayout(this);',
              '        super.onCreate(savedInstanceState);\n        configureDebugTestUrl();\n\n        root = new FrameLayout(this);'
          )
          one(
              '    private String appUrlForGeneration(int generation) {\n        return APP_URL_BASE + "&handoff-gen=" + generation;\n    }',
              '    private String appUrlForGeneration(int generation) {\n'
              '        String separator = appUrlBase.contains("?") ? "&" : "?";\n'
              '        return appUrlBase + separator + "handoff-gen=" + generation;\n'
              '    }'
          )
          old = '''    private boolean isTrusted(Uri uri) {
        if (uri == null || !"https".equalsIgnoreCase(uri.getScheme())) return false;
        if (!TRUSTED_HOST.equalsIgnoreCase(uri.getHost())) return false;
        String path = uri.getPath();
        return path != null && path.startsWith(TRUSTED_PATH_PREFIX);
    }
'''
          new = '''    private void configureDebugTestUrl() {
        if (!isDebuggableBuild()) return;
        String override = getIntent().getStringExtra(TEST_APP_URL_EXTRA);
        if (override == null || override.isBlank()) return;
        Uri uri = Uri.parse(override);
        if (isPinnedDebugOrigin(uri)) appUrlBase = override;
    }

    private boolean isDebuggableBuild() {
        return (getApplicationInfo().flags & ApplicationInfo.FLAG_DEBUGGABLE) != 0;
    }

    private boolean isPinnedDebugOrigin(Uri uri) {
        return uri != null
                && "http".equalsIgnoreCase(uri.getScheme())
                && "10.0.2.2".equals(uri.getHost())
                && uri.getPort() == 4199;
    }

    private boolean isTrusted(Uri uri) {
        if (uri == null) return false;
        if (isDebuggableBuild() && isPinnedDebugOrigin(uri)) return true;
        if (!"https".equalsIgnoreCase(uri.getScheme())) return false;
        if (!TRUSTED_HOST.equalsIgnoreCase(uri.getHost())) return false;
        String path = uri.getPath();
        return path != null && path.startsWith(TRUSTED_PATH_PREFIX);
    }
'''
          one(old, new)
          p.write_text(s)

          debug_manifest = Path('android-native/app/src/debug/AndroidManifest.xml')
          debug_manifest.parent.mkdir(parents=True, exist_ok=True)
          debug_manifest.write_text('''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:tools="http://schemas.android.com/tools">
    <application
        android:usesCleartextTraffic="true"
        tools:replace="android:usesCleartextTraffic" />
</manifest>
''')

          debug_network = Path('android-native/app/src/debug/res/xml/network_security_config.xml')
          debug_network.parent.mkdir(parents=True, exist_ok=True)
          debug_network.write_text('''<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="false">
        <trust-anchors>
            <certificates src="system" />
        </trust-anchors>
    </base-config>
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="false">10.0.2.2</domain>
    </domain-config>
</network-security-config>
''')
          PY

          git diff --check
          git diff -- android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java \
            android-native/app/src/debug/AndroidManifest.xml \
            android-native/app/src/debug/res/xml/network_security_config.xml \
            > .artifacts/android-pinned-web/native-diagnostic.patch

          # Product deadlines and production network policy stay byte-identical.
          test "$(git hash-object .github/scripts/capture-android-launch.sh)" = 52222dbbee45bad86df5604bbc5acf5b3f5c1914
          test "$(git hash-object android-native/app/src/main/AndroidManifest.xml)" = 45cbc1cae91bdbdb11ee2019afa64220ed7fe4e8
          test "$(git hash-object android-native/app/src/main/res/xml/network_security_config.xml)" = 683208ffda765ff9d68c5dc665fc017fe9f5bbdc
          test "$(git hash-object android-native/app/build.gradle.kts)" = 950774020b1c96450dfc96ee8e69479a92204d26
          grep -q 'BRIDGE_READY_TIMEOUT_MS = 3_500L' android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          grep -q 'VISUAL_CALLBACK_TIMEOUT_MS = 1_500L' android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java
          grep -q 'LOAD_COMMIT_HARD_TIMEOUT_MS = 24_000L' android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java

      - name: Commit identified diagnostic native source before execution
        shell: bash
        run: |
          set -euo pipefail
          git add android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java \
            android-native/app/src/debug/AndroidManifest.xml \
            android-native/app/src/debug/res/xml/network_security_config.xml
          git diff --cached --check
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git commit -m 'test(android): allow pinned host bytes in debug harness only'
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          git rev-parse HEAD > .artifacts/android-pinned-web/native-diagnostic.sha
          git rev-parse 'HEAD^{tree}' > .artifacts/android-pinned-web/native-diagnostic.tree
          git archive --format=tar.gz HEAD > .artifacts/android-pinned-web/native-diagnostic-source.tar.gz

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify release boundary and build diagnostic debug APK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-android-capture-contract.py | tee .artifacts/android-pinned-web/capture-contract-after.log
          gradle -p android-native :app:processReleaseMainManifest --stacktrace \
            2>&1 | tee .artifacts/android-pinned-web/release-manifest-check.log
          gradle -p android-native :app:assembleDebug --stacktrace \
            2>&1 | tee .artifacts/android-pinned-web/debug-build.log
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk \
            > .artifacts/android-pinned-web/apk.sha256
          gradle -p android-native --stop

      - name: Prepare unchanged capture contract with pinned provenance and URL injection
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/capture-android-launch.sh .artifacts/android-pinned-web/capture-pinned.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.artifacts/android-pinned-web/capture-pinned.sh')
          s=p.read_text()
          old="printf 'web_source=public-github-pages\\nweb_url=https://safal207.github.io/robys-coffee-house-demo/?entry=android-handoff\\nweb_bytes_pinned_to_pr=false\\n' > \"$OUT/source-boundary.txt\""
          new="printf 'web_source=pinned-git-archive\\nweb_url=%s\\nweb_bytes_pinned_to_pr=true\\nweb_commit=%s\\n' \"$ROBYS_PINNED_WEB_URL\" \"$ROBYS_WEB_COMMIT\" > \"$OUT/source-boundary.txt\""
          assert s.count(old)==1
          s=s.replace(old,new)
          old='adb shell am start -W -n "$PACKAGE/$ACTIVITY" > "$OUT/activity-start.txt"'
          new='adb shell am start -W -n "$PACKAGE/$ACTIVITY" --es robys.test.APP_URL "$ROBYS_PINNED_WEB_URL" > "$OUT/activity-start.txt"'
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          chmod +x .artifacts/android-pinned-web/capture-pinned.sh
          diff -u .github/scripts/capture-android-launch.sh .artifacts/android-pinned-web/capture-pinned.sh \
            > .artifacts/android-pinned-web/capture-transform.diff || test "$?" = 1
          grep -q '^HANDOFF_WAIT_SECONDS=30$' .artifacts/android-pinned-web/capture-pinned.sh
          grep -q 'LOAD_COMMIT_TIMEOUT|VISUAL_STATE_TIMEOUT|MAIN_FRAME_ERROR|SSL_ERROR' .artifacts/android-pinned-web/capture-pinned.sh
          grep -q 'native_line < commit_line && commit_line < ready_line && ready_line < visual_line && visual_line < complete_line' .artifacts/android-pinned-web/capture-pinned.sh
          cat > .artifacts/android-pinned-web/run-pinned.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p android-native/build/visual-evidence
          python3 -m http.server 4199 --bind 0.0.0.0 --directory /tmp/robys-pinned-web \
            > android-native/build/visual-evidence/pinned-web-server.log 2>&1 &
          server_pid=$!
          cleanup_server(){ kill "$server_pid" 2>/dev/null || true; }
          trap cleanup_server EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4199/?entry=android-handoff >/dev/null; then break; fi
            sleep .1
          done
          curl --fail --silent http://127.0.0.1:4199/android-handoff.js >/dev/null
          export ROBYS_PINNED_WEB_URL='http://10.0.2.2:4199/?entry=android-handoff'
          export ROBYS_WEB_COMMIT='9e4e09d09affa28712b27bb6ca48961adc8cbca8'
          bash .artifacts/android-pinned-web/capture-pinned.sh
          SH
          chmod +x .artifacts/android-pinned-web/run-pinned.sh

      - name: Launch API 36 emulator against pinned exact web archive
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .artifacts/android-pinned-web/run-pinned.sh

      - name: Verify pinned completion and preserve timing evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=android-native/build/visual-evidence
          if [[ -f "$E/source-boundary.txt" ]]; then cp "$E/source-boundary.txt" .artifacts/android-pinned-web/; fi
          if [[ -f "$E/handoff-states.txt" ]]; then cp "$E/handoff-states.txt" .artifacts/android-pinned-web/; fi
          if [[ -f "$E/logcat.txt" ]]; then cp "$E/logcat.txt" .artifacts/android-pinned-web/; fi
          if [[ -f "$E/webview-provider.txt" ]]; then cp "$E/webview-provider.txt" .artifacts/android-pinned-web/; fi
          if [[ -f "$E/evidence-summary.txt" ]]; then cp "$E/evidence-summary.txt" .artifacts/android-pinned-web/; fi
          test -f "$E/source-boundary.txt"
          grep -Fxq 'web_source=pinned-git-archive' "$E/source-boundary.txt"
          grep -Fxq 'web_bytes_pinned_to_pr=true' "$E/source-boundary.txt"
          grep -Fxq 'web_commit=9e4e09d09affa28712b27bb6ca48961adc8cbca8' "$E/source-boundary.txt"
          test -f "$E/handoff-states.txt"
          grep -q 'HANDOFF_COMPLETE$' "$E/handoff-states.txt"
          ! grep -Eq 'LOAD_COMMIT_TIMEOUT|VISUAL_STATE_TIMEOUT|MAIN_FRAME_ERROR|SSL_ERROR' "$E/handoff-states.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re, datetime, json
          p=Path('android-native/build/visual-evidence/handoff-states.txt')
          rows=[]
          for line in p.read_text().splitlines():
              m=re.match(r'(\d\d-\d\d) (\d\d:\d\d:\d\d\.\d+) .*RobysHandoff: (.+)$', line)
              if m:
                  t=datetime.datetime.strptime('2026-'+m.group(1)+' '+m.group(2), '%Y-%m-%d %H:%M:%S.%f')
                  rows.append((t,m.group(3)))
          assert rows
          out=[]
          for i,(t,state) in enumerate(rows):
              out.append({'state':state,'from_start_ms':round((t-rows[0][0]).total_seconds()*1000,1),'from_previous_ms':0 if i==0 else round((t-rows[i-1][0]).total_seconds()*1000,1)})
          Path('.artifacts/android-pinned-web/state-timing.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Publish diagnostic native commit only after pinned contract passes
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$DIAG_BRANCH"; then
            echo 'Diagnostic branch already exists; refusing overwrite.' >&2
            exit 1
          else
            test "$?" = 2
          fi
          git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' \
            push origin "HEAD:refs/heads/$DIAG_BRANCH"

      - name: Upload all pinned/native evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-pinned-web-9e4e09d-${{ github.sha }}
          path: |
            .artifacts/android-pinned-web/
            android-native/build/visual-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
