name: Security contract

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-contract:
    name: Security foundation gates
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build generated runtime
        run: npm run build

      - name: Verify security contracts and scan secrets
        env:
          SECURITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          npm run verify:security 2>&1 | tee security-evidence/security-contract.log

      - name: Verify analytics destination boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          node scripts/verify-analytics-destination-boundaries.mjs 2>&1 \
            | tee security-evidence/analytics-destination-contract.log

      - name: Block high and critical dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          npm audit --audit-level=high 2>&1 | tee security-evidence/npm-audit.log

      - name: Upload exact-run security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-contract-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-evidence/
          if-no-files-found: error
          retention-days: 30
