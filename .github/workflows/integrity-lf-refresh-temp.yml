name: Temporary integrity LF migration

on:
  push:
    branches:
      - agent/day-night-motion-v1
    paths:
      - ".github/workflows/integrity-lf-refresh-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate LF-canonical manifest
        run: npm run integrity:generate
      - name: Verify generator and raw-byte verifier agree
        run: npm run verify:integrity
      - name: Commit migrated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "build(integrity): migrate manifest to LF byte truth"
          git push origin HEAD:agent/day-night-motion-v1
