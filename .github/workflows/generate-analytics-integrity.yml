name: Generate analytics integrity manifest

on:
  push:
    branches:
      - fix/analytics-url-boundaries-20260802
    paths:
      - analytics.js
      - scripts/verify-analytics-destination-boundaries.mjs
      - .github/workflows/security.yml
      - .github/workflows/generate-analytics-integrity.yml
  pull_request:
    paths:
      - analytics.js
      - scripts/verify-analytics-destination-boundaries.mjs
      - .github/workflows/security.yml
      - .github/workflows/generate-analytics-integrity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Verify and generate manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify analytics boundary contract
        run: node scripts/verify-analytics-destination-boundaries.mjs

      - name: Generate integrity manifest
        run: npm run integrity:generate

      - name: Commit exact generated manifest to the feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- integrity-manifest.json; then
            echo "Integrity manifest already matches the generated tree."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity-manifest.json
          git commit -m "chore: refresh analytics integrity manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytics-integrity-${{ github.sha }}
          path: integrity-manifest.json
          if-no-files-found: error
          retention-days: 1
