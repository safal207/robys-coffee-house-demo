name: Pairing completion candidate
on:
  push:
    branches: [qa/pairing-completion-20260906]
    paths: [.github/workflows/pairing-completion-candidate.yml]
permissions:
  contents: write
concurrency:
  group: pairing-completion-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'safal207/robys-coffee-house-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 09b081ec3e74b1ee0144e1522f171026b56353f7
          fetch-depth: 60
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Strengthen the real-page regression without changing product bytes
        run: |
          mkdir -p .artifacts/pairing-completion
          git rev-parse HEAD > .artifacts/pairing-completion/input-head.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/pairing-offers-regression.mjs'); s=p.read_text()
          edits={
            "assert.ok(geometry.imageWidth>=geometry.media.w,`${id}: source upscaled`);": "assert.ok(geometry.imageWidth>=geometry.media.w,`${id}: source upscaled`);\n        assert.ok(geometry.media.h<=321,`${id}: pairing photo exceeds 320px bound`);\n        assert.equal(await page.evaluate(()=>innerWidth),width,`${id}: actual viewport differs`);",
            "assert.equal(money(await page.locator('#menu-product-price').innerText()),expectedPrice);": "assert.equal(money(await page.locator('#menu-product-price').innerText()),expectedPrice);\n        await page.locator('#menu-product-image').evaluate(img=>img.decode());\n        const modalFit=await page.locator('#menu-product-image').evaluate(img=>getComputedStyle(img).objectFit);\n        assert.equal(modalFit,'contain',`${id}: pairing modal must preserve complete photo`);\n        result.geometry[i].modalFit=modalFit;\n        if(width===390&&lang==='ru'&&font===16) await page.screenshot({path:out+`/dialog-${id}-${i}.png`});",
            "assert.ok(await action.evaluate(node=>node===document.activeElement),`${id}: return focus`);": "assert.ok(await action.evaluate(node=>node===document.activeElement),`${id}: return focus`);\n        const badge=await row.locator('.full-menu-item-media').evaluate(media=>{const style=getComputedStyle(media,'::after');return {quantity:media.dataset.cartQuantity,display:style.display,content:style.content};});\n        assert.equal(badge.quantity,String(i===0?2:1),`${id}: selected quantity`);\n        assert.notEqual(badge.display,'none',`${id}: selected quantity badge is hidden`);\n        assert.ok(badge.content.includes(badge.quantity),`${id}: badge lacks actual quantity`);\n        result.geometry[i].badge=badge;"
          }
          for old,new in edits.items():
            assert s.count(old)==1, 'Unexpected test source: '+old
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Preserve red evidence on the pre-fix product
        shell: bash
        run: |
          set +e
          PAIRING_EVIDENCE=.artifacts/pairing-completion/before node scripts/pairing-offers-regression.mjs > .artifacts/pairing-completion/before.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('.artifacts/pairing-completion/before/report.json','utf8'));
          assert.equal(report.cases.length,24);
          assert.equal(report.passed,false);
          assert.ok(report.cases.some(row=>/pairing modal must preserve|photo exceeds 320px|quantity badge is hidden/.test(row.error||'')),'Must reproduce a targeted presentation defect, not just a harness error');
          console.log(JSON.stringify({beforePassed:report.cases.filter(x=>x.passed).length,total:report.cases.length}));
          JS
      - name: Apply scoped framing and badge repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pairing-posters.css'); s=p.read_text()
          assert s.count('  aspect-ratio: 1;')==1
          s=s.replace('  aspect-ratio: 1;', '  height: auto;\n  max-height: 320px;\n  aspect-ratio: 4 / 3;')
          s+='''
          /* Keep genuine selected quantities; remove only decorative poster overlays. */
          #pairing-offers .full-menu-item.is-in-cart .full-menu-item-media::after {
            display: grid;
          }
          /* A later shared rule uses cover. Set photographs remain complete in the dialog. */
          #menu-product-dialog .menu-product-visual img[src*="products/sets-v1/"] {
            object-fit: contain;
            object-position: center;
            transform: none;
          }
          '''
          p.write_text(s)
          p=Path('scripts/test-pairing-offers-source.mjs');s=p.read_text()
          s+='''
          assert.match(css,/max-height: 320px/,'pairing media must stay bounded');
          assert.match(css,/is-in-cart[^{}]*::after\\s*\\{\\s*display: grid/,'selected badge must remain visible');
          assert.match(css,/#menu-product-dialog[^{}]*sets-v1[^{}]*\\{[^}]*object-fit: contain/,'set modal must not crop');
          '''
          p.write_text(s)
          PY
      - name: Full build and unchanged security contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee .artifacts/pairing-completion/build.log
          npm run integrity:generate 2>&1 | tee .artifacts/pairing-completion/integrity.log
          npm run check 2>&1 | tee .artifacts/pairing-completion/check.log
          npm run verify:security 2>&1 | tee .artifacts/pairing-completion/security.log
          git diff --exit-code -- menu-catalog.js src/order-store.ts src/menu-app.js
          git diff --check
      - name: Real set-to-order regression after repair
        run: node scripts/pairing-offers-regression.mjs
        env:
          PAIRING_EVIDENCE: .artifacts/pairing-completion/after
          PAIRING_BASE_REF: 0893c361f035e7c6bf6d9456ee82d8dfb14ab601
      - name: Export only validated product/test files as a detached commit
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const owner=context.repo.owner,repo=context.repo.repo,input='09b081ec3e74b1ee0144e1522f171026b56353f7';
            const out='.artifacts/pairing-completion';
            const before=JSON.parse(fs.readFileSync(out+'/before/report.json','utf8'));
            const after=JSON.parse(fs.readFileSync(out+'/after/report.json','utf8'));
            if(!after.passed||after.cases.length!==24||!after.negativeControl?.detected)throw new Error('Incomplete positive/negative evidence');
            const ref=await github.rest.git.getRef({owner,repo,ref:'heads/fix/pairing-offers-framing-20260906'});
            if(ref.data.object.sha!==input)throw new Error('Source branch moved; refuse stale export');
            const changed=cp.execFileSync('git',['diff','--name-only','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
            const allowed=new Set(['pairing-posters.css','scripts/pairing-offers-regression.mjs','scripts/test-pairing-offers-source.mjs','menu.html','sw.js','integrity-manifest.json']);
            for(const path of changed)if(!allowed.has(path))throw new Error('Unexpected changed path: '+path);
            if(changed.length!==6)throw new Error('Expected exactly six source/generated files');
            const notePath='docs/qa/pairing-completion-2026-09-06.md';
            const note='# Pairing completion verification — 6 September 2026\n\n'+
              'Input checkout: `'+input+'`; candidate run: `'+context.runId+'`.\n'+
              'Strengthened real-page assertions reproduced '+before.cases.filter(x=>!x.passed).length+'/'+before.cases.length+' failures on unchanged input product bytes. After bounded CSS repair, 24/24 pass and the original crop/hidden-copy control is detected.\n\n'+
              'Scope: complete set image in card AND modal, media max320px, visible real selected-quantity badge. Prices290/370TRY unchanged; add2+add1=950TRY and session reload verified. Catalogue, order-store and menu behavior source unchanged.\n\n'+
              'Full build/check/integrity and security passed. Matrix320/390/768/1440 x TR/EN/RU x root16/32; reduced motion paired with32px. Real images, enforcing CSP, ordinary touches/clicks; SW blocked for deterministic CSS. No physical-device, live-publication, cache-upgrade or new Lighthouse claim.\n\n'+
              'Use candidate.json, candidate.patch and file hashes together: results describe the tested working tree, not a fresh checkout of its later commit. The permanent pairing workflow must independently verify the final head. No merge, deployment, Codex request, approval or changed thresholds.\n';
            fs.writeFileSync(notePath,note);changed.push(notePath);
            const parent=await github.rest.git.getCommit({owner,repo,commit_sha:input});
            const entries=changed.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}));
            // No workflow file is created, edited, deleted or exported by this Actions token.
            const tree=await github.rest.git.createTree({owner,repo,base_tree:parent.data.tree.sha,tree:entries});
            const commit=await github.rest.git.createCommit({owner,repo,message:'fix(pairings): preserve complete modal photos and selected quantities',tree:tree.data.sha,parents:[input]});
            const hashes={};for(const path of changed)hashes[path]=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
            fs.writeFileSync(out+'/candidate.json',JSON.stringify({input,candidate:commit.data.sha,tree:tree.data.sha,changed,hashes,refUpdated:false},null,2));
      - name: Preserve evidence even on failed export
        if: always()
        run: |
          mkdir -p .artifacts/pairing-completion/files
          git diff > .artifacts/pairing-completion/candidate.patch
          git status --short > .artifacts/pairing-completion/status.txt
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib
          out=Path('.artifacts/pairing-completion'); hashes={}
          for name in ['pairing-posters.css','scripts/pairing-offers-regression.mjs','scripts/test-pairing-offers-source.mjs','menu.html','sw.js','integrity-manifest.json','docs/qa/pairing-completion-2026-09-06.md']:
            p=Path(name)
            if not p.exists(): continue
            dst=out/'files'/name; dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dst)
            hashes[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'file-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pairing-completion-${{ github.sha }}
          path: .artifacts/pairing-completion/
          retention-days: 14
          if-no-files-found: error
