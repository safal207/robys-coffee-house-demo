name: Android pinned base-head comparison

on:
  pull_request:
    paths:
      - "scripts/prepare-android-pinned-fixture.py"
      - "scripts/verify-android-pinned-evidence.py"
      - "scripts/test-android-pinned-fixture.py"
      - "scripts/qa/PinnedWebFixture.java"
      - ".github/workflows/android-pinned-comparison.yml"

permissions:
  contents: read

concurrency:
  group: android-pinned-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.pull_request.number == 342
    name: Pinned ${{ matrix.revision }} — diagnostic transport
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          path: subject

      - name: Prepare isolated pinned fixture
        run: python3 scripts/prepare-android-pinned-fixture.py --source subject --output "$RUNNER_TEMP/pinned-fixture"

      - name: Verify fixture inventory and negative controls
        run: python3 scripts/test-android-pinned-fixture.py

      - name: Verify original capture failure semantics
        run: python3 scripts/test-android-capture-contract.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build diagnostic debug APK
        run: |
          gradle -p "$RUNNER_TEMP/pinned-fixture/android-native" :app:assembleDebug --stacktrace
          gradle -p "$RUNNER_TEMP/pinned-fixture/android-native" --stop
          free -h
          nproc

      - name: Cold launch with original recorder and deadlines
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cd "$RUNNER_TEMP/pinned-fixture" && bash capture.sh

      - name: Verify delivered source identity even when handoff fails
        if: always()
        run: python3 scripts/verify-android-pinned-evidence.py "$RUNNER_TEMP/pinned-fixture"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pinned-${{ matrix.revision }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pinned-fixture/android-native/build/visual-evidence/**
            ${{ runner.temp }}/pinned-fixture/fixture-manifest.json
            ${{ runner.temp }}/pinned-fixture/native-instrumentation.diff
            ${{ runner.temp }}/pinned-fixture/pinned-evidence-summary.json
            ${{ runner.temp }}/pinned-fixture/apk-inventory.json
          if-no-files-found: warn
          retention-days: 14
