name: Verify generated runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.d.ts'
      - '**/*.html'
      - 'src/**'
      - 'scripts/**'
      - 'qa/business-profile.json'
      - 'qa/causal-refactoring/**'
      - 'docs/causal-refactoring/**'
      - 'app.js'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/typescript-build.yml'
  push:
    branches: [main]
    paths:
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.d.ts'
      - '**/*.html'
      - 'src/**'
      - 'scripts/**'
      - 'qa/business-profile.json'
      - 'qa/causal-refactoring/**'
      - 'docs/causal-refactoring/**'
      - 'app.js'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/typescript-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify causal refactoring and business truth gate
        run: |
          npm run verify:causal-refactoring
          npm run test:causal-refactoring

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Type-check source
        run: npm run typecheck

      - name: Build generated runtime
        run: npm run build

      - name: Upload generated runtime for inspection
        uses: actions/upload-artifact@v4
        with:
          name: generated-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app.js
            featured-gallery.js
            home-menu-entry.js
            home-menu-entry.css
            index.html
            menu-runtime.js
            menu-runtime.css
            menu.html
            discover-runtime.js
            discover-rotation.js
            discover-rotation-v2.js
            discover-rotation-v3.js
            discover.html
            smart-choice/app-runtime.js
            smart-choice/cart-runtime.js
            smart-choice/experiments-runtime.js
            smart-choice/analytics-runtime.js
            smart-choice/decision-trace-runtime.js
            smart-choice/release-qa.js
            smart-choice/simulator-runtime.js
            smart-choice/index.html
            smart-choice/simulator.html
            sw.js
          retention-days: 3

      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check featured-gallery.js
          node --check home-menu-entry.js
          node --check menu-runtime.js
          node --check discover-runtime.js
          node --check discover-rotation.js
          node --check discover-rotation-v2.js
          node --check discover-rotation-v3.js
          node --check smart-choice/app-runtime.js
          node --check smart-choice/cart-runtime.js
          node --check smart-choice/experiments-runtime.js
          node --check smart-choice/analytics-runtime.js
          node --check smart-choice/decision-trace-runtime.js
          node --check smart-choice/release-qa.js
          node --check smart-choice/simulator-runtime.js
          node --check sw.js

      - name: Verify IIFE and deferred loading contract
        run: node scripts/verify-bundle.mjs

      - name: Verify canonical media assets
        run: npm run verify:media

      - name: Reject unreachable runtime CSS and JavaScript
        run: npm run audit:deps -- --check

      - name: Upload dependency graph report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/dependency-graph.json
          retention-days: 7

      - name: Regenerate integrity evidence
        run: npm run integrity:generate

      - name: Reject stale generated files
        run: |
          generated_files=(
            app.js
            featured-gallery.js
            home-menu-entry.js
            index.html
            menu-runtime.js
            menu-runtime.css
            menu.html
            discover-runtime.js
            discover-rotation.js
            discover-rotation-v2.js
            discover-rotation-v3.js
            discover.html
            smart-choice/app-runtime.js
            smart-choice/cart-runtime.js
            smart-choice/experiments-runtime.js
            smart-choice/analytics-runtime.js
            smart-choice/decision-trace-runtime.js
            smart-choice/release-qa.js
            smart-choice/simulator-runtime.js
            smart-choice/index.html
            smart-choice/simulator.html
            sw.js
            integrity-manifest.json
          )
          generated_status="$(git status --porcelain=v1 --untracked-files=all -- "${generated_files[@]}")"
          if [[ -n "$generated_status" ]]; then
            printf 'Generated files are missing from Git or stale after build:\n%s\n' "$generated_status"
            exit 1
          fi
