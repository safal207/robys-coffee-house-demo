name: Diagnose Android render contention
'on':
  push:
    branches: [qa/android-render-contention-c34f0e0-20260909]
    paths: [.github/workflows/android-render-contention-study.yml]
permissions:
  contents: read
concurrency:
  group: android-render-contention-c34f0e0-20260909
  cancel-in-progress: false
jobs:
  capture:
    name: API36 ${{ matrix.mode }} replicate ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - mode: record
            rep: 1
          - mode: no-record
            rep: 1
          - mode: no-record
            rep: 2
          - mode: record
            rep: 2
    steps:
      - name: Checkout exact tested product head
        uses: actions/checkout@v4
        with:
          ref: c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          persist-credentials: false
      - name: Fetch diagnostic script only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .qa-render
          sparse-checkout: .github/scripts/capture-android-render-diagnostic.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Bind diagnostic to exact product and script
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          mkdir -p .artifacts
          cp .qa-render/.github/scripts/capture-android-render-diagnostic.sh .artifacts/capture-android-render-diagnostic.sh
          chmod +x .artifacts/capture-android-render-diagnostic.sh
          sha256sum .artifacts/capture-android-render-diagnostic.sh > .artifacts/diagnostic-script.sha256
          printf 'product_head=%s\ninvocation_head=%s\nmode=%s\nreplicate=%s\n' "$(git rev-parse HEAD)" "${GITHUB_SHA}" '${{ matrix.mode }}' '${{ matrix.rep }}' > .artifacts/provenance.txt
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build exact debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace
      - name: Release build resources before cold emulator
        run: |
          gradle -p android-native --stop
          free -h
          nproc
      - name: Capture fixed treatment
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: CAPTURE_MODE=${{ matrix.mode }} CAPTURE_REPLICATE=${{ matrix.rep }} bash .artifacts/capture-android-render-diagnostic.sh
      - name: Prove product checkout stayed exact
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c34f0e0c53ac05c20c0eade93c85ee4cc284d1fe
          git diff --exit-code
      - name: Upload all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-render-${{ matrix.mode }}-${{ matrix.rep }}-${{ github.sha }}
          path: |
            android-native/build/render-diagnostic/${{ matrix.mode }}-${{ matrix.rep }}/
            .artifacts/provenance.txt
            .artifacts/diagnostic-script.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
