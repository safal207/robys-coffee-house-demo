name: Smart Choice static artifact

on:
  pull_request:
    paths:
      - "smart-choice/**"
      - "src/smart-choice/**"
      - "src/social-offer.ts"
      - "scripts/build.mjs"
      - "scripts/test-smart-choice-page.mjs"
      - "package.json"
      - ".github/workflows/smart-choice-static-artifact.yml"

permissions:
  contents: write

jobs:
  build-static-artifact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply scoped TypeScript fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/smart-choice/page.ts")
          source = path.read_text()

          replacements = [
              (
                  '''const app = document.querySelector<HTMLElement>("#smart-choice-app");
          if (!app) throw new Error("[SMART-CHOICE-PAGE] App root is missing.");
          ''',
                  '''function requireElement<T extends HTMLElement>(selector: string): T {
            const element = document.querySelector<T>(selector);
            if (!element) throw new Error(`[SMART-CHOICE-PAGE] Required element is missing: ${selector}`);
            return element;
          }

          const app = requireElement<HTMLElement>("#smart-choice-app");
          ''',
              ),
              (
                  '''    const parsed = JSON.parse(raw) as Partial<FlowState>;
              if (
                parsed.version !== STATE_VERSION ||
                !isScreen(parsed.screen) ||
                !isLanguage(parsed.locale) ||
                !Number.isInteger(parsed.questionIndex) ||
                (parsed.questionIndex ?? -1) < 0 ||
                (parsed.questionIndex ?? questions.length) >= questions.length ||
                !parsed.answers ||
                typeof parsed.answers !== "object"
              ) {
          ''',
                  '''    const parsed = JSON.parse(raw) as Partial<FlowState>;
              const questionIndex =
                typeof parsed.questionIndex === "number" && Number.isInteger(parsed.questionIndex)
                  ? parsed.questionIndex
                  : -1;
              if (
                parsed.version !== STATE_VERSION ||
                !isScreen(parsed.screen) ||
                !isLanguage(parsed.locale) ||
                questionIndex < 0 ||
                questionIndex >= questions.length ||
                !parsed.answers ||
                typeof parsed.answers !== "object"
              ) {
          ''',
              ),
              ("      questionIndex: parsed.questionIndex,", "      questionIndex,"),
              (
                  '''function updateStaticCopy(): void {
            document.documentElement.lang = state.locale;
            document.title = `Roby's Smart Choice | ${copy[state.locale].fullMenu}`;
            document.querySelectorAll<HTMLElement>("[data-static-copy]").forEach((element) => {
              const key = element.dataset.staticCopy;
              if (key && key in copy[state.locale]) element.textContent = copy[state.locale][key];
            });
          ''',
                  '''function updateStaticCopy(): void {
            document.documentElement.lang = state.locale;
            const languageCopy: Record<string, string> = copy[state.locale];
            document.title = `Roby's Smart Choice | ${languageCopy.fullMenu}`;
            document.querySelectorAll<HTMLElement>("[data-static-copy]").forEach((element) => {
              const key = element.dataset.staticCopy;
              if (key && languageCopy[key]) element.textContent = languageCopy[key];
            });
          ''',
              ),
          ]

          changed = False
          for before, after in replacements:
              if before in source:
                  source = source.replace(before, after, 1)
                  changed = True
              elif after not in source:
                  raise SystemExit("Expected Smart Choice patch context was not found")

          if changed:
              path.write_text(source)
          PY

          if git diff --quiet -- src/smart-choice/page.ts; then
            echo "Scoped TypeScript fixes already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/smart-choice/page.ts
            git commit -m "fix: satisfy Smart Choice TypeScript contracts"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify Smart Choice
        id: smart-build
        continue-on-error: true
        shell: bash
        run: npm run build > smart-choice-build.log 2>&1

      - name: Generate exact integrity manifest
        if: steps.smart-build.outcome == 'success'
        run: npm run integrity:generate

      - name: Stage diagnostics and generated static files
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/smart-choice/smart-choice .artifacts/smart-choice/src/smart-choice
          cp smart-choice-build.log .artifacts/smart-choice/smart-choice-build.log
          cp src/smart-choice/page.ts .artifacts/smart-choice/src/smart-choice/page.ts
          if [ -f smart-choice/app.js ]; then cp smart-choice/app.js .artifacts/smart-choice/smart-choice/app.js; fi
          if [ -f smart-choice/index.html ]; then cp smart-choice/index.html .artifacts/smart-choice/smart-choice/index.html; fi
          if [ -f smart-choice/style.css ]; then cp smart-choice/style.css .artifacts/smart-choice/smart-choice/style.css; fi
          if [ -f social-offer.js ]; then cp social-offer.js .artifacts/smart-choice/social-offer.js; fi
          if [ -f integrity-manifest.json ]; then cp integrity-manifest.json .artifacts/smart-choice/integrity-manifest.json; fi

      - name: Upload exact static artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smart-choice-static-${{ github.event.pull_request.head.sha }}
          path: .artifacts/smart-choice
          if-no-files-found: error
          retention-days: 7

      - name: Enforce successful build
        if: steps.smart-build.outcome != 'success'
        run: |
          tail -n 120 smart-choice-build.log
          exit 1
