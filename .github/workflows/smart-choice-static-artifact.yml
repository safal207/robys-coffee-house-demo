name: Smart Choice static artifact

on:
  pull_request:
    paths:
      - "smart-choice/**"
      - "src/smart-choice/**"
      - "src/social-offer.ts"
      - "scripts/build.mjs"
      - "scripts/test-smart-choice-page.mjs"
      - "package.json"
      - ".github/workflows/smart-choice-static-artifact.yml"

permissions:
  contents: read

jobs:
  build-static-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify Smart Choice
        id: smart-build
        continue-on-error: true
        shell: bash
        run: npm run build > smart-choice-build.log 2>&1

      - name: Generate exact integrity manifest
        if: steps.smart-build.outcome == 'success'
        run: npm run integrity:generate

      - name: Stage diagnostics and generated static files
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/smart-choice/smart-choice
          cp smart-choice-build.log .artifacts/smart-choice/smart-choice-build.log
          if [ -f smart-choice/app.js ]; then cp smart-choice/app.js .artifacts/smart-choice/smart-choice/app.js; fi
          if [ -f smart-choice/index.html ]; then cp smart-choice/index.html .artifacts/smart-choice/smart-choice/index.html; fi
          if [ -f smart-choice/style.css ]; then cp smart-choice/style.css .artifacts/smart-choice/smart-choice/style.css; fi
          if [ -f social-offer.js ]; then cp social-offer.js .artifacts/smart-choice/social-offer.js; fi
          if [ -f integrity-manifest.json ]; then cp integrity-manifest.json .artifacts/smart-choice/integrity-manifest.json; fi

      - name: Upload exact static artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smart-choice-static-${{ github.event.pull_request.head.sha }}
          path: .artifacts/smart-choice
          if-no-files-found: error
          retention-days: 7

      - name: Enforce successful build
        if: steps.smart-build.outcome != 'success'
        run: |
          tail -n 120 smart-choice-build.log
          exit 1
