name: Temporary exact-head integrity refresh

on:
  push:
    branches:
      - fix/manual-qa-polish-20260915
    paths:
      - ".github/workflows/tmp-refresh-android-integrity-20260916.yml"

permissions:
  contents: write

concurrency:
  group: tmp-refresh-android-integrity-20260916
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove branch has not moved
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Generate exact-head integrity manifest
        run: |
          npm run integrity:generate
          node scripts/generate-integrity-manifest.mjs --check
          changed="$(git status --short --untracked-files=all)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$changed" | grep -Eq '^ M integrity-manifest\.json$'

      - name: Commit manifest only if head is still exact
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity-manifest.json
          git commit -m "Refresh integrity manifest for Android debug source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
