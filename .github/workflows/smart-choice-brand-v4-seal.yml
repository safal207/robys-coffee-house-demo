name: Smart Choice Brand V4 Seal

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/smart-choice-brand-v4-seal.yml

permissions:
  contents: write

concurrency:
  group: smart-choice-brand-v4-seal
  cancel-in-progress: true

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/smart-choice-approved-brand-v4
          fetch-depth: 0

      - name: Rebuild and verify exact repair
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run integrity:generate
          npm run check

      - name: Seal generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/smart-choice-brand-v4-seal.yml
          git add -A
          git commit -m "fix: seal Smart Choice approved identity v4"
          git push origin HEAD:fix/smart-choice-approved-brand-v4
