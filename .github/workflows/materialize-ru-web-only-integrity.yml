name: Materialize RU web-only integrity manifest

on:
  push:
    branches: ['rc/ru-coffee-web-only-main-20260909']
    paths: ['.github/workflows/materialize-ru-web-only-integrity.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/ru-coffee-web-only-main-20260909
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate and constrain the only source change
        run: |
          test "$GITHUB_REF" = "refs/heads/rc/ru-coffee-web-only-main-20260909"
          node scripts/generate-integrity-manifest.mjs
          node scripts/verify-integrity-manifest.mjs
          git diff --check
          test "$(git diff --name-only)" = "integrity-manifest.json"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const manifest = JSON.parse(fs.readFileSync('integrity-manifest.json', 'utf8'));
          const byPath = new Map(manifest.files.map(row => [row.path, row]));
          const expected = {
            'ru/coffee-gazipasa.html': ['8453', '1b9e73f1e8d61b7c76e0e05054ac59297444e684e4b5ee266e6881cb5529add1'],
            'ru/coffee-gazipasa.css': ['3082', '43152430a245f81955f25bb99fe8a35e9d661bbe6a0d75eb60c2d8ec71589d57']
          };
          for (const [name, [bytes, sha]] of Object.entries(expected)) {
            const row = byPath.get(name);
            if (!row || String(row.bytes) !== bytes || row.sha256 !== sha) throw new Error(`Unexpected manifest row: ${name}`);
          }
          if (manifest.files.length !== 240) throw new Error(`Unexpected protected file count: ${manifest.files.length}`);
          console.log('manifest sha256=' + crypto.createHash('sha256').update(fs.readFileSync('integrity-manifest.json')).digest('hex'));
          NODE
      - name: Commit only the generated manifest to this RC branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrity-manifest.json
          git diff --cached --name-only | grep -x 'integrity-manifest.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'qa: use generator-produced web-only integrity manifest'
          git push origin HEAD:rc/ru-coffee-web-only-main-20260909
