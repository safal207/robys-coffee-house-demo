name: Assemble pairing preview upload

on:
  push:
    branches:
      - upload/pairing-preview-20260921
    paths:
      - ".github/workflows/assemble-pairing-preview-upload.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: upload/pairing-preview-20260921
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct requested preview video
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .asset-upload/clean-001a.b64 \
            .asset-upload/clean-001b.b64 \
            .asset-upload/final-002.b64 \
            .asset-upload/final-003.b64 \
            .asset-upload/final-004.b64 \
            .asset-upload/final-005.b64 \
            .asset-upload/final-006.b64 \
            .asset-upload/final-007.b64 \
            .asset-upload/clean-008a1.b64 \
            .asset-upload/clean-008a2.b64 \
            .asset-upload/clean-008b.b64 \
            .asset-upload/final-009.b64 \
            .asset-upload/final-010.b64 \
            | tr -d '\r\n' \
            | base64 -d \
            > src/products/sets-v1/iced-san-sebastian-pairing-preview.mp4

          test "$(stat -c%s src/products/sets-v1/iced-san-sebastian-pairing-preview.mp4)" = "65010"
          echo "037650426bb8b61c1be2612ef63f4dc10914dbf614ea1705092a2562a3fd020e  src/products/sets-v1/iced-san-sebastian-pairing-preview.mp4" | sha256sum -c -
          node scripts/verify-pairing-preview-media.mjs

      - name: Bump preview cache revision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/featured-gallery.ts")
          source = path.read_text()
          old = "iced-san-sebastian-pairing-preview.mp4?v=20260921-1"
          new = "iced-san-sebastian-pairing-preview.mp4?v=20260921-2"
          if old not in source:
              raise SystemExit("expected old pairing preview revision is missing")
          path.write_text(source.replace(old, new))
          PY

      - name: Build and refresh integrity evidence
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run integrity:generate
          node scripts/verify-pairing-preview-media.mjs
          npm run verify:integrity

      - name: Remove temporary staging transport
        shell: bash
        run: |
          rm -f .asset-upload/*.b64
          rm -f .github/workflows/assemble-pairing-preview-upload.yml

      - name: Commit assembled video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: upload requested pairing preview video"
          git push origin HEAD:upload/pairing-preview-20260921
