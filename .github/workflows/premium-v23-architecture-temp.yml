name: Temporary premium optics v2.3 architecture

on:
  push:
    branches:
      - agent/premium-depth-v1
    paths:
      - ".github/scripts/premium-v23-architecture-temp.py"
      - ".github/workflows/premium-v23-architecture-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/premium-depth-v1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Apply real-3d and cache architecture
        run: python3 .github/scripts/premium-v23-architecture-temp.py
      - name: Verify syntax and full integrity
        run: |
          node --check bootstrap.js
          node --check day-night-entry.js
          node --check sw.js
          node --check scripts/premium-depth-smoke.mjs
          npm run integrity:generate
          npm run verify:integrity
      - name: Commit architecture and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap.js day-night-entry.js sw.js scripts/premium-depth-smoke.mjs .github/workflows/premium-depth-certification.yml integrity-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(motion): make premium optics a real 3d context"
          git push origin HEAD:agent/premium-depth-v1
