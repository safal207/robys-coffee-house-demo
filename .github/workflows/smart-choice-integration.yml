name: Smart Choice Integration
# Re-run after reconciling the deployed owner-approved v4 identity contract.

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/smart-choice-integration.yml

permissions:
  contents: write

concurrency:
  group: smart-choice-integration-v1
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: integration/smart-choice-release-v1
          fetch-depth: 0

      - name: Merge reviewed Smart Choice stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/smart-choice-revenue-simulator

          set +e
          git merge --no-ff --no-commit origin/agent/smart-choice-revenue-simulator
          merge_status=$?
          set -e

          if [ "${merge_status}" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            printf 'Detected conflicts:\n%s\n' "${conflicts}"
            unexpected="$(printf '%s\n' "${conflicts}" | grep -Ev '^(index\.html|integrity-manifest\.json|package\.json)$' || true)"
            if [ -n "${unexpected}" ]; then
              echo "Unexpected conflicts; refusing automatic integration:" >&2
              printf '%s\n' "${unexpected}" >&2
              exit 1
            fi
          fi

          if git diff --name-only --diff-filter=U | grep -qx 'package.json'; then
            git show :2:package.json > /tmp/package-main.json
            git show :3:package.json > /tmp/package-smart-choice.json
            node <<'NODE'
          const fs = require('node:fs');
          const main = JSON.parse(fs.readFileSync('/tmp/package-main.json', 'utf8'));
          const smart = JSON.parse(fs.readFileSync('/tmp/package-smart-choice.json', 'utf8'));
          const merged = {
            ...main,
            ...smart,
            scripts: { ...main.scripts, ...smart.scripts },
            devDependencies: { ...main.devDependencies, ...smart.devDependencies },
          };
          if (main.scripts['verify:brand-candidate']) {
            merged.scripts['verify:brand-candidate'] = main.scripts['verify:brand-candidate'];
          }
          const regression = merged.scripts['verify:regression'];
          if (regression && !regression.includes('npm run verify:brand-candidate')) {
            merged.scripts['verify:regression'] = regression.replace(
              'npm run verify:brand-identity &&',
              'npm run verify:brand-identity && npm run verify:brand-candidate &&',
            );
          }
          fs.writeFileSync('package.json', `${JSON.stringify(merged, null, 2)}\n`);
          NODE
            git add package.json
          fi

          for generated in index.html integrity-manifest.json; do
            if git diff --name-only --diff-filter=U | grep -qx "${generated}"; then
              git checkout --ours -- "${generated}"
              git add "${generated}"
            fi
          done

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved paths remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          sed -i 's/const EXPECTED_UX_CSS_REVISION = "20260724-wordmark-v3";/const EXPECTED_UX_CSS_REVISION = "20260726-approved-v4";/' scripts/verify-regression-contracts.mjs
          grep -q 'const EXPECTED_UX_CSS_REVISION = "20260726-approved-v4";' scripts/verify-regression-contracts.mjs

          sed -i 's/sw\.js?v=offline-20260710-runtime-1/sw.js?v=platform-install-20260727-1/' menu-pwa.js
          sed -i 's/menu-pwa\.js?v=offline-20260710-runtime-1/menu-pwa.js?v=platform-install-20260727-1/' menu.html
          grep -q 'const SERVICE_WORKER_URL = "sw.js?v=platform-install-20260727-1";' menu-pwa.js
          grep -q 'src="menu-pwa.js?v=platform-install-20260727-1"' menu.html

          git add scripts/verify-regression-contracts.mjs menu-pwa.js menu.html

      - name: Rebuild merged product and evidence
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/smart-choice-integration.log
          : > "${log}"
          run_checked() {
            label="$1"
            shift
            echo "Running ${label}..."
            if ! "$@" >> "${log}" 2>&1; then
              echo "FAILED: ${label}" >&2
              tail -n 160 "${log}" >&2
              exit 1
            fi
          }
          run_checked npm-ci npm ci --no-audit --no-fund
          run_checked build npm run build
          run_checked integrity-generate npm run integrity:generate
          run_checked full-check npm run check
          echo "All integration checks passed."

      - name: Upload integration diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smart-choice-integration-diagnostic-${{ github.run_id }}
          path: /tmp/smart-choice-integration.log
          if-no-files-found: error
          retention-days: 7

      - name: Seal integration commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/smart-choice-integration.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "feat: integrate Smart Choice release v1"
          git push origin HEAD:integration/smart-choice-release-v1
