name: Finalize revenue simulator required cache key

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-revenue-required-cache-key.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - run: npm run build
      - run: npm run integrity:generate
      - name: Commit required generated outputs and remove workflow
        shell: bash
        run: |
          rm .github/workflows/finalize-revenue-required-cache-key.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html integrity-manifest.json .github/workflows/finalize-revenue-required-cache-key.yml
          git commit -m "build: commit required homepage cache revision"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
