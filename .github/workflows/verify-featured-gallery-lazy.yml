name: Verify featured gallery lazy startup
on:
  push:
    branches: [qa/featured-gallery-lazy-verify-20260908]
    paths: [.github/workflows/verify-featured-gallery-lazy.yml]
permissions:
  contents: read
concurrency:
  group: verify-featured-gallery-lazy-20260908
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BASE_SHA: 5e6618b861efc866286c83a06e0380133e103a08
      CANDIDATE_BRANCH: fix/featured-gallery-lazy-startup-20260908
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5e6618b861efc866286c83a06e0380133e103a08
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .diagnostic-tools
          sparse-checkout: scripts/test-featured-gallery-lazy-browser.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Preserve exact-parent negative control
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p .artifacts/featured-gallery-lazy
          cp .diagnostic-tools/scripts/test-featured-gallery-lazy-browser.mjs scripts/
          set +e
          node scripts/test-featured-gallery-lazy-browser.mjs > .artifacts/featured-gallery-lazy/before-browser.log 2>&1
          before=$?
          set -e
          test "$before" = 1
          grep -Eq 'Gallery loading drift|explicit fetch priority' .artifacts/featured-gallery-lazy/before-browser.log
      - name: Apply hash-bound source and static fallback repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          p=Path('src/featured-gallery.ts');data=p.read_bytes()
          assert blob(data)=='048ff89250738356ac895966f59714d9cba9d139', blob(data)
          s=data.decode()
          old='''  image.loading = index === 0 ? "eager" : "lazy";\n  image.decoding = "async";\n  if (index === 0) image.fetchPriority = "low";'''
          new='''  // This gallery is below the first mobile viewport. Do not explicitly\n  // compete with entry/hero resources; the browser may fetch when proximity warrants it.\n  image.loading = "lazy";\n  image.decoding = "async";'''
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          p=Path('index.html');html=p.read_text()
          old='loading="eager" decoding="async" fetchpriority="low"'
          assert html.count(old)==1
          html=html.replace(old,'loading="lazy" decoding="async"')
          p.write_text(html)
          PY
          npm run build
          npm run integrity:generate
      - name: Create exact candidate commit before verification
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={'src/featured-gallery.ts','featured-gallery.js','index.html','integrity-manifest.json','scripts/test-featured-gallery-lazy-browser.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert not changed-allowed, changed-allowed
          assert not {p for p in untracked if p!='scripts/test-featured-gallery-lazy-browser.mjs' and not p.startswith('.diagnostic-tools/') and not p.startswith('.artifacts/')},untracked
          subprocess.run(['git','add','--',*sorted(changed|{'scripts/test-featured-gallery-lazy-browser.mjs'})],check=True)
          PY
          git diff --cached --check
          git diff --cached --binary > .artifacts/featured-gallery-lazy/candidate.patch
          git diff --cached --stat > .artifacts/featured-gallery-lazy/candidate-stat.txt
          git write-tree > .artifacts/featured-gallery-lazy/candidate-tree.txt
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          candidate=$(printf '%s\n' 'perf(gallery): keep below-fold poster images lazy' | git commit-tree "$(cat .artifacts/featured-gallery-lazy/candidate-tree.txt)" -p "$BASE_SHA")
          printf '%s\n' "$candidate" > .artifacts/featured-gallery-lazy/candidate-commit.txt
          git reset --hard "$candidate"
          git archive --format=tar.gz HEAD > .artifacts/featured-gallery-lazy/candidate-source.tar.gz
      - name: Full existing check and security
        shell: bash
        run: |
          npm run check 2>&1 | tee .artifacts/featured-gallery-lazy/check.log
          test ${PIPESTATUS[0]} -eq 0
          npm run verify:security 2>&1 | tee .artifacts/featured-gallery-lazy/security.log
          test ${PIPESTATUS[0]} -eq 0
          git diff --exit-code
      - name: Real-page lazy intent and recovery
        shell: bash
        run: |
          node scripts/test-featured-gallery-lazy-browser.mjs 2>&1 | tee .artifacts/featured-gallery-lazy/after-browser.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Existing order and Premium UI
        shell: bash
        run: |
          npm run test:order-share:browser 2>&1 | tee .artifacts/featured-gallery-lazy/order-share.log
          test ${PIPESTATUS[0]} -eq 0
          node scripts/premium-ui-regression.mjs 2>&1 | tee .artifacts/featured-gallery-lazy/premium-ui.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Six fixed untouched Morning certifications
        shell: bash
        run: |
          for n in 1 2 3 4 5 6; do
            MORNING_ENTRY_RESULTS_DIR=".artifacts/featured-gallery-lazy/morning-$n" node scripts/morning-entry-smoke.mjs 2>&1 | tee ".artifacts/featured-gallery-lazy/morning-$n.log"
            test ${PIPESTATUS[0]} -eq 0
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for n in range(1,7):
            d=json.loads(Path(f'.artifacts/featured-gallery-lazy/morning-{n}/morning-entry-60hz-evidence.json').read_text())
            rows.append({'run':n,'startupMs':d['startupMs'],'medianFrameIntervalMs':d['medianFrameIntervalMs'],'uniqueTransforms':d['uniqueTransforms']})
          Path('.artifacts/featured-gallery-lazy/morning-six-summary.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Original extended Motion and browser Android bridge contracts
        shell: bash
        run: |
          MOTION_RELEASE_RESULTS_DIR=.artifacts/featured-gallery-lazy/motion node scripts/motion-release-certification.mjs 2>&1 | tee .artifacts/featured-gallery-lazy/motion.log
          test ${PIPESTATUS[0]} -eq 0
          ANDROID_HANDOFF_RESULTS_DIR=.artifacts/featured-gallery-lazy/android-browser node scripts/android-handoff-smoke.mjs 2>&1 | tee .artifacts/featured-gallery-lazy/android-browser.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Publish only if every gate passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(cat .artifacts/featured-gallery-lazy/candidate-commit.txt)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/fix/featured-gallery-entry-startup-20260908 | cut -f1)" = "$BASE_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH"; then exit 1; else test "$?" = 2; fi
          git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: featured-gallery-lazy-verification-${{ github.sha }}
          path: .artifacts/featured-gallery-lazy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
