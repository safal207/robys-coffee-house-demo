name: Bounded order recovery candidate
on:
  push:
    branches: [fix/order-release-recovery-20260905]
    paths: [.github/workflows/qa-order-recovery-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'safal207/robys-coffee-house-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Guard original source and install locked tools
        run: |
          test "$(git hash-object src/order-store.ts)" = b872e654de43634ed5f08e3fd6ca4e0fd3d74270
          test "$(git hash-object scripts/test-menu-runtime-contract.mjs)" = 6f3eda84d1f4f0523594f58a6d6d2c7a68ea189c
          git merge-base --is-ancestor 74f2bb9858fabded718afc6e44eca52f6f725fef HEAD
          mkdir -p .artifacts/order-recovery
          git rev-parse HEAD > .artifacts/order-recovery/input-head.txt
          npm ci --no-audit --no-fund
      - name: Reproduce original recovery defects on actual repository source
        shell: bash
        run: |
          set +e
          ORDER_TEST_REPORT=.artifacts/order-recovery/before.json node scripts/test-order-recovery.mjs > .artifacts/order-recovery/before.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('.artifacts/order-recovery/before.json'));assert.equal(r.total,16);assert.equal(r.failed,12);"
      - name: Apply guarded recovery and isolated-dependency fixture repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('src/order-store.ts');s=p.read_text()
          start=s.index('export function createOrderStore(')
          end=s.index('\nlet storage: Storage | null = null;',start)
          replacement=r'''export function createOrderStore(
            storage: Pick<Storage, 'getItem' | 'setItem'> | null,
            onSubscriberError: (error: unknown) => void = error => console.error('[Robys order] View update failed', error)
          ) {
            let snapshot: OrderSnapshot = { version: 2, revision: 0, lines: [], migrationDone: false };
            let persistent = storage !== null;
            // Preserve bytes which this instance could not read; keep edits in memory.
            let safeToWrite = storage !== null;
            let notice = '';
            let pendingLegacy: OrderLine[] | null = null;
            let undo: { line: OrderLine; index: number } | null = null;
            const listeners = new Set<() => void>();
            const read = (key: string): unknown => {
              try { const text = storage?.getItem(key); return text ? JSON.parse(text) : null; }
              catch { notice = 'storage'; persistent = false; safeToWrite = false; return null; }
            };
            const emit = () => {
              // Committed data must not be reported as a failed add by a broken view.
              for (const listener of [...listeners]) {
                try { listener(); }
                catch (error) { try { onSubscriberError(error); } catch { /* Diagnostics cannot undo a committed order. */ } }
              }
            };
            const save = () => {
              if (!safeToWrite || !storage) { persistent = false; notice = 'storage'; return; }
              try {
                storage.setItem(ORDER_KEY, JSON.stringify(snapshot)); persistent = true;
                if (notice === 'storage') notice = '';
              } catch { persistent = false; notice = 'storage'; }
            };
            const existing = read(ORDER_KEY) as Partial<OrderSnapshot> | null;
            if (existing) {
              try {
                if (existing.version !== 2 || !Number.isSafeInteger(existing.revision) || Number(existing.revision) < 0) throw new Error('Invalid order schema');
                snapshot = { version: 2, revision: Number(existing.revision), lines: validLines(existing.lines), migrationDone: existing.migrationDone === true };
              } catch { notice = 'invalid-order'; snapshot.migrationDone = true; }
            } else if (safeToWrite) {
              const legacy = read(LEGACY_MENU_KEY) as { version?: number; lines?: unknown } | null;
              if (legacy?.version === 1) {
                try { snapshot.lines = validLines(legacy.lines); } catch { notice = 'invalid-legacy'; }
              }
            }
            // A legacy conflict needs consent and must not be silently reimported.
            if (safeToWrite && !snapshot.migrationDone) {
              const oldChoice = read(LEGACY_CHOICE_KEY) as CartState | null;
              const oldFlow = read('robys-smart-choice-session.v1') as { answers?: { partySize?: PartySize } } | null;
              if (oldChoice) {
                try {
                  const party = oldFlow?.answers?.partySize ?? 'one';
                  if (!['one', 'two', 'family'].includes(party)) throw new Error('Unknown party');
                  pendingLegacy = [lineFromChoice(oldChoice, party)];
                } catch { notice = 'invalid-legacy'; snapshot.migrationDone = true; }
              } else snapshot.migrationDone = true;
            }
            save();
            const replace = (lines: OrderLine[], migrationDone = snapshot.migrationDone) => {
              const next = validLines(lines);
              const revision = snapshot.revision + 1;
              if (!Number.isSafeInteger(revision)) throw new Error('Order revision limit');
              const remaining = new Set(next.map(line => line.id));
              const removed = snapshot.lines.filter(line => !remaining.has(line.id));
              if (removed.length === 1) {
                undo = { line: { ...removed[0] }, index: snapshot.lines.findIndex(line => line.id === removed[0].id) };
              } else if (removed.length > 1) undo = null;
              snapshot = { ...snapshot, revision, lines: next, migrationDone };
              if (migrationDone) pendingLegacy = null;
              save(); emit();
            };
            const store = {
              get: (): OrderSnapshot => ({ ...snapshot, lines: snapshot.lines.map(line => ({ ...line })) }),
              status: () => ({ persistent, notice, pendingLegacy: pendingLegacy?.map(line => ({ ...line })) ?? null, canUndo: undo !== null }),
              subscribe: (listener: () => void) => { listeners.add(listener); return () => { listeners.delete(listener); }; },
              replace,
              setQuantity(id: string, quantity: number) {
                if (!resolveOrderProduct(id) || !Number.isInteger(quantity) || quantity < 0 || quantity > MAX_QUANTITY) throw new Error('Invalid quantity');
                const index = snapshot.lines.findIndex(line => line.id === id);
                const next = snapshot.lines.map(line => ({ ...line }));
                if (quantity === 0) {
                  if (index < 0) return;
                  next.splice(index, 1);
                } else if (index >= 0) {
                  if (next[index].quantity === quantity) return;
                  next[index] = { id, quantity };
                } else next.push({ id, quantity });
                replace(next);
              },
              add(id: string, quantity = 1) {
                if (!Number.isInteger(quantity) || quantity <= 0) throw new Error('Invalid addition');
                const previous = snapshot.lines.find(line => line.id === id)?.quantity ?? 0;
                if (previous + quantity > MAX_QUANTITY) throw new Error('Quantity limit');
                store.setQuantity(id, previous + quantity);
              },
              undoRemoval() {
                if (!undo) return;
                const removed = undo; undo = null;
                try {
                  const previous = snapshot.lines.find(line => line.id === removed.line.id);
                  if (previous) store.add(removed.line.id, removed.line.quantity);
                  else {
                    const next = snapshot.lines.map(line => ({ ...line }));
                    next.splice(Math.min(removed.index, next.length), 0, { ...removed.line });
                    replace(next);
                  }
                } catch (error) { undo = removed; throw error; }
              },
              resolveMigration(choice: 'keep' | 'import') {
                if (choice !== 'keep' && choice !== 'import') throw new Error('Unknown migration decision');
                if (!pendingLegacy) return;
                let next = snapshot.lines;
                if (choice === 'import') {
                  const merged = new Map(next.map(line => [line.id, line.quantity]));
                  for (const line of pendingLegacy) merged.set(line.id, (merged.get(line.id) ?? 0) + line.quantity);
                  next = validLines([...merged].map(([id, quantity]) => ({ id, quantity })));
                }
                replace(next, true);
              },
              summary() {
                const quantity = snapshot.lines.reduce((sum, line) => sum + line.quantity, 0);
                const totalMinor = snapshot.lines.reduce((sum, line) => sum + Math.round(resolveOrderProduct(line.id)!.item.price * 100) * line.quantity, 0);
                return { quantity, totalMinor };
              },
              reload() {
                const stored = read(ORDER_KEY) as OrderSnapshot | null;
                if (!safeToWrite) { emit(); return; }
                if (stored?.version !== 2 && stored !== null) return;
                if (stored && Number.isSafeInteger(stored.revision) && stored.revision >= snapshot.revision) {
                  try {
                    const next: OrderSnapshot = { version: 2, revision: stored.revision, lines: validLines(stored.lines), migrationDone: stored.migrationDone === true };
                    if (JSON.stringify(next) !== JSON.stringify(snapshot)) undo = null;
                    snapshot = next;
                    if (snapshot.migrationDone) pendingLegacy = null;
                    emit();
                  } catch { notice = 'invalid-order'; emit(); }
                }
              }
            };
            return store;
          }'''
          p.write_text(s[:start]+replacement+s[end:])
          p=Path('scripts/test-menu-runtime-contract.mjs');s=p.read_text()
          s=s.replace("const cwd = process.cwd();", "const dependency = readFileSync('order-store.js', 'utf8');\nconst cwd = process.cwd();")
          s=s.replace("  mkdirSync('src');", "  mkdirSync('src');\n  writeFileSync('order-store.js', dependency);")
          marker="  assert.equal(readVerifiedMenuSource(), 'export const count = 2;\\n');"
          assert s.count(marker)==1
          s=s.replace(marker,marker+'''
            // A changed shared dependency must invalidate the emitted import URL.
            const importsOrder = 'import { order } from "./order-store.js"; export const count = () => order.get();\\n';
            writeFileSync('src/menu-app.js', importsOrder);
            writeFileSync('menu-app.js', compileMenuRuntime());
            assert.equal(readVerifiedMenuSource(), importsOrder);
            writeFileSync('order-store.js', dependency + '\\n// changed dependency fixture\\n');
            assert.throws(() => readVerifiedMenuSource(), /stale or differs/);
            writeFileSync('menu-app.js', compileMenuRuntime());
            assert.equal(readVerifiedMenuSource(), importsOrder);
          ''')
          s=s.replace("assert.equal(readFileSync('menu-app.js', 'utf8'), emitted, 'real runtime was modified by test');", "assert.equal(readFileSync('menu-app.js', 'utf8'), emitted, 'real runtime was modified by test');\nassert.equal(readFileSync('order-store.js', 'utf8'), dependency, 'real dependency was modified by test');")
          p.write_text(s)
          p=Path('package.json');s=p.read_text();data=json.loads(s)
          assert 'test:order-recovery' not in data['scripts']
          data['scripts']['test:order-recovery']='node scripts/test-order-recovery.mjs'
          data['scripts']['check']+=' && npm run test:order-recovery && node scripts/test-menu-runtime-contract.mjs'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          Path('.github/workflows/qa-order-recovery-candidate.yml').unlink()
          PY
      - name: Build source-first and enforce complete existing checks
        shell: bash
        run: |
          set -euo pipefail
          npm run build > .artifacts/order-recovery/build.log 2>&1
          npm run integrity:generate > .artifacts/order-recovery/integrity.log 2>&1
          npm run check > .artifacts/order-recovery/check.log 2>&1
          npm run verify:security > .artifacts/order-recovery/security.log 2>&1
          ORDER_TEST_REPORT=.artifacts/order-recovery/after.json node scripts/test-order-recovery.mjs > .artifacts/order-recovery/after.log 2>&1
          node scripts/test-menu-runtime-contract.mjs > .artifacts/order-recovery/runtime-contract.log 2>&1
          git diff --check
      - run: npx playwright install --with-deps chromium
      - name: Cross-route guest journeys on repaired working tree
        env:
          ORDER_RESULTS_DIR: .artifacts/order-recovery/journeys
        run: node scripts/unified-order-browser.mjs
      - name: Touch and enlarged-text layout
        env:
          ORDER_LAYOUT_RESULTS_DIR: .artifacts/order-recovery/layout
        run: node scripts/order-layout-regression.mjs
      - name: Existing menu and feedback regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/premium-ui-regression.mjs > .artifacts/order-recovery/premium-ui.log 2>&1
          node scripts/premium-feedback-regression.mjs > .artifacts/order-recovery/premium-feedback.log 2>&1
      - name: Create validated detached candidate only; do not update any branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            const owner=context.repo.owner,repo=context.repo.repo;
            const base='74f2bb9858fabded718afc6e44eca52f6f725fef';
            const current=await github.rest.git.getRef({owner,repo,ref:'heads/feat/unified-order-flow'});
            if(current.data.object.sha!==base)throw new Error('Feature branch moved; candidate requires reconciliation');
            const paths=cp.execFileSync('git',['diff','--name-only','-z',base],{encoding:'utf8'}).split('\0').filter(Boolean);
            const allowed=new Set(['src/order-store.ts','scripts/test-order-recovery.mjs','scripts/test-menu-runtime-contract.mjs','package.json','order-store.js','order-shell.js','order-launcher.js','menu-app.js','smart-choice/app-v2.js','smart-choice/cart-v2.js','smart-choice/experiments-v2.js','smart-choice/analytics-v2.js','smart-choice/decision-trace-v2.js','smart-choice/release-qa.js','smart-choice/simulator-v2.js','index.html','discover.html','menu.html','smart-choice/index.html','smart-choice/simulator.html','sw.js','integrity-manifest.json']);
            for(const p of paths)if(!allowed.has(p))throw new Error('Unexpected path: '+p);
            const original=await github.rest.git.getCommit({owner,repo,commit_sha:base});
            const tree=await github.rest.git.createTree({owner,repo,base_tree:original.data.tree.sha,tree:paths.map(p=>({path:p,mode:'100644',type:'blob',content:fs.readFileSync(p,'utf8')}))});
            const commit=await github.rest.git.createCommit({owner,repo,message:'fix(order): preserve shared orders and stable item order with recovery regressions',tree:tree.data.sha,parents:[base]});
            fs.writeFileSync('.artifacts/order-recovery/candidate.json',JSON.stringify({inputHead:context.sha,parent:base,candidate:commit.data.sha,tree:tree.data.sha,paths,refUpdated:false},null,2)+'\n');
            core.info('Validated detached candidate '+commit.data.sha+'; feature/main refs unchanged.');
      - name: Preserve tested bytes and failures
        if: always()
        run: |
          mkdir -p .artifacts/order-recovery
          git diff 74f2bb9858fabded718afc6e44eca52f6f725fef > .artifacts/order-recovery/source.patch
          git diff --stat 74f2bb9858fabded718afc6e44eca52f6f725fef > .artifacts/order-recovery/diff-stat.txt
          sha256sum src/order-store.ts order-store.js scripts/test-order-recovery.mjs > .artifacts/order-recovery/tested-files.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: order-recovery-${{ github.sha }}
          path: |
            .artifacts/order-recovery/
            .artifacts/premium-ui/
            .artifacts/premium-feedback/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
