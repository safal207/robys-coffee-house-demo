name: Finalize Smart Choice revenue simulator assets

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-revenue-simulator-assets.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - run: npm run build
      - run: npm run integrity:generate
      - name: Commit exact generated assets and remove finalizer
        shell: bash
        run: |
          rm .github/workflows/finalize-revenue-simulator-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-choice/simulator.js smart-choice/simulator.html integrity-manifest.json .github/workflows/finalize-revenue-simulator-assets.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: commit revenue simulator assets"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
