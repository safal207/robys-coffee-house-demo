name: Cross-page product photo cache audit
on:
  pull_request:
    paths:
      - "scripts/audit-photo-cross-page-cache.mjs"
      - ".github/workflows/photo-cross-page-cache-audit.yml"
permissions:
  contents: read
concurrency:
  group: photo-cross-page-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cache-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ensure-playwright-browsers.mjs chromium
      - name: Validate cache audit syntax
        run: node --check scripts/audit-photo-cross-page-cache.mjs
      - name: Observe HTTP cache and active Service Worker
        run: node scripts/audit-photo-cross-page-cache.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: photo-cross-page-cache-evidence
          path: .artifacts/photo-cross-page-cache/
          if-no-files-found: warn
          retention-days: 14
