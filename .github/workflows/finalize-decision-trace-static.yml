name: Finalize Smart Choice decision trace static

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-static:
    if: github.event.pull_request.head.ref == 'agent/smart-choice-decision-trace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-choice-decision-trace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run integrity:generate
      - name: Commit exact generated outputs and remove finalizer
        shell: bash
        run: |
          rm -f .github/workflows/finalize-decision-trace-static.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-choice/decision-trace.js smart-choice/index.html integrity-manifest.json .github/workflows/finalize-decision-trace-static.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "build: finalize Smart Choice decision trace assets"
          git push origin HEAD:agent/smart-choice-decision-trace
