name: Fix exact-head rerun artifact contract

on:
  push:
    branches: [feature/cinematic-experience]

permissions:
  contents: write

concurrency:
  group: fix-exact-head-rerun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Make artifact names rerun-stable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/liminalqa-decision.yml')
          text = path.read_text()
          expr = '$' + '{{ '
          attempt_key = expr + 'github.run_id }}-' + expr + 'github.run_attempt }}'
          stable_key = expr + 'github.run_id }}'

          count = text.count(attempt_key)
          if count != 6:
              raise SystemExit(f'expected 6 run-attempt artifact keys, found {count}')
          text = text.replace(attempt_key, stable_key)

          seven = '          retention-days: 7\n'
          if text.count(seven) != 2:
              raise SystemExit('expected two 7-day artifact uploads')
          text = text.replace(seven, seven + '          overwrite: true\n')

          ninety = '          retention-days: 90\n'
          if text.count(ninety) != 1:
              raise SystemExit('expected one 90-day artifact upload')
          text = text.replace(ninety, ninety + '          overwrite: true\n')

          path.write_text(text)

          updated = path.read_text()
          if attempt_key in updated:
              raise SystemExit('run-attempt artifact key still present')
          if updated.count('overwrite: true') != 3:
              raise SystemExit('expected exactly three overwrite-enabled artifact uploads')
          for fragment in (
              'lighthouse-repeatability-mobile-' + stable_key,
              'sealed-evidence-candidate-' + expr + 'env.ROBY_TESTED_COMMIT }}-' + stable_key,
              'exact-head-evidence-' + expr + 'env.ROBY_TESTED_COMMIT }}-' + stable_key,
          ):
              if fragment not in updated:
                  raise SystemExit(f'missing stable artifact fragment: {fragment}')
          print('Exact-head artifact names are rerun-stable.')
          PY
          git diff --check

      - name: Commit workflow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/liminalqa-decision.yml
          git diff --cached --check
          git commit -m 'Make exact-head artifacts rerun-safe'
          git push
