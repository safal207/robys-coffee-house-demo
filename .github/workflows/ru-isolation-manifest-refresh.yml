name: One-shot RU isolation manifest refresh

on:
  push:
    branches: ['probe/ru-web-isolation-main-20260909']
    paths: ['.github/workflows/ru-isolation-manifest-refresh.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe/ru-web-isolation-main-20260909
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate exact manifest and verify candidate
        run: |
          npm run integrity:generate
          npm run check
          npm run verify:security
          git diff --exit-code -- . ':!integrity-manifest.json'
          git diff --check -- integrity-manifest.json
          git diff -- integrity-manifest.json
      - name: Commit only the regenerated manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrity-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'qa(ru): refresh isolation integrity manifest from CI'
          git push origin HEAD:probe/ru-web-isolation-main-20260909
