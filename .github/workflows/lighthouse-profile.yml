name: Lighthouse profiles

on:
  workflow_call:

env:
  LHCI_VERSION: "0.15.1"
  LIGHTHOUSE_ENFORCE: "true"

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    # The signed ffprobe prerequisite supports this Ubuntu deb822 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ensure ffprobe is available
        run: node scripts/ensure-lighthouse-ffprobe.mjs
      - run: npm run verify:media
      - run: node scripts/run-lighthouse-profile.mjs "${{ matrix.profile }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.profile }}-${{ github.sha }}
          path: |
            .lighthouseci/
            lighthouse/reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
