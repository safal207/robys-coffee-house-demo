name: Android visual smoke

on:
  push:
    branches:
      - agent/android-v1.2-rebuild-splash
    paths:
      - "android-native/**"
      - ".github/scripts/capture-android-launch.sh"
      - ".github/workflows/android-visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-visual-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-evidence:
    name: Capture Roby's launch sequence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace

      - name: Launch API 36 emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/capture-android-launch.sh

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robys-v1.2-launch-evidence-${{ github.sha }}
          path: android-native/build/visual-evidence/**
          if-no-files-found: warn
          retention-days: 14
