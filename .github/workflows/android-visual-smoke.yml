name: Android visual smoke

on:
  push:
    branches:
      - agent/android-v1.2-rebuild-splash
    paths:
      - "android-native/**"
      - ".github/workflows/android-visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-visual-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-evidence:
    name: Capture Roby's launch sequence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace

      - name: Launch API 36 emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p android-native/build/visual-evidence
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global window_animation_scale 1
            adb shell settings put global transition_animation_scale 1
            adb shell settings put global animator_duration_scale 1
            adb logcat -c
            adb shell am force-stop com.robys.coffeehouse.debug
            adb shell rm -f /sdcard/robys-launch.mp4

            adb shell screenrecord --time-limit 6 --bit-rate 4000000 /sdcard/robys-launch.mp4 >/tmp/robys-screenrecord.log 2>&1 &
            RECORDER_PID=$!
            sleep 0.25

            adb shell am start -n com.robys.coffeehouse.debug/com.robys.coffeehouse.MainActivity
            sleep 0.35
            adb exec-out screencap -p > android-native/build/visual-evidence/01-bean.png
            sleep 0.55
            adb exec-out screencap -p > android-native/build/visual-evidence/02-cup.png
            sleep 0.55
            adb exec-out screencap -p > android-native/build/visual-evidence/03-brand.png
            sleep 1.30
            adb exec-out screencap -p > android-native/build/visual-evidence/04-app.png

            wait "$RECORDER_PID" || true
            adb pull /sdcard/robys-launch.mp4 android-native/build/visual-evidence/robys-launch.mp4
            adb shell dumpsys window windows > android-native/build/visual-evidence/window-state.txt
            adb logcat -d -t 600 > android-native/build/visual-evidence/logcat.txt

            test -s android-native/build/visual-evidence/01-bean.png
            test -s android-native/build/visual-evidence/02-cup.png
            test -s android-native/build/visual-evidence/03-brand.png
            test -s android-native/build/visual-evidence/04-app.png
            test -s android-native/build/visual-evidence/robys-launch.mp4

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robys-v1.2-launch-evidence-${{ github.sha }}
          path: android-native/build/visual-evidence/**
          if-no-files-found: warn
          retention-days: 14
