name: Android atomic handoff visual smoke

on:
  pull_request:
    paths:
      - "android-native/**"
      - "android-handoff.js"
      - "bootstrap-v2.js"
      - "sw.js"
      - "integrity-manifest.json"
      - "scripts/motion-release-certification.mjs"
      - ".github/scripts/capture-android-launch.sh"
      - ".github/workflows/android-visual-smoke.yml"
      - ".github/workflows/motion-release-certification.yml"
  push:
    branches:
      - agent/android-webview-atomic-handoff-v1
      - agent/motion-release-certification-v1
      - fix/android-handoff-evidence-20260905
    paths:
      - "android-native/**"
      - "android-handoff.js"
      - "bootstrap-v2.js"
      - "sw.js"
      - "integrity-manifest.json"
      - "scripts/motion-release-certification.mjs"
      - ".github/scripts/capture-android-launch.sh"
      - ".github/workflows/android-visual-smoke.yml"
      - ".github/workflows/motion-release-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-atomic-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-evidence:
    name: API 36 WebView atomic handoff
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace

      - name: Release build resources before cold emulator launch
        run: |
          gradle -p android-native --stop
          free -h
          nproc

      - name: Launch API 36 emulator and capture atomic handoff evidence
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          # swiftshader_indirect was deprecated in Emulator 36.4.9.
          # The supported software backend does not change product deadlines.
          emulator-options: -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/capture-android-launch.sh

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robys-atomic-handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: android-native/build/visual-evidence/**
          if-no-files-found: warn
          retention-days: 14
