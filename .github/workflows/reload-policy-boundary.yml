name: Explicit reload ownership transfer candidate
on:
  push:
    branches: [diagnostic/reload-policy-boundary-20261023]
permissions:
  contents: read
jobs:
  feed:
    name: Complete native reload suite (${{ matrix.browser }})
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15-intel' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      CHECKOUT_BROWSERS: ${{ matrix.browser }}
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run verify:integrity && git diff --exit-code
      - if: matrix.browser == 'webkit'
        run: npx --no-install playwright install webkit
      - if: matrix.browser == 'firefox'
        run: node scripts/ensure-playwright-browsers.mjs firefox
      - name: Bind immutable candidate, full harness and native executable
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, accessSync, constants, mkdirSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { firefox, webkit } from 'playwright';
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const manifest=readFileSync('integrity-manifest.json'),files=JSON.parse(manifest).files;
          const hash=createHash('sha256').update(manifest);
          for(const file of [...files].sort((a,b)=>a.path.localeCompare(b.path))){
            const bytes=readFileSync(file.path),sha256=sha(bytes);
            if(bytes.length!==file.bytes||sha256!==file.sha256)throw Error('Protected asset differs: '+file.path);
            hash.update(JSON.stringify({path:file.path,bytes:bytes.length,sha256}));
          }
          const runtimeSha256=hash.digest('hex');
          if(runtimeSha256!=='285a5c6f704760bfdd96a5739fd145dd929a7c3c575b507d2234afb17fdc3da5'||sha(manifest)!=='1ce4108ccd8f216e7671792fa1b2964234da2a9e4a362fb06301cbc37d6404fb'||files.length!==733)throw Error('Unexpected candidate frontend');
          const selected=process.env.CHECKOUT_BROWSERS,pkg=JSON.parse(readFileSync('node_modules/playwright-core/package.json','utf8'));
          const browser=JSON.parse(readFileSync('node_modules/playwright-core/browsers.json','utf8')).browsers.find(x=>x.name===selected);
          const executablePath=({firefox,webkit})[selected].executablePath();
          const expectedRevision=selected==='webkit'?'2203':'1490';
          const osVersion=process.platform==='darwin'?execFileSync('sw_vers',['-productVersion'],{encoding:'utf8'}).trim():process.platform;
          if(process.version!=='v22.23.3'||process.arch!=='x64'||pkg.version!=='1.55.1'||browser?.revision!==expectedRevision
            ||selected==='webkit'&&(process.platform!=='darwin'||!osVersion.startsWith('15.'))
            ||selected==='firefox'&&process.platform!=='linux'||!executablePath.includes('/'+selected+'-'+expectedRevision+'/'))throw Error('Unexpected native toolchain');
          accessSync(executablePath,constants.X_OK);
          const harnessSha256=sha(readFileSync('scripts/test-menu-feed-browser.mjs'));
          const metadata={scope:'Complete unchanged canonical candidate feed, three native product reloads, persisted reading and existing manual policy; replaces no complete current-head Order gate',
            sourceAnchor:'50e217d90e0bd25883e8e5023f8426f747192774',revision:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),parent:git('rev-parse','HEAD^'),
            sourceChanges:git('diff','--name-only','50e217d90e0bd25883e8e5023f8426f747192774','HEAD'),dirty:!!git('status','--porcelain'),
            runtimeSha256,runtimeFiles:files.length,manifestSha256:sha(manifest),harnessSha256,node:process.version,osVersion,architecture:process.arch,
            playwright:pkg.version,browser,executablePath,launcherSha256:sha(readFileSync(executablePath))};
          if(metadata.revision!==process.env.GITHUB_SHA||metadata.parent!=='50e217d90e0bd25883e8e5023f8426f747192774'||metadata.sourceChanges!=='.github/workflows/reload-policy-boundary.yml'
            ||metadata.dirty||harnessSha256!=='ba3113278d5e03f24957fa217bf24604b824350322f41b8b1a3b26138f9b7ec6')throw Error('Unexpected candidate identity');
          mkdirSync('.artifacts/transfer-candidate',{recursive:true});
          writeFileSync('.artifacts/transfer-candidate/environment.json',JSON.stringify(metadata,null,2)+'\n');
          console.log(JSON.stringify(metadata,null,2));
          NODE
      - name: Complete canonical feed suite including three native reloads and existing policy
        run: node scripts/test-menu-feed-browser.mjs
      - if: always()
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reload-transfer-${{ matrix.browser }}
          path: |
            .artifacts/menu-feed/
            .artifacts/transfer-candidate/
          include-hidden-files: true
          retention-days: 14
