name: Temporary Android download consolidation

on:
  push:
    branches:
      - fix/manual-qa-polish-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/manual-qa-polish-20260915
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Consolidate Android download runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old_lines, new_lines, label):
              old = "\n".join(old_lines)
              new = "\n".join(new_lines)
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"missing patch anchor: {label}")

          source_path = Path("src/conversion.js")
          source = source_path.read_text()
          source = replace_once(source, [
              '  const button = document.createElement("button");',
              '  button.className = "android-download-button";',
              '  button.type = "button";',
              '  button.setAttribute("aria-describedby", "android-download-note android-download-status");'
          ], [
              '  const button = document.createElement("a");',
              '  button.className = "android-download-button";',
              '  button.type = "application/vnd.android.package-archive";',
              '  button.setAttribute("aria-describedby", "android-download-note android-download-status");',
              '  button.setAttribute("aria-disabled", "true");',
              '  button.tabIndex = 0;'
          ], "download anchor")
          source = replace_once(source, [
              '  const pill = document.createElement("div");',
              '  pill.className = "android-app-screen-pill";',
              '  screen.append(screenCopy, pill);'
          ], [
              '  const pill = document.createElement("div");',
              '  pill.className = "android-app-screen-pill";',
              '  const androidMark = document.createElement("img");',
              '  androidMark.src = "src/android-mark.svg?v=20260627-2";',
              '  androidMark.alt = "";',
              '  androidMark.width = 48;',
              '  androidMark.height = 48;',
              '  androidMark.decoding = "async";',
              '  pill.append(androidMark);',
              '  screen.append(screenCopy, pill);'
          ], "screen logo")
          source = replace_once(source, [
              'async function downloadAndroidApk(button, status) {',
              '  const language = document.documentElement.lang;',
              '  const copy = androidStatusCopy[language] || androidStatusCopy.tr;',
              '  button.disabled = true;',
              '  button.setAttribute("aria-busy", "true");',
              '  status.textContent = copy.preparing;'
          ], [
              'async function downloadAndroidApk(button, status) {',
              '  if (button.dataset.apkDownload === "verified-blob" || button.getAttribute("aria-busy") === "true") return;',
              '  const language = document.documentElement.lang;',
              '  const copy = androidStatusCopy[language] || androidStatusCopy.tr;',
              '  button.setAttribute("aria-busy", "true");',
              '  button.setAttribute("aria-disabled", "true");',
              '  status.textContent = copy.preparing;'
          ], "download start")
          source = replace_once(source, [
              '    const blob = new Blob([bytes], { type: "application/vnd.android.package-archive" });',
              '    const objectUrl = URL.createObjectURL(blob);',
              '    const anchor = document.createElement("a");',
              '    anchor.href = objectUrl;',
              '    anchor.download = androidApkFileName;',
              '    document.body.append(anchor);',
              '    anchor.click();',
              '    anchor.remove();',
              '    window.setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);',
              '    status.textContent = copy.ready;'
          ], [
              '    const blob = new Blob([bytes], { type: "application/vnd.android.package-archive" });',
              '    const objectUrl = URL.createObjectURL(blob);',
              '    button.href = objectUrl;',
              '    button.download = androidApkFileName;',
              '    button.dataset.apkDownload = "verified-blob";',
              '    button.removeAttribute("aria-disabled");',
              '    status.textContent = copy.ready;',
              '    button.click();',
              '    window.setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);'
          ], "verified blob")
          source = replace_once(source, [
              '  } finally {',
              '    button.disabled = false;',
              '    button.removeAttribute("aria-busy");',
              '  }'
          ], [
              '  } finally {',
              '    button.removeAttribute("aria-busy");',
              '  }'
          ], "download finally")
          source_path.write_text(source)

          pwa_path = Path("pwa-pairing-fix.js")
          pwa = pwa_path.read_text()
          pwa = pwa.replace('const M="mobile-install.js?v=platform-install-20260727-1",A="android-download.js?v=android-verified-20260627-1",P="robys-pwa"', 'const M="mobile-install.js?v=platform-install-20260727-1",P="robys-pwa"')
          pwa = pwa.replace('y===SERVICE_WORKER_URL||y===M||y===A?y:', 'y===SERVICE_WORKER_URL||y===M?y:')
          pwa = pwa.replace('const t=()=>{if(l)return;l=1;for(const x of[M,A]){const e=document.createElement("script");e.src=u(x);e.async=1;e.onerror=()=>{e.remove();l=0};document.head.append(e)}};', 'const t=()=>{if(l)return;l=1;const e=document.createElement("script");e.src=u(M);e.async=1;e.onerror=()=>{e.remove();l=0};document.head.append(e)};')
          if "android-download.js" in pwa:
              raise SystemExit("duplicate Android runtime remains in PWA")
          pwa_path.write_text(pwa)

          index_path = Path("index.html")
          index_path.write_text(index_path.read_text().replace('pwa-pairing-fix.js?v=20260916-3', 'pwa-pairing-fix.js?v=20260916-4'))
          sw_path = Path("sw-core-v64.js")
          sw = sw_path.read_text().replace('pwa-pairing-fix.js?v=20260916-3', 'pwa-pairing-fix.js?v=20260916-4').replace('  "./android-download.js",\n', '')
          if '"./android-download.js"' in sw:
              raise SystemExit("duplicate Android runtime remains in service worker")
          sw_path.write_text(sw)
          Path("android-download.js").unlink()

          verifier_path = Path("scripts/verify-android-download.mjs")
          verifier = verifier_path.read_text()
          start = verifier.index('const upgrade = readFileSync("android-download.js", "utf8");')
          marker = 'assert(upgrade.includes(".then(() => link.click())"), "First user click must continue into the verified download after preparation");'
          end = verifier.index(marker, start) + len(marker)
          replacement_lines = [
              'const conversionSource = readFileSync("src/conversion.js", "utf8");',
              'const bootstrap = readFileSync("bootstrap-v2.js", "utf8");',
              'const css = readFileSync("android-app.css", "utf8");',
              'const mobileInstall = readFileSync("mobile-install.js", "utf8");',
              'const mobileInstallCss = readFileSync("mobile-install.css", "utf8");',
              'const pwa = readFileSync("pwa.js", "utf8");',
              'const sw = readFileSync("sw.js", "utf8") + "\\n" + readFileSync("sw-core-v64.js", "utf8");',
              'const home = readFileSync("index.html", "utf8");',
              'const pairingPwa = readFileSync("pwa-pairing-fix.js", "utf8");',
              'assert(conversionSource.includes("Array.from(") && conversionSource.includes("downloads/android-v1.2/part-"), "Canonical conversion runtime must construct all six APK part URLs");',
              'assert(conversionSource.includes(expectedSha256), "Canonical conversion runtime must verify APK SHA-256");',
              'assert(conversionSource.includes(\'document.createElement("a")\'), "Android download control must be an anchor before user intent");',
              'assert(conversionSource.includes(\'src/android-mark.svg?v=20260627-2\'), "Android screen logo must be present before user intent");',
              'assert(conversionSource.includes(\'button.dataset.apkDownload = "verified-blob"\'), "Verified Blob state must bind to the visible Android control");',
              'assert(conversionSource.includes("button.href = objectUrl") && conversionSource.includes("button.download = androidApkFileName"), "Verified download URL and filename must bind to the visible Android control");',
              'assert(conversionSource.includes("button.click()"), "First user click must continue into the verified download after preparation");',
              'assert(!existsSync("android-download.js"), "Duplicate Android download runtime must not return");',
              'assert(!home.includes(\'src="android-download.js\'), "Home page must not load a duplicate Android download runtime");',
              'assert(!pairingPwa.includes("android-download.js"), "PWA bootstrap must not load a duplicate Android download runtime");',
              'assert(!sw.includes("./android-download.js"), "Service worker must not precache a duplicate Android download runtime");'
          ]
          verifier = verifier[:start] + "\n".join(replacement_lines) + verifier[end:]
          verifier_path.write_text(verifier)

          security_path = Path("scripts/verify-security-contracts.mjs")
          security = security_path.read_text().replace('  "android-download.js",\n', '  "src/conversion.js",\n')
          if '"android-download.js"' in security:
              raise SystemExit("security runtime map still references duplicate Android runtime")
          security_path.write_text(security)
          PY
      - name: Build canonical runtime and integrity
        run: |
          npm run typecheck
          npm run build
          npm run integrity:generate
          node scripts/verify-android-download.mjs
          npm run verify:security
          npm run verify:integrity
          git diff --check
      - name: Prove offline Android download flow
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/robys-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/verify-offline-browser.mjs
      - name: Prove consolidation diff is bounded
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' android-download.js conversion.js index.html integrity-manifest.json pwa-pairing-fix.js scripts/verify-android-download.mjs scripts/verify-security-contracts.mjs src/conversion.js sw-core-v64.js | sort > /tmp/expected.txt
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - name: Commit bounded consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aleksey Safonov'
          git config user.email '55020240+safal207@users.noreply.github.com'
          git add -A -- android-download.js conversion.js index.html integrity-manifest.json pwa-pairing-fix.js scripts/verify-android-download.mjs scripts/verify-security-contracts.mjs src/conversion.js sw-core-v64.js
          git diff --cached --check
          git commit -m 'perf: consolidate Android download runtime'
          git push origin HEAD:fix/manual-qa-polish-20260915
