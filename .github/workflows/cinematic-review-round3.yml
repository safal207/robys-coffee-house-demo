name: Cinematic review round 3

on:
  push:
    branches: [feature/cinematic-experience]

permissions:
  contents: write

concurrency:
  group: cinematic-review-round3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply final Codex fixes
        run: python scripts/apply-cinematic-review-round3.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build revisioned runtime
        run: npm run build

      - name: Refresh integrity manifest
        run: npm run integrity:generate

      - name: Validate syntax security and complete repository
        shell: bash
        run: |
          set -euo pipefail
          node --check experience/experience.js
          npm run verify:security
          npm run check
          npm run integrity:generate
          npm run verify:integrity

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Target final review findings
        shell: bash
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 4173 > /tmp/robys-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });

          // Non-text localization: restored RU and selected EN update title + aria labels.
          const localized = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await localized.addInitScript(() => localStorage.setItem('robys-language', 'ru'));
          await localized.goto('http://127.0.0.1:4173/experience/', { waitUntil: 'networkidle' });
          if (!document) {}
          const ru = await localized.evaluate(() => ({
            title: document.title,
            header: document.querySelector('.experience-header')?.getAttribute('aria-label'),
            home: document.querySelector('.brand-lockup')?.getAttribute('aria-label'),
            language: document.querySelector('.language-switcher')?.getAttribute('aria-label'),
          }));
          if (!ru.title.includes('Возьми с собой') || ru.header !== "Навигация по истории Roby's" || ru.home !== "Главная Roby's Coffee House" || ru.language !== 'Выбор языка') {
            throw new Error(`Russian non-text localization mismatch: ${JSON.stringify(ru)}`);
          }
          await localized.locator('[data-lang="en"]').click();
          const en = await localized.evaluate(() => ({
            title: document.title,
            header: document.querySelector('.experience-header')?.getAttribute('aria-label'),
            home: document.querySelector('.brand-lockup')?.getAttribute('aria-label'),
            language: document.querySelector('.language-switcher')?.getAttribute('aria-label'),
          }));
          if (!en.title.includes('Take It With You') || en.header !== "Roby's cinematic navigation" || en.home !== "Roby's Coffee House home" || en.language !== 'Language selector') {
            throw new Error(`English non-text localization mismatch: ${JSON.stringify(en)}`);
          }
          await localized.close();

          // Offline-first: install the SW from the home route, then visit experience offline.
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, serviceWorkers: 'allow' });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.evaluate(async () => {
            const registration = await navigator.serviceWorker.register('/sw.js');
            await navigator.serviceWorker.ready;
            if (registration.installing) {
              await new Promise((resolve) => registration.installing.addEventListener('statechange', function onChange() {
                if (this.state === 'activated') resolve();
              }));
            }
          });
          await page.reload({ waitUntil: 'networkidle' });
          await page.waitForFunction(() => Boolean(navigator.serviceWorker.controller));
          await context.setOffline(true);
          await page.goto('http://127.0.0.1:4173/experience/', { waitUntil: 'domcontentloaded' });
          const max = await page.evaluate(() => document.documentElement.scrollHeight - innerHeight);
          await page.evaluate((y) => scrollTo(0, y), max * 0.84);
          await page.waitForTimeout(500);
          const pairing = await page.locator('.pairing-card img').evaluateAll((images) => images.map((img) => ({ complete: img.complete, width: img.naturalWidth, src: img.currentSrc })));
          if (pairing.length !== 2 || pairing.some((img) => !img.complete || img.width <= 0)) {
            throw new Error(`offline pairing images unavailable: ${JSON.stringify(pairing)}`);
          }
          await context.close();
          await browser.close();
          NODE

      - name: Commit final fixes on green validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience/ sw.js integrity-manifest.json
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'Resolve final cinematic review findings'
          git push
