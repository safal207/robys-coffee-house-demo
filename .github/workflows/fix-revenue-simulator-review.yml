name: Address revenue simulator review findings

on:
  pull_request:
    paths:
      - '.github/workflows/fix-revenue-simulator-review.yml'
      - 'scripts/patch-revenue-review-ui.py'
      - 'scripts/patch-revenue-review-contracts.py'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/patch-revenue-review-ui.py
      - run: python scripts/patch-revenue-review-contracts.py
      - run: npm ci --silent
      - run: npm run build
      - run: npm run integrity:generate
      - name: Commit reviewed fixes and remove temporary tooling
        shell: bash
        run: |
          rm scripts/patch-revenue-review-ui.py scripts/patch-revenue-review-contracts.py .github/workflows/fix-revenue-simulator-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address revenue simulator review findings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
