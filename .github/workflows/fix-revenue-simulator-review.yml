name: Address revenue simulator review findings

on:
  pull_request:
    paths:
      - '.github/workflows/fix-revenue-simulator-review.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          html_path = Path('smart-choice/simulator.html')
          html = html_path.read_text()
          html = replace_once(html, '''          <label class="sim-field">
            <span>Формат чисел</span>
            <select name="locale">
              <option value="ru-RU" selected>Русский</option>
              <option value="tr-TR">Türkçe</option>
              <option value="en-US">English</option>
            </select>
          </label>
          ''', '''          <div class="sim-field">
            <span>Язык интерфейса и чисел</span>
            <strong class="sim-readonly-value">Русский (ru-RU)</strong>
            <input type="hidden" name="locale" value="ru-RU" />
            <small>Этот owner-интерфейс локализован только на русском. Другие форматы доступны через versioned API.</small>
          </div>
          ''', 'locale selector')
          html = replace_once(html, '''  </main>

  <div id="revenue-simulator-status"''', '''    <noscript>
      <section class="sim-results sim-noscript" aria-labelledby="simulator-noscript-title">
        <h2 id="simulator-noscript-title">Ручной расчёт без JavaScript</h2>
        <p>Автоматический симулятор требует JavaScript. Базовый сценарий можно проверить вручную:</p>
        <ol>
          <li><code>целевая выручка = текущая выручка × (1 + рост / 100)</code></li>
          <li><code>денежный разрыв = целевая выручка − текущая выручка</code></li>
          <li><code>дополнительные заказы = округление вверх(разрыв / средний чек)</code></li>
          <li><code>нужный средний чек = округление вверх(целевая выручка / текущие заказы)</code></li>
        </ol>
        <p>Не меняйте цены и не публикуйте стратегию без проверки себестоимости, маржи и подтверждения владельца.</p>
      </section>
    </noscript>
  </main>

  <div id="revenue-simulator-status"''', 'noscript insertion')
          html_path.write_text(html)

          ui_path = Path('src/smart-choice/revenue-simulator.ts')
          ui = ui_path.read_text()
          ui = replace_once(ui, 'function renderResult(result: RevenueSimulationResult): void {', 'function renderResult(result: RevenueSimulationResult, focusHeading = true): void {', 'renderResult signature')
          ui = replace_once(ui, '''  const heading = element("h2", "sim-results-title", "Сценарий роста");
  heading.tabIndex = -1;
''', '''  const heading = element("h2", "sim-results-title", "Сценарий роста");
  heading.id = "results-placeholder-title";
  heading.tabIndex = -1;
''', 'result heading id')
          ui = replace_once(ui, '''    card.append(element("code", "sim-formula", scenario.formula));
    if (scenario.remainingToRequestedTargetMinor > 0) {
''', '''    card.append(element("code", "sim-formula", scenario.formula));
    if (scenario.financials) {
      const financials = element("div", "sim-financials");
      financials.append(
        element("p", "", `Валовая прибыль: ${money(result, scenario.financials.projectedGrossProfitMinor)}`),
        element("p", "", `Прирост валовой прибыли: ${money(result, scenario.financials.incrementalGrossProfitMinor)}`),
        element("p", "", `Валовая маржа: ${percent(scenario.financials.projectedGrossMarginBps, result.locale)}`),
        element("p", `sim-margin-status sim-margin-status--${scenario.financials.marginGuardrail}`, `Margin guardrail: ${scenario.financials.marginGuardrail}`)
      );
      card.append(financials);
    }
    if (scenario.remainingToRequestedTargetMinor > 0) {
''', 'scenario financials')
          ui = replace_once(ui, '''  statusRoot.textContent = "Сценарий рассчитан. Проверьте исходные данные и guardrails перед любым пилотом.";
  heading.focus();
}

function renderError(message: string): void {
''', '''  statusRoot.textContent = "Сценарий рассчитан. Проверьте исходные данные и guardrails перед любым пилотом.";
  if (focusHeading) heading.focus();
}

function renderError(message: string, focusHeading = true): void {
''', 'result focus and error signature')
          ui = replace_once(ui, '''  const heading = element("h2", "sim-results-title", "Расчёт остановлен");
  heading.tabIndex = -1;
''', '''  const heading = element("h2", "sim-results-title", "Расчёт остановлен");
  heading.id = "results-placeholder-title";
  heading.tabIndex = -1;
''', 'error heading id')
          ui = replace_once(ui, '''  statusRoot.textContent = `Ошибка проверки данных: ${message}`;
  heading.focus();
}

function runSimulation(): void {
''', '''  statusRoot.textContent = `Ошибка проверки данных: ${message}`;
  if (focusHeading) heading.focus();
}

function runSimulation(focusHeading = true): void {
''', 'error focus and run signature')
          ui = replace_once(ui, '''      renderError(errors.map((entry) => `${entry.path}: ${entry.message}`).join(" "));
''', '''      renderError(errors.map((entry) => `${entry.path}: ${entry.message}`).join(" "), focusHeading);
''', 'validation error focus')
          ui = replace_once(ui, '''    renderResult(simulateRevenueGrowth(input));
  } catch (error) {
    renderError(error instanceof Error ? error.message : "Неизвестная ошибка расчёта.");
''', '''    renderResult(simulateRevenueGrowth(input), focusHeading);
  } catch (error) {
    renderError(error instanceof Error ? error.message : "Неизвестная ошибка расчёта.", focusHeading);
''', 'simulation focus propagation')
          ui = replace_once(ui, '''  runSimulation();
});
''', '''  runSimulation(true);
});
''', 'submit focus')
          if not ui.endswith('runSimulation();\n'):
              raise SystemExit('initial runSimulation call not found at file end')
          ui = ui[:-len('runSimulation();\n')] + 'runSimulation(false);\n'
          ui_path.write_text(ui)

          domain_path = Path('src/smart-choice/revenue-simulator-domain.ts')
          domain = domain_path.read_text()
          domain = replace_once(domain, '''    const requirements = scenario.requirements
      .map((entry) => `${entry.lever} ${percent(entry.requiredLiftBps)}`)
      .join("; ");
    return `| ${scenario.label} | ${percent(scenario.planningGrowthBps)} | ${money(scenario.projectedRevenueMinor)} | ${money(scenario.uncertaintyLowMinor)}–${money(scenario.uncertaintyHighMinor)} | ${requirements} |`;
''', '''    const requirements = scenario.requirements
      .map((entry) => `${entry.lever} ${percent(entry.requiredLiftBps)}`)
      .join("; ");
    const financialSummary = scenario.financials
      ? `${money(scenario.financials.projectedGrossProfitMinor)}; Δ ${money(scenario.financials.incrementalGrossProfitMinor)}; ${percent(scenario.financials.projectedGrossMarginBps)}; ${scenario.financials.marginGuardrail}`
      : "Unavailable — COGS missing";
    return `| ${scenario.label} | ${percent(scenario.planningGrowthBps)} | ${money(scenario.projectedRevenueMinor)} | ${money(scenario.uncertaintyLowMinor)}–${money(scenario.uncertaintyHighMinor)} | ${requirements} | ${financialSummary} |`;
''', 'markdown financial summary')
          domain = replace_once(domain, '''    "| Scenario | Planned growth | Projected revenue | Explicit range | Required lever lifts |",
    "|---|---:|---:|---:|---|",
''', '''    "| Scenario | Planned growth | Projected revenue | Explicit range | Required lever lifts | Gross profit / margin |",
    "|---|---:|---:|---:|---|---|",
''', 'markdown scenario header')
          domain_path.write_text(domain)

          css_path = Path('smart-choice/simulator.css')
          css = css_path.read_text()
          css += '''

.sim-readonly-value {
  display: flex;
  min-height: 46px;
  align-items: center;
  padding: 10px 12px;
  background: var(--sim-cream);
  border: 1px solid var(--sim-line);
  border-radius: 12px;
  font-size: 0.82rem;
}

.sim-financials {
  display: grid;
  gap: 5px;
  margin-top: 12px;
  padding: 12px;
  background: var(--sim-cream);
  border-radius: 12px;
  font-size: 0.7rem;
}

.sim-financials p {
  margin: 0;
}

.sim-margin-status--breach {
  color: #7d1117;
  font-weight: 900;
}

.sim-margin-status--pass {
  color: #245c35;
  font-weight: 900;
}

.sim-noscript {
  margin-top: 20px;
}

.sim-noscript code {
  overflow-wrap: anywhere;
}
'''
          css_path.write_text(css)

          test_path = Path('scripts/test-smart-choice-revenue-simulator.mjs')
          test = test_path.read_text()
          test = replace_once(test, '''  assert.ok(withCogs.scenarios.every((scenario) => Number.isInteger(scenario.financials.projectedGrossProfitMinor)));

  const mismatchInput''', '''  assert.ok(withCogs.scenarios.every((scenario) => Number.isInteger(scenario.financials.projectedGrossProfitMinor)));
  const cogsMarkdown = exportRevenueSimulationMarkdown(withCogs);
  assert.match(cogsMarkdown, /Gross profit \/ margin/);
  assert.match(cogsMarkdown, /pass|breach/);
  assert.doesNotMatch(cogsMarkdown, /Unavailable — COGS missing/);

  const mismatchInput''', 'financial markdown tests')
          test_path.write_text(test)

          verify_path = Path('scripts/verify-smart-choice-revenue-simulator.mjs')
          verify = verify_path.read_text()
          verify = replace_once(verify, '''assert.match(html, /Owner approval required/, "owner-approval boundary is missing");
''', '''assert.match(html, /Owner approval required/, "owner-approval boundary is missing");
assert.match(html, /name="locale" value="ru-RU"/, "owner UI must use its declared Russian locale");
assert.ok(!html.includes('option value="tr-TR"') && !html.includes('option value="en-US"'), "untranslated locale options must not be exposed");
assert.match(html, /<noscript>[\s\S]*целевая выручка = текущая выручка/, "manual no-JavaScript formula fallback is required");
''', 'HTML review contracts')
          verify = replace_once(verify, '''assert.ok(!source.includes("Math.random"), "simulator must remain deterministic");
''', '''assert.ok(!source.includes("Math.random"), "simulator must remain deterministic");
assert.ok(source.includes('heading.id = "results-placeholder-title"'), "results region label must remain valid after rendering");
assert.ok(source.includes("runSimulation(false)"), "initial calculation must not steal focus");
assert.ok(source.includes("scenario.financials"), "computed gross-profit and margin fields must be rendered");
''', 'source review contracts')
          verify = replace_once(verify, '''assert.ok(domain.includes("revenue × conversion"), "explicit revenue formula is missing");
''', '''assert.ok(domain.includes("revenue × conversion"), "explicit revenue formula is missing");
assert.ok(domain.includes("Gross profit / margin"), "human-readable financial export is missing");
''', 'domain financial export contract')
          verify_path.write_text(verify)

          docs_path = Path('docs/smart-choice/revenue-simulator-contract.md')
          docs = docs_path.read_text()
          docs = replace_once(docs, '''The public Smart Choice flow does not link to this page. The owner tool is `noindex`, stores no personal data and sends no network requests. Direct navigation grants access only to the local planning interface; it does not authorize catalog, price or experiment changes.
''', '''The public Smart Choice flow does not link to this page. The owner tool is `noindex`, stores no personal data and sends no network requests. Direct navigation grants access only to the local planning interface; it does not authorize catalog, price or experiment changes. The browser owner UI is deliberately Russian-only in v0.1; the versioned domain/export API may still format supported locales when called programmatically.
''', 'documentation locale boundary')
          docs_path.write_text(docs)

          Path('.github/workflows/fix-revenue-simulator-review.yml').unlink()
      - run: npm ci --silent
      - run: npm run build
      - run: npm run integrity:generate
      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/smart-choice/revenue-simulator-domain.ts src/smart-choice/revenue-simulator.ts smart-choice/simulator.html smart-choice/simulator.css smart-choice/simulator.js scripts/test-smart-choice-revenue-simulator.mjs scripts/verify-smart-choice-revenue-simulator.mjs docs/smart-choice/revenue-simulator-contract.md integrity-manifest.json .github/workflows/fix-revenue-simulator-review.yml
          git commit -m "fix: address revenue simulator review findings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
