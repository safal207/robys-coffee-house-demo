name: Cinematic experience validation

on:
  push:
    branches: [feature/cinematic-experience]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinematic-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate cinematic experience
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate current integrity manifest
        run: npm run integrity:generate

      - name: Check experience runtime syntax
        run: node --check experience/experience.js

      - name: Verify security contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cinematic-evidence
          npm run verify:security 2>&1 | tee cinematic-evidence/security.log

      - name: Run complete repository check
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee cinematic-evidence/check.log

      - name: Upload cinematic validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cinematic-experience-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            integrity-manifest.json
            cinematic-evidence/
            .artifacts/security-contract-report.json
          if-no-files-found: warn
          retention-days: 14
