name: Finalize Smart Choice release assets

on:
  pull_request:
    paths:
      - 'src/smart-choice/release-qa*.ts'
      - 'smart-choice/release-qa.css'
      - 'smart-choice/index.html'
      - 'scripts/build.mjs'
      - 'scripts/verify-smart-choice-release.mjs'
      - 'package.json'
      - '.github/workflows/smart-choice-release-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/smart-choice-release-qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-choice-release-qa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - run: npm run build
      - run: npm run integrity:generate
      - name: Commit exact generated assets and remove finalizer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-choice/release-qa.js smart-choice/index.html integrity-manifest.json
          git rm .github/workflows/smart-choice-release-finalize.yml
          git commit -m "build: finalize Smart Choice release assets"
          git push origin HEAD:agent/smart-choice-release-qa
