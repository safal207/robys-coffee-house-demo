name: Lighthouse mobile audit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/lighthouse-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact repository head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install exact Lighthouse version
        run: npm install --global lighthouse@12.8.2

      - name: Start Chrome and verify DevTools readiness
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/robys-lighthouse"
          mkdir -p "$diagnostics"
          chrome_path="$(command -v google-chrome)"
          {
            printf 'Chrome path: %s\n' "$chrome_path"
            "$chrome_path" --version
            node --version
            lighthouse --version
          } | tee "$diagnostics/versions.log"
          # Preserve the defaults used by this exact Lighthouse installation.
          lighthouse_entry="$(readlink -f "$(command -v lighthouse)")"
          default_flags="$(node --input-type=module - "$lighthouse_entry" <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(process.argv[2]);
          const { Launcher } = await import(require.resolve('chrome-launcher'));
          console.log(Launcher.defaultFlags().join('\n'));
          NODE
          )"
          mapfile -t chrome_defaults <<< "$default_flags"
          if curl --noproxy '*' --silent --fail --max-time 1 http://127.0.0.1:9222/json/version >/dev/null; then
            echo "Refusing to audit through an existing DevTools endpoint"
            exit 1
          fi
          profile="$(mktemp -d "$RUNNER_TEMP/robys-lighthouse-profile.XXXXXX")"
          "$chrome_path" "${chrome_defaults[@]}" --headless --no-sandbox --disable-gpu \
            --no-first-run --no-default-browser-check \
            --user-data-dir="$profile" \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            about:blank >"$diagnostics/chrome-out.log" 2>"$diagnostics/chrome-err.log" &
          chrome_pid=$!
          printf '%s\n' "$chrome_pid" > "$diagnostics/chrome.pid"
          for attempt in {1..30}; do
            if ! kill -0 "$chrome_pid" 2>/dev/null; then
              echo "Chrome exited before DevTools became ready"
              cat "$diagnostics/chrome-err.log"
              exit 1
            fi
            if curl --noproxy '*' --silent --fail --max-time 1 \
              http://127.0.0.1:9222/json/version > "$diagnostics/devtools.json"; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!d.Browser || !d.webSocketDebuggerUrl) process.exit(1)' "$diagnostics/devtools.json"
              echo "Chrome DevTools is ready on 127.0.0.1:9222"
              exit 0
            fi
            sleep 1
          done
          cat "$diagnostics/chrome-err.log"
          echo "Chrome DevTools did not become ready within 30 attempts"
          exit 1

      - name: Start local server
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/robys-server.log 2>&1 &
          echo $! > /tmp/robys-server.pid
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/robys-server.log
          exit 1

      - name: Run Lighthouse mobile audit
        run: |
          set -euo pipefail
          lighthouse http://127.0.0.1:8080/ \
            --hostname=127.0.0.1 --port=9222 \
            --output=json \
            --output=html \
            --output-path=./lighthouse-report \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile \
            --screen-emulation.mobile=true \
            --throttling-method=simulate \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --verbose 2>&1 | tee "$RUNNER_TEMP/robys-lighthouse/lighthouse.log"

      - name: Create exact-run readable summary
        env:
          AUDITED_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('lighthouse-report.report.json', 'utf8'));
          if (report.runtimeError) throw new Error(`Lighthouse runtime error: ${JSON.stringify(report.runtimeError)}`);
          for (const id of ['performance', 'accessibility', 'best-practices', 'seo']) {
            const score = report.categories?.[id]?.score;
            if (typeof score !== 'number' || !Number.isFinite(score) || score < 0 || score > 1) {
              throw new Error(`Missing or invalid Lighthouse category: ${id}`);
            }
          }
          const categories = Object.fromEntries(
            Object.entries(report.categories).map(([key, value]) => [key, Math.round(value.score * 100)])
          );
          const metricIds = [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift',
            'interactive'
          ];
          const metrics = Object.fromEntries(metricIds.map((id) => {
            const audit = report.audits[id];
            return [id, audit ? { displayValue: audit.displayValue, numericValue: audit.numericValue, score: audit.score } : null];
          }));
          const opportunities = Object.values(report.audits)
            .filter((audit) => audit && audit.details && audit.details.type === 'opportunity' && typeof audit.numericValue === 'number' && audit.score !== 1)
            .sort((a, b) => (b.numericValue || 0) - (a.numericValue || 0))
            .slice(0, 8)
            .map((audit) => ({ id: audit.id, title: audit.title, displayValue: audit.displayValue, score: audit.score }));
          const failedAudits = Object.values(report.audits)
            .filter((audit) => audit && audit.scoreDisplayMode !== 'notApplicable' && typeof audit.score === 'number' && audit.score < 0.9)
            .sort((a, b) => a.score - b.score)
            .slice(0, 15)
            .map((audit) => ({ id: audit.id, title: audit.title, score: audit.score, displayValue: audit.displayValue || null }));
          const settings = report.configSettings || {};
          const summary = {
            schema: 'robys.lighthouse.local.v2',
            generatedAt: new Date().toISOString(),
            testedCommit: process.env.AUDITED_SHA,
            sourceRunId: process.env.SOURCE_RUN_ID,
            sourceRunAttempt: process.env.SOURCE_RUN_ATTEMPT,
            lighthouseVersion: report.lighthouseVersion,
            testedUrl: report.finalDisplayedUrl,
            device: {
              formFactor: settings.formFactor || null,
              screenEmulation: settings.screenEmulation || null,
              throttlingMethod: settings.throttlingMethod || null,
              throttling: settings.throttling || null,
              locale: settings.locale || null
            },
            categories,
            metrics,
            opportunities,
            failedAudits
          };
          fs.writeFileSync('lighthouse-summary.json', JSON.stringify(summary, null, 2) + '\n');
          const lines = [
            '# Lighthouse mobile audit',
            '',
            `- Tested commit: \`${summary.testedCommit}\``,
            `- Source run: \`${summary.sourceRunId}\``,
            `- Performance: **${categories.performance}**`,
            `- Accessibility: **${categories.accessibility}**`,
            `- Best practices: **${categories['best-practices']}**`,
            `- SEO: **${categories.seo}**`
          ];
          fs.writeFileSync('lighthouse-summary.md', lines.join('\n') + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
          cat lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stop audit processes and collect server diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/robys-lighthouse"
          mkdir -p "$diagnostics"
          if test -f "$diagnostics/chrome.pid"; then
            kill "$(cat "$diagnostics/chrome.pid")" 2>/dev/null || true
          fi
          if test -f /tmp/robys-server.pid; then
            kill "$(cat /tmp/robys-server.pid)" 2>/dev/null || true
          fi
          if test -f /tmp/robys-server.log; then
            cp /tmp/robys-server.log "$diagnostics/server.log"
          fi

      - name: Upload browser startup diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/robys-lighthouse/*.log
            ${{ runner.temp }}/robys-lighthouse/devtools.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload immutable Lighthouse report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-mobile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lighthouse-report.report.html
            lighthouse-report.report.json
            lighthouse-summary.json
            lighthouse-summary.md
          if-no-files-found: error
          retention-days: 90
