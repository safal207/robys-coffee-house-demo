name: Temporary premium focus evidence hardening

on:
  push:
    branches:
      - agent/premium-depth-v1
    paths:
      - ".github/scripts/premium-focus-evidence-temp.py"
      - ".github/workflows/premium-focus-evidence-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/premium-depth-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden late-focus evidence
        run: |
          python3 .github/scripts/premium-focus-evidence-temp.py
          node --check scripts/premium-depth-smoke.mjs
      - name: Commit focus evidence hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/premium-depth-smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(motion): require effective pre-handoff focus"
          git push origin HEAD:agent/premium-depth-v1
