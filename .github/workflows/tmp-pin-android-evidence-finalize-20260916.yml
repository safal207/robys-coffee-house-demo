name: Temporary exact-head Android evidence repair finalizer

on:
  push:
    branches:
      - fix/manual-qa-polish-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/manual-qa-polish-20260915
          fetch-depth: 0
          persist-credentials: true

      - name: Reuse already-proven bounded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-pin-android-evidence-retry-20260916.yml').read_text().splitlines()
          start = workflow.index('      - name: Patch exact-head Android source boundary')
          run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name:'))
          body = []
          for line in workflow[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/exact-head-android-patch.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/exact-head-android-patch.sh

      - name: Reprove exact-head source and failure semantics
        run: |
          node scripts/verify-android-evidence-source.mjs
          CAPTURE_CASES=success,fallback,timeout,error_then_complete python3 scripts/test-android-capture-contract.py
          git diff --check

      - name: Prove exact seven-file scope including untracked files
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 | sed -E 's/^.. //' | sort > /tmp/actual.txt
          printf '%s\n' \
            .github/scripts/capture-android-launch.sh \
            .github/workflows/android-visual-smoke.yml \
            android-native/app/src/debug/AndroidManifest.xml \
            android-native/app/src/debug/res/xml/network_security_config.xml \
            android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java \
            scripts/test-android-capture-contract.py \
            scripts/verify-android-evidence-source.mjs | sort > /tmp/expected.txt
          echo 'Exact-head Android evidence diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aleksey Safonov'
          git config user.email '55020240+safal207@users.noreply.github.com'
          git add -- \
            .github/scripts/capture-android-launch.sh \
            .github/workflows/android-visual-smoke.yml \
            android-native/app/src/debug/AndroidManifest.xml \
            android-native/app/src/debug/res/xml/network_security_config.xml \
            android-native/app/src/main/java/com/robys/coffeehouse/MainActivity.java \
            scripts/test-android-capture-contract.py \
            scripts/verify-android-evidence-source.mjs
          git diff --cached --check
          git commit -m 'qa: pin Android atomic web evidence to exact head'
          git push origin HEAD:fix/manual-qa-polish-20260915
