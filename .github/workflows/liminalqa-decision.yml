name: Exact-head evidence and LiminalQA

on:
  pull_request:
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "src/**"
      - "smart-choice/**"
      - "scripts/**"
      - "qa/**"
      - "lighthouse/**"
      - "docker-compose.browser-lab.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "src/**"
      - "smart-choice/**"
      - "scripts/**"
      - "qa/**"
      - "lighthouse/**"
      - "docker-compose.browser-lab.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-head-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LIMINALQA_REVISION: 09701ec70712b300e4c66f0c4f940e159651aac5
  ROBY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  ROBY_SOURCE_RUN_ID: ${{ github.run_id }}
  ROBY_EVIDENCE_ROOT: qa/liminal-artifacts

jobs:
  measure:
    name: Lighthouse repeatability / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - name: Checkout exact Roby's head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.ROBY_TESTED_COMMIT }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Collect one warm-up and six measured observations
        run: node scripts/run-lighthouse-repeatability.mjs "${{ matrix.profile }}"

      - name: Upload profile evidence for aggregation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-repeatability-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/lighthouse-repeatability/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 7

  decision:
    name: Build and seal exact-head evidence
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Roby's head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.ROBY_TESTED_COMMIT }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Download mobile repeatability evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lighthouse-repeatability-mobile-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/lighthouse-repeatability/mobile

      - name: Download desktop repeatability evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lighthouse-repeatability-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/lighthouse-repeatability/desktop

      - name: Merge independently measured profiles
        run: node scripts/run-lighthouse-repeatability.mjs --merge

      - name: Bind evidence directory to exact head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROBY_EVIDENCE_ROOT"
          mkdir -p "$ROBY_EVIDENCE_ROOT"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$ROBY_TESTED_COMMIT"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          checked = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          requested = os.environ["ROBY_TESTED_COMMIT"]
          packet = {
              "schema": "robys.exact-head.v1",
              "requested": requested,
              "checkedOut": checked,
              "matches": requested == checked,
              "sourceRunId": os.environ["ROBY_SOURCE_RUN_ID"],
          }
          Path(os.environ["ROBY_EVIDENCE_ROOT"], "exact-head.json").write_text(
              json.dumps(packet, indent=2) + "\n",
              encoding="utf-8",
          )
          assert packet["matches"]
          PY

      - name: Verify publication boundary and security contracts
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            node scripts/verify-evidence-publication-boundary.mjs
            npm run verify:security
          } 2>&1 | tee "$ROBY_EVIDENCE_ROOT/security.log"

      - name: Verify performance contract
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          npm run verify:performance 2>&1 | tee "$ROBY_EVIDENCE_ROOT/performance.log"

      - name: Verify browser-lab ports and immutable images
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.browser-lab.yml config -q
          docker compose -f docker-compose.browser-lab.yml config --format json > /tmp/browser-lab-compose.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("/tmp/browser-lab-compose.json").read_text())
          expected_counts = {"site": 1, "chromium": 2, "firefox": 2}
          services = {}
          all_loopback = True
          all_pinned = True
          for name, expected_count in expected_counts.items():
              service = config["services"][name]
              image = service.get("image", "")
              pinned = "@sha256:" in image and ":latest" not in image
              all_pinned = all_pinned and pinned
              ports = service.get("ports", [])
              assert len(ports) == expected_count, (name, len(ports), expected_count)
              loopback = all(port.get("host_ip") == "127.0.0.1" for port in ports)
              all_loopback = all_loopback and loopback
              services[name] = {
                  "image": image,
                  "imagePinned": pinned,
                  "platform": service.get("platform"),
                  "publishedPorts": [
                      {
                          "hostIp": port.get("host_ip"),
                          "published": port.get("published"),
                          "target": port.get("target"),
                      }
                      for port in ports
                  ],
              }
          assert all_loopback
          assert all_pinned
          assert services["chromium"]["platform"] == "linux/amd64"
          assert services["firefox"]["platform"] == "linux/amd64"
          packet = {
              "schema": "robys.browser-lab-policy.v1",
              "testedCommit": os.environ["ROBY_TESTED_COMMIT"],
              "sourceRunId": os.environ["ROBY_SOURCE_RUN_ID"],
              "allLoopback": all_loopback,
              "allImagesPinned": all_pinned,
              "services": services,
          }
          Path(os.environ["ROBY_EVIDENCE_ROOT"], "compose-policy.json").write_text(
              json.dumps(packet, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Import Lighthouse evidence
        shell: bash
        run: |
          set -euo pipefail
          cp .artifacts/lighthouse-repeatability/report.json "$ROBY_EVIDENCE_ROOT/lighthouse-repeatability.json"
          cp .artifacts/lighthouse-repeatability/report.md "$ROBY_EVIDENCE_ROOT/lighthouse-repeatability.md"
          cp -R .artifacts/lighthouse-repeatability "$ROBY_EVIDENCE_ROOT/lighthouse-raw"

      - name: Generate current-run LiminalQA signals
        run: node scripts/build-liminalqa-signals.mjs

      - name: Checkout pinned LiminalQA engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: safal207/LiminalQAengineer
          ref: ${{ env.LIMINALQA_REVISION }}
          path: liminalqa
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustc +1.88.0 --version
          cargo +1.88.0 --version

      - name: Test pinned LiminalQA core
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo +1.88.0 test -p liminalqa-core --manifest-path liminalqa/Cargo.toml 2>&1 \
            | tee "$ROBY_EVIDENCE_ROOT/liminalqa-core-tests.log"

      - name: Build exact-evidence decision adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adapter/src
          cp qa/liminal/decision_adapter.rs adapter/src/main.rs
          cat > adapter/Cargo.toml <<'TOML'
          [package]
          name = "robys-liminalqa-adapter"
          version = "0.2.0"
          edition = "2021"

          [dependencies]
          liminalqa-core = { path = "../liminalqa/liminalqa-core" }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          sha2 = "0.10"
          TOML
          set -o pipefail
          cargo +1.88.0 build --manifest-path adapter/Cargo.toml 2>&1 \
            | tee "$ROBY_EVIDENCE_ROOT/adapter-build.log"

      - name: Generate advisory LiminalQA decision
        run: |
          adapter/target/debug/robys-liminalqa-adapter \
            "$ROBY_EVIDENCE_ROOT/input-signals.json" \
            "$ROBY_EVIDENCE_ROOT"

      - name: Seal evidence bundle with producer self-check
        run: node scripts/seal-liminalqa-evidence.mjs "$ROBY_EVIDENCE_ROOT"

      - name: Upload sealed evidence candidate before policy gating
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-evidence-candidate-${{ env.ROBY_TESTED_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/liminal-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Publish producer reports to workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$ROBY_EVIDENCE_ROOT/lighthouse-repeatability.md" ]]; then
            cat "$ROBY_EVIDENCE_ROOT/lighthouse-repeatability.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$ROBY_EVIDENCE_ROOT/decision.md" ]]; then
            cat "$ROBY_EVIDENCE_ROOT/decision.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Enforce producer structural invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROBY_EVIDENCE_ROOT"])
          packet = json.loads((root / "decision.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          assert packet["schema"] == "robys.liminalqa.decision.v2"
          assert packet["input_schema"] == "robys.liminalqa.input.v2"
          assert packet["tested_commit"] == os.environ["ROBY_TESTED_COMMIT"]
          assert packet["source_run_id"] == os.environ["ROBY_SOURCE_RUN_ID"]
          assert packet["source_revision"] == os.environ["LIMINALQA_REVISION"]
          assert all(item["verified"] for item in packet["evidence"])
          assert isinstance(packet["suite_decision"]["merge_policy"], str)
          assert packet["suite_decision"]["merge_policy"].strip()
          assert isinstance(packet["suite_decision"]["block_reason"], str)
          assert manifest["testedCommit"] == os.environ["ROBY_TESTED_COMMIT"]
          assert manifest["sourceRunId"] == os.environ["ROBY_SOURCE_RUN_ID"]
          assert not (root / "verification.json").exists()
          assert not (root / "evidence-quality.json").exists()
          print("Producer decision and seal are structurally consistent")
          PY

  verify:
    name: Verify sealed evidence on fresh runner
    needs: decision
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Roby's head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.ROBY_TESTED_COMMIT }}
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download sealed producer candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sealed-evidence-candidate-${{ env.ROBY_TESTED_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/liminal-artifacts

      - name: Recompute and verify evidence on fresh runner
        run: node scripts/verify-liminalqa-evidence.mjs "$ROBY_EVIDENCE_ROOT"

      - name: Build deterministic evidence archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/final
          archive=".artifacts/final/exact-head-evidence-${ROBY_TESTED_COMMIT}-${ROBY_SOURCE_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$ROBY_EVIDENCE_ROOT" -cf - . | gzip -n > "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish verifier report to workflow summary
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '# Fresh-runner evidence verification\n\n'
            printf '```json\n'
            cat "$ROBY_EVIDENCE_ROOT/verification.json"
            printf '```\n\n'
            printf '```json\n'
            cat "$ROBY_EVIDENCE_ROOT/evidence-quality.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified immutable exact-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-head-evidence-${{ env.ROBY_TESTED_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/liminal-artifacts/
            .artifacts/final/*.tar.gz
            .artifacts/final/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Enforce verified release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROBY_EVIDENCE_ROOT"])
          verification = json.loads((root / "verification.json").read_text())
          quality = json.loads((root / "evidence-quality.json").read_text())
          assert verification["verified"] is True
          assert quality["overall"] == "pass"
          if verification["releaseGatePassed"] is not True:
              raise SystemExit(
                  "Release blocked after evidence was preserved: "
                  f"policy={verification['observedPolicy']}, "
                  f"lighthouse={verification['observedLighthouseVerdict']}"
              )
          assert quality["releaseGate"] == "pass"
          print("Verified evidence permits the release gate")
          PY
