name: PR341 pinned final-gate analysis
on:
  push:
    branches: [qa/pr341-final-gates-20260906]
    paths: [.github/workflows/qa-pr341-final-gates.yml]
permissions:
  contents: write
jobs:
  inspect:
    if: github.repository == 'safal207/robys-coffee-house-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: current
    steps:
      - name: Checkout exact current PR including focus repair
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7bae774cfffbaeb7f997c6ad7453142d294876f1
          path: current
          persist-credentials: false
      - name: Checkout previously tested source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8c712406b3779a5bf9dbaba4fba2e55dbc0305d6
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only the three exact reviewed source files
        run: |
          mkdir -p .artifacts/home-copy-candidate
          test "$(git rev-parse HEAD)" = 7bae774cfffbaeb7f997c6ad7453142d294876f1
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected={
            'src/i18n.ts':'47f0b8e2cdea74fe6456d0e48c564252e551a96dcea97f7e7b2f3b3d7bea8265',
            'scripts/test-home-copy.mjs':'4fa90a07776cdfbafe155a14c477b2e8dad8e7d3984f95f06ab81c79657819c1',
            'scripts/home-copy-browser.mjs':'bce56dc3a52d8d40c3cab71cf852b1e82d8582c98fd11734832b1f024f60f65b'
          };
          for(const [file,digest] of Object.entries(expected)) {
            const bytes=readFileSync('../source/'+file);
            assert.equal(createHash('sha256').update(bytes).digest('hex'),digest,file);
            writeFileSync(file,bytes);
          }
          const pack=JSON.parse(readFileSync('package.json','utf8'));
          assert.ok(!pack.scripts['test:home-copy']);
          pack.scripts['test:home-copy']='node --test scripts/test-home-copy.mjs';
          pack.scripts.check+=' && npm run test:home-copy';
          writeFileSync('package.json',JSON.stringify(pack,null,2)+'\n');
          JS
      - run: npm ci --no-audit --no-fund
      - name: Rebuild and verify complete product source
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee .artifacts/home-copy-candidate/build.log
          npm run integrity:generate 2>&1 | tee .artifacts/home-copy-candidate/integrity.log
          npm run check 2>&1 | tee .artifacts/home-copy-candidate/check.log
          npm run verify:security 2>&1 | tee .artifacts/home-copy-candidate/security.log
          git diff --check
      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser translation parity
        env:
          HOME_COPY_RESULTS_DIR: .artifacts/home-copy-candidate/translations
        run: node scripts/home-copy-browser.mjs
      - name: Real guest journeys and current focus/hero checks
        run: |
          MENU_DEMAND_RESULTS_DIR=.artifacts/home-copy-candidate/demand node scripts/menu-demand-browser.mjs
          ORDER_RESULTS_DIR=.artifacts/home-copy-candidate/journeys node scripts/unified-order-browser.mjs
          ORDER_LAYOUT_RESULTS_DIR=.artifacts/home-copy-candidate/layout node scripts/order-layout-regression.mjs
          HERO_RESULTS_DIR=.artifacts/home-copy-candidate/hero-negative node scripts/order-hero-regression.mjs --negative-control
          HERO_RESULTS_DIR=.artifacts/home-copy-candidate/hero node scripts/order-hero-regression.mjs
      - name: Store tested runtime as detached commit only
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const owner=context.repo.owner,repo=context.repo.repo;
            const parent='7bae774cfffbaeb7f997c6ad7453142d294876f1';
            const live=await github.rest.git.getRef({owner,repo,ref:'heads/feat/unified-order-flow'});
            if(live.data.object.sha!==parent)throw new Error('PR head moved; refuse stale integration');
            const files=['src/i18n.ts','scripts/test-home-copy.mjs','scripts/home-copy-browser.mjs','package.json','app.js','index.html','integrity-manifest.json'];
            const fixed={
              'src/i18n.ts':'47f0b8e2cdea74fe6456d0e48c564252e551a96dcea97f7e7b2f3b3d7bea8265',
              'scripts/test-home-copy.mjs':'4fa90a07776cdfbafe155a14c477b2e8dad8e7d3984f95f06ab81c79657819c1',
              'scripts/home-copy-browser.mjs':'bce56dc3a52d8d40c3cab71cf852b1e82d8582c98fd11734832b1f024f60f65b',
              'app.js':'0a634c2a1ee405e419521de8ba532238e581cb9de155c3c8f85aa7d7fdac5603'
            };
            const hash=file=>crypto.createHash('sha256').update(fs.readFileSync('current/'+file)).digest('hex');
            for(const [file,wanted] of Object.entries(fixed))if(hash(file)!==wanted)throw new Error('Candidate bytes differ: '+file);
            const changed=cp.execFileSync('git',['diff','--name-only'],{cwd:'current',encoding:'utf8'}).trim().split('\n');
            for(const file of changed)if(!files.includes(file))throw new Error('Unexpected product change: '+file);
            const base=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const tree=await github.rest.git.createTree({owner,repo,base_tree:base.data.tree.sha,tree:files.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync('current/'+path,'utf8')}))});
            const commit=await github.rest.git.createCommit({owner,repo,message:'perf(home): remove retired translation payload with live-copy parity tests',tree:tree.data.sha,parents:[parent]});
            const evidence={workflowHead:context.sha,inputHead:parent,parent,candidate:commit.data.sha,tree:tree.data.sha,files:Object.fromEntries(files.map(file=>[file,hash(file)])),refUpdated:false,scope:'Full build and bounded browser tests; not Lighthouse or release approval'};
            fs.writeFileSync('current/.artifacts/home-copy-candidate/candidate.json',JSON.stringify(evidence,null,2));
            for(const file of files){const target='current/.artifacts/home-copy-candidate/files/'+file;fs.mkdirSync(require('path').dirname(target),{recursive:true});fs.copyFileSync('current/'+file,target);}
            core.info('Detached tested candidate '+commit.data.sha+'; branch unchanged');
      - name: Preserve input and patch on success or failure
        if: always()
        run: |
          mkdir -p .artifacts/home-copy-candidate
          git rev-parse HEAD > .artifacts/home-copy-candidate/HEAD.txt
          git diff -- src/i18n.ts package.json app.js index.html integrity-manifest.json > .artifacts/home-copy-candidate/candidate.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr341-home-copy-candidate-${{ github.sha }}
          path: current/.artifacts/home-copy-candidate/
          retention-days: 7
          if-no-files-found: error
