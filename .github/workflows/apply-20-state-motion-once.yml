name: Apply 20-state motion once

on:
  push:
    branches:
      - agent/motion-entry-20-state
    paths:
      - .github/workflows/apply-20-state-motion-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/motion-entry-20-state
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic transform
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/apply-motion.py
          python3 /tmp/apply-motion.py
          node --check morning-entry.js
          node --check scripts/morning-entry-smoke.mjs
          node scripts/generate-integrity-manifest.mjs
          git diff --check
      - name: Commit 20-state choreography
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morning-entry.js scripts/morning-entry-smoke.mjs integrity-manifest.json
          git commit -m "feat(motion): add 20-state spline choreography"
          git push origin HEAD:agent/motion-entry-20-state
