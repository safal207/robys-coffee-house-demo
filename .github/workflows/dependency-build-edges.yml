name: Dependency build-edge contract

on:
  pull_request:
    paths:
      - scripts/audit-dependencies.mjs
      - scripts/test-audit-dependencies.mjs
      - scripts/build.mjs
      - scripts/menu-runtime-source.mjs
      - src/conversion.js
      - src/menu-app.js
      - .github/workflows/dependency-build-edges.yml
  push:
    branches: [fix/source-first-dependency-edges]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove real orphan failures are preserved
        run: node scripts/test-audit-dependencies.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run verify:security
      - name: Audit actual repository and reject stale build output
        run: |
          node scripts/audit-dependencies.mjs --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-build-edges-${{ github.sha }}
          path: .artifacts/dependency-graph.json
          retention-days: 7
          if-no-files-found: warn
