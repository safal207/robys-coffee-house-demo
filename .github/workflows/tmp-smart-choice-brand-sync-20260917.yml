name: Temporary Smart Choice brand sync

on:
  push:
    branches:
      - tmp/pr403-main-merge-probe-20260917

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync restored approved identity revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "20260726-approved-v4"
          new = "20260917-approved-v4-restore"
          files = [
              Path("scripts/verify-smart-choice-release.mjs"),
              Path("smart-choice/brand-v4.css"),
              Path("smart-choice/index.html"),
              Path("smart-choice/simulator.html"),
          ]
          changed = []
          for path in files:
              text = path.read_text()
              if old in text:
                  text = text.replace(old, new)
                  changed.append(str(path))
              if path.name in {"index.html", "simulator.html"}:
                  text = text.replace("brand-v4.css?v=20260728-1", f"brand-v4.css?v={new}")
              path.write_text(text)

          assert sorted(changed) == sorted(str(p) for p in files), changed
          verifier = Path("scripts/verify-smart-choice-release.mjs").read_text()
          adapter = Path("smart-choice/brand-v4.css").read_text()
          client = Path("smart-choice/index.html").read_text()
          simulator = Path("smart-choice/simulator.html").read_text()
          for text in (verifier, adapter, client, simulator):
              assert old not in text
              assert new in text
          assert f"brand-v4.css?v={new}" in client
          assert f"brand-v4.css?v={new}" in simulator
          PY
          git rm .github/workflows/tmp-smart-choice-brand-sync-20260917.yml
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf 'changed=%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-smart-choice-release.mjs smart-choice/brand-v4.css smart-choice/index.html smart-choice/simulator.html
          git commit -m "Sync Smart Choice restored brand revision"
          git push origin HEAD:tmp/pr403-main-merge-probe-20260917
