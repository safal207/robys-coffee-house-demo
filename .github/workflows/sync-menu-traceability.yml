name: Sync menu source traceability

on:
  push:
    branches:
      - agent/fix-menu-truth-and-journeys
    paths:
      - ".github/workflows/sync-menu-traceability.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-menu-truth-and-journeys
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point feature evidence at readable source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('qa/traceability/ui-ux.json')
          text = path.read_text()
          text = text.replace('menu-page.js#renderMenu', 'src/menu-page-runtime.js#renderMenu')
          text = text.replace('menu-page.js#setLanguage', 'src/menu-page-runtime.js#setLanguage')
          path.write_text(text)
          PY
          npm run integrity:generate
      - name: Commit traceability and manifest
        run: |
          git add qa/traceability/ui-ux.json integrity-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: point menu traceability at readable source"
          git push origin HEAD:agent/fix-menu-truth-and-journeys
