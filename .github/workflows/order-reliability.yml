name: Order reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-navigation:
    name: Home menu and keyboard (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      ROBYS_HOME_QA_ENGINES: ${{ matrix.browser }}
      ROBYS_HOME_NAV_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run verify:integrity && git diff --exit-code
      - run: node scripts/ensure-playwright-browsers.mjs ${{ matrix.browser }}
      - name: Returning visitor navigation asset revisions
        run: node --test scripts/test-home-navigation-cache.mjs
      - name: Home menu text at breakpoints and increased text size
        run: node scripts/test-home-menu-responsive-browser.mjs
      - name: Home navigation keyboard, resize and native destinations
        run: node scripts/test-home-navigation-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-navigation-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14

  order-reliability:
    name: Order integrity (${{ matrix.browser }})
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15-intel' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # Playwright 1.55.1 DebugLogger names native process logs pw:browser.
      DEBUG: ${{ matrix.browser == 'webkit' && 'pw:browser' || '' }}
      ROBYS_FAMILY_BROWSER: ${{ matrix.browser }}
      ROBYS_FAMILY_QA_DIR: .artifacts/order-reliability/family
      ROBYS_PROMO_BROWSER: ${{ matrix.browser }}
      ROBYS_PROMO_QA_DIR: .artifacts/order-reliability/promo
      ROBYS_TRANSACTION_BROWSER: ${{ matrix.browser }}
      ROBYS_TRANSACTION_QA_DIR: .artifacts/order-reliability/transactions
      CHECKOUT_BROWSERS: ${{ matrix.browser }}
      ROBYS_RELEASE_BUILT_BROWSERS: ${{ matrix.browser }}
      ROBYS_STORAGE_BROWSER: ${{ matrix.browser }}
      ROBYS_LAZY_BROWSER: ${{ matrix.browser }}
      ROBYS_LAZY_QA_DIR: .artifacts/order-reliability/lazy-images
      ROBYS_PAIRING_BROWSER: ${{ matrix.browser }}
      ROBYS_PAIRING_QA_DIR: .artifacts/order-reliability/pairing-price
      ROBYS_COMBO_BROWSERS: ${{ matrix.browser }}
      ROBYS_COMBO_QA_DIR: .artifacts/order-reliability/combos
      ROBYS_OFFER_BROWSERS: ${{ matrix.browser }}
      ROBYS_QUICK_BUILDER_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.browser == 'webkit' && '22.23.3' || '22' }}
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${{ matrix.browser == 'webkit' && '1' || '' }}
      - name: Verify native crash report collection
        if: matrix.browser == 'webkit'
        run: node --test scripts/test-macos-webkit-crashes.mjs
      - run: npm run build && npm run verify:integrity && git diff --exit-code
      - if: matrix.browser != 'webkit'
        run: node scripts/ensure-playwright-browsers.mjs ${{ matrix.browser }}
      - name: Install and validate the locked native WebKit
        if: matrix.browser == 'webkit'
        run: npx --no-install playwright install webkit
      - name: Bind native macOS WebKit and its locked executable
        if: matrix.browser == 'webkit'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, accessSync, constants, mkdirSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { webkit } from 'playwright';
          const pkg = JSON.parse(readFileSync('node_modules/playwright-core/package.json', 'utf8'));
          const browser = JSON.parse(readFileSync('node_modules/playwright-core/browsers.json', 'utf8')).browsers.find(item => item.name === 'webkit');
          const executablePath = webkit.executablePath();
          const osVersion = execFileSync('sw_vers', ['-productVersion'], { encoding: 'utf8' }).trim();
          if (process.version !== 'v22.23.3' || process.platform !== 'darwin' || process.arch !== 'x64'
            || !osVersion.startsWith('15.') || pkg.version !== '1.55.1' || browser?.revision !== '2203'
            || !executablePath.includes('/webkit-2203/')) throw new Error('Canonical WebKit toolchain differs from the declared native macOS environment');
          accessSync(executablePath, constants.X_OK);
          const metadata = { declaredRunner: 'macos-15-intel', osVersion,
            runnerImage: process.env.ImageVersion ?? null, architecture: process.arch,
            node: process.version, playwright: pkg.version, webkit: browser, executablePath,
            diagnosticsStartedAt: new Date().toISOString(),
            launcherSHA256: createHash('sha256').update(readFileSync(executablePath)).digest('hex') };
          mkdirSync('.artifacts/order-reliability', { recursive: true });
          writeFileSync('.artifacts/order-reliability/webkit-environment.json', JSON.stringify(metadata, null, 2) + '\n');
          console.log(JSON.stringify(metadata, null, 2));
          NODE
      - name: Built menu photo visibility and recovery
        run: node scripts/test-menu-lazy-images-browser.mjs
      - name: Pairing prices at increased text size
        run: node scripts/test-pairing-price-browser.mjs
      - name: Family loading, contents and photographs
        run: node scripts/test-menu-family-browser.mjs
      - name: Editable combos, all views and gentle choice help
        run: node scripts/test-menu-combos-browser.mjs
      - name: Menu feed selection, shared cart and counter QR
        run: node scripts/test-menu-feed-browser.mjs
      - name: Contextual offer cards and exact recipe navigation
        run: node scripts/test-combo-offer-cards-browser.mjs
      - name: Quick builder touch position, cancellation and saved selection
        run: node scripts/test-quick-builder-scroll-browser.mjs
      - name: Recommendation cart keyboard focus and asynchronous updates
        run: node scripts/test-smart-choice-cart-focus-browser.mjs
      - name: First offline combo reveal and missing-photo negative control
        if: matrix.browser == 'chromium'
        run: node scripts/test-combo-offline.mjs
      - name: Editable promotional pairs
        run: node scripts/test-promo-components-browser.mjs
      - name: Concurrent cart mutations and storage recovery
        run: node scripts/test-order-transactions-stress-browser.mjs
      - name: Immutable QR and explicit refresh
        run: node scripts/test-order-checkout-staleness-browser.mjs
      - name: Unavailable storage and legacy tab recovery
        run: node scripts/test-order-storage-compat-browser.mjs
      - name: Built release QR, cashier and concurrent native Add
        run: node scripts/test-order-release-built-browser.mjs
      - name: Mobile order navigation
        if: matrix.browser == 'chromium'
        run: node scripts/test-mobile-navigation-browser.mjs
      - name: Collect candidate Playwright crash summaries
        if: failure() && matrix.browser == 'webkit'
        run: node scripts/collect-macos-webkit-crashes.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-reliability-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14

  # This diagnostic changes the whole user-space toolchain, not one isolated library.
  webkit-supported-toolchain-control:
    name: WebKit official user-space control (diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    container:
      # Official v1.55.1-noble linux/amd64 manifest, verified directly from public MCR.
      image: mcr.microsoft.com/playwright@sha256:d8e0bdf35da90942fc8f97a65fa7f1969200ccd916ec0fd78780d80d9b81e07b
    env:
      ROBYS_LAZY_BROWSER: webkit
      ROBYS_LAZY_QA_DIR: .artifacts/webkit-supported-toolchain-control
      ROBYS_BROWSER_STARTUP_DIAGNOSTICS: '1'
      ROBYS_NATIVE_STACKS: '1'
      ROBYS_CONTROL_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Trust this container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the locked project dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Install the signed native-signal tracer and debugger
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { installSignedUbuntuPackages } from './scripts/signed-ubuntu-packages.mjs';
          if (process.getuid() !== 0) throw new Error('The declared official container must retain its existing root user');
          installSignedUbuntuPackages(['strace', 'gdb'], { run(command, args) {
            // The official image is already root and need not contain sudo.
            // Keep the installer's signed sources, isolated state and bounds.
            if (command !== 'sudo' || args[0] !== '-n' || args[1] !== 'env') throw new Error('Unexpected package command');
            return spawnSync('env', args.slice(2), { stdio: 'inherit' });
          } });
          NODE
      - name: Record the bound image, browser and resource metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, mkdirSync, statfsSync, accessSync, constants } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { resolve } from 'node:path';
          import { release } from 'node:os';
          import { webkit } from 'playwright';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const optional = path => { try { return readFileSync(path, 'utf8').trim(); } catch { return null; } };
          const head = git('rev-parse', 'HEAD');
          if (!/^[0-9a-f]{40}$/.test(process.env.ROBYS_CONTROL_EXPECTED_HEAD ?? '') || head !== process.env.ROBYS_CONTROL_EXPECTED_HEAD) throw new Error('Control checkout does not match the requested head');
          if (git('status', '--porcelain')) throw new Error('Control checkout is not clean');
          const pkg = JSON.parse(readFileSync('node_modules/playwright-core/package.json', 'utf8'));
          const browser = JSON.parse(readFileSync('node_modules/playwright-core/browsers.json', 'utf8')).browsers.find(item => item.name === 'webkit');
          const marker = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          if (process.version !== 'v22.23.3' || pkg.version !== '1.55.1' || browser?.revision !== '2203' || marker.driverVersion !== '1.55.1' || marker.dockerImageName !== 'mcr.microsoft.com/playwright:v1.55.1-noble') throw new Error('Control toolchain differs from the declared versions');
          const executablePath = webkit.executablePath();
          accessSync(executablePath, constants.X_OK);
          const shm = statfsSync('/dev/shm');
          const memory = Object.fromEntries((optional('/proc/meminfo') ?? '').split('\n').filter(line => /^(MemTotal|MemAvailable|SwapTotal|SwapFree):/.test(line)).map(line => line.split(':').map(part => part.trim())));
          const libraries = spawnSync('dpkg-query', ['-W', '-f=${binary:Package}\t${Version}\n', 'libglib2.0-0t64', 'libgl1-mesa-dri', 'libgbm1', 'libegl-mesa0', 'strace', 'gdb'], { encoding: 'utf8' });
          const output = resolve(process.env.ROBYS_LAZY_QA_DIR);
          mkdirSync(output, { recursive: true });
          const metadata = {
            observedAt: new Date().toISOString(), diagnosticScope: 'whole user-space toolchain; does not replace the canonical host gate',
            source: { head, tree: git('rev-parse', 'HEAD^{tree}') },
            declaredImage: 'mcr.microsoft.com/playwright@sha256:d8e0bdf35da90942fc8f97a65fa7f1969200ccd916ec0fd78780d80d9b81e07b', imageMarker: marker,
            node: process.version, npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), kernel: release(), uid: process.getuid(),
            playwright: pkg.version, webkit: browser, executablePath, launcherSHA256: createHash('sha256').update(readFileSync(executablePath)).digest('hex'),
            shm: { totalBytes: shm.bsize * shm.blocks, availableBytes: shm.bsize * shm.bavail }, memory,
            cgroup: Object.fromEntries(['memory.max', 'memory.current', 'memory.events', 'memory.swap.max', 'pids.max'].map(name => [name, optional('/sys/fs/cgroup/' + name)])),
            libraries: { status: libraries.status, versions: libraries.stdout?.trim() ?? '', error: libraries.error?.message ?? null }
          };
          writeFileSync(resolve(output, 'environment.json'), JSON.stringify(metadata, null, 2) + '\n');
          console.log(JSON.stringify(metadata, null, 2));
          NODE
      - name: Observe the canonical WebKit suite and separate crash controls
        run: node scripts/run-menu-lazy-images-diagnostics.mjs
      - name: Verify the native observer with handled and fatal child signals
        if: always()
        env:
          ROBYS_REQUIRE_NATIVE_STACKS: '1'
        run: node --test scripts/test-browser-native-stacks.mjs
      - name: Preserve the diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-supported-toolchain-control-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: .artifacts/webkit-supported-toolchain-control/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
