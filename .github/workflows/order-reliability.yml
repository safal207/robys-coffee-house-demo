name: WebKit media diagnostic

on:
  pull_request:
    branches: [feat/family-combo-video-20261019]

permissions:
  contents: read

jobs:
  diagnose:
    name: WebKit media diagnosis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps webkit
      - name: Native protocol, source selection and interception probe
        run: node scripts/webkit-media-diagnostic.mjs
        env:
          PROBE_REPORT_DIR: .artifacts/native-probe
          PROBE_FEATURE_HEAD: f8f1c1e9fb0f17386f06ade15e45105cc9f09210
      - name: Unchanged family-video regression
        run: node scripts/test-combo-offer-cards-browser.mjs
        env:
          ROBYS_OFFER_BROWSERS: webkit
          ROBYS_OFFER_FILTER: video
          ROBYS_OFFER_QA_DIR: .artifacts/actual-media
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-media-diagnostic-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
