name: PR515 on-demand pairing build sync
on:
  push:
    branches: [feat/taste-memory-social-20261120]
    paths: [.github/workflows/pr515-pairing-on-demand-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run integrity:generate
      - run: node scripts/ensure-lighthouse-ffprobe.mjs
      - run: npm run check
      - run: node --test scripts/test-performance-delivery-regression.mjs
      - run: node scripts/test-hero-playback.mjs
      - run: node scripts/verify-p1-interface-contracts.mjs
      - run: node scripts/verify-regression-contracts.mjs
      - run: node -e "const fs=require('node:fs');for(const f of ['pairing-posters.js','pairing-discovery.js']) console.log('CHUNK BYTES:',f,fs.statSync(f).size)"
      - name: Commit generated assets and remove temporary workflow
        run: |
          git rm .github/workflows/pr515-pairing-on-demand-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync on-demand pairing story runtime'
          git push origin HEAD:feat/taste-memory-social-20261120
