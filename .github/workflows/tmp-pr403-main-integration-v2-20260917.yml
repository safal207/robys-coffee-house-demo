name: Temporary PR403 main integration v2

on:
  push:
    branches:
      - tmp/pr403-main-merge-probe-20260917

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge exact main and prove two-file conflict boundary
        shell: bash
        run: |
          set -euo pipefail
          expected_main="2c21d63066d2d610df6b856f032c569d57d7544d"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected_main"
          set +e
          git merge --no-commit --no-ff "$expected_main"
          status=$?
          set -e
          test "$status" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          printf 'conflict=%s\n' "${conflicts[@]}"
          test "${#conflicts[@]}" -eq 2
          test "${conflicts[0]}" = "scripts/verify-android-download.mjs"
          test "${conflicts[1]}" = "sw.js"

      - name: Resolve conflicts as bounded union
        shell: bash
        run: |
          set -euo pipefail
          git checkout --ours scripts/verify-android-download.mjs sw.js
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('scripts/verify-android-download.mjs')
          text = verifier.read_text()
          old_sw = 'const sw = readFileSync("sw.js", "utf8") + "\\n" + readFileSync("sw-core-v64.js", "utf8");'
          new_sw = 'const swWrapper = readFileSync("sw.js", "utf8");\nconst swCore = readFileSync("sw-core-v64.js", "utf8");\nconst sw = `${swWrapper}\\n${swCore}`;'
          assert old_sw in text
          text = text.replace(old_sw, new_sw, 1)

          anchor = 'assert(bootstrap.includes("placeholder.replaceWith(logo)"), "Legacy CSS Android icon is not replaced by the real logo");\n'
          addition = '''assert(conversionSource.includes('section.className = "android-app-section"') && conversionSource.includes("visit.before(section)"), "Conversion source must create the Android promo next to the visit section");
          assert(mobileInstall.includes("visit.after(section)"), "Mobile install runtime must define the final visit → Android ordering");
          '''
          assert anchor in text
          text = text.replace(anchor, anchor + addition, 1)

          anchor = 'assert(css.includes(".android-app-screen-pill img"), "Android logo styling is missing");\n'
          addition = '''assert(css.includes("MOBILE-HERO-001"), "Android promo mobile rendering contract marker is missing");
          assert(css.includes(".visit-section:has(+ .android-app-section){padding-bottom:0}"), "Phone layout must remove the final visit → Android white gap");
          assert(!css.includes(".menu-section{padding-bottom:24px}"), "Android spacing must not compress the unrelated menu section");
          assert(css.includes(".android-app-section::after{display:none;mask-image:none;-webkit-mask-image:none}"), "Mobile Android promo must disable the masked compositor layer");
          assert(css.includes("background:#2a1d1b;backdrop-filter:none;-webkit-backdrop-filter:none"), "Mobile Android promo card must avoid backdrop-filter compositor artifacts");
          assert(css.includes(".android-app-screen-brand .android-app-screen-mark{width:158px;height:74px"), "Approved Roby's lockup must keep the enlarged in-phone presentation");
          '''
          assert anchor in text
          text = text.replace(anchor, anchor + addition, 1)

          anchor = 'assert(!sw.includes("./downloads/android-v1.2/part-"), "Service worker install must not precache the 1 MB APK payload");\n'
          addition = '''assert(swWrapper.includes('importScripts("./sw-core-v64.js")'), "Service worker wrapper must load the revisioned core");
          assert(swWrapper.includes('path.endsWith("/android-app.css")'), "Service worker activation must purge stale Android promo CSS");
          assert(swWrapper.includes('path.endsWith("/mobile-install.js")') && swWrapper.includes('path.endsWith("/mobile-install.css")'), "Service worker activation must purge stale mobile install runtime assets");
          assert(swWrapper.includes('path.endsWith("/community-reel.css")'), "Service worker activation must purge stale community reel CSS");
          assert(swCore.includes("runtimeAssetResponse") && swCore.includes("cache.put(request, network.clone())"), "APK parts must remain eligible for runtime caching after explicit requests");
          '''
          assert anchor in text
          text = text.replace(anchor, anchor + addition, 1)
          verifier.write_text(text)

          sw = Path('sw.js')
          text = sw.read_text()
          anchor = 'path.endsWith("/community-reel.css") ||\n                    path.endsWith(PAIRING_PREVIEW_PATH);'
          replacement = '''path.endsWith("/community-reel.css") ||
                    path.endsWith("/android-app.css") ||
                    path.endsWith("/mobile-install.js") ||
                    path.endsWith("/mobile-install.css") ||
                    path.endsWith(PAIRING_PREVIEW_PATH);'''
          assert anchor in text
          sw.write_text(text.replace(anchor, replacement, 1))
          PY
          git add scripts/verify-android-download.mjs sw.js
          test -z "$(git diff --name-only --diff-filter=U)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild and verify merged tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run integrity:generate
          npm run check
          npm run verify:security
          node scripts/verify-android-evidence-source.mjs
          python3 scripts/test-android-capture-contract.py
          git diff --check

      - name: Commit and push verified merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge current main into manual QA repair"
          git push origin HEAD:tmp/pr403-main-merge-probe-20260917
