name: Cinematic final P2 validation v2

on:
  push:
    branches:
      - feature/cinematic-experience

permissions:
  contents: write

concurrency:
  group: cinematic-final-p2-validation-v2
  cancel-in-progress: true

jobs:
  patch-validate-commit:
    if: github.event.head_commit.message == 'Run final cinematic P2 validation v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/cinematic-experience

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply final P2 fixes
        run: python3 scripts/patch-cinematic-final-p2.py

      - name: Verify syntax before build
        run: |
          node --check experience/experience-pwa.js
          node --check scripts/run-lighthouse-repeatability.mjs
          node --check scripts/build-liminalqa-signals.mjs

      - name: Build revisioned outputs
        run: npm run build

      - name: Refresh integrity manifest
        run: npm run integrity:generate

      - name: Verify security contracts
        run: npm run verify:security

      - name: Run complete repository check
        run: npm run check

      - name: Verify repeatability configs include both routes
        run: |
          node - <<'NODE'
          for (const profile of ['mobile', 'desktop']) {
            const config = require(`./lighthouse/lighthouserc.repeatability.${profile}.cjs`);
            const urls = config.ci.collect.url;
            if (!urls.includes('http://localhost/index.html?entry=off')) throw new Error(`${profile}: home URL missing`);
            if (!urls.includes('http://localhost/experience/')) throw new Error(`${profile}: experience URL missing`);
            if (config.ci.collect.numberOfRuns !== 7) throw new Error(`${profile}: repeatability run count changed`);
          }
          console.log('Repeatability configs cover home + experience for mobile and desktop.');
          NODE

      - name: Install Chromium for targeted PWA smoke
        run: npx playwright install chromium

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/robys-http.log 2>&1 &
          echo $! >/tmp/robys-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/experience/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/robys-http.log
          exit 1

      - name: Verify first-visit root service worker and offline experience
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ serviceWorkers: 'allow' });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(String(error)));
          page.on('console', (message) => {
            if (message.type() === 'error') errors.push(message.text());
          });

          await page.goto('http://127.0.0.1:4173/experience/', { waitUntil: 'networkidle' });
          const registration = await page.evaluate(async () => {
            const ready = await navigator.serviceWorker.ready;
            return {
              scope: ready.scope,
              scriptURL: ready.active?.scriptURL ?? ready.waiting?.scriptURL ?? ready.installing?.scriptURL ?? ''
            };
          });
          assert.equal(new URL(registration.scope).pathname, '/', 'experience must request root service-worker scope');
          assert.equal(new URL(registration.scriptURL).pathname, '/sw.js', 'experience must register root sw.js');
          await page.waitForFunction(() => Boolean(navigator.serviceWorker.controller), null, { timeout: 15000 });

          await context.setOffline(true);
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.waitForSelector('[data-cinematic-experience]');
          const imageState = await page.evaluate(() => Array.from(document.querySelectorAll('.pairing-card img')).map((image) => ({ complete: image.complete, naturalWidth: image.naturalWidth })));
          assert.equal(imageState.length, 2, 'pairing images missing');
          for (const image of imageState) {
            assert.equal(image.complete, true, 'pairing image did not complete offline');
            assert.ok(image.naturalWidth > 0, 'pairing image missing from offline cache');
          }
          assert.deepEqual(errors, [], `browser errors: ${errors.join(' | ')}`);
          await browser.close();
          console.log('Experience first-visit PWA registration + offline reload PASS.');
          NODE

      - name: Enforce changed-file allowlist
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'experience/experience-pwa.js',
              'experience/index.html',
              'sw.js',
              'scripts/build.mjs',
              'scripts/verify-security-contracts.mjs',
              'scripts/run-lighthouse-repeatability.mjs',
              'scripts/build-liminalqa-signals.mjs',
              'lighthouse/lighthouserc.repeatability.mobile.cjs',
              'lighthouse/lighthouserc.repeatability.desktop.cjs',
              'integrity-manifest.json',
          }
          changed = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          changed_paths = {line[3:] for line in changed}
          unexpected = sorted(changed_paths - allowed)
          required = {'experience/experience-pwa.js', 'experience/index.html', 'sw.js', 'scripts/run-lighthouse-repeatability.mjs'}
          missing = sorted(required - changed_paths)
          if unexpected:
              raise SystemExit(f'unexpected changed files: {unexpected}')
          if missing:
              raise SystemExit(f'expected changed files missing: {missing}')
          print('Allowed changed files:', *sorted(changed_paths), sep='\n- ')
          PY

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experience/experience-pwa.js \
            experience/index.html \
            sw.js \
            scripts/build.mjs \
            scripts/verify-security-contracts.mjs \
            scripts/run-lighthouse-repeatability.mjs \
            scripts/build-liminalqa-signals.mjs \
            lighthouse/lighthouserc.repeatability.mobile.cjs \
            lighthouse/lighthouserc.repeatability.desktop.cjs \
            integrity-manifest.json
          git diff --cached --check
          git commit -m 'Finish cinematic PWA and route evidence'
          git push origin HEAD:feature/cinematic-experience
