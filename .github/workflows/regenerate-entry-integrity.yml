name: Regenerate entry integrity

on:
  push:
    branches:
      - agent/morning-entry-v1
    paths:
      - .github/workflows/regenerate-entry-integrity.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/morning-entry-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-integrity-manifest.mjs
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh integrity manifest for entry loader"
          git push origin HEAD:agent/morning-entry-v1
