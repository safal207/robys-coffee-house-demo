name: Promote Roby's approved identity v4

on:
  push:
    branches:
      - agent/align-robys-approved-identity
    paths:
      - "qa/brand/candidate/**"
      - "scripts/promote-robys-approved-identity-v4.mjs"
      - "scripts/verify-brand-identity-assets.mjs"
      - ".github/workflows/promote-robys-v4.yml"

permissions:
  contents: write

concurrency:
  group: promote-robys-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Promote approved SVG assets and cache revisions
        run: node scripts/promote-robys-approved-identity-v4.mjs

      - name: Render approved Apple touch icon
        run: |
          python -m pip install --disable-pip-version-check --quiet cairosvg==2.7.1
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="icon.svg",
              write_to="apple-touch-icon.png",
              output_width=180,
              output_height=180,
          )
          PY

      - name: Regenerate integrity manifest
        run: npm run integrity:generate

      - name: Verify production identity and candidate contracts
        run: |
          npm run verify:brand-identity
          npm run verify:brand-candidate
          npm run verify:integrity
          git diff --check

      - name: Commit promoted identity
        run: |
          if git diff --quiet; then
            echo "Approved v4 is already promoted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apple-touch-icon.png \
            brand-photo-logo.css \
            icon.svg \
            icon-maskable.svg \
            index.html \
            menu.html \
            discover.html \
            sw.js \
            integrity-manifest.json \
            src/brand/robys-mark-master-v1.svg \
            src/brand/robys-organic-ring.svg \
            src/brand/robys-compact-master-v1.svg \
            src/brand/robys-header-master-v1.svg \
            src/brand/robys-primary-master-v1.svg
          git commit -m "Promote approved Roby's identity v4"
          git push
