name: Reviewdog static review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: reviewdog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  shellcheck:
    name: Reviewdog / ShellCheck
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Review changed shell code
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1.32.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          level: warning
          fail_level: warning
          path: scripts
          pattern: "*.sh"
          exclude: "./.git/*"
          check_all_files_with_shebangs: "false"
          shellcheck_flags: "--external-sources --severity=warning"

  markdownlint:
    name: Reviewdog / markdownlint
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Use the same lint/reviewdog versions without the action container's
      # unavailable Debian Bullseye packages. Error filtering stays unchanged.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up pinned reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Install pinned Markdown linter
        run: npm install --global --ignore-scripts --no-audit --no-fund markdownlint-cli@0.49.1

      - name: Review changed Markdown
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/markdownlint.txt"
          lint_status=0
          markdownlint . > "$report" 2>&1 || lint_status=$?
          cat "$report"
          # Exit 1 denotes lint findings, which reviewdog filters to added lines.
          # A broken linter/configuration must not silently become a green job.
          if [ "$lint_status" -gt 1 ]; then exit "$lint_status"; fi
          if [ "$lint_status" -eq 1 ] && ! grep -Eq '^.+:[0-9]+(:[0-9]+)? ' "$report"; then
            exit 1
          fi
          reviewdog -efm='%f:%l:%c %m' -efm='%f:%l %m' \
            -name=markdownlint -reporter=github-pr-review \
            -filter-mode=added -level=error -fail-level=error < "$report"
