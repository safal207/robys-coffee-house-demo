name: Sync release reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/release-reconciliation-20260918

permissions:
  contents: write

concurrency:
  group: sync-release-reconciliation
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run integrity:generate
      - run: npm run check
      - run: npm run verify:security
      - run: git diff --check
      - name: Commit reconciled generated state and remove one-shot workflow
        run: |
          git rm -f .github/workflows/sync-release-reconciliation.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync reconciled generated state"
          git push origin HEAD:fix/release-reconciliation-20260918
