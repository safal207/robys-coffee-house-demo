name: Sync generated PR branch

on:
  push:
    branches:
      - fix/integrity-refresh-trigger-coverage

permissions:
  contents: write

concurrency:
  group: sync-generated-integrity-pr
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run integrity:generate
      - run: git diff --check

      - name: Commit exact generated state
        run: |
          if git diff --quiet; then
            echo "Generated runtime and integrity manifest are already current."
            exit 0
          fi
          echo "Generated drift:"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync generated runtime and integrity"
          git push origin HEAD:fix/integrity-refresh-trigger-coverage
