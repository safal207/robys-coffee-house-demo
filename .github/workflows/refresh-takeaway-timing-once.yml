name: Refresh Takeaway Timing Once

# Unit timing harness now delays only the entrance animation; rerun canonical generation on that exact contract.
on:
  push:
    branches:
      - fix/takeaway-stationary-hold-timeline
    paths:
      - ".github/workflows/refresh-takeaway-timing-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/takeaway-stationary-hold-timeline
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify timing unit contract before generation
        run: node --test scripts/test-takeaway-entry.mjs
      - name: Build canonical revisions
        run: npm run build
      - name: Verify timing unit contract after generation
        run: node --test scripts/test-takeaway-entry.mjs
      - name: Refresh canonical integrity manifest
        run: node scripts/generate-integrity-manifest.mjs
      - name: Enforce bounded generated diff
        run: |
          rm .github/workflows/refresh-takeaway-timing-once.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
            ".github/workflows/refresh-takeaway-timing-once.yml",
            "bootstrap-v2.js",
            "index.html",
            "discover.html",
            "menu.html",
            "sw.js",
            "integrity-manifest.json",
          }
          changed = set(filter(None, subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()))
          extra = changed - allowed
          if extra:
              raise SystemExit(f"unexpected generated files: {sorted(extra)}")
          required = {"bootstrap-v2.js", "index.html", "discover.html", "menu.html", "sw.js", "integrity-manifest.json"}
          missing = required - changed
          if missing:
              raise SystemExit(f"expected generated files missing: {sorted(missing)}")
          print("bounded timing generated diff:", sorted(changed))
          PY
      - name: Commit generated revisions and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap-v2.js index.html discover.html menu.html sw.js integrity-manifest.json .github/workflows/refresh-takeaway-timing-once.yml
          git commit -m "chore(entry): sync takeaway timing revisions"
          git push origin HEAD:fix/takeaway-stationary-hold-timeline
