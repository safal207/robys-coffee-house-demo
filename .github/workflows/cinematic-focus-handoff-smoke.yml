name: Cinematic focus handoff smoke

on:
  push:
    branches:
      - feature/cinematic-experience

permissions:
  contents: read

concurrency:
  group: cinematic-focus-handoff-smoke
  cancel-in-progress: true

jobs:
  keyboard-focus-smoke:
    if: github.event.head_commit.message == 'Add cinematic focus handoff smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/cinematic-experience

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build revisioned runtime
        run: npm run build

      - name: Verify experience runtime syntax
        run: node --check experience/experience.js

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/robys-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/experience/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/robys-http.log
          exit 1

      - name: Verify focused finale CTA hands off before deactivation
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-US' });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:4173/experience/', { waitUntil: 'networkidle' });

          const scrollToProgress = async (progress) => {
            await page.evaluate((value) => {
              const experience = document.querySelector('[data-cinematic-experience]');
              if (!(experience instanceof HTMLElement)) throw new Error('experience root missing');
              const start = experience.getBoundingClientRect().top + window.scrollY;
              const range = Math.max(1, experience.offsetHeight - window.innerHeight);
              window.scrollTo(0, start + range * value);
            }, progress);
          };

          await scrollToProgress(0.98);
          await page.waitForFunction(() => document.querySelector('[data-cinematic-experience]')?.getAttribute('data-active-scene') === '6');

          const primary = page.locator('.primary-cta');
          await primary.focus();
          assert.equal(await page.evaluate(() => document.activeElement?.classList.contains('primary-cta')), true, 'primary CTA did not receive focus');

          await scrollToProgress(0.75);
          await page.waitForFunction(() => document.querySelector('[data-cinematic-experience]')?.getAttribute('data-active-scene') === '5');

          const shortcutFocused = await page.evaluate(() => document.activeElement === document.querySelector('.accessible-story-actions a:first-child'));
          assert.equal(shortcutFocused, true, 'focus was not handed to the persistent story shortcut');

          assert.equal(await primary.getAttribute('tabindex'), '-1', 'inactive finale CTA stayed in tab order');
          assert.equal(await primary.getAttribute('aria-hidden'), 'true', 'inactive finale CTA stayed in accessibility tree');

          await page.waitForTimeout(250);
          const shortcutVisibility = await page.evaluate(() => {
            const nav = document.querySelector('.accessible-story-actions');
            const active = document.activeElement;
            if (!(nav instanceof HTMLElement) || !(active instanceof HTMLElement)) return null;
            const rect = nav.getBoundingClientRect();
            return {
              top: rect.top,
              bottom: rect.bottom,
              activeInside: nav.contains(active),
              outlineStyle: getComputedStyle(active).outlineStyle,
              outlineWidth: getComputedStyle(active).outlineWidth
            };
          });
          assert.ok(shortcutVisibility, 'shortcut visibility state unavailable');
          assert.equal(shortcutVisibility.activeInside, true, 'focus left persistent story shortcuts');
          assert.ok(shortcutVisibility.top >= 0 && shortcutVisibility.bottom <= 844, `shortcut nav not onscreen: ${JSON.stringify(shortcutVisibility)}`);
          assert.notEqual(shortcutVisibility.outlineStyle, 'none', 'focused shortcut has no visible outline');
          assert.notEqual(shortcutVisibility.outlineWidth, '0px', 'focused shortcut outline width is zero');

          await page.keyboard.press('Tab');
          assert.equal(await page.evaluate(() => document.activeElement === document.querySelector('.accessible-story-actions a:nth-child(2)')), true, 'Tab did not continue to second persistent shortcut');

          await browser.close();
          console.log('Finale CTA focus handoff to visible persistent story shortcuts PASS.');
          NODE
