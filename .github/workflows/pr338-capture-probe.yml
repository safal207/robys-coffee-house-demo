name: PR338 pinned capture diagnosis
on:
  push:
    branches: [qa/pr338-capture-probe-20260905]
    paths: [.github/workflows/pr338-capture-probe.yml, scripts/capture-document-region.mjs, scripts/test-menu-share-capture.mjs]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: probe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f38487ec64f60e0721ae5b23074527497886eca1
          path: current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 04b3ce7549a2fc111bcc13ca9cf92adabb29dd4a
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build locked inputs
        run: |
          set -euo pipefail
          cd current
          mkdir -p visual-results/capture-evidence/files
          git rev-parse HEAD > visual-results/capture-evidence/input-head.txt
          git ls-tree -r HEAD > visual-results/capture-evidence/input-tree.txt
          npm ci --no-audit --no-fund
          npm run build
          cd ../baseline
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare bounded capture candidate
        working-directory: current
        run: |
          cp ../probe/scripts/capture-document-region.mjs scripts/
          cp ../probe/scripts/test-menu-share-capture.mjs scripts/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/visual-regression.mjs')
          s = p.read_text()
          old = 'import { PNG } from "pngjs";'
          assert s.count(old) == 1
          s = s.replace(old, old + '\nimport { captureDocumentRegion } from "./capture-document-region.mjs";')
          old = '        await locator.scrollIntoViewIfNeeded();\n        await page.waitForTimeout(80);\n        await locator.screenshot({ path: filePath, animations: "disabled" });'
          assert s.count(old) == 1
          new = '''        if (capture.id === "menu-share") {
                    // Document-flow component. Reachability is tested separately;
                    // locator auto-scroll can move the sticky filters over this crop.
                    await captureDocumentRegion(page, locator, filePath);
                  } else {
                    await locator.scrollIntoViewIfNeeded();
                    await page.waitForTimeout(80);
                    await locator.screenshot({ path: filePath, animations: "disabled" });
                  }'''
          p.write_text(s.replace(old, new))
          # Put the companion viewport test into the actual future PR workflow.
          p = Path('.github/workflows/visual-regression.yml')
          s = p.read_text()
          old = '      - name: Compare screenshots with base branch\n'
          assert s.count(old) == 1
          step = '''      - name: Verify document capture and share-action reachability
                  working-directory: current
                  env:
                    CAPTURE_RESULTS_DIR: ${{ github.workspace }}/current/visual-results/capture-reachability
                  run: node scripts/test-menu-share-capture.mjs

          '''
          p.write_text(s.replace(old, step + old))
          PY
      - name: Verify unchanged public bytes and repository checks
        working-directory: current
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee visual-results/capture-evidence/check.log
          npm run verify:security 2>&1 | tee visual-results/capture-evidence/security.log
          git diff --exit-code -- integrity-manifest.json index.html menu.html menu-app.js menu-premium.css sw.js
          ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/visual-regression.yml')"
      - name: Install pinned visual tools
        working-directory: current
        run: |
          npm install --no-save --package-lock=false playwright@1.52.0 pixelmatch@6.0.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify capture recovery and viewport reachability
        working-directory: current
        run: node scripts/test-menu-share-capture.mjs
      - name: Compare pinned branches without granting approval
        id: compare
        continue-on-error: true
        working-directory: current
        env:
          VISUAL_CURRENT_DIR: ${{ github.workspace }}/current
          VISUAL_BASELINE_DIR: ${{ github.workspace }}/baseline
          VISUAL_RESULTS_DIR: ${{ github.workspace }}/current/visual-results/capture-evidence/visual
        run: node scripts/visual-regression.mjs
      - name: Preserve exact source and boundary
        if: always()
        working-directory: current
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          mkdir -p visual-results/capture-evidence/files/scripts visual-results/capture-evidence/files/.github/workflows
          cp scripts/capture-document-region.mjs scripts/visual-regression.mjs scripts/test-menu-share-capture.mjs visual-results/capture-evidence/files/scripts/
          cp .github/workflows/visual-regression.yml visual-results/capture-evidence/files/.github/workflows/
          git diff --check
          git diff > visual-results/capture-evidence/candidate.patch
          printf 'compare_outcome=%s\nreviewed_or_approved=false\nref_updated=false\n' "$COMPARE_OUTCOME" > visual-results/capture-evidence/boundary.txt
          git hash-object scripts/capture-document-region.mjs scripts/visual-regression.mjs scripts/test-menu-share-capture.mjs .github/workflows/visual-regression.yml > visual-results/capture-evidence/candidate-blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr338-capture-diagnosis-${{ github.sha }}
          path: current/visual-results/capture-evidence/
          retention-days: 7
          if-no-files-found: error
