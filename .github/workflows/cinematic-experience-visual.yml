name: Cinematic experience visual smoke

on:
  push:
    branches: [feature/cinematic-experience]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinematic-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    name: Capture cinematic experience evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start local site
        shell: bash
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 4173 > /tmp/robys-vite.log 2>&1 &
          echo $! > /tmp/robys-vite.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/experience/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/robys-vite.log
          exit 1

      - name: Capture desktop and mobile cinematic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-results
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const report = [];

          const cases = [
            { name: 'desktop', viewport: { width: 1440, height: 900 } },
            { name: 'mobile', viewport: { width: 390, height: 844 } },
          ];

          for (const testCase of cases) {
            const page = await browser.newPage({ viewport: testCase.viewport });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('console', (message) => {
              if (message.type() === 'error') pageErrors.push(`console: ${message.text()}`);
            });

            await page.goto('http://127.0.0.1:4173/experience/', { waitUntil: 'networkidle' });
            await page.locator('.hero-cup').waitFor({ state: 'visible' });

            const cupVisible = await page.locator('.hero-cup').isVisible();
            const wideLogoVisible = await page.locator('.brand-logo-wide').isVisible();
            const compactLogoVisible = await page.locator('.brand-logo-compact').isVisible();
            if (!cupVisible) throw new Error(`${testCase.name}: branded hero cup is not visible`);
            if (!wideLogoVisible && !compactLogoVisible) throw new Error(`${testCase.name}: approved Roby's logo is not visible`);

            async function capture(label, progress) {
              await page.evaluate((value) => {
                const max = Math.max(0, document.documentElement.scrollHeight - innerHeight);
                scrollTo(0, max * value);
              }, progress);
              await page.waitForTimeout(1100);
              const scene = await page.locator('[data-cinematic-experience]').getAttribute('data-active-scene');
              const frame = await page.locator('[data-cinematic-experience]').getAttribute('data-motion-frame');
              await page.screenshot({ path: `visual-results/cinematic-${testCase.name}-${label}.png`, fullPage: false });
              report.push({ viewport: testCase.name, label, progress, scene, frame });
            }

            await capture('01-arrival', 0.01);
            await capture('02-middle', 0.52);
            await capture('03-finale', 0.985);

            await page.locator('[data-lang="ru"]').click();
            const finalCopy = (await page.locator('[data-scene="6"] h2').textContent()) || '';
            if (!finalCopy.includes('Возьми с собой')) throw new Error(`${testCase.name}: Russian finale copy did not localize`);

            if (pageErrors.length) throw new Error(`${testCase.name}: browser errors: ${pageErrors.join(' | ')}`);
            await page.close();
          }

          await browser.close();
          fs.writeFileSync('visual-results/cinematic-visual-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cinematic-visual-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            visual-results/
            /tmp/robys-vite.log
          if-no-files-found: warn
          retention-days: 14
