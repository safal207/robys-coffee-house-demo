name: Agent platform install verify

on:
  push:
    branches:
      - agent/platform-install-cta
    paths:
      - mobile-install.js
      - mobile-install.css
      - pwa.js
      - sw.js
      - scripts/verify-android-download.mjs
      - .github/workflows/agent-platform-install-verify.yml

permissions:
  contents: write

jobs:
  verify-and-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/platform-install-cta
          fetch-depth: 0

      - name: Verify JavaScript syntax
        run: |
          node --check mobile-install.js
          node --check pwa.js
          node --check sw.js

      - name: Verify platform install contract
        run: node scripts/verify-android-download.mjs

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Generate current integrity manifest
        run: node scripts/generate-integrity-manifest.mjs

      - name: Commit regenerated generated files
        shell: bash
        run: |
          if git diff --quiet -- index.html discover.html sw.js integrity-manifest.json; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html discover.html sw.js integrity-manifest.json
          git commit -m "Regenerate runtime and integrity for platform install CTA"
          git push origin HEAD:agent/platform-install-cta
