name: Patch service worker core build sync

on:
  push:
    branches:
      - fix/manual-qa-polish-20260915

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/manual-qa-polish-20260915
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch build generator fail-closed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build.mjs')
          s = p.read_text()
          old_read = 'let serviceWorker = readFileSync("sw.js", "utf8");'
          new_read = 'let serviceWorker = readFileSync("sw-core-v64.js", "utf8");'
          old_write = 'writeFileSync("sw.js", serviceWorker);'
          new_write = 'writeFileSync("sw-core-v64.js", serviceWorker);'
          if s.count(old_read) != 1 or s.count(old_write) != 1:
              raise SystemExit('build.mjs service-worker anchors changed; refusing patch')
          s = s.replace(old_read, new_read).replace(old_write, new_write)
          p.write_text(s)
          PY
          git diff --check
      - name: Build and refresh integrity
        run: |
          npm run build
          npm run integrity:generate
      - name: Remove temporary validator from production tree
        run: git rm .github/workflows/patch-build-sw-core-20260916.yml
      - name: Full repository checks
        run: npm run check
      - name: Security checks
        run: npm run verify:security
      - name: Verify generated diff allowlist
        shell: bash
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
            'scripts/build.mjs',
            'experience/index.html',
            'menu.html',
            'smart-choice/index.html',
            'sw-core-v64.js',
            'integrity-manifest.json',
            '.github/workflows/patch-build-sw-core-20260916.yml',
          }
          out = subprocess.check_output(['git','status','--porcelain'], text=True)
          paths = set()
          for line in out.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ',1)[1]
              paths.add(path)
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit('Unexpected generated changes: ' + ', '.join(unexpected))
          required = {'scripts/build.mjs','sw-core-v64.js','integrity-manifest.json'}
          missing = sorted(required - paths)
          if missing:
              raise SystemExit('Expected generated changes missing: ' + ', '.join(missing))
          print('Allowed generated changes:', sorted(paths))
          PY
      - name: Commit validated generator and generated state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync build generator with service worker core"
          git push origin HEAD:fix/manual-qa-polish-20260915
