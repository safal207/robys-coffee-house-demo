name: Patch service worker core build sync

on:
  push:
    branches:
      - fix/manual-qa-polish-20260915

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/manual-qa-polish-20260915
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch SW core generator and verifier fail-closed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label} anchor changed: {old}')
              return text.replace(old, new)

          p = Path('scripts/build.mjs')
          s = p.read_text()
          s = replace_once(s, 'let serviceWorker = readFileSync("sw.js", "utf8");', 'let serviceWorker = readFileSync("sw-core-v64.js", "utf8");', 'build read')
          s = replace_once(s, 'writeFileSync("sw.js", serviceWorker);', 'writeFileSync("sw-core-v64.js", serviceWorker);', 'build write')
          p.write_text(s)

          p = Path('scripts/verify-smart-choice-release.mjs')
          s = p.read_text()
          s = replace_once(s, 'const serviceWorker = read("sw.js");', 'const serviceWorker = read("sw.js");\nconst serviceWorkerCore = read("sw-core-v64.js");', 'verifier read')
          s = replace_once(s, "requireText(serviceWorker, '\"./smart-choice/index.html\"', \"Smart Choice page must be precached\");", "requireText(serviceWorker, 'importScripts(\"./sw-core-v64.js\")', \"Service worker wrapper must load the reviewed core runtime\");\nrequireText(serviceWorkerCore, '\"./smart-choice/index.html\"', \"Smart Choice page must be precached\");", 'page precache')
          s = replace_once(s, "requireText(serviceWorker, 'const isVersionedSmartChoiceAsset', \"Smart Choice assets must use exact-revision cache matching\");", "requireText(serviceWorkerCore, 'const isVersionedSmartChoiceAsset', \"Smart Choice assets must use exact-revision cache matching\");", 'versioned asset')
          s = replace_once(s, "requireText(serviceWorker, 'if (isSmartChoice) return cachedPage(\"smart-choice/index.html\")', \"Smart Choice must have a dedicated offline navigation route\");", "requireText(serviceWorkerCore, 'if (isSmartChoice) return cachedPage(\"smart-choice/index.html\")', \"Smart Choice must have a dedicated offline navigation route\");", 'offline route')
          s = replace_once(s, "requireText(serviceWorker, 'url.pathname === `${scopePath}smart-choice/`', \"Smart Choice clean URL must not be classified as the home page\");", "requireText(serviceWorkerCore, 'url.pathname === `${scopePath}smart-choice/`', \"Smart Choice clean URL must not be classified as the home page\");", 'clean route')
          s = replace_once(s, 'assert.ok(!serviceWorker.includes(`"./smart-choice/${legacyFile}?v=`), `Service worker must not precache legacy cache-colliding ${legacyFile}`);', 'assert.ok(!serviceWorkerCore.includes(`"./smart-choice/${legacyFile}?v=`), `Service worker core must not precache legacy cache-colliding ${legacyFile}`);', 'legacy assets')
          s = replace_once(s, 'requireText(serviceWorker, `"./${file}?v=${revision}"`, `${file} is not precached at its HTML revision`);', 'requireText(serviceWorkerCore, `"./${file}?v=${revision}"`, `${file} is not precached at its HTML revision`);', 'revisioned assets')
          p.write_text(s)
          PY
          git diff --check
      - name: Build and refresh integrity
        run: |
          npm run build
          npm run integrity:generate
      - name: Remove temporary validator from production tree
        run: git rm .github/workflows/patch-build-sw-core-20260916.yml
      - name: Full repository checks
        run: npm run check
      - name: Security checks
        run: npm run verify:security
      - name: Verify generated diff allowlist
        shell: bash
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
            'scripts/build.mjs',
            'scripts/verify-smart-choice-release.mjs',
            'experience/index.html',
            'menu.html',
            'smart-choice/index.html',
            'sw-core-v64.js',
            'integrity-manifest.json',
            '.github/workflows/patch-build-sw-core-20260916.yml',
          }
          out = subprocess.check_output(['git','status','--porcelain'], text=True)
          paths = set()
          for line in out.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ',1)[1]
              paths.add(path)
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit('Unexpected generated changes: ' + ', '.join(unexpected))
          required = {'scripts/build.mjs','scripts/verify-smart-choice-release.mjs','sw-core-v64.js','integrity-manifest.json'}
          missing = sorted(required - paths)
          if missing:
              raise SystemExit('Expected generated changes missing: ' + ', '.join(missing))
          print('Allowed generated changes:', sorted(paths))
          PY
      - name: Commit validated generator and generated state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync build and verifier with service worker core"
          git push origin HEAD:fix/manual-qa-polish-20260915
