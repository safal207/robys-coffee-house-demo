name: Cinematic inferred language route smoke

on:
  push:
    branches:
      - feature/cinematic-experience

permissions:
  contents: read

concurrency:
  group: cinematic-inferred-language-route-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: github.event.head_commit.message == 'Add inferred language route smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/cinematic-experience

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build revisioned runtime
        run: npm run build

      - name: Verify experience runtime syntax
        run: node --check experience/experience.js

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/robys-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/experience/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/robys-http.log
          exit 1

      - name: Verify browser-derived language persists across routes
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          for (const [locale, expected] of [['ru-RU', 'ru'], ['en-US', 'en']]) {
            const context = await browser.newContext({ locale });
            const page = await context.newPage();

            await page.goto('http://127.0.0.1:4173/experience/', { waitUntil: 'networkidle' });
            assert.equal(await page.evaluate(() => document.documentElement.lang), expected, `${locale}: experience language`);
            assert.equal(await page.evaluate(() => localStorage.getItem('robys-language')), expected, `${locale}: inferred language was not persisted`);

            await page.goto('http://127.0.0.1:4173/menu.html', { waitUntil: 'networkidle' });
            assert.equal(await page.evaluate(() => document.documentElement.lang), expected, `${locale}: menu did not preserve inferred language`);
            assert.equal(await page.evaluate(() => localStorage.getItem('robys-language')), expected, `${locale}: menu storage mismatch`);

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            assert.equal(await page.evaluate(() => document.documentElement.lang), expected, `${locale}: home did not preserve inferred language`);
            assert.equal(await page.evaluate(() => localStorage.getItem('robys-language')), expected, `${locale}: home storage mismatch`);

            await context.close();
          }
          await browser.close();
          console.log('Browser-derived RU/EN language persistence across Experience → Menu → Home PASS.');
          NODE
