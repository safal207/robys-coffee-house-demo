name: Apply revenue simulator type fixes

on:
  pull_request:
    paths:
      - '.github/workflows/fix-revenue-simulator-types.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply confirmed TypeScript fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          domain_path = Path('src/smart-choice/revenue-simulator-domain.ts')
          domain = domain_path.read_text()
          updated_domain, domain_count = re.subn(
              r'(^\s*)const resultWithoutId = \{',
              r'\1const resultWithoutId: Omit<RevenueSimulationResult, "simulationId"> = {',
              domain,
              count=1,
              flags=re.MULTILINE,
          )
          if domain_count != 1:
              raise SystemExit(f'Expected one resultWithoutId declaration, found {domain_count}')
          domain_path.write_text(updated_domain)

          ui_path = Path('src/smart-choice/revenue-simulator.ts')
          ui = ui_path.read_text()
          pattern = re.compile(
              r'const form = document\.querySelector<HTMLFormElement>\("#revenue-simulator-form"\);\n'
              r'const resultsRoot = document\.querySelector<HTMLElement>\("#revenue-simulator-results"\);\n'
              r'const statusRoot = document\.querySelector<HTMLElement>\("#revenue-simulator-status"\);\n'
              r'const exportJsonButton = document\.querySelector<HTMLButtonElement>\("#export-simulation-json"\);\n'
              r'const exportMarkdownButton = document\.querySelector<HTMLButtonElement>\("#export-simulation-markdown"\);\n\n'
              r'if \(!form \|\| !resultsRoot \|\| !statusRoot \|\| !exportJsonButton \|\| !exportMarkdownButton\) \{\n'
              r'\s+throw new Error\("\[SMART-CHOICE-REVENUE-SIMULATOR\] Required owner UI elements are missing\."\);\n'
              r'\}\n'
          )
          replacement = '''function requireElement<T extends Element>(selector: string): T {
            const node = document.querySelector<T>(selector);
            if (!node) throw new Error(`[SMART-CHOICE-REVENUE-SIMULATOR] Missing element: ${selector}`);
            return node;
          }

          const form = requireElement<HTMLFormElement>("#revenue-simulator-form");
          const resultsRoot = requireElement<HTMLElement>("#revenue-simulator-results");
          const statusRoot = requireElement<HTMLElement>("#revenue-simulator-status");
          const exportJsonButton = requireElement<HTMLButtonElement>("#export-simulation-json");
          const exportMarkdownButton = requireElement<HTMLButtonElement>("#export-simulation-markdown");
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          updated_ui, ui_count = pattern.subn(replacement, ui, count=1)
          if ui_count != 1:
              raise SystemExit(f'Expected one nullable DOM block, found {ui_count}')
          ui_path.write_text(updated_ui)

          Path('.github/workflows/fix-revenue-simulator-types.yml').unlink()
      - name: Commit exact fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/smart-choice/revenue-simulator-domain.ts src/smart-choice/revenue-simulator.ts .github/workflows/fix-revenue-simulator-types.yml
          git commit -m "fix: satisfy revenue simulator TypeScript contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
