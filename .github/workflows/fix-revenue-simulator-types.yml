name: Apply revenue simulator type fixes

on:
  pull_request:
    paths:
      - '.github/workflows/fix-revenue-simulator-types.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply confirmed TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          domain_path = Path('src/smart-choice/revenue-simulator-domain.ts')
          domain = domain_path.read_text()
          old_domain = '  const resultWithoutId = {\n'
          new_domain = '  const resultWithoutId: Omit<RevenueSimulationResult, "simulationId"> = {\n'
          if old_domain not in domain:
              raise SystemExit('Expected resultWithoutId declaration not found')
          domain_path.write_text(domain.replace(old_domain, new_domain, 1))

          ui_path = Path('src/smart-choice/revenue-simulator.ts')
          ui = ui_path.read_text()
          old_ui = '''const form = document.querySelector<HTMLFormElement>("#revenue-simulator-form");
          const resultsRoot = document.querySelector<HTMLElement>("#revenue-simulator-results");
          const statusRoot = document.querySelector<HTMLElement>("#revenue-simulator-status");
          const exportJsonButton = document.querySelector<HTMLButtonElement>("#export-simulation-json");
          const exportMarkdownButton = document.querySelector<HTMLButtonElement>("#export-simulation-markdown");

          if (!form || !resultsRoot || !statusRoot || !exportJsonButton || !exportMarkdownButton) {
            throw new Error("[SMART-CHOICE-REVENUE-SIMULATOR] Required owner UI elements are missing.");
          }
          '''
          old_ui = '\n'.join(line.strip() if index == 0 else line[10:] for index, line in enumerate(old_ui.splitlines())) + '\n'
          new_ui = '''function requireElement<T extends Element>(selector: string): T {
            const node = document.querySelector<T>(selector);
            if (!node) throw new Error(`[SMART-CHOICE-REVENUE-SIMULATOR] Missing element: ${selector}`);
            return node;
          }

          const form = requireElement<HTMLFormElement>("#revenue-simulator-form");
          const resultsRoot = requireElement<HTMLElement>("#revenue-simulator-results");
          const statusRoot = requireElement<HTMLElement>("#revenue-simulator-status");
          const exportJsonButton = requireElement<HTMLButtonElement>("#export-simulation-json");
          const exportMarkdownButton = requireElement<HTMLButtonElement>("#export-simulation-markdown");
          '''
          new_ui = '\n'.join(line.strip() if index == 0 else line[10:] for index, line in enumerate(new_ui.splitlines())) + '\n'
          if old_ui not in ui:
              raise SystemExit('Expected nullable DOM block not found')
          ui_path.write_text(ui.replace(old_ui, new_ui, 1))

          Path('.github/workflows/fix-revenue-simulator-types.yml').unlink()
      - name: Commit exact fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/smart-choice/revenue-simulator-domain.ts src/smart-choice/revenue-simulator.ts .github/workflows/fix-revenue-simulator-types.yml
          git commit -m "fix: satisfy revenue simulator TypeScript contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
