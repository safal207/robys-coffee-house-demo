name: Smart Choice cart finalizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run integrity:generate
      - name: Commit exact generated outputs and remove finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-choice/cart.js smart-choice/index.html integrity-manifest.json
          git rm .github/workflows/smart-choice-cart-artifact.yml
          git commit -m "build: commit Smart Choice cart static outputs"
          git push origin HEAD:agent/smart-choice-cart
