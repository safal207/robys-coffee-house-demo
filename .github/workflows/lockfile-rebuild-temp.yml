name: Temporary lockfile rebuild

on:
  push:
    branches:
      - agent/motion-release-certification-v1
    paths:
      - ".github/workflows/lockfile-rebuild-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild lockfile from package manifest
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify critical resolved records
        run: |
          node <<'NODE'
          const p = require('./package-lock.json');
          const androidArm = p.packages['node_modules/@esbuild/android-arm'];
          const playwright = p.packages['node_modules/playwright'];
          const core = p.packages['node_modules/playwright-core'];
          if (androidArm?.resolved !== 'https://registry.npmjs.org/@esbuild/android-arm/-/android-arm-0.28.1.tgz') process.exit(1);
          if (playwright?.version !== '1.52.0' || core?.version !== '1.52.0') process.exit(1);
          NODE
      - name: Commit rebuilt lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(test): rebuild deterministic dependency lock"
          git push origin HEAD:agent/motion-release-certification-v1
