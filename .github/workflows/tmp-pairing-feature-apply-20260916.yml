name: Apply pairing video cart feature

on:
  push:
    branches:
      - feat/kiosk-pairing-video-cart-20260916

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply feature patch
        run: python .github/scripts/tmp-pairing-feature-20260916.py
      - name: Install dependencies
        run: npm ci
      - name: Build generated runtime
        run: npm run build
      - name: Refresh integrity manifest
        run: npm run integrity:generate
      - name: Verify project contracts
        run: npm run check
      - name: Verify security contract
        run: npm run verify:security
      - name: Verify exact integrity
        run: npm run verify:integrity
      - name: Verify binary and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < src/products/sets-v1/iced-san-sebastian-pairing-card.mp4)" -eq 46561
          actual="$(sha256sum src/products/sets-v1/iced-san-sebastian-pairing-card.mp4 | cut -d ' ' -f 1)"
          test "$actual" = "834fb5ec5eab863d1707c667c7404a9447da6f9ae38be02b9d3cf3df5ac7059a"
          grep -q 'PAIRING_VIDEO_SRC' src/menu-app.js
          grep -q 'menu-pairing-add' src/menu-app.js
          grep -q 'PAIRING-CARD-MOTION-V1' menu-premium.css
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(src/menu-app\.js|menu-app\.js|menu-premium\.css|menu\.html|sw-core-v64\.js|integrity-manifest\.json|\.github/scripts/tmp-pairing-feature-20260916\.py|\.github/workflows/tmp-pairing-feature-apply-20260916\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit verified feature and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/tmp-pairing-feature-20260916.py
          rm -f .github/workflows/tmp-pairing-feature-apply-20260916.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add pairing video and one-tap combo cart"
          git push
