name: Temporary Playwright security refresh

on:
  push:
    branches:
      - agent/motion-release-certification-v1
    paths:
      - ".github/workflows/playwright-security-refresh-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild safe Playwright dependency lock
        run: |
          rm package-lock.json
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund playwright@1.55.1
      - name: Verify safe exact dependency and audit gate
        run: |
          node <<'NODE'
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          if (manifest.devDependencies?.playwright !== '1.55.1') process.exit(1);
          if (lock.packages['node_modules/playwright']?.version !== '1.55.1') process.exit(1);
          if (lock.packages['node_modules/playwright-core']?.version !== '1.55.1') process.exit(1);
          NODE
          npm audit --audit-level=high
      - name: Commit safe manifest and lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(test): pin safe Playwright 1.55.1"
          git push origin HEAD:agent/motion-release-certification-v1
