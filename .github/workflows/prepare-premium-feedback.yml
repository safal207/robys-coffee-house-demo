name: Prepare premium feedback repair
on:
  push:
    branches: [feat/premium-feedback-polish]
    paths: ['qa/feedback.patch', 'qa/prepare-feedback.py', '.github/workflows/prepare-premium-feedback.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded repair; remove one-off preparation files
        run: |
          set -euo pipefail
          git apply --check qa/feedback.patch
          git apply qa/feedback.patch
          python3 qa/prepare-feedback.py
          git rm qa/feedback.patch qa/prepare-feedback.py .github/workflows/prepare-premium-feedback.yml
      - run: npm ci --no-audit --no-fund
      - name: Rebuild and verify before committing
        run: |
          set -euo pipefail
          mkdir -p .artifacts/premium-feedback
          npm run build > .artifacts/premium-feedback/build.log 2>&1
          npm run integrity:generate
          npm run check > .artifacts/premium-feedback/check.log 2>&1
          npm run verify:security > .artifacts/premium-feedback/security.log 2>&1
          npm run verify:performance > .artifacts/premium-feedback/performance.log 2>&1
          git diff --check
      - name: Commit verified sources to the isolated feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'feat(ui): reflect cart state, preserve category focus and confirm interactions'
          git push origin HEAD:refs/heads/feat/premium-feedback-polish
          git rev-parse HEAD > .artifacts/premium-feedback/HEAD.txt
          git rev-parse HEAD^{tree} > .artifacts/premium-feedback/TREE.txt
      - run: npx playwright install --with-deps chromium
      - name: Real-navigation feedback regression
        run: node scripts/premium-feedback-regression.mjs
      - name: Existing geometry and order regression
        if: always()
        run: node scripts/premium-ui-regression.mjs
      - name: Archive exact tested public source and dependencies
        if: always()
        run: |
          mkdir -p .artifacts/premium-feedback
          git archive --format=tar HEAD | gzip -1 > .artifacts/premium-feedback/source.tar.gz
          tar -czf .artifacts/premium-feedback/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-premium-feedback-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
