name: Menu nutrition

on:
  pull_request:
    paths: ['src/menu-*.js', 'menu-*.js', 'menu*.css', 'menu*.html', 'scripts/test-menu-nutrition*.mjs', 'scripts/build.mjs', '.github/workflows/menu-nutrition.yml']
  push:
    branches: [main]
    paths: ['src/menu-*.js', 'menu-*.js', 'menu*.css', 'menu*.html', 'scripts/test-menu-nutrition*.mjs', 'scripts/build.mjs', '.github/workflows/menu-nutrition.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nutrition:
    name: Nutrition content and mobile UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/test-menu-nutrition.mjs
      - run: npm run build
      - run: node scripts/ensure-playwright-browsers.mjs chromium
      - run: node scripts/test-menu-nutrition-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-nutrition-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/menu-nutrition/
          if-no-files-found: error
          retention-days: 14
