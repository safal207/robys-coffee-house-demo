name: Finalize Smart Choice experiment assets

on:
  push:
    branches:
      - agent/smart-choice-experiments

permissions:
  contents: write

jobs:
  finalize-static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-choice-experiments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run integrity:generate
      - name: Commit exact generated outputs and remove finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-choice/experiments.js smart-choice/index.html integrity-manifest.json
          git rm .github/workflows/finalize-smart-choice-experiments.yml
          git commit -m "build: finalize Smart Choice experiment assets"
          git push origin HEAD:agent/smart-choice-experiments
